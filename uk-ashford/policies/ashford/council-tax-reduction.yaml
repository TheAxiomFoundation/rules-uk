format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: uk-ashford/manual/council-tax-reduction-scheme-2026-2027/page-100
    # upstream_source_check:
    #   status: delegated_scheme
    #   checked_paths: [uk/statutes/ukpga/1992/14/13A, uk/regulations/uksi/2012/2885, uk/regulations/uksi/2012/2886]
    #   rationale: Section 13A delegates the working-age scheme to Ashford Borough Council, so the Council's adopted document is operative. The pinned singular source-verification contract rejects and strips this attestation as a live field.
  summary: |-
    Upstream-source status: delegated_scheme. Section 13A delegates the working-age
    scheme to Ashford, so its adopted document is operative. The 2026-27 award is
    a five-band discount, not an excess-income taper: 90%, 75%, 60%, 45%, or 30%
    of the scheme-defined maximum, selected from separate single/couple weekly-
    income rows. Capital over £10,000 gives no award; capital above £6,000 adds
    £1 weekly tariff income for every £250 or incomplete £250. A flat £10 weekly
    non-dependant deduction applies unless the applicant or non-dependant is in a
    printed protected/exempt class. No minimum-award floor is stated. Pension-age
    prescribed provisions are outside this working-age module.
  deferred_outputs:
    - output: uk-ashford:policies/ashford/council-tax-reduction/sections-12-to-30-and-schedules-2-to-3#assessed_weekly_income
      reason: Detailed earnings, self-employment, minimum-income-floor, and income-disregard calculations are outside this award-surface module.
    - output: uk-ashford:policies/ashford/council-tax-reduction/sections-31-to-40-and-schedule-4#assessed_capital
      reason: Capital valuation, attribution, notional-capital, and disregard rules are outside this award-surface module.
    - output: uk-ashford:policies/ashford/council-tax-reduction/paragraph-57.1#band_d_capped_annual_liability
      reason: The module consumes eligible liability already capped at the lower of actual liability and Band D; charge lookup and joint-liability apportionment are outside this award surface.
    - output: uk-ashford:policies/ashford/council-tax-reduction/paragraphs-58.3-to-58.6#non_dependant_protection_or_exemption
      reason: The detailed disability, benefit, student, absence, and other exemption classifier is consumed as an input.
rules:
  - name: ashford_council_tax_reduction_maximum_support_rate
    kind: parameter
    dtype: Rate
    source: Ashford Council Tax Reduction Scheme 2026/27 paragraph 57.1
