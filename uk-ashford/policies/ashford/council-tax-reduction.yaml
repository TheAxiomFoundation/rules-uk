          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: uk-ashford/manual/council-tax-reduction-scheme-2026-2027/page-51
              excerpt: "£1 for each £250"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          1

  - name: ashford_council_tax_reduction_weeks_per_year
    kind: parameter
    dtype: Number
    source: Ashford Council Tax Reduction Scheme 2026/27 paragraph 13.3
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: uk-ashford/manual/council-tax-reduction-scheme-2026-2027/page-32
              excerpt: "dividing the product by 52"
    versions:
      - effective_from: '2026-04-01'
