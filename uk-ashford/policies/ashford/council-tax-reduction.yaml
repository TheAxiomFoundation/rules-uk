          52

  - name: ashford_council_tax_reduction_non_dependant_weekly_deduction_by_band
    kind: parameter
    dtype: Money
    period: Week
    unit: GBP
    indexed_by: ashford_council_tax_reduction_non_dependant_deduction_band
    source: Ashford Council Tax Reduction Scheme 2026/27 paragraph 58.1
    metadata:
      proof:
        atoms:
          - path: versions[0].values
            kind: parameter_table
            source:
              corpus_citation_path: uk-ashford/manual/council-tax-reduction-scheme-2026-2027/page-64
              excerpt: "the non-dependant deductions in respect of a day referred to in paragraph 29 are in respect of a non-dependant aged 18 or over, £10.00 x 1/7"
              table:
