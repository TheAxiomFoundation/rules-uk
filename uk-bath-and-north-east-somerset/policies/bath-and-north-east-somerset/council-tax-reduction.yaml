  - name: bath_and_north_east_somerset_council_tax_reduction_non_dependant_work_status_index
    kind: derived
    entity: Person
    dtype: Integer
    period: Week
    source: Bath and North East Somerset Council Tax Reduction Scheme 2026/27, paragraph 58.1
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter_table
            source:
              corpus_citation_path: uk-bath-and-north-east-somerset/manual/council-tax-reduction-scheme-2026-2027/page-91
              excerpt: "58.1 Subject to the following provisions of this paragraph, the non-dependant deductions in respect of a day referred to in section 57 (maximum council tax support) shall be; (a) in respect of a non-dependant aged 18 or over in remunerative work, £0.00 x 1/7; (b) in respect of a non-dependant aged 18 or over to whom sub­ paragraph (a) does not apply, £0.00 x 1/7."
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          if non_dependant_is_in_remunerative_work: bath_and_north_east_somerset_council_tax_reduction_remunerative_work_index else: bath_and_north_east_somerset_council_tax_reduction_non_remunerative_work_index

