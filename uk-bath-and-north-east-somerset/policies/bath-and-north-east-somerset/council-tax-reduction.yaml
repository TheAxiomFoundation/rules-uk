module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: uk-bath-and-north-east-somerset/manual/council-tax-reduction-scheme-2026-2027/page-181
    upstream_source_check:
      status: delegated_scheme
      checked_paths:
        - uk/statutes/ukpga/1992/14/13A
        - uk/regulations/uksi/2012/2885
        - uk/regulations/uksi/2012/2886
      rationale: Section 13A delegates the working-age scheme to Bath and North East Somerset Council, so the authority's adopted 2026/27 scheme document is the operative source for these locally set parameters and award calculations.
  summary: |-
    The adopted scheme operates from 1 April 2026 through 31 March 2027. Its
    working-age award surface is hybrid: non-UC Classes D and E use a 78%
    maximum subject to a Band D liability cap, with a 100% actual-band override
    for listed protected classes and a 2 6/7% daily excess-income taper; UC
    Class F applies the printed 100%, 85%, 60%, 40%, 20%, or 0% income-band
    rate directly to actual weekly liability. Pension-age provisions are outside
    this module.
  deferred_outputs:
    - output: uk-bath-and-north-east-somerset:policies/bath-and-north-east-somerset/council-tax-reduction/schedule-1#legacy_weekly_applicable_amount
      reason: The category-specific personal allowances and premium schedules used to calculate the Classes D and E applicable amount are outside this award-surface module.
    - output: uk-bath-and-north-east-somerset:policies/bath-and-north-east-somerset/council-tax-reduction/sections-15-32#legacy_weekly_income_excluding_tariff
      reason: The detailed working-age legacy income assessment and disregard schedules are outside this award-surface module.
    - output: uk-bath-and-north-east-somerset:policies/bath-and-north-east-somerset/council-tax-reduction/schedule-6/paragraphs-2-4#class_f_assessed_weekly_income
      reason: The component-level Universal Credit income and disregard calculation is outside this award-surface module; this module consumes its assessed weekly result.
