format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: uk-blackpool/manual/council-tax-reduction-scheme-2026-2027/page-72
  summary: |-
    Blackpool's operative 2026-2027 local working-age scheme uses a 100 percent
    maximum, a 2 6/7 percent daily excess-income taper (20 percent weekly),
    a £16,000 capital limit with £1 weekly tariff income for each £250 or part
    above £6,000, and four working-age non-dependant deduction bands. After the
    means-test assessment, the scheme reduces the award by 27.11 percent for
    ordinary working-age claimants or 13.56 percent for the protected classes
    listed in section 59A.2. No minimum-award floor or council-tax band cap is
    stated. The pension-age prescribed scheme and its Class C alternative
    maximum reduction are outside this working-age module.
  deferred_outputs:
    - output: uk-blackpool:policies/blackpool/council-tax-reduction/schedule-1#applicable_premiums_amount
      reason: >-
        Schedule 1 contains category-specific premium eligibility and amount
        schedules used in the applicable amount. This award-surface module
        accepts the calculated weekly applicable amount as an input and does
        not treat omitted premiums as zero.
