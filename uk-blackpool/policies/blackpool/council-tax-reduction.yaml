        formula: |-
          if blackpool_council_tax_reduction_assessed_capital_for_year <= blackpool_council_tax_reduction_tariff_income_threshold: 0 else: ceil((min(blackpool_council_tax_reduction_assessed_capital_for_year, blackpool_council_tax_reduction_capital_limit) - blackpool_council_tax_reduction_tariff_income_threshold) / blackpool_council_tax_reduction_tariff_income_capital_step) * blackpool_council_tax_reduction_tariff_income_weekly_amount_per_step

