  - name: blackpool_council_tax_reduction_section_59a_2_protected_class
    kind: derived
    entity: Household
    dtype: Judgment
    period: Year
    source: Blackpool Council Tax Reduction Scheme 2026/27 section 59A.2
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: uk-blackpool/manual/council-tax-reduction-scheme-2026-2027/page-72
              excerpt: "Where the applicant or their partner receive, Disability Living Allowance or a Personal Independence Payment;"
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: uk-blackpool/manual/council-tax-reduction-scheme-2026-2027/page-72
              excerpt: "An applicant who is a lone parent and who is responsible and resides with a child under 5 years old ;"
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: uk-blackpool/manual/council-tax-reduction-scheme-2026-2027/page-72
              excerpt: "Where the applicant or their partners receives carers allowance;"
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: uk-blackpool/manual/council-tax-reduction-scheme-2026-2027/page-72
              excerpt: "Where the applicant or their partner is in receipt of a war pension, war widows’ pension, war disablement pension or equivalent;"
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: uk-blackpool/manual/council-tax-reduction-scheme-2026-2027/page-72
              excerpt: "Where the applicant or their partner receive: o Income Support; or o Income Related Employment and Support Allowance; or o Income Based Jobseeker’s Allowance;"
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: uk-blackpool/manual/council-tax-reduction-scheme-2026-2027/page-72
              excerpt: "Where the applicant or their partner is in receipt of Universal Credit and immediately prior to receipt of that were in receipt of: o Income Support; or o Income Related Employment and Support Allowance; or o Income Based Jobseeker’s Allowance;"
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: uk-blackpool/manual/council-tax-reduction-scheme-2026-2027/page-72
              excerpt: "Where the applicant, or their partner, is in receipt of Jobseeker’s Allowance Contribution Based;"
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: uk-blackpool/manual/council-tax-reduction-scheme-2026-2027/page-72
              excerpt: "Where the applicant, or their partner, is in receipt of Main Phase Employment and Support Allowance and are in the Work Related Activity Group;"
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: uk-blackpool/manual/council-tax-reduction-scheme-2026-2027/page-72
              excerpt: "Where the applicant is in receipt of Maximum Universal Credit and is neither employed, self-employed or in receipt of any other income which is taken into account when calculating their Universal Credit award;"
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: uk-blackpool/manual/council-tax-reduction-scheme-2026-2027/page-72
              excerpt: "Where the applicant is in receipt of Universal Credit which includes any of the following elements: o Limited capability for work o Limited capability for work & work related activity."
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          blackpool_council_tax_reduction_applicant_or_partner_receives_dla_or_pip
          or blackpool_council_tax_reduction_applicant_is_lone_parent_with_child_under_five
          or blackpool_council_tax_reduction_applicant_or_partner_receives_carers_allowance
          or blackpool_council_tax_reduction_applicant_or_partner_receives_qualifying_war_pension
          or blackpool_council_tax_reduction_applicant_or_partner_receives_legacy_income_based_benefit
          or blackpool_council_tax_reduction_universal_credit_followed_legacy_income_based_benefit
          or blackpool_council_tax_reduction_applicant_or_partner_receives_contribution_based_jsa
          or blackpool_council_tax_reduction_applicant_or_partner_receives_main_phase_esa_work_related_activity
          or blackpool_council_tax_reduction_applicant_receives_maximum_uc_without_earned_or_other_counted_income
          or blackpool_council_tax_reduction_universal_credit_includes_lcw_or_lcwra

