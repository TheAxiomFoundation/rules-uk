format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: uk-brentwood/manual/council-tax-reduction-scheme-2026-2027/page-58
    # upstream_source_check:
    #   status: delegated_scheme
    #   checked_paths: [uk/statutes/ukpga/1992/14/13A, uk/regulations/uksi/2012/2885, uk/regulations/uksi/2012/2886]
    #   rationale: Section 13A delegates the working-age scheme to this authority, so Brentwood's adopted document is operative.
  summary: |-
    Brentwood's operative working-age scheme applies a six-column weekly-income grid to 100% of eligible liability. The grid awards 75%, 50%, 25%, or zero according to weekly income and whether the family has no, one, or two-or-more dependants. A listed disability benefit raises a positive grid award to 100%; specified income-related benefits passport the award to 75%. Capital above £6,000, or an owner occupying a Band F, G, or H dwelling, produces no award. Paragraph 45.1 prints that there are no non-dependant deductions. The working-age grid has no excess-income taper, tariff-income rule, or minimum-entitlement floor; the document's 2 6/7% taper and £16,000 limit occur only in its pensioner prescribed-scheme restatement and are outside this module.
  deferred_outputs:
    - output: uk-brentwood:policies/brentwood/council-tax-reduction/sections-12-to-29-and-schedule-2#assessed_weekly_income
      reason: The award surface consumes weekly income calculated under the scheme; detailed earnings, self-employment, and income-disregard rules are outside this module.
    - output: uk-brentwood:policies/brentwood/council-tax-reduction/sections-31-to-38-and-schedule-3#assessed_capital
      reason: The award surface applies the local capital cliff; valuation, attribution, notional-capital, and capital-disregard rules are outside this module.
    - output: uk-brentwood:policies/brentwood/council-tax-reduction/class-c#alternative_maximum_council_tax_reduction
      reason: The separate pension-age alternative maximum reduction is outside this working-age award surface.
