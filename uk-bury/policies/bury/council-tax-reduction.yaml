  - name: bury_council_tax_reduction_working_age_scheme_applies
    kind: derived
    entity: Household
    dtype: Judgment
    period: Year
    source: Bury Council Tax Support Scheme 2026-27 paragraphs 1 and 9
    metadata:
      proof:
        atoms:
          - path: 'versions[0].formula'
            kind: condition
            source:
              corpus_citation_path: uk-bury/manual/council-tax-support-scheme-2026-27/page-4
              excerpt: "This document describes the scheme set up by Bury Council for the period 1st April 2026 until 31st March 2027."
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          local_authority_is_bury and council_tax_reduction_household_in_england and bury_council_tax_reduction_applicant_is_working_age and would_claim_council_tax_reduction

  - name: bury_council_tax_reduction_capital_eligible
    kind: derived
    entity: Household
    dtype: Judgment
    period: Year
