            kind: condition
            source:
              corpus_citation_path: uk-bury/manual/council-tax-support-scheme-2026-27/page-9
              excerpt: "If an applicant has more than £16,000 (£8,000 for working-age applicants) in capital, no council tax support is applied under this scheme."
    versions: [{effective_from: '2026-04-01', formula: "bury_council_tax_reduction_assessed_capital_for_year <= bury_council_tax_reduction_capital_limit"}]

  - name: bury_council_tax_reduction_earnings_band
    kind: derived
    entity: Household
    dtype: Integer
    period: Month
    source: Bury Council Tax Support Scheme 2026-27 paragraphs 9 and 10
    metadata:
      proof:
        atoms:
