format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: uk-bury/manual/council-tax-support-scheme-2026-27/page-10
    # upstream_source_check:
      # status: delegated_scheme
      # checked_paths: [uk/statutes/ukpga/1992/14/13A, uk/regulations/uksi/2012/2885, uk/regulations/uksi/2012/2886]
      # rationale: LGFA 1992 section 13A delegates the working-age scheme to Bury Council, so the adopted document is operative.
  summary: |-
    Bury's operative 2026-27 working-age award is a direct earnings-banded percentage of the capped liability: 80, 60, 40, 20, or nil. The document prints no working-age excess-income taper and no working-age tariff-income rule; its sole local capital rule is the £8,000 cliff. Paragraphs 36-37 prescribe the award order but contain no sentence expressly stating that a grid percentage is multiplied by a separately calculated 80 percent maximum; this module therefore applies the printed grid percentage directly to the actual-or-Band-B-capped liability. The Band-B cap does not apply to protected groups. Pension-age provisions are outside scope.
  deferred_outputs:
    - output: uk-bury:policies/bury/council-tax-reduction/paragraphs-14-to-25#assessed_monthly_earnings
      reason: Earnings assessment, Universal Credit earnings retrieval, and the detailed applicant/partner aggregation rules are outside this award-surface module.
    - output: uk-bury:policies/bury/council-tax-reduction/paragraphs-26-to-33-and-appendix-5#assessed_capital
      reason: Capital valuation, attribution, notional-capital, and disregard rules are outside this award-surface module.
    - output: uk-bury:policies/bury/council-tax-reduction/paragraph-12#protected_group_classifier
      reason: The detailed benefit, carer, lone-parent, and bereavement classifiers are supplied as a boundary fact.
    - output: uk-bury:policies/bury/council-tax-reduction/paragraphs-43-to-52#chargeable_non_dependant_count
      reason: The detailed non-dependant membership, age, couple, and exemption classifiers are outside this flat-deduction calculation.
