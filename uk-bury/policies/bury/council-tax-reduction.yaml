            kind: parameter_table
            source:
              corpus_citation_path: uk-bury/manual/council-tax-support-scheme-2026-27/page-6
              excerpt: "The percentage support awarded depends on where the applicant’s earnings fall in the ranges listed in the table."
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          if bury_council_tax_reduction_monthly_earned_income == bury_council_tax_reduction_zero_award: bury_council_tax_reduction_nil_earnings_band_code else: if bury_council_tax_reduction_number_of_children >= bury_council_tax_reduction_three_or_more_children_threshold: if bury_council_tax_reduction_monthly_earned_income <= bury_council_tax_reduction_three_child_band_2_upper_earnings: bury_council_tax_reduction_band_2_code else: if bury_council_tax_reduction_monthly_earned_income <= bury_council_tax_reduction_two_plus_children_band_3_upper_earnings: bury_council_tax_reduction_band_3_code else: if bury_council_tax_reduction_monthly_earned_income <= bury_council_tax_reduction_two_plus_children_band_4_upper_earnings: bury_council_tax_reduction_band_4_code else: bury_council_tax_reduction_nil_band_code else: if bury_council_tax_reduction_number_of_children == bury_council_tax_reduction_two_children_threshold: if bury_council_tax_reduction_monthly_earned_income <= bury_council_tax_reduction_three_child_band_2_upper_earnings: bury_council_tax_reduction_band_2_code else: if bury_council_tax_reduction_monthly_earned_income <= bury_council_tax_reduction_two_plus_children_band_3_upper_earnings: bury_council_tax_reduction_band_3_code else: if bury_council_tax_reduction_monthly_earned_income <= bury_council_tax_reduction_two_plus_children_band_4_upper_earnings: bury_council_tax_reduction_band_4_code else: bury_council_tax_reduction_nil_band_code else: if bury_council_tax_reduction_number_of_children == bury_council_tax_reduction_one_child_threshold: if bury_council_tax_reduction_monthly_earned_income <= bury_council_tax_reduction_two_child_band_2_upper_earnings: bury_council_tax_reduction_band_2_code else: if bury_council_tax_reduction_monthly_earned_income <= bury_council_tax_reduction_one_child_band_3_upper_earnings: bury_council_tax_reduction_band_3_code else: if bury_council_tax_reduction_monthly_earned_income <= bury_council_tax_reduction_one_child_band_4_upper_earnings: bury_council_tax_reduction_band_4_code else: bury_council_tax_reduction_nil_band_code else: if bury_council_tax_reduction_applicant_has_partner: if bury_council_tax_reduction_monthly_earned_income <= bury_council_tax_reduction_single_one_child_band_2_upper_earnings: bury_council_tax_reduction_band_2_code else: if bury_council_tax_reduction_monthly_earned_income <= bury_council_tax_reduction_couple_band_3_upper_earnings: bury_council_tax_reduction_band_3_code else: if bury_council_tax_reduction_monthly_earned_income <= bury_council_tax_reduction_couple_band_4_upper_earnings: bury_council_tax_reduction_band_4_code else: bury_council_tax_reduction_nil_band_code else: if bury_council_tax_reduction_monthly_earned_income <= bury_council_tax_reduction_single_one_child_band_2_upper_earnings: bury_council_tax_reduction_band_2_code else: if bury_council_tax_reduction_monthly_earned_income <= bury_council_tax_reduction_single_band_3_upper_earnings: bury_council_tax_reduction_band_3_code else: if bury_council_tax_reduction_monthly_earned_income <= bury_council_tax_reduction_single_band_4_upper_earnings: bury_council_tax_reduction_band_4_code else: bury_council_tax_reduction_nil_band_code

