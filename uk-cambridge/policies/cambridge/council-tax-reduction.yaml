format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: uk-cambridge/manual/council-tax-reduction-scheme-working-age/page-65
    # upstream_source_check:
    # status: delegated_scheme
    # checked_paths:
    # - uk/statutes/ukpga/1992/14/13A
    # - uk/regulations/uksi/2012/2885
    # - uk/regulations/uksi/2012/2886
    # rationale: Section 13A of the Local Government Finance Act 1992 delegates the working-age scheme to Cambridge City Council, so its adopted scheme document is the operative legal source for the locally set working-age values.
  summary: |-
    Cambridge's operative 2026-27 non-Universal-Credit working-age Classes D and E award starts from 100 percent of eligible council-tax liability. Paragraph 47 defines that maximum after the applicable non-dependant deduction; paragraph 49 then subtracts the Class E excess-income amount. The printed daily 2 6/7 percent taper is derived to a weekly rate, and capital over £16,000 is an eligibility cliff with tariff income above £6,000. The current end-of-calculation deduction is zero, so the listed protected classes do not change the current award. The separate Universal Credit Class F table is deferred because the adopted February 2026 minutes require its income bands and contribution levels to be uprated but do not print the replacement cells; its printed £0.01 minimum-entitlement threshold and the minutes' £8.36 Universal Credit non-dependant amount are encoded. Pension-age provisions are outside this working-age module.
  deferred_outputs:
    - output: uk-cambridge:policies/cambridge/council-tax-reduction/paragraphs-44-to-45-and-schedule-1#applicable_amount
      reason: The category-specific allowances, premiums, components, and transitional additions used to calculate the applicable amount are outside this award-surface module.
    - output: uk-cambridge:policies/cambridge/council-tax-reduction/parts-15-to-17-and-schedules-2-to-4#assessed_income_and_capital
      reason: Detailed income disregards, attribution, valuation, notional capital, and capital disregards are outside this award-surface module.
    - output: uk-cambridge:policies/cambridge/council-tax-reduction/paragraph-47#eligible_liability_after_discounts_and_joint_liability
      reason: The award surface consumes eligible liability after council-tax discounts, exemptions, and joint-liability apportionment.
    - output: uk-cambridge:policies/cambridge/council-tax-reduction/paragraph-48.3-to-48.10#non_dependant_exemption_couple_and_apportionment
      reason: This module encodes the published deduction amounts and consumes the resulting household total; detailed exemption, couple, and apportionment classifiers are outside its scope.
    - output: uk-cambridge:policies/cambridge/council-tax-reduction/paragraph-49a.3#protected_end_of_calculation_deduction_classification
      reason: The current end-of-calculation deduction is zero for every claimant, so its protected-class classifier has no 2026-27 monetary effect.
    - output: uk-cambridge:policies/cambridge/council-tax-reduction/schedule-a1#universal_credit_class_f_annual_award
      reason: The unamended £0.01 minimum-entitlement threshold is encoded, but the February 2026 adoption minutes require the Class F Universal Credit income bands and contribution levels to be uprated without publishing the replacement 2026-27 table cells; this module does not infer them from the superseded base table.
rules:
  - name: cambridge_council_tax_reduction_maximum_support_rate
    kind: parameter
    dtype: Rate
    period: Year
    source: Cambridge City Council Full Council minutes, 26 February 2026, recommendation 3; Council Tax Reduction Scheme paragraph 47(1)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: effective_period
            source:
              corpus_citation_path: uk-cambridge/manual/council-tax-reduction-scheme-working-age/page-2
              excerpt: "Approved and Made by Council 10 October 2022 Coming into effect in relation to financial years beginning on or after 1 April 2025"
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: uk-cambridge/manual/full-council-minutes-2026-02-26/page-22
              excerpt: "That 100% of the Council Tax liability shall continue to be used as the starting point for the calculation of entitlement under both Council Tax Reduction Schemes."
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: uk-cambridge/manual/council-tax-reduction-scheme-working-age/page-59
              excerpt: "Where an applicant falls within paragraph 37 (class D) or 38 (class E), the amount of an applicant’s maximum council tax reduction in respect of a day is 100 per cent of the amount A /"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          1

  - name: cambridge_council_tax_reduction_daily_taper_rate
    kind: parameter
    dtype: Rate
    period: Day
    source: Cambridge City Council Council Tax Reduction Scheme paragraph 38(f)(ii), derived from the printed mixed-number percentage
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: uk-cambridge/manual/council-tax-reduction-scheme-working-age/page-52
              excerpt: "amount B is 2 and 6/7 per cent of the difference between his income for the relevant week and his applicable amount;"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          (cambridge_council_tax_reduction_taper_whole_percentage_points + cambridge_council_tax_reduction_taper_fraction_numerator / cambridge_council_tax_reduction_days_per_week) * cambridge_council_tax_reduction_per_cent_unit

