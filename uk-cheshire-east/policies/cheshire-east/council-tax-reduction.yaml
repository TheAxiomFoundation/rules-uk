    kind: derived
    entity: Person
    dtype: Judgment
    period: Year
    source: Cheshire East Council Tax Reduction Scheme 2026/27 paragraphs 58.1 and 58.4-58.6
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
