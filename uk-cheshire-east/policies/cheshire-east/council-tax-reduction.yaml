format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: uk-cheshire-east/manual/council-tax-reduction-scheme-2026-2027/page-100
  summary: |-
    Upstream-source status: delegated_scheme. LGFA 1992 section 13A delegates the working-age scheme to Cheshire East, so the Council's adopted document is operative. Checked paths: uk/statutes/ukpga/1992/14/13A, uk/regulations/uksi/2012/2885, and uk/regulations/uksi/2012/2886. Cheshire East's adopted 2026-27 working-age scheme is an income-banded grid, not the 20 percent pension-age taper printed on page 6. It caps ordinary maximum support at 80 percent of Band-D-or-lower liability, applies five income-grid rates and a zero band, excludes capital of £6,000 or more, deducts £11.16 weekly for each non-exempt adult non-dependant, and suppresses awards below £2 weekly. Specified income-related benefits receive 100 percent support. The working-age scheme contains no tariff-income rule: its £6,000 capital threshold is an immediate eligibility cliff.
  deferred_outputs:
    - output: uk-cheshire-east:policies/cheshire-east/council-tax-reduction/sections-15-to-56-and-schedules-3-to-5#assessed_weekly_income
      reason: The award surface consumes weekly income and assessed capital after the scheme's detailed income, disregard, attribution, and valuation rules, which are outside this module.
    - output: uk-cheshire-east:policies/cheshire-east/council-tax-reduction/section-57.1#band_d_capped_annual_liability
      reason: The award surface consumes liability already limited to the lower of actual discounted liability and Band D and adjusted for joint liability; valuation of that council-tax base is outside this module.
    - output: uk-cheshire-east:policies/cheshire-east/council-tax-reduction/section-58.2-to-58.3#annual_non_dependant_deductions_after_coordination
      reason: Couple coordination and apportionment between jointly liable people require resident relationships outside this household award surface.
