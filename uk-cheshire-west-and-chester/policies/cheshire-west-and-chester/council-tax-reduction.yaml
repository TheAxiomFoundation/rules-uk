        formula: |-
          if cheshire_west_and_chester_council_tax_reduction_protected_class: cheshire_west_and_chester_council_tax_reduction_protected_maximum_support_rate else: cheshire_west_and_chester_council_tax_reduction_standard_maximum_support_rate

  - name: cheshire_west_and_chester_council_tax_reduction_selected_eligible_liability_for_year
    kind: derived
    entity: Household
    dtype: Money
    period: Year
    unit: GBP
    source: Cheshire West and Chester Council Tax Reduction Scheme 2026/27 paragraphs 5.1 and 6.3
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: exception
            source:
              corpus_citation_path: uk-cheshire-west-and-chester/manual/council-tax-reduction-scheme-2026-2027/page-14
              excerpt: "There is no restriction to any Council Tax banding where these protections apply for war pensioners"
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: uk-cheshire-west-and-chester/manual/council-tax-reduction-scheme-2026-2027/page-14
              excerpt: "dwellings in valuation bands E, F, G and H then a will be the amount as it would have applied to dwellings in valuation band D."
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          if cheshire_west_and_chester_council_tax_reduction_is_war_pensioner: cheshire_west_and_chester_council_tax_reduction_actual_annual_liability_after_discounts else: min(cheshire_west_and_chester_council_tax_reduction_actual_annual_liability_after_discounts, cheshire_west_and_chester_council_tax_reduction_band_d_annual_liability_after_discounts)

  - name: cheshire_west_and_chester_council_tax_reduction_capital_eligible
    kind: derived
    entity: Household
    dtype: Judgment
    period: Year
    source: Cheshire West and Chester Council Tax Reduction Scheme 2026/27 paragraphs 35.2 and 35.3
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: uk-cheshire-west-and-chester/manual/council-tax-reduction-scheme-2026-2027/page-52
              excerpt: "capital limit for working age applicants of £6,000, except for those who are defined as war pensioners"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          (cheshire_west_and_chester_council_tax_reduction_is_war_pensioner and cheshire_west_and_chester_council_tax_reduction_assessed_capital <= cheshire_west_and_chester_council_tax_reduction_war_pensioner_capital_limit)
          or (not cheshire_west_and_chester_council_tax_reduction_is_war_pensioner and cheshire_west_and_chester_council_tax_reduction_assessed_capital <= cheshire_west_and_chester_council_tax_reduction_standard_capital_limit)

  - name: cheshire_west_and_chester_council_tax_reduction_tariff_income_for_year
    kind: derived
    entity: Household
    dtype: Money
    period: Year
    unit: GBP
    source: Cheshire West and Chester Council Tax Reduction Scheme 2026/27 paragraphs 35.1 and 35.4
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: uk-cheshire-west-and-chester/manual/council-tax-reduction-scheme-2026-2027/page-52
              excerpt: "where any part of the excess is not a complete £250 that part shall be treated as equivalent to a weekly tariff income of £1."
          - path: versions[0].formula
            kind: exception
            source:
              corpus_citation_path: uk-cheshire-west-and-chester/manual/council-tax-reduction-scheme-2026-2027/page-52
              excerpt: "which applies to war pensioners only."
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          if cheshire_west_and_chester_council_tax_reduction_is_war_pensioner: cheshire_west_and_chester_council_tax_reduction_tariff_income_weekly_amount_per_step * ceil(max(0, cheshire_west_and_chester_council_tax_reduction_assessed_capital - cheshire_west_and_chester_council_tax_reduction_tariff_income_threshold) / cheshire_west_and_chester_council_tax_reduction_tariff_income_capital_step) * cheshire_west_and_chester_council_tax_reduction_weeks_per_year else: 0

  - name: cheshire_west_and_chester_council_tax_reduction_excess_income_for_year
    kind: derived
    entity: Household
    dtype: Money
    period: Year
    unit: GBP
    source: Cheshire West and Chester Council Tax Reduction Scheme 2026/27 paragraph 34.1
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: uk-cheshire-west-and-chester/manual/council-tax-reduction-scheme-2026-2027/page-52
              excerpt: "excess of income over the applicable amount"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          max(0, cheshire_west_and_chester_council_tax_reduction_assessed_income_for_year + cheshire_west_and_chester_council_tax_reduction_tariff_income_for_year - cheshire_west_and_chester_council_tax_reduction_applicable_amount_for_year)

  - name: cheshire_west_and_chester_council_tax_reduction_income_taper_deduction_for_year
    kind: derived
    entity: Household
    dtype: Money
    period: Year
    unit: GBP
    source: Cheshire West and Chester Council Tax Reduction Scheme 2026/27 paragraph 34.1
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: uk-cheshire-west-and-chester/manual/council-tax-reduction-scheme-2026-2027/page-52
              excerpt: "percentage of excess of income over the applicable amount which is deducted from maximum"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          cheshire_west_and_chester_council_tax_reduction_excess_income_for_year * cheshire_west_and_chester_council_tax_reduction_weekly_taper_rate

  - name: cheshire_west_and_chester_council_tax_reduction_non_dependant_deduction_band
    kind: derived
    entity: Person
    dtype: Number
    period: Week
    source: Cheshire West and Chester Council Tax Reduction Scheme 2026/27 paragraphs 33.1 and 33.1A
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter_table
            source:
              corpus_citation_path: uk-cheshire-west-and-chester/manual/council-tax-reduction-scheme-2026-2027/page-49
              excerpt: "In the case of a non-dependant aged 18 or over to whom sub-paragraph 1(a) applies, where it is shown to Cheshire West and Chester Council that his normal gross weekly income is less than £279.00, the deduction to be made under this paragraph is that specified in subparagraph 1(b)."
              table:
                header: "33.1A working non-dependant threshold"
                row_key: "threshold result"
                column_key: "deduction band"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          if cheshire_west_and_chester_council_tax_reduction_non_dependant_in_remunerative_work and cheshire_west_and_chester_council_tax_reduction_non_dependant_normal_gross_weekly_income >= cheshire_west_and_chester_council_tax_reduction_non_dependant_low_income_threshold_weekly: 1 else: 0

  - name: cheshire_west_and_chester_council_tax_reduction_individual_non_dependant_deduction_for_year
    kind: derived
    entity: Person
    dtype: Money
    period: Year
    unit: GBP
    source: Cheshire West and Chester Council Tax Reduction Scheme 2026/27 paragraph 33
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: uk-cheshire-west-and-chester/manual/council-tax-reduction-scheme-2026-2027/page-49
              excerpt: "the non-dependant deductions in respect of a day referred to in maximum Council Tax Reduction shall be:"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          if cheshire_west_and_chester_council_tax_reduction_is_non_dependant and not cheshire_west_and_chester_council_tax_reduction_non_dependant_exempt: cheshire_west_and_chester_council_tax_reduction_non_dependant_weekly_deduction_by_band[cheshire_west_and_chester_council_tax_reduction_non_dependant_deduction_band] * cheshire_west_and_chester_council_tax_reduction_weeks_per_year else: 0

  - name: cheshire_west_and_chester_council_tax_reduction_amount_before_minimum_floor
    kind: derived
    entity: Household
    dtype: Money
    period: Year
    unit: GBP
    source: Cheshire West and Chester Council Tax Reduction Scheme 2026/27 working-age award calculation
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: uk-cheshire-west-and-chester/manual/council-tax-reduction-scheme-2026-2027/page-52
              excerpt: "which is deducted from maximum, Council Tax Reduction"
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: uk-cheshire-west-and-chester/manual/council-tax-reduction-scheme-2026-2027/page-49
              excerpt: "non-dependant deductions in respect of a day referred to in maximum Council Tax Reduction"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          max(0, cheshire_west_and_chester_council_tax_reduction_selected_eligible_liability_for_year * cheshire_west_and_chester_council_tax_reduction_selected_maximum_support_rate - cheshire_west_and_chester_council_tax_reduction_income_taper_deduction_for_year - cheshire_west_and_chester_council_tax_reduction_non_dependant_deductions_for_year)

  - name: cheshire_west_and_chester_council_tax_reduction_minimum_floor_met
    kind: derived
    entity: Household
    dtype: Judgment
    period: Year
    source: Cheshire West and Chester Council Tax Reduction Scheme 2026/27 paragraph 34.2
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: uk-cheshire-west-and-chester/manual/council-tax-reduction-scheme-2026-2027/page-52
              excerpt: "if an applicant’s assessed entitlement is £1.99 per week or less, then no entitlement shall be awarded"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          cheshire_west_and_chester_council_tax_reduction_amount_before_minimum_floor > cheshire_west_and_chester_council_tax_reduction_minimum_entitlement_weekly * cheshire_west_and_chester_council_tax_reduction_weeks_per_year

  - name: cheshire_west_and_chester_council_tax_reduction_award_conditions_met
    kind: derived
    entity: Household
    dtype: Judgment
    period: Year
    source: Cheshire West and Chester Council Tax Reduction Scheme 2026/27 Classes A to D
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: uk-cheshire-west-and-chester/manual/council-tax-reduction-scheme-2026-2027/page-12
              excerpt: "who has made an application for a reduction under the authority’s scheme."
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          local_authority_is_cheshire_west_and_chester and would_claim_council_tax_reduction and cheshire_west_and_chester_council_tax_reduction_applicant_is_working_age and cheshire_west_and_chester_council_tax_reduction_capital_eligible and cheshire_west_and_chester_council_tax_reduction_minimum_floor_met

