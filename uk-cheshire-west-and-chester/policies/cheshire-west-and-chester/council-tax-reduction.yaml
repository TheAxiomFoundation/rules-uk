    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: exception
            source:
              corpus_citation_path: uk-cheshire-west-and-chester/manual/council-tax-reduction-scheme-2026-2027/page-14
              excerpt: "This applies to classes C, D and war pensioners."
    versions:
