            kind: formula
            source:
              corpus_citation_path: uk-cheshire-west-and-chester/manual/council-tax-reduction-scheme-2026-2027/page-52
              excerpt: "Following the application of this 20 percent taper"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          if cheshire_west_and_chester_council_tax_reduction_award_conditions_met: cheshire_west_and_chester_council_tax_reduction_amount_before_minimum_floor else: 0

