format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: uk-cheshire-west-and-chester/manual/council-tax-reduction-scheme-2026-2027/page-52
  summary: |-
    Upstream-source status: delegated_scheme. LGFA 1992 section 13A delegates the working-age scheme to Cheshire West and Chester, so the Council's adopted document is operative. Checked paths: uk/statutes/ukpga/1992/14/13A, uk/regulations/uksi/2012/2885, and uk/regulations/uksi/2012/2886. Cheshire West and Chester's adopted 2026-27 working-age scheme is a taper scheme. Ordinary applicants receive at most 75 percent of discounted Band-D-or-lower liability; protected Classes C and D receive 100 percent but retain the Band D cap; working-age war pensioners receive 100 percent without the Band D cap and use a £16,000 capital limit with tariff income above £6,000. Other applicants face a £6,000 capital cliff. A 20 percent excess-income taper and working-age non-dependant deductions apply, and weekly entitlement of £1.99 or less is suppressed.
  deferred_outputs:
    - output: uk-cheshire-west-and-chester:policies/cheshire-west-and-chester/council-tax-reduction/section-31-and-schedule-1#applicable_amount
      reason: The personal allowances, child amounts, and premium schedules feeding the applicable amount are outside this award-surface module.
    - output: uk-cheshire-west-and-chester:policies/cheshire-west-and-chester/council-tax-reduction/section-33.2-to-33.7#non_dependant_coordination_and_exemptions
      reason: Couple coordination, apportionment, and the detailed exemption schedule require resident-level facts outside this household award surface.
