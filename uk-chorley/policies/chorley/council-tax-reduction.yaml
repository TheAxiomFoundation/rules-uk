            kind: formula
            source:
              corpus_citation_path: uk-chorley/manual/council-tax-reduction-scheme-2026-2027/page-72
              excerpt: "No deduction shall be made in respect of a non-dependant"
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: uk-chorley/manual/council-tax-reduction-scheme-2026-2027/page-71
              excerpt: "normal gross weekly income"
          - path: versions[0].formula
