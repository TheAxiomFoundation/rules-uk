          if not chorley_council_tax_reduction_is_non_dependant or chorley_council_tax_reduction_non_dependant_exempt: 0 else: chorley_council_tax_reduction_non_dependant_deduction_weekly_by_band[chorley_council_tax_reduction_non_dependant_band] * chorley_council_tax_reduction_weeks_per_year

