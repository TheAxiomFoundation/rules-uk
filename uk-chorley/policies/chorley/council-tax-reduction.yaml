        formula: |-
          if not chorley_council_tax_reduction_non_dependant_in_remunerative_work or chorley_council_tax_reduction_non_dependant_normal_gross_weekly_income < chorley_council_tax_reduction_non_dependant_mid_income_threshold_weekly: 0 else: (if chorley_council_tax_reduction_non_dependant_normal_gross_weekly_income < chorley_council_tax_reduction_non_dependant_high_income_threshold_weekly: 1 else: (if chorley_council_tax_reduction_non_dependant_normal_gross_weekly_income < chorley_council_tax_reduction_non_dependant_top_income_threshold_weekly: 2 else: 3))

  - name: chorley_council_tax_reduction_individual_non_dependant_deduction_for_year
