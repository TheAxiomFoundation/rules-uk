        formula: |-
          if chorley_council_tax_reduction_has_universal_credit_award: 0 else: chorley_council_tax_reduction_tariff_income_weekly_amount_per_step * ceil(max(0, chorley_council_tax_reduction_assessed_capital_for_year - chorley_council_tax_reduction_tariff_income_threshold) / chorley_council_tax_reduction_tariff_income_step) * chorley_council_tax_reduction_weeks_per_year

