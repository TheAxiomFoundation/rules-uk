format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: uk-chorley/manual/council-tax-reduction-scheme-2026-2027/page-73
    # upstream_source_check:
    #   status: delegated_scheme
    #   checked_paths: [uk/statutes/ukpga/1992/14/13A, uk/regulations/uksi/2012/2885, uk/regulations/uksi/2012/2886]
    #   rationale: Section 13A delegates the working-age scheme to Chorley Borough Council, so the Council's adopted scheme document is the operative source for its local values and award calculation. The pinned singular source-verification contract strips this attestation as a live field.
  summary: |-
    Chorley's operative 2026-27 working-age scheme is a taper scheme. The maximum is 100 percent of eligible liability, so it is not capped below 100 percent. Excess weekly income is withdrawn at 20 percent, derived from the printed daily 2 6/7 percent rate. Capital above £16,000 produces no award; capital above £6,000 through £16,000 produces £1 weekly tariff income for each £250 or part thereof. Non-dependant deductions are subtracted from the maximum. No minimum-award floor or council-tax band cap is stated. The pension-age prescribed scheme is outside this module.
  deferred_outputs:
    - output: uk-chorley:policies/chorley/council-tax-reduction/schedule-1#applicable_amount
      reason: The category-specific personal allowances and premiums are outside this award-surface module; the calculated applicable amount is consumed as an input.
    - output: uk-chorley:policies/chorley/council-tax-reduction/paragraphs-58.6-to-58.9#non_dependant_exemption_classifier
      reason: The detailed disability, student, benefit, absence, and armed-forces exemption tests are outside this award-surface module; their result is consumed as an input.
    - output: uk-chorley:policies/chorley/council-tax-reduction/class-c#alternative_maximum_council_tax_reduction
      reason: The separate pension-age second-adult alternative maximum reduction is outside this working-age module.
