          chorley_council_tax_reduction_non_dependant_weekly_hours >= chorley_council_tax_reduction_remunerative_work_hours

  - name: chorley_council_tax_reduction_non_dependant_band
    kind: derived
    entity: Person
    dtype: Number
    period: Year
    source: Chorley Council Tax Reduction Scheme 2026-2027 paragraph 58.2 income bands
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: uk-chorley/manual/council-tax-reduction-scheme-2026-2027/page-71
              excerpt: "less than £279.00, the deduction to be made under this paragraph shall be that specified in paragraph 58.1(b); (b) not less than £279.00, but less than £485.00, the deduction to be made under this section shall be £10.60 x1/7; (c) not less than £485.00, but less than £605.00, the deduction to be made under this section shall be £13.30 x 1/7;"
    versions:
