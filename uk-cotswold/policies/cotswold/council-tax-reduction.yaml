format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: uk-cotswold/manual/council-tax-reduction-scheme-2026-2027/page-14
    # upstream_source_check:
    #   status: delegated_scheme
    #   checked_paths: [uk/statutes/ukpga/1992/14/13A, uk/regulations/uksi/2012/2885, uk/regulations/uksi/2012/2886]
    #   rationale: Section 13A delegates the working-age scheme to Cotswold District Council, so its adopted scheme document is the operative source for the local award parameters. The pinned singular source-verification contract strips this attestation as a live field.
  summary: |-
    Upstream-source status is delegated_scheme; checked paths are
    uk/statutes/ukpga/1992/14/13A, uk/regulations/uksi/2012/2885, and
    uk/regulations/uksi/2012/2886. Section 13A makes Cotswold's adopted document
    operative. Cotswold's 2026-27 working-age scheme awards ordinary applicants 100, 80,
    60, 40, or 20 percent of Band-E-capped net liability according to a
    ten-family-column weekly-income grid. Protected applicants instead receive
    100 percent maximum support less non-dependant deductions and a 20 percent
    excess-income taper. Capital above £10,000 ends entitlement; capital above
    £6,000 produces £1 weekly tariff income per £250 or part. Pension-age rules
    are outside this module.
  deferred_outputs:
    - output: uk-cotswold:policies/cotswold/council-tax-reduction/protected-applicable-amounts#applicable_amount
      reason: Schedule 5 personal allowances, child amounts, premiums, components, and transitional additions are category-specific inputs to the protected award and are not encoded here.
rules:
  - name: cotswold_council_tax_reduction_maximum_support_rate
    kind: parameter
    dtype: Rate
    source: Cotswold Council Tax Support Scheme 2026/2027 section 54.1
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: uk-cotswold/manual/council-tax-reduction-scheme-2026-2027/page-99
              excerpt: "shall be 100 per cent, of the amount A divided by B"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          1

  - name: cotswold_council_tax_reduction_capital_limit
