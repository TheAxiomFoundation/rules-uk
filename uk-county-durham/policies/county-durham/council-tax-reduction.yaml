    kind: parameter
    dtype: Rate
    source: Durham County Council Working-age Council Tax Reduction Scheme 2026/27 section 2.3 income bands
    metadata: {proof: {atoms: [{path: "versions[0].formula", kind: parameter_table, source: {corpus_citation_path: uk-county-durham/manual/council-tax-reduction-scheme-2026-2027/page-5, excerpt: "Household weekly income % discount awarded £0.00 - £69.99 90% £70.00 - £125.00 75% £125.01 – 200.00 50% £200.01 - £275.00 25% £275.01 or more 0%", table: {header: "Household weekly income", row_key: "£0.00 - £69.99", column_key: "% discount awarded"}}}]}}
    versions: [{effective_from: '2026-04-01', formula: 0.90}]

