    versions: [{effective_from: '2026-04-01', formula: 12}]

  - name: county_durham_council_tax_reduction_capital_eligible
    kind: derived
    entity: Person
    dtype: Boolean
    period: Week
    source: Durham County Council Working-age Council Tax Reduction Scheme 2026/27 sections 2.2 and 6.1
    metadata: {proof: {atoms: [{path: "versions[0].formula", kind: formula, source: {corpus_citation_path: uk-county-durham/manual/council-tax-reduction-scheme-2026-2027/page-8, excerpt: "If an applicant has capital of £10,000 or more, they will not be eligible for a discount under this scheme."}}]}}
    versions: [{effective_from: '2026-04-01', formula: "if county_durham_council_tax_reduction_assessed_capital < county_durham_council_tax_reduction_capital_limit: true else: false"}]

  - name: county_durham_council_tax_reduction_tariff_income_for_week
    kind: derived
    entity: Person
    dtype: Money
    period: Week
    unit: GBP
    source: Durham County Council Working-age Council Tax Reduction Scheme 2026/27 section 8.4
    metadata: {proof: {atoms: [{path: "versions[0].formula", kind: formula, source: {corpus_citation_path: uk-county-durham/manual/council-tax-reduction-scheme-2026-2027/page-9, excerpt: "£1 for each £250 in excess of £6,000 but not £10,000 or more. b) £1 for any excess which is not a complete £250."}}]}}
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          if county_durham_council_tax_reduction_assessed_capital > county_durham_council_tax_reduction_tariff_income_threshold: ceil((county_durham_council_tax_reduction_assessed_capital - county_durham_council_tax_reduction_tariff_income_threshold) / county_durham_council_tax_reduction_tariff_income_step) * county_durham_council_tax_reduction_tariff_income_weekly_amount_per_step else: county_durham_council_tax_reduction_assessed_capital - county_durham_council_tax_reduction_assessed_capital

  - name: county_durham_council_tax_reduction_non_dependant_weekly_deduction
    kind: derived
    entity: Person
    dtype: Money
    period: Week
    unit: GBP
    source: Durham County Council Working-age Council Tax Reduction Scheme 2026/27 section 10.2
    metadata: {proof: {atoms: [{path: "versions[0].formula", kind: formula, source: {corpus_citation_path: uk-county-durham/manual/council-tax-reduction-scheme-2026-2027/page-10, excerpt: "a deduction of £10.00 per week is applied for each non-dependant aged 18 or over, unless they are exempt. For non-dependant couples, a £10.00 deduction is applied to each person"}}]}}
    versions: [{effective_from: '2026-04-01', formula: "county_durham_council_tax_reduction_non_dependant_count * county_durham_council_tax_reduction_non_dependant_weekly_deduction_by_band[county_durham_council_tax_reduction_non_dependant_deduction_band]"}]

  - name: county_durham_council_tax_reduction_assessed_weekly_income_with_tariff
    kind: derived
    entity: Person
    dtype: Money
    period: Week
    unit: GBP
    source: Durham County Council Working-age Council Tax Reduction Scheme 2026/27 sections 2.3 and 8.4
    metadata: {proof: {atoms: [{path: "versions[0].formula", kind: formula, source: {corpus_citation_path: uk-county-durham/manual/council-tax-reduction-scheme-2026-2027/page-9, excerpt: "The capital of an applicant, will be treated as if it were a weekly income of:"}}]}}
    versions: [{effective_from: '2026-04-01', formula: "county_durham_council_tax_reduction_assessed_weekly_income + county_durham_council_tax_reduction_tariff_income_for_week"}]

  - name: county_durham_council_tax_reduction_base_support_rate
    kind: derived
    entity: Person
    dtype: Rate
    period: Week
    source: Durham County Council Working-age Council Tax Reduction Scheme 2026/27 section 2.3
    metadata: {proof: {atoms: [{path: "versions[0].formula", kind: formula, source: {corpus_citation_path: uk-county-durham/manual/council-tax-reduction-scheme-2026-2027/page-4, excerpt: "The percentage of discount awarded is determined by the applicant’s weekly income, as assessed against the income bands set out below."}}]}}
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          if county_durham_council_tax_reduction_assessed_weekly_income_with_tariff >= county_durham_council_tax_reduction_income_band_0_lower_bound: county_durham_council_tax_reduction_support_rate_0 else: if county_durham_council_tax_reduction_assessed_weekly_income_with_tariff >= county_durham_council_tax_reduction_income_band_25_lower_bound: county_durham_council_tax_reduction_support_rate_25 else: if county_durham_council_tax_reduction_assessed_weekly_income_with_tariff >= county_durham_council_tax_reduction_income_band_50_lower_bound: county_durham_council_tax_reduction_support_rate_50 else: if county_durham_council_tax_reduction_assessed_weekly_income_with_tariff >= county_durham_council_tax_reduction_income_band_75_lower_bound: county_durham_council_tax_reduction_support_rate_75 else: county_durham_council_tax_reduction_support_rate_90

  - name: county_durham_council_tax_reduction_terminal_illness_support_within_limit
    kind: derived
    entity: Person
    dtype: Boolean
    period: Week
    source: Durham County Council Working-age Council Tax Reduction Scheme 2026/27 section 2.4
    metadata: {proof: {atoms: [{path: "versions[0].formula", kind: formula, source: {corpus_citation_path: uk-county-durham/manual/council-tax-reduction-scheme-2026-2027/page-5, excerpt: "Any household awarded, or currently receiving, a 90% discount will automatically qualify for 100% support for up to 12 months if a member of the household has been diagnosed with a terminal illness."}}]}}
    versions: [{effective_from: '2026-04-01', formula: "if county_durham_council_tax_reduction_terminal_illness_support_months <= county_durham_council_tax_reduction_terminal_illness_support_month_limit: true else: false"}]

  - name: county_durham_council_tax_reduction_support_rate
    kind: derived
    entity: Person
    dtype: Rate
    period: Week
    source: Durham County Council Working-age Council Tax Reduction Scheme 2026/27 section 2.4
    metadata: {proof: {atoms: [{path: "versions[0].formula", kind: formula, source: {corpus_citation_path: uk-county-durham/manual/council-tax-reduction-scheme-2026-2027/page-5, excerpt: "Any household awarded, or currently receiving, a 90% discount will automatically qualify for 100% support for up to 12 months if a member of the household has been diagnosed with a terminal illness."}}]}}
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          if county_durham_council_tax_reduction_capital_eligible == true: if county_durham_council_tax_reduction_terminal_illness_sr1_confirmed: if county_durham_council_tax_reduction_terminal_illness_support_within_limit == true: if county_durham_council_tax_reduction_base_support_rate == county_durham_council_tax_reduction_support_rate_90: county_durham_council_tax_reduction_terminal_illness_support_rate else: county_durham_council_tax_reduction_base_support_rate else: county_durham_council_tax_reduction_base_support_rate else: county_durham_council_tax_reduction_base_support_rate else: county_durham_council_tax_reduction_support_rate_0

  - name: county_durham_council_tax_reduction_daily_maximum_amount
    kind: derived
    entity: Person
    dtype: Money
    period: Day
    unit: GBP
    source: Durham County Council Working-age Council Tax Reduction Scheme 2026/27 section 9.1
    metadata: {proof: {atoms: [{path: "versions[0].formula", kind: formula, source: {corpus_citation_path: uk-county-durham/manual/council-tax-reduction-scheme-2026-2027/page-9, excerpt: "the maximum amount of council tax reduction is determined by first applying any relevant discounts or exemptions to the account and then calculating the daily liability."}}]}}
    versions: [{effective_from: '2026-04-01', formula: county_durham_council_tax_reduction_daily_liability_after_discounts_and_exemptions}]
inputs:
