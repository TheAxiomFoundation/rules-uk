format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: uk-county-durham/manual/council-tax-reduction-scheme-2026-2027/page-9
    # upstream_source_check:
      # status: delegated_scheme
      # checked_paths: [uk/statutes/ukpga/1992/14/13A, uk/regulations/uksi/2012/2885, uk/regulations/uksi/2012/2886]
      # rationale: LGFA 1992 section 13A delegates the working-age scheme to this authority so the adopted document is operative.
  summary: |-
    Durham County Council's adopted 2026/27 working-age scheme selects a 90, 75, 50, 25, or 0 percent discount from assessed weekly income. The document separately defines the daily maximum liability after discounts and exemptions, but contains no sentence linking the selected percentage to that maximum or directly to liability; this module therefore exposes each printed award-basis component and does not infer a monetary multiplication. A terminally ill household member with SR1 confirmation raises an existing 90 percent award to 100 percent for up to 12 months. Capital of £10,000 or more excludes entitlement, and capital above £6,000 produces £1 weekly tariff income per £250 or part. Pension-age provisions and detailed income, capital, liability, rounding, and non-dependant exemption classifiers are outside this module.
  deferred_outputs:
    - output: uk-county-durham:policies/county-durham/council-tax-reduction/sections-3-to-5-and-annexes-1-and-3#assessed_weekly_income
      reason: The detailed earnings, Universal Credit, disregard, and minimum-income-floor rules determine the boundary assessed-income input.
    - output: uk-county-durham:policies/county-durham/council-tax-reduction/sections-6-to-8-and-annex-2#assessed_capital
      reason: Capital valuation, attribution, notional capital, and disregard rules determine the boundary assessed-capital input.
    - output: uk-county-durham:policies/county-durham/council-tax-reduction/section-9#daily_maximum_council_tax_reduction
      reason: Discounts, exemptions, joint-liability shares, and rounding determine the boundary daily maximum amount.
    - output: uk-county-durham:policies/county-durham/council-tax-reduction/section-10#non_dependant_exemption_and_apportionment
      reason: The detailed non-dependant exemption, household membership, and joint-liability apportionment classifiers remain boundary inputs.
rules:
  - name: county_durham_council_tax_reduction_capital_limit
    kind: parameter
    dtype: Money
    period: Year
    unit: GBP
