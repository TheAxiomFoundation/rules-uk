    source: Durham County Council Working-age Council Tax Reduction Scheme 2026/27 section 10.2
    metadata:
      proof:
        atoms:
          - path: "versions[0].values"
            kind: parameter_table
            source:
              corpus_citation_path: uk-county-durham/manual/council-tax-reduction-scheme-2026-2027/page-10
              excerpt: "a deduction of £10.00 per week is applied for each non-dependant aged 18 or over, unless they are exempt. For non-dependant couples, a £10.00 deduction is applied to each person"
              table: {header: "Section 10.2 non-dependant deduction", row_key: "1", column_key: "weekly deduction"}
    versions: [{effective_from: '2026-04-01', values: {0: 0, 1: 10.00}}]

