    metadata: {proof: {atoms: [{path: "versions[0].formula", kind: amount, source: {corpus_citation_path: uk-county-durham/manual/council-tax-reduction-scheme-2026-2027/page-8, excerpt: "capital of £10,000 or more"}}]}}
    versions: [{effective_from: '2026-04-01', formula: 10000}]

