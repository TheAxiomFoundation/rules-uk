format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: uk-coventry/manual/council-tax-reduction-scheme-2026-2027/page-114
  summary: |-
    Coventry's 2026-27 working-age scheme uses weekly net income less the applicable amount to select one of five discount bands (80%, 65%, 40%, 20%, or 0%). The award applies the selected rate to eligible council tax liability after non-dependant deductions, subject to the £16,000 capital limit. Pages 1-7 concern the out-of-scope pension-age prescribed scheme.
  deferred_outputs:
    - output: uk-coventry:policies/coventry/council-tax-reduction/schedule-1#applicable_amount
      reason: The category-specific personal allowances and premium schedules used to calculate the applicable amount are outside this award-surface module.
    - output: uk-coventry:policies/coventry/council-tax-reduction/section-1.7#class_e_alternative_maximum_reduction
      reason: The separate second-adult alternative maximum reduction class is outside this working-age Class D award surface.
