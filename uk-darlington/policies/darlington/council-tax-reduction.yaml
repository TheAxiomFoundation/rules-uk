format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: uk-darlington/manual/council-tax-reduction-scheme-2026-2027/page-41
    # upstream_source_check:
    #   status: delegated_scheme
    #   checked_paths: [uk/statutes/ukpga/1992/14/13A, uk/regulations/uksi/2012/2885, uk/regulations/uksi/2012/2886]
    #   rationale: LGFA 1992 section 13A delegates the working-age scheme to Darlington Borough Council, so the adopted document is operative. The apply-stage encoder strips this attestation to the singular source-verification contract after local gates pass.
  summary: |-
    Darlington's 2026-2027 working-age Council Tax Support pays 80% of weekly eligible liability, after the scheme's joint-liability rule, and reduces that maximum by applicable non-dependant deductions and a 20% weekly excess-income taper. Means-tested routes require capital below £16,000; qualifying Income Support, income-based Jobseekers Allowance, and income-related Employment and Support Allowance are capital-disregarded. The module encodes Table 3's individual non-dependant amounts and the maximum deduction for unknown income, while consuming the detailed protection, exemption, and aggregation classifiers. No working-age protected maximum rate, minimum-award floor, or Council Tax-band cap is printed in the award calculation. Pension-age provisions are outside this working-age module.
  deferred_outputs:
    - output: uk-darlington:policies/darlington/council-tax-reduction/paragraphs-44-to-53#applicable_amount_and_universal_credit_maximum_award
      reason: This award surface consumes the weekly applicable amount and Universal Credit maximum award; the detailed personal-allowance and premium schedules are outside this module.
    - output: uk-darlington:policies/darlington/council-tax-reduction/paragraphs-63-to-105#assessed_weekly_income_after_disregards
      reason: This module uses the resulting weekly income inputs; earnings, other-income, disregard, and Universal Credit assessment calculations remain outside the award surface.
    - output: uk-darlington:policies/darlington/council-tax-reduction/paragraphs-106-to-116#assessed_capital_after_disregards
      reason: This module applies the local capital limit and tariff rule to the resulting capital amount; capital valuation, attribution, and detailed disregard calculations remain outside the award surface.
    - output: uk-darlington:policies/darlington/council-tax-reduction/paragraphs-118-to-119#weekly_liability_after_discounts
      reason: This module consumes liability already normalized from the printed A divided by B calculation after discounts, then encodes the local joint-liability division.
    - output: uk-darlington:policies/darlington/council-tax-reduction/paragraphs-123-to-127#non_dependant_deduction_before_joint_liability_apportionment
      reason: This module encodes the individual Table 3 bands and the final joint-liability apportionment, but consumes the detailed income-disregard, couple, protection, absence, student, benefit, and armed-forces classifiers and their aggregate result.
    - output: uk-darlington:policies/darlington/council-tax-reduction/paragraphs-136-to-137#extended_reduction
      reason: The separate four-week extended-reduction safeguard is outside the ordinary working-age maximum and taper calculation.
