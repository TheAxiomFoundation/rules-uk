  - name: dartford_council_tax_reduction_maximum_amount_for_year
    kind: derived
    entity: Person
    dtype: Money
    period: Year
    unit: GBP
    source: Dartford Council Tax Reduction Scheme 2026/27 paragraph 39.1
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: uk-dartford/manual/council-tax-reduction-scheme-2026-2027/page-54
              excerpt: "shall be 100 per cent, of the amount A divided by B where; (a) A is the amount set by the appropriate authority as the council tax for the relevant financial year in respect of the dwelling in which he is a resident and for which he is liable, subject to any discount which may be appropriate to that dwelling under the 1992 Act; and (b) B is the number of days in that financial year"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          dartford_council_tax_reduction_maximum_eligible_liability_for_year
          * dartford_council_tax_reduction_maximum_liability_rate

  - name: simulated_dartford_council_tax_reduction_annual_amount
    kind: derived
    entity: Person
    dtype: Money
    period: Year
    unit: GBP
    source: Dartford Council Tax Reduction Scheme 2026/27 Schedule 1 paragraphs 1-2 and paragraph 39.5
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: uk-dartford/manual/council-tax-reduction-scheme-2026-2027/page-73
              excerpt: "The amount of discount to be granted is to be based on the following factors: (a) The maximum Council Tax Reduction as defined within this scheme"
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: uk-dartford/manual/council-tax-reduction-scheme-2026-2027/page-55
              excerpt: "Where any reduction is calculated and the award is less than £1 per week, no reduction whatsoever will be granted."
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          if dartford_council_tax_reduction_working_age_scheme_applies and would_claim_council_tax_reduction and dartford_council_tax_reduction_capital_eligible: (if dartford_council_tax_reduction_maximum_amount_for_year * dartford_council_tax_reduction_selected_support_rate < dartford_council_tax_reduction_minimum_award_weekly * dartford_council_tax_reduction_weeks_per_year: 0 else: dartford_council_tax_reduction_maximum_amount_for_year * dartford_council_tax_reduction_selected_support_rate) else: 0

  - name: dartford_council_tax_reduction_annual_amount
    kind: derived
    entity: Person
    dtype: Money
    period: Year
    unit: GBP
    source: Dartford Council Tax Reduction Scheme 2026/27 final working-age award surface
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: uk-dartford/manual/council-tax-reduction-scheme-2026-2027/page-73
              excerpt: "Calculation of the amount of Council Tax Reduction in accordance with the Discount Scheme."
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          simulated_dartford_council_tax_reduction_annual_amount
