    kind: derived
    entity: Person
    dtype: Number
    period: Week
    source: Dartford Council Tax Reduction Scheme 2026/27 Schedule 1 grid
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter_table
            source:
              corpus_citation_path: uk-dartford/manual/council-tax-reduction-scheme-2026-2027/page-73
              excerpt: "Weekly Income levels Band Discount Single person Couple with no children or young person Couple or Lone Parent with one child /young person Couple or Lone Parent with two or more children /young persons 1 80% Relevant benefit (Passported) 1 80% £0 - £103.99 £0 - £154.99 £0 - £232.99 £0 - £308.99 2 60% £104 - £167.99 £155 - £218.99 £233 - £296.99 £309 - £384.99 3 40% £168 - £232.99 £219 - £283.99 £297 - £359.99 £385 - £449.99 4 20% £233 - £333.99 £284 - £384.99 £360 - £489.99 £450 - £577.99 5 0% £334+ £385+ £490+ £578+"
              table:
                header: Weekly Income levels
                row_key: weekly income and family category
                column_key: Band
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          if dartford_council_tax_reduction_passported_to_band_1: dartford_council_tax_reduction_band_1 else: if dartford_council_tax_reduction_weekly_income >= dartford_council_tax_reduction_band_5_lower_income_by_family[dartford_council_tax_reduction_family_category]: dartford_council_tax_reduction_band_5 else: if dartford_council_tax_reduction_weekly_income >= dartford_council_tax_reduction_band_4_lower_income_by_family[dartford_council_tax_reduction_family_category]: dartford_council_tax_reduction_band_4 else: if dartford_council_tax_reduction_weekly_income >= dartford_council_tax_reduction_band_3_lower_income_by_family[dartford_council_tax_reduction_family_category]: dartford_council_tax_reduction_band_3 else: if dartford_council_tax_reduction_weekly_income >= dartford_council_tax_reduction_band_2_lower_income_by_family[dartford_council_tax_reduction_family_category]: dartford_council_tax_reduction_band_2 else: dartford_council_tax_reduction_band_1

