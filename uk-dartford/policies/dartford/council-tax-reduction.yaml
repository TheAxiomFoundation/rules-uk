format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: uk-dartford/manual/council-tax-reduction-scheme-2026-2027/page-73
    # upstream_source_check:
    #   status: delegated_scheme
    #   checked_paths: [uk/statutes/ukpga/1992/14/13A, uk/regulations/uksi/2012/2885, uk/regulations/uksi/2012/2886]
    #   rationale: Section 13A delegates the working-age scheme to this authority, so Dartford's adopted document is operative.
  summary: |-
    Dartford's operative 2026-27 working-age scheme is a five-band weekly-income discount scheme, not an excess-income taper. The pensioner Class B text on page 6 contains the 2 6/7 per cent taper, but Schedule 1 governs working-age awards with rates of 80%, 60%, 40%, 20%, and 0%. Paragraph 39.1 defines the maximum as 100% of eligible liability, and Schedule 1 bases the discount on that maximum. Capital above £6,000 produces no award, with no working-age tariff-income interval below the cliff. The scheme prints no working-age non-dependant deduction rule. Awards below £1 per week are nil.
  deferred_outputs:
    - output: uk-dartford:policies/dartford/council-tax-reduction/sections-12-to-26-and-schedule-2#assessed_weekly_income
      reason: Detailed earnings, self-employment, minimum-income-floor, and income-disregard calculations are outside this award-surface module.
    - output: uk-dartford:policies/dartford/council-tax-reduction/sections-28-to-34-and-schedule-3#assessed_capital
      reason: Capital valuation, attribution, notional-capital, and disregard rules are outside this award-surface module.
    - output: uk-dartford:policies/dartford/council-tax-reduction/paragraphs-39.1-to-39.4#maximum_eligible_liability
      reason: The award surface consumes eligible liability after statutory discounts and joint-liability apportionment.
    - output: uk-dartford:policies/dartford/council-tax-reduction/pension-age-class-c#alternative_maximum_council_tax_reduction
      reason: The separate pension-age alternative maximum reduction is outside the working-age award surface.
