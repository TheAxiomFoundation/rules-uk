            kind: condition
            source:
              corpus_citation_path: uk-dartford/manual/council-tax-reduction-scheme-2026-2027/page-73
              excerpt: "capital is greater than £6,000 shall not be entitled to any Council Tax Reductions whatsoever"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          dartford_council_tax_reduction_assessed_capital_for_year
          <= dartford_council_tax_reduction_capital_limit

  - name: dartford_council_tax_reduction_passported_to_band_1
    kind: derived
    entity: Person
    dtype: Judgment
    period: Week
    source: Dartford Council Tax Reduction Scheme 2026/27 Schedule 1 paragraph 8
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: uk-dartford/manual/council-tax-reduction-scheme-2026-2027/page-73
              excerpt: "Where an applicant or partner is in receipt of a relevant benefit namely Income Support, Income Related Employment and Support Allowance or Income Based Jobseeker’s Allowance, discount will be award at Band 1 level (80%)"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          dartford_council_tax_reduction_applicant_or_partner_receives_income_support
          or dartford_council_tax_reduction_applicant_or_partner_receives_income_related_esa
          or dartford_council_tax_reduction_applicant_or_partner_receives_income_based_jsa

