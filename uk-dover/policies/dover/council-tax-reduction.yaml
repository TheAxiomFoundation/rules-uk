format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: uk-dover/manual/council-tax-reduction-scheme-2026-2027/page-80
    # upstream_source_check:
    #   status: delegated_scheme
    #   checked_paths: [uk/statutes/ukpga/1992/14/13A, uk/regulations/uksi/2012/2885, uk/regulations/uksi/2012/2886]
    #   rationale: Section 13A delegates the working-age scheme to Dover District Council, so the adopted document is operative. The pinned singular source-verification contract rejects and strips this attestation as a live field.
  summary: |-
    Dover's adopted 2026-27 working-age scheme is an income-banded discount, not an excess-income taper. It awards 100, 75, 50, or 25 percent of maximum Council Tax Reduction according to weekly income and family category, with no award above Band 4. Maximum Council Tax Reduction is 100 percent of the lower of actual discounted liability and Band D liability. Capital above £10,000 is an immediate cliff, with no tariff-income rule. A flat £10 weekly non-dependant deduction applies unless a printed protected or exempt class applies. The 2 6/7 percent text on page 6 belongs to the separately prescribed pension-age Class B and is outside this working-age module.
  deferred_outputs:
    - output: uk-dover:policies/dover/council-tax-reduction/sections-12-to-33-and-schedules-2-to-3#assessed_weekly_income_and_capital
      reason: Detailed income, disregard, attribution, and capital-valuation rules are outside this award-surface module.
    - output: uk-dover:policies/dover/council-tax-reduction/paragraph-35#band_d_capped_annual_liability
      reason: The award surface consumes liability already limited to the lower of actual discounted liability and Band D and adjusted for joint liability.
    - output: uk-dover:policies/dover/council-tax-reduction/paragraph-36#annual_non_dependant_deductions_after_coordination
      reason: Couple coordination and apportionment among jointly liable persons require resident relationships outside this household award surface.
rules:
  - name: dover_council_tax_reduction_family_category_codes
    kind: parameter
    dtype: Number
    indexed_by: dover_council_tax_reduction_family_category
    source: Dover Council Tax Reduction Scheme 2026-27 Schedule 1
    metadata:
      proof:
        atoms:
          - path: versions[0].values
            kind: parameter_table
            source: &grid_source
              corpus_citation_path: uk-dover/manual/council-tax-reduction-scheme-2026-2027/page-80
              excerpt: &grid_excerpt "Income Band Single Couple Family with 1 child Family with 2+ children Discount From To From To From To From To Band 1 0.00 109.00 0.00 164.00 0.00 246.00 0.00 327.00 100% Band 2 109.01 184.00 164.01 239.00 246.01 321.00 327.01 402.00 75% Band 3 184.01 259.00 239.01 314.00 321.01 396.00 402.01 477.00 50% Band 4 259.01 334.00 314.01 389.00 396.01 471.00 477.01 552.00 25%"
              table: &grid_table
                header: "Income Band and Discount"
                row_key: "Band"
                column_key: "family category"
    versions:
      - effective_from: '2026-04-01'
        values: {0: 0, 1: 1, 2: 2, 3: 3}

  - name: dover_council_tax_reduction_income_band_codes
    kind: parameter
    dtype: Number
    indexed_by: dover_council_tax_reduction_income_band
    source: Dover Council Tax Reduction Scheme 2026-27 Schedule 1
    metadata:
      proof:
        atoms:
          - path: versions[0].values
            kind: parameter_table
            source:
              <<: *grid_source
    versions:
      - effective_from: '2026-04-01'
        values: {0: 0, 1: 1, 2: 2, 3: 3, 4: 4}

  - name: dover_council_tax_reduction_maximum_support_rate
    kind: parameter
    dtype: Rate
    period: Year
    source: Dover Council Tax Reduction Scheme 2026-27 paragraph 35.1
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: uk-dover/manual/council-tax-reduction-scheme-2026-2027/page-49
              excerpt: "shall be 100 per cent, of the amount A divided by B"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          1.00

  - name: dover_council_tax_reduction_capital_limit
    kind: parameter
    dtype: Money
    period: Year
    unit: GBP
    source: Dover Council Tax Reduction Scheme 2026-27 paragraph 26.1
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: uk-dover/manual/council-tax-reduction-scheme-2026-2027/page-40
              excerpt: "the prescribed amount is £10,000 and no reduction shall be granted when the applicant has an amount greater than this level."
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          10000

  - name: dover_council_tax_reduction_days_per_week
    kind: parameter
    dtype: Number
    source: Dover Council Tax Reduction Scheme 2026-27 paragraph 36.1
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: uk-dover/manual/council-tax-reduction-scheme-2026-2027/page-49
              excerpt: "shall be £10 x 1/7"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          7

  - name: dover_council_tax_reduction_non_dependant_weekly_deduction_by_band
    kind: parameter
    dtype: Money
    period: Week
    unit: GBP
    indexed_by: dover_council_tax_reduction_non_dependant_deduction_band
    source: Dover Council Tax Reduction Scheme 2026-27 paragraph 36.1
    metadata:
      proof:
        atoms:
          - path: versions[0].values
            kind: parameter_table
            source:
              corpus_citation_path: uk-dover/manual/council-tax-reduction-scheme-2026-2027/page-49
              excerpt: "the non-dependant deductions in respect of a day referred to in section 35 (maximum council tax reduction) shall be £10 x 1/7"
              table:
                header: "36.0 Non-dependant deductions"
                row_key: "deduction band"
                column_key: "weekly deduction"
    versions:
      - effective_from: '2026-04-01'
        values: {0: 0, 1: 10}

  - name: dover_council_tax_reduction_band_2_lower_income_by_family
    kind: parameter
    dtype: Money
    period: Week
    unit: GBP
    indexed_by: dover_council_tax_reduction_family_category
    source: Dover Council Tax Reduction Scheme 2026-27 Schedule 1
    metadata: &grid_proof
      proof:
        atoms:
          - path: versions[0].values
            kind: parameter_table
            source:
              <<: *grid_source
    versions:
      - effective_from: '2026-04-01'
        values: {0: 109.01, 1: 164.01, 2: 246.01, 3: 327.01}

  - name: dover_council_tax_reduction_band_3_lower_income_by_family
    kind: parameter
    dtype: Money
    period: Week
    unit: GBP
    indexed_by: dover_council_tax_reduction_family_category
    source: Dover Council Tax Reduction Scheme 2026-27 Schedule 1
    metadata: *grid_proof
    versions:
      - effective_from: '2026-04-01'
        values: {0: 184.01, 1: 239.01, 2: 321.01, 3: 402.01}

  - name: dover_council_tax_reduction_band_4_lower_income_by_family
    kind: parameter
    dtype: Money
    period: Week
    unit: GBP
    indexed_by: dover_council_tax_reduction_family_category
    source: Dover Council Tax Reduction Scheme 2026-27 Schedule 1
    metadata: *grid_proof
    versions:
      - effective_from: '2026-04-01'
        values: {0: 259.01, 1: 314.01, 2: 396.01, 3: 477.01}

  - name: dover_council_tax_reduction_band_4_upper_income_by_family
    kind: parameter
    dtype: Money
    period: Week
    unit: GBP
    indexed_by: dover_council_tax_reduction_family_category
    source: Dover Council Tax Reduction Scheme 2026-27 Schedule 1
    metadata: *grid_proof
    versions:
      - effective_from: '2026-04-01'
        values: {0: 334.00, 1: 389.00, 2: 471.00, 3: 552.00}

  - name: dover_council_tax_reduction_discount_rate_by_band
    kind: parameter
    dtype: Rate
    period: Year
    indexed_by: dover_council_tax_reduction_income_band
    source: Dover Council Tax Reduction Scheme 2026-27 Schedule 1
    metadata: *grid_proof
    versions:
      - effective_from: '2026-04-01'
        values: {0: 1.00, 1: 0.75, 2: 0.50, 3: 0.25, 4: 0}

  - name: dover_council_tax_reduction_protected_discount_rate
    kind: parameter
    dtype: Rate
    period: Year
    source: Dover Council Tax Reduction Scheme 2026-27 Schedule 1 paragraphs 6-7
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: uk-dover/manual/council-tax-reduction-scheme-2026-2027/page-80
              excerpt: "discount will be awarded at Band 1 level."
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          1.00

  - name: dover_council_tax_reduction_family_category
    kind: derived
    entity: Household
    dtype: Number
    period: Year
    source: Dover Council Tax Reduction Scheme 2026-27 Schedule 1
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter_table
            source:
              <<: *grid_source
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          if dover_council_tax_reduction_has_two_or_more_children: dover_council_tax_reduction_family_category_codes[3] else: if dover_council_tax_reduction_has_one_child: dover_council_tax_reduction_family_category_codes[2] else: if dover_council_tax_reduction_has_partner: dover_council_tax_reduction_family_category_codes[1] else: dover_council_tax_reduction_family_category_codes[0]

  - name: dover_council_tax_reduction_income_band
    kind: derived
    entity: Household
    dtype: Number
    period: Week
    source: Dover Council Tax Reduction Scheme 2026-27 Schedule 1
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter_table
            source:
              <<: *grid_source
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          if dover_council_tax_reduction_assessed_weekly_income > dover_council_tax_reduction_band_4_upper_income_by_family[dover_council_tax_reduction_family_category]: dover_council_tax_reduction_income_band_codes[4] else: if dover_council_tax_reduction_assessed_weekly_income >= dover_council_tax_reduction_band_4_lower_income_by_family[dover_council_tax_reduction_family_category]: dover_council_tax_reduction_income_band_codes[3] else: if dover_council_tax_reduction_assessed_weekly_income >= dover_council_tax_reduction_band_3_lower_income_by_family[dover_council_tax_reduction_family_category]: dover_council_tax_reduction_income_band_codes[2] else: if dover_council_tax_reduction_assessed_weekly_income >= dover_council_tax_reduction_band_2_lower_income_by_family[dover_council_tax_reduction_family_category]: dover_council_tax_reduction_income_band_codes[1] else: dover_council_tax_reduction_income_band_codes[0]

  - name: dover_council_tax_reduction_passporting_benefit
    kind: derived
    entity: Household
    dtype: Judgment
    period: Year
    source: Dover Council Tax Reduction Scheme 2026-27 Schedule 1 paragraph 6
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: uk-dover/manual/council-tax-reduction-scheme-2026-2027/page-80
              excerpt: "Income Support, Income Related Employment and Support Allowance or Income Based Jobseeker’s Allowance"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          dover_council_tax_reduction_receives_income_support
          or dover_council_tax_reduction_receives_income_related_esa
          or dover_council_tax_reduction_receives_income_based_jsa

  - name: dover_council_tax_reduction_protected_band_one
    kind: derived
    entity: Household
    dtype: Judgment
    period: Year
    source: Dover Council Tax Reduction Scheme 2026-27 Schedule 1 paragraphs 6-11
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: uk-dover/manual/council-tax-reduction-scheme-2026-2027/page-80
              excerpt: "discount will be awarded at Band 1 level."
          - path: versions[0].formula
            kind: exception
            source:
              corpus_citation_path: uk-dover/manual/council-tax-reduction-scheme-2026-2027/page-80
              excerpt: "their assessable incomes will be disregarded in full which will result in their award then falling into Band 1."
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          dover_council_tax_reduction_passporting_benefit
          or dover_council_tax_reduction_uc_has_zero_earnings
          or dover_council_tax_reduction_kent_care_leaver_aged_21_to_24

  - name: dover_council_tax_reduction_selected_discount_rate
    kind: derived
    entity: Household
    dtype: Rate
    period: Year
    source: Dover Council Tax Reduction Scheme 2026-27 Schedule 1
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter_table
            source:
              <<: *grid_source
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          if dover_council_tax_reduction_protected_band_one: dover_council_tax_reduction_protected_discount_rate else: dover_council_tax_reduction_discount_rate_by_band[dover_council_tax_reduction_income_band]

  - name: dover_council_tax_reduction_capital_eligible
    kind: derived
    entity: Household
    dtype: Judgment
    period: Year
    source: Dover Council Tax Reduction Scheme 2026-27 paragraph 26.1
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: uk-dover/manual/council-tax-reduction-scheme-2026-2027/page-40
              excerpt: "no reduction shall be granted when the applicant has an amount greater than this level."
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          dover_council_tax_reduction_assessed_capital
          <= dover_council_tax_reduction_capital_limit

  - name: dover_council_tax_reduction_non_dependant_deduction_band
    kind: derived
    entity: Person
    dtype: Number
    period: Week
    source: Dover Council Tax Reduction Scheme 2026-27 paragraphs 36.1 and 36.4-36.6
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: uk-dover/manual/council-tax-reduction-scheme-2026-2027/page-49
              excerpt: "the non-dependant deductions in respect of a day referred to in section 35 (maximum council tax reduction) shall be £10 x 1/7"
          - path: versions[0].formula
            kind: exception
            source:
              corpus_citation_path: uk-dover/manual/council-tax-reduction-scheme-2026-2027/page-50
              excerpt: "No deduction is to be made in respect of a non-dependent if—"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          if dover_council_tax_reduction_person_is_non_dependant and not dover_council_tax_reduction_applicant_or_partner_is_protected_from_non_dependant_deductions and not dover_council_tax_reduction_non_dependant_is_exempt: dover_council_tax_reduction_income_band_codes[1] else: dover_council_tax_reduction_income_band_codes[0]

  - name: dover_council_tax_reduction_daily_non_dependant_deduction
    kind: derived
    entity: Person
    dtype: Money
    period: Day
    unit: GBP
    source: Dover Council Tax Reduction Scheme 2026-27 paragraph 36.1
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: uk-dover/manual/council-tax-reduction-scheme-2026-2027/page-49
              excerpt: "shall be £10 x 1/7"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          dover_council_tax_reduction_non_dependant_weekly_deduction_by_band[dover_council_tax_reduction_non_dependant_deduction_band] / dover_council_tax_reduction_days_per_week

  - name: dover_council_tax_reduction_maximum_amount_for_year
    kind: derived
    entity: Household
    dtype: Money
    period: Year
    unit: GBP
    source: Dover Council Tax Reduction Scheme 2026-27 paragraphs 35-36
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: uk-dover/manual/council-tax-reduction-scheme-2026-2027/page-49
              excerpt: "shall be 100 per cent, of the amount A divided by B"
          - path: versions[0].formula
            kind: ordering
            source:
              corpus_citation_path: uk-dover/manual/council-tax-reduction-scheme-2026-2027/page-49
              excerpt: "the non-dependant deductions in respect of a day referred to in section 35 (maximum council tax reduction) shall be £10 x 1/7"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          max(0, dover_council_tax_reduction_band_d_capped_annual_liability * dover_council_tax_reduction_maximum_support_rate - dover_council_tax_reduction_annual_non_dependant_deductions_after_coordination)

  - name: dover_council_tax_reduction_award_conditions_met
    kind: derived
    entity: Household
    dtype: Judgment
    period: Year
    source: Dover Council Tax Reduction Scheme 2026-27 working-age scope and capital rule
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: definition
            source:
              corpus_citation_path: uk-dover/manual/council-tax-reduction-scheme-2026-2027/page-4
              excerpt: "This document details how the scheme will operate for working age applicants"
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: uk-dover/manual/council-tax-reduction-scheme-2026-2027/page-80
              excerpt: "Any applicant whose capital is greater than £10,000 shall not be entitled to any Council Tax Reductions whatsoever."
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          local_authority_is_dover
          and would_claim_council_tax_reduction
          and dover_council_tax_reduction_applicant_is_in_working_age_class
          and dover_council_tax_reduction_capital_eligible

  - name: dover_council_tax_reduction_annual_amount
    kind: derived
    entity: Household
    dtype: Money
    period: Year
    unit: GBP
    source: Dover Council Tax Reduction Scheme 2026-27 Schedule 1 paragraphs 1-2
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: uk-dover/manual/council-tax-reduction-scheme-2026-2027/page-80
              excerpt: "The amount of discount to be granted is to be based on the following factors: a. The maximum Council Tax Reduction as defined within this scheme;"
          - path: versions[0].formula
            kind: parameter_table
            source:
              <<: *grid_source
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          if dover_council_tax_reduction_award_conditions_met: max(0, dover_council_tax_reduction_maximum_amount_for_year * dover_council_tax_reduction_selected_discount_rate) else: 0
