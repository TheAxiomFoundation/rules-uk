        formula: |-
          dudley_council_tax_reduction_non_dependant_count * dudley_council_tax_reduction_non_dependant_weekly_deduction_by_band[dudley_council_tax_reduction_flat_non_dependant_deduction_band] * dudley_council_tax_reduction_weeks_per_year

  - name: dudley_council_tax_reduction_maximum_amount_for_year
    kind: derived
