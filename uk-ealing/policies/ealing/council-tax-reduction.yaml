format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: uk-ealing/manual/council-tax-reduction-scheme-2026-2027/page-14
    # upstream_source_check:
    # status: delegated_scheme
    # checked_paths: [uk/statutes/ukpga/1992/14/13A, uk/regulations/uksi/2012/2885, uk/regulations/uksi/2012/2886]
    # rationale: LGFA 1992 section 13A delegates the working-age scheme to Ealing Council, so the adopted document is operative. The apply-stage encoder strips this attestation to the singular source-verification contract after local gates pass.
  summary: |-
    Ealing's operative 2026-27 working-age award is a banded scheme, not an excess-income taper. The table gives direct awards of 100%, 75%, 60%, 50%, 40%, 30%, 20%, 10%, and 0% for protected Class E and 80%, 60%, 50%, 40%, 30%, 20%, 10%, and 0% for non-protected Class D. The selected direct rate applies to maximum council-tax liability before non-dependant, extended-reduction, and capping adjustments; the 80% Class D Band 1 rate is not compounded with later table rates. Unless passported, Class D income must be below £308.40 and Class E income below £334.09. The detailed Class D/E eligibility clauses make capital of £6,000 or more ineligible, notwithstanding the broader page-13 wording that says capital exceeds £6,000. Awards below £2 per week are nil. Ealing prints no local tariff-income threshold, step, or amount, and its local capital cliff makes any incorporated default-regulations tariff methodology inoperative within an eligible award.
  deferred_outputs:
    - output: uk-ealing:policies/ealing/council-tax-reduction/sections-5-and-6#working_age_class_and_assessed_weekly_income
      reason: The award surface consumes the working-age eligibility result and assessed weekly income; liability, residency, pension-credit, income, earnings-disregard, self-employment, and Universal Credit calculation mechanics are outside this module.
    - output: uk-ealing:policies/ealing/council-tax-reduction/section-6#assessed_capital_and_default_regulations_tariff_income
      reason: This module applies Ealing's local capital cliff. Capital valuation, attribution, disregards, and the incorporated Default Regulations tariff-income methodology are not locally quantified in the adopted document and are outside this award surface.
    - output: uk-ealing:policies/ealing/council-tax-reduction/section-7#non_dependant_deduction_classifier_and_235_16_tie_breaker
      reason: The deduction amounts are encoded, but prescribed-scheme exemptions and the source's unresolved equality at exactly £235.16 of gross weekly earnings are consumed as a classified deduction band rather than invented here.
    - output: uk-ealing:policies/ealing/council-tax-reduction/section-9#extended_reduction_offset
      reason: The award formula consumes the amount of an extended reduction from another billing authority; its determination is outside this local working-age award surface.
    - output: uk-ealing:policies/ealing/council-tax-reduction/section-10#maximum_liability_class_d_capping_reduction_and_class_e_transitional_capping_adjustment
      reason: The award surface consumes discounted maximum liability. The document says to subtract capping for Class D and subtract or add transitional capping for Class E, but supplies no calculation or amount.
    - output: uk-ealing:policies/ealing/council-tax-reduction/sections-8-and-12#student_and_temporary_absence_eligibility
      reason: Student treatment and the working-age temporary-absence classifier are outside this award calculation module.
