  - name: elmbridge_council_tax_reduction_tariff_income_for_year
    kind: derived
    entity: Household
    dtype: Money
    period: Year
    unit: GBP
    source: Elmbridge Council Tax Reduction Scheme 2026-2027 paragraphs 57 and 72 working-age tariff income
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: uk-elmbridge/manual/council-tax-reduction-scheme-2026-2027/page-138
              excerpt: "£1 for any excess which is not a complete £250."
          - path: versions[0].formula
            kind: condition
            source:
