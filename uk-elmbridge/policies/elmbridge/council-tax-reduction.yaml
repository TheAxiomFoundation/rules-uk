        formula: |-
          elmbridge_council_tax_reduction_tariff_income_weekly_amount_per_step * ceil(max(0, elmbridge_council_tax_reduction_assessed_capital_for_year - elmbridge_council_tax_reduction_tariff_income_threshold) / elmbridge_council_tax_reduction_tariff_income_step) * elmbridge_council_tax_reduction_weeks_per_year

