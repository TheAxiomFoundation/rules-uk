format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: uk-elmbridge/manual/council-tax-reduction-scheme-2026-2027/page-58
    # upstream_source_check:
    #   status: delegated_scheme
    #   checked_paths: [uk/statutes/ukpga/1992/14/13A, uk/regulations/uksi/2012/2885, uk/regulations/uksi/2012/2886]
    #   rationale: LGFA 1992 section 13A delegates the working-age scheme to Elmbridge Borough Council, so the adopted document is operative. The apply-stage encoder strips this attestation to the singular source-verification contract after local gates pass.
  summary: |-
    Elmbridge's adopted 2026-27 working-age scheme applies the printed 100%, 95%, or 90% maximum-liability rate according to the council's vulnerability classification; the maximum is reduced by non-dependant deductions and then by the printed 20% weekly excess-income taper. Capital over £16,000 excludes an applicant; capital over £6,000 produces £1 weekly tariff income for each £250 or part thereof. The scheme has no minimum-award floor. Pension-age and separate alternative-maximum-reduction provisions are outside this module.
  deferred_outputs:
    - output: uk-elmbridge:policies/elmbridge/council-tax-reduction/schedule-3#applicable_amount
      reason: The working-age personal allowances, family premiums, disability premiums, components, and transitional additions underlying the applicable amount are outside this award-surface module.
    - output: uk-elmbridge:policies/elmbridge/council-tax-reduction/paragraphs-18-and-31-and-schedule-4#alternative_maximum_reduction
      reason: The separate second-adult alternative maximum reduction calculation is outside this working-age Classes D and E award surface.
    - output: uk-elmbridge:policies/elmbridge/council-tax-reduction/paragraph-29#working_age_vulnerability_classification
      reason: This module consumes the council's vulnerability classification to select the printed 100%, 95%, or 90% maximum rate; the category schedules themselves are outside this award calculation surface.
