format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: uk-folkestone-and-hythe/manual/council-tax-reduction-scheme-2026-2027/page-57
  summary: |-
    Folkestone and Hythe's 2026/27 working-age scheme is a four-band weekly-income grid, not an excess-income taper. It awards 100%, 75%, 50%, or 25% of the scheme-defined maximum, which is 100% of the lower of actual discounted liability and Band D liability. Capital over £16,000 produces no award; capital over £6,000 adds £1 weekly tariff income per £250 or part. A flat £10 weekly non-dependant deduction applies unless the printed benefit exemption applies. The 2 6/7% daily taper on page 6 belongs only to the out-of-scope pensioner Class B.
  deferred_outputs:
    - output: uk-folkestone-and-hythe:policies/folkestone-and-hythe/council-tax-reduction/sections-14-to-38-and-schedules-2-to-3#assessed_weekly_income_and_capital
      reason: Detailed income, disregard, capital valuation, and attribution rules are outside this award-surface module.
    - output: uk-folkestone-and-hythe:policies/folkestone-and-hythe/council-tax-reduction/paragraph-39.1#band_d_capped_eligible_liability
      reason: The module consumes liability already capped at the lower of actual discounted liability and Band D; charge lookup and joint-liability apportionment are outside scope.
    - output: uk-folkestone-and-hythe:policies/folkestone-and-hythe/council-tax-reduction/paragraphs-39.6-to-39.7#non_dependant_exemption_and_couple_classifier
      reason: The flat deduction is encoded; detailed benefit-status and couple classification is deferred.
    - output: uk-folkestone-and-hythe:policies/folkestone-and-hythe/council-tax-reduction/class-c#alternative_maximum_council_tax_reduction
      reason: The separate pension-age second-adult reduction is outside this working-age module.
rules:
  - name: folkestone_and_hythe_council_tax_reduction_maximum_liability_rate
    kind: parameter
    dtype: Rate
    source: Folkestone and Hythe Council Tax Reduction Scheme 2026 paragraph 39.1
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: uk-folkestone-and-hythe/manual/council-tax-reduction-scheme-2026-2027/page-41
              excerpt: "shall be 100 per cent, of the amount A divided by B"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          1.00

