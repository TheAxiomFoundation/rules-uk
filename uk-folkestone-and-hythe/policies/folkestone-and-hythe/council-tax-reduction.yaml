              excerpt: "Band Single Person Couple Household with 1 Child Household with 2 or more children Weekly income (£) Weekly income (£) Weekly income (£) Weekly income (£) (1) 100% discount 0.00 to 150.00 0.00 to 212.00 0.00 to 286.00 0.00 to 357.00 (2) 75% discount 150.01 to 200.00 212.01 to 254.00 286.01 to 322.00 357.01 to 448.00 (3) 50% discount 200.01 to 251.00 254.01 to 291.00 322.01 to 388.00 448.01 to 550.00 (4) 25% discount 251.01 to 368.00 291.01 to 408.00 388.01 to 479.00 550.01 to 647.00"
              table: {header: Banded Discount Scheme, row_key: family, column_key: weekly income}
    versions:
