  - name: folkestone_and_hythe_council_tax_reduction_capital_limit
    kind: parameter
    dtype: Money
    period: Year
    unit: GBP
    source: Folkestone and Hythe Council Tax Reduction Scheme 2026 paragraph 27.1
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: uk-folkestone-and-hythe/manual/council-tax-reduction-scheme-2026-2027/page-33
              excerpt: "the prescribed amount is £16,000 and no support shall be granted when the applicant has an amount greater that this level"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          16000

  - name: folkestone_and_hythe_council_tax_reduction_tariff_income_threshold
    kind: parameter
    dtype: Money
    period: Year
    unit: GBP
    source: Folkestone and Hythe Council Tax Reduction Scheme 2026 paragraph 27.1
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: uk-folkestone-and-hythe/manual/council-tax-reduction-scheme-2026-2027/page-33
              excerpt: "income above £6,000 then a tariff income will be calculated"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          6000

  - name: folkestone_and_hythe_council_tax_reduction_tariff_income_step
    kind: parameter
    dtype: Money
    period: Year
    unit: GBP
    source: Folkestone and Hythe Council Tax Reduction Scheme 2026 paragraph 27.1
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: uk-folkestone-and-hythe/manual/council-tax-reduction-scheme-2026-2027/page-34
              excerpt: "£1 per week for every £250 or part thereof"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          250

  - name: folkestone_and_hythe_council_tax_reduction_tariff_income_per_step
    kind: parameter
    dtype: Money
    period: Week
    unit: GBP
    source: Folkestone and Hythe Council Tax Reduction Scheme 2026 paragraph 27.1
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: uk-folkestone-and-hythe/manual/council-tax-reduction-scheme-2026-2027/page-34
              excerpt: "£1 per week for every £250 or part thereof"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          1

  - name: folkestone_and_hythe_council_tax_reduction_weeks_per_year
    kind: parameter
    dtype: Number
    source: Folkestone and Hythe Council Tax Reduction Scheme 2026 weekly-income conversion
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: uk-folkestone-and-hythe/manual/council-tax-reduction-scheme-2026-2027/page-29
              excerpt: "dividing the product by 52"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          52

  - name: folkestone_and_hythe_council_tax_reduction_weekly_deduction_by_band
    kind: parameter
    dtype: Money
    period: Week
    unit: GBP
    indexed_by: folkestone_and_hythe_council_tax_reduction_non_dependant_band
    source: Folkestone and Hythe Council Tax Reduction Scheme 2026 paragraphs 39.5-39.6
    metadata:
      proof:
        atoms:
          - path: versions[0].values
            kind: parameter_table
            source:
              corpus_citation_path: uk-folkestone-and-hythe/manual/council-tax-reduction-scheme-2026-2027/page-41
              excerpt: "Any award shall be reduced by an amount of £10.00 per week for each non dependant who resides within the premises. 39.6 Paragraph 39.5 will not apply where any non-dependant is in receipt of Job Seekers Allowance (Income Based), Employment Support Allowance (Income Related), Income Support, Pension Credit (Guaranteed Credit), or Universal Credit where the Universal Credit applicant has no earnings."
              table: {header: Non-dependant deduction, row_key: band, column_key: weekly deduction}
    versions:
      - effective_from: '2026-04-01'
        values: {0: 0, 1: 10.00}

  - name: folkestone_and_hythe_council_tax_reduction_capital_eligible
    kind: derived
    entity: Person
    dtype: Judgment
    period: Year
    source: Folkestone and Hythe Council Tax Reduction Scheme 2026 paragraph 27.1
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: uk-folkestone-and-hythe/manual/council-tax-reduction-scheme-2026-2027/page-33
              excerpt: "no support shall be granted when the applicant has an amount greater that this level"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          folkestone_and_hythe_council_tax_reduction_assessed_capital
          <= folkestone_and_hythe_council_tax_reduction_capital_limit

  - name: folkestone_and_hythe_council_tax_reduction_tariff_income_weekly
    kind: derived
    entity: Person
    dtype: Money
    period: Week
    unit: GBP
    source: Folkestone and Hythe Council Tax Reduction Scheme 2026 paragraph 27.1
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: uk-folkestone-and-hythe/manual/council-tax-reduction-scheme-2026-2027/page-34
              excerpt: "The tariff shall be calculated as £1 per week for every £250 or part thereof above the disregard level of £6,000."
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          if folkestone_and_hythe_council_tax_reduction_assessed_capital <= folkestone_and_hythe_council_tax_reduction_tariff_income_threshold: 0 else: ceil((folkestone_and_hythe_council_tax_reduction_assessed_capital - folkestone_and_hythe_council_tax_reduction_tariff_income_threshold) / folkestone_and_hythe_council_tax_reduction_tariff_income_step) * folkestone_and_hythe_council_tax_reduction_tariff_income_per_step

  - name: folkestone_and_hythe_council_tax_reduction_income_band
    kind: derived
    entity: Person
    dtype: Number
    period: Week
    source: Folkestone and Hythe Council Tax Reduction Scheme 2026 Schedule 1
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter_table
            source:
              corpus_citation_path: uk-folkestone-and-hythe/manual/council-tax-reduction-scheme-2026-2027/page-57
              excerpt: "Discount bands vary depending on both weekly income and the household (family as defined within this scheme)."
              table: {header: Banded Discount Scheme, row_key: weekly income and family, column_key: band}
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          if folkestone_and_hythe_council_tax_reduction_passported_to_band_1: folkestone_and_hythe_council_tax_reduction_band_1 else: if folkestone_and_hythe_council_tax_reduction_weekly_income + folkestone_and_hythe_council_tax_reduction_tariff_income_weekly > folkestone_and_hythe_council_tax_reduction_band_4_upper_income_by_family[folkestone_and_hythe_council_tax_reduction_family_category]: folkestone_and_hythe_council_tax_reduction_band_0 else: if folkestone_and_hythe_council_tax_reduction_weekly_income + folkestone_and_hythe_council_tax_reduction_tariff_income_weekly >= folkestone_and_hythe_council_tax_reduction_band_4_lower_income_by_family[folkestone_and_hythe_council_tax_reduction_family_category]: folkestone_and_hythe_council_tax_reduction_band_4 else: if folkestone_and_hythe_council_tax_reduction_weekly_income + folkestone_and_hythe_council_tax_reduction_tariff_income_weekly >= folkestone_and_hythe_council_tax_reduction_band_3_lower_income_by_family[folkestone_and_hythe_council_tax_reduction_family_category]: folkestone_and_hythe_council_tax_reduction_band_3 else: if folkestone_and_hythe_council_tax_reduction_weekly_income + folkestone_and_hythe_council_tax_reduction_tariff_income_weekly >= folkestone_and_hythe_council_tax_reduction_band_2_lower_income_by_family[folkestone_and_hythe_council_tax_reduction_family_category]: folkestone_and_hythe_council_tax_reduction_band_2 else: folkestone_and_hythe_council_tax_reduction_band_1

  - name: folkestone_and_hythe_council_tax_reduction_non_dependant_band
    kind: derived
    entity: Person
    dtype: Number
    period: Week
    source: Folkestone and Hythe Council Tax Reduction Scheme 2026 paragraphs 39.5-39.6
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter_table
            source:
              corpus_citation_path: uk-folkestone-and-hythe/manual/council-tax-reduction-scheme-2026-2027/page-41
              excerpt: "Any award shall be reduced by an amount of £10.00 per week for each non dependant who resides within the premises."
              table: {header: Non-dependant deduction, row_key: condition, column_key: band}
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          if folkestone_and_hythe_council_tax_reduction_has_chargeable_non_dependant and not folkestone_and_hythe_council_tax_reduction_non_dependant_exempt: 1 else: 0

  - name: folkestone_and_hythe_council_tax_reduction_annual_amount
    kind: derived
    entity: Person
    dtype: Money
    period: Year
    unit: GBP
    source: Folkestone and Hythe Council Tax Reduction Scheme 2026 Schedule 1 and paragraphs 27.1, 39.1, 39.5
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: uk-folkestone-and-hythe/manual/council-tax-reduction-scheme-2026-2027/page-57
              excerpt: "The amount of discount to be granted is to be based on the following factors: a. The maximum Council Tax Reduction as defined within this scheme;"
          - path: versions[0].formula
            kind: effective_period
            source:
              corpus_citation_path: uk-folkestone-and-hythe/manual/council-tax-reduction-scheme-2026-2027/page-57
              excerpt: "The authority’s Council Tax Reduction scheme from 2026/27 shall be calculated"
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: uk-folkestone-and-hythe/manual/council-tax-reduction-scheme-2026-2027/page-41
              excerpt: "Any award shall be reduced by an amount of £10.00 per week for each non dependant"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          if folkestone_and_hythe_council_tax_reduction_capital_eligible: max(0, folkestone_and_hythe_council_tax_reduction_maximum_eligible_liability * folkestone_and_hythe_council_tax_reduction_maximum_liability_rate * folkestone_and_hythe_council_tax_reduction_support_rate_by_band[folkestone_and_hythe_council_tax_reduction_income_band] - folkestone_and_hythe_council_tax_reduction_weekly_deduction_by_band[folkestone_and_hythe_council_tax_reduction_non_dependant_band] * folkestone_and_hythe_council_tax_reduction_weeks_per_year) else: 0
