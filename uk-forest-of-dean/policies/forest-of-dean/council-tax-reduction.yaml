  - name: forest_of_dean_council_tax_reduction_tariff_income_weekly
    kind: derived
    entity: Person
    dtype: Money
    period: Week
    unit: GBP
    source: Forest of Dean Council Tax Support Scheme 2026/27 paragraphs 42.1-42.2
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: uk-forest-of-dean/manual/council-tax-reduction-scheme-2026-2027/page-57
              excerpt: "Where the applicant’s capital calculated in accordance with this scheme exceeds £6,000 it shall be treated as equivalent to a weekly income of £1 for each complete £250 of in excess of £6,000 but not exceeding £16,000"
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: uk-forest-of-dean/manual/council-tax-reduction-scheme-2026-2027/page-57
              excerpt: "where any part of the excess is not a complete £250 that part shall be treated as equivalent to a weekly tariff income of £1."
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          if forest_of_dean_council_tax_reduction_assessed_capital_for_year <= forest_of_dean_council_tax_reduction_tariff_income_threshold: 0 else: ceil((forest_of_dean_council_tax_reduction_assessed_capital_for_year - forest_of_dean_council_tax_reduction_tariff_income_threshold) / forest_of_dean_council_tax_reduction_tariff_income_capital_step) * forest_of_dean_council_tax_reduction_tariff_income_weekly_amount_per_step

