              excerpt: "by adding to that amount the weekly income calculated in line with regulation 52 of the Housing Benefit Regulations 2006 (calculation to tariff income from capital)"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          forest_of_dean_council_tax_reduction_assessed_weekly_net_income_excluding_tariff
          + forest_of_dean_council_tax_reduction_tariff_income_weekly

  - name: forest_of_dean_council_tax_reduction_income_band
    kind: derived
    entity: Person
    dtype: Number
    period: Week
    source: Forest of Dean Council Tax Support Scheme 2026/27 paragraph 59.5
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter_table
            source:
              corpus_citation_path: uk-forest-of-dean/manual/council-tax-reduction-scheme-2026-2027/page-73
              excerpt: "Entitlement to Council Tax Support is determined as follows: Income Band Single Couple Lone Parent Couple with Children Maximum % Entitlement Net Income £ per week Band 1 0 – 90.38 0 – 141.22 0 – 180.76 0 – 237.25 90 Band 2 90.39 – 115.38 141.23 – 176.22 180.77 – 205.76 237.26 – 287.25 70 Band 3 115.39 – 140.38 176.23 – 226.22 205.77 – 255.76 287.26 – 337.25 50 Band 4 140.39 – 165.38 226.23 – 276.22 255.77 – 305.76 337.26 – 387.25 30 Band 5 165.39 – 190.38 276.23 – 326.22 305.77 – 355.76 387.26 – 437.25 10 Band 6 190.39 + 326.23 + 355.77 + 437.26 + 0 Income Band Single Couple Lone Parent Couple with Children Maximum % Entitlement Net Income £ per week Band 1 0 – 90.38 0 – 141.22 0 – 180.76 0 – 237.25 95 Band 2 90.39 – 115.38 141.23 – 176.22 180.77 – 205.76 237.26 – 287.25 75 Band 3 115.39 – 140.38 176.23 – 226.22 205.77 – 255.76 287.26 – 337.25 55 Band 4 140.39 – 165.38 226.23 – 276.22 255.77 – 305.76 337.26 – 387.25 35 Band 5 165.39 – 190.38 276.23 – 326.22 305.77 – 355.76 387.26 – 437.25 15 Band 6 190.39 + 326.23 + 355.77 + 437.26 + 0"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          if forest_of_dean_council_tax_reduction_weekly_net_income >= forest_of_dean_council_tax_reduction_band_6_lower_income_by_family[forest_of_dean_council_tax_reduction_family_category]: forest_of_dean_council_tax_reduction_band_6 else: if forest_of_dean_council_tax_reduction_weekly_net_income >= forest_of_dean_council_tax_reduction_band_5_lower_income_by_family[forest_of_dean_council_tax_reduction_family_category]: forest_of_dean_council_tax_reduction_band_5 else: if forest_of_dean_council_tax_reduction_weekly_net_income >= forest_of_dean_council_tax_reduction_band_4_lower_income_by_family[forest_of_dean_council_tax_reduction_family_category]: forest_of_dean_council_tax_reduction_band_4 else: if forest_of_dean_council_tax_reduction_weekly_net_income >= forest_of_dean_council_tax_reduction_band_3_lower_income_by_family[forest_of_dean_council_tax_reduction_family_category]: forest_of_dean_council_tax_reduction_band_3 else: if forest_of_dean_council_tax_reduction_weekly_net_income >= forest_of_dean_council_tax_reduction_band_2_lower_income_by_family[forest_of_dean_council_tax_reduction_family_category]: forest_of_dean_council_tax_reduction_band_2 else: forest_of_dean_council_tax_reduction_band_1

