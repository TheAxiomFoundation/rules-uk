format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: uk-forest-of-dean/manual/council-tax-reduction-scheme-2026-2027/page-74
    # upstream_source_check:
    #   status: delegated_scheme
    #   checked_paths: [uk/statutes/ukpga/1992/14/13A, uk/regulations/uksi/2012/2885, uk/regulations/uksi/2012/2886]
    #   rationale: Section 13A delegates the working-age scheme to this authority, so Forest of Dean's adopted document is operative.
  summary: |-
    Forest of Dean's 2026-27 working-age scheme is a six-band award surface, not an excess-income taper. Weekly net income and family category select 90%, 70%, 50%, 30%, 10%, or 0% for Class A and 95%, 75%, 55%, 35%, 15%, or 0% for protected Class B. The selected percentage applies to annual liability after discounts and non-dependant deductions, with liability capped at Band E. Capital above £16,000 produces no award; capital over £6,000 adds £1 weekly tariff income for each £250 or part thereof.
  deferred_outputs:
    - output: uk-forest-of-dean:policies/forest-of-dean/council-tax-reduction/sections-15-to-32-and-schedules-3-to-4#assessed_weekly_net_income
      reason: The award surface consumes weekly net income calculated under the scheme; detailed earnings, self-employment, Universal Credit adjustment, childcare, and income-disregard rules are outside this module.
    - output: uk-forest-of-dean:policies/forest-of-dean/council-tax-reduction/sections-33-to-41-and-schedule-5#assessed_capital
      reason: Capital valuation, attribution, notional-capital, diminishing-capital, joint-capital, and disregard rules are outside this award-surface module.
    - output: uk-forest-of-dean:policies/forest-of-dean/council-tax-reduction/paragraph-57.1#a_or_band_e_capped_annual_liability
      reason: Dwelling-band charge lookup, statutory discounts, the Band E cap, and joint-liability apportionment are consumed as eligible liability rather than re-encoded here.
    - output: uk-forest-of-dean:policies/forest-of-dean/council-tax-reduction/paragraphs-58.3-to-58.9#non_dependant_exemption_and_apportionment
      reason: The deduction grid is encoded; detailed couple apportionment and disability, student, benefit, absence, and Universal Credit exemption classifiers are deferred.
