  - name: forest_of_dean_council_tax_reduction_non_dependant_weekly_deduction_by_band
    kind: parameter
    dtype: Money
    period: Week
    unit: GBP
    indexed_by: forest_of_dean_council_tax_reduction_non_dependant_deduction_band
    source: Forest of Dean Council Tax Support Scheme 2026/27 paragraphs 58.1-58.2
    metadata:
      proof:
        atoms:
          - path: versions[0].values
            kind: parameter_table
            source:
              corpus_citation_path: uk-forest-of-dean/manual/council-tax-reduction-scheme-2026-2027/page-71
              excerpt: "58.1 Subject to the following provisions of this paragraph, the non-dependant deductions in respect of a day referred to in section 57 (maximum council tax support) shall be;\n\n(a) in respect of a non-dependant aged 18 or over in remunerative work, £15.95 x 1/7. (b) in respect of a non-dependant aged 18 or over to whom sub-paragraph (a) does not apply, £5.20 x 1/7. 58.2 In the case of a non-dependant aged 18 or over to whom paragraph 58.1(a) applies, where it is shown to the appropriate authority that his normal gross weekly income is- (a) less than £279.00, the deduction to be made under this paragraph shall be that specified in paragraph 58.1(b). (b) not less than £279.00, but less than £485.00, the deduction to be made under this section shall be £10.60. (c) not less than £485.00, but less than £605.00, the deduction to be made under this section shall be £13.30."
              table:
                header: Non-dependant deductions
                row_key: deduction band
                column_key: weekly deduction
    versions:
      - effective_from: '2026-04-01'
        values: {0: 0, 1: 5.20, 2: 10.60, 3: 13.30, 4: 15.95}

