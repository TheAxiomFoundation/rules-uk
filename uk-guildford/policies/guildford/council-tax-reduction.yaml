format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: uk-guildford/manual/council-tax-reduction-scheme-2026-2027/page-54
    # upstream_source_check:
    #   status: delegated_scheme
    #   checked_paths: [uk/statutes/ukpga/1992/14/13A, uk/regulations/uksi/2012/2885, uk/regulations/uksi/2012/2886]
    #   rationale: LGFA 1992 section 13A delegates the working-age scheme to Guildford Borough Council, so the adopted scheme document is the operative source for these local parameters and award rules. The apply-stage encoder strips this attestation to the singular source-verification contract after local gates pass.
  summary: |-
    Guildford's operative 2026-27 working-age scheme pays 100% of the locally defined maximum (the lower of the household's liability and Band D liability), subject to a £6,000 capital cliff, a 20% weekly excess-income taper, non-dependant deductions, and a £10 weekly minimum-award floor. Pension-age provisions are outside this local working-age module.
  deferred_outputs:
    - output: uk-guildford:policies/guildford/council-tax-reduction/paragraphs-44-to-46-and-schedule-1#applicable_amount_and_assessed_income
      reason: The award surface consumes applicable amount and assessed income; the detailed personal allowances, premiums, earnings, disregards, childcare, self-employment, and Universal Credit assessment rules are outside this module.
    - output: uk-guildford:policies/guildford/council-tax-reduction/part-17-and-schedule-4#assessed_capital
      reason: This module applies the local £6,000 capital cliff; detailed capital valuation, attribution, notional-capital, and disregard rules are outside this module.
    - output: uk-guildford:policies/guildford/council-tax-reduction/paragraph-47#maximum_eligible_liability
      reason: This module consumes the locally defined maximum eligible liability; charge lookup, the Band D comparison, discounts, joint-liability apportionment, and household non-dependant aggregation are outside this award surface.
    - output: uk-guildford:policies/guildford/council-tax-reduction/paragraph-48#non_dependant_exemption_and_apportionment
      reason: This module encodes the printed deduction grid and consumes the exemption result; disability, benefit, student, absence, couple, and apportionment classifiers are outside this module.
rules:
  - name: guildford_council_tax_reduction_maximum_support_rate
    kind: parameter
    dtype: Rate
    source: Guildford Borough Council Council Tax Reduction Scheme 2026 paragraph 47(1)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: uk-guildford/manual/council-tax-reduction-scheme-2026-2027/page-51
              excerpt: "100 per cent of the amount A/B"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          1

  - name: guildford_council_tax_reduction_capital_limit
    kind: parameter
    dtype: Money
    period: Year
    unit: GBP
    source: Guildford Borough Council Council Tax Reduction Scheme 2026 paragraph 42(1)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: uk-guildford/manual/council-tax-reduction-scheme-2026-2027/page-49
              excerpt: "capital exceeds £6,000"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          6000

  - name: guildford_council_tax_reduction_weekly_taper_rate
    kind: parameter
    dtype: Rate
    source: Guildford Borough Council Council Tax Reduction Scheme 2026 paragraph 38(f)(ii)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: uk-guildford/manual/council-tax-reduction-scheme-2026-2027/page-44
              excerpt: "amount B is 20 per cent of the difference"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          0.20

  - name: guildford_council_tax_reduction_weeks_per_year
    kind: parameter
    dtype: Number
    source: Guildford Borough Council Council Tax Reduction Scheme 2026 annual conversion denominator
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: uk-guildford/manual/council-tax-reduction-scheme-2026-2027/page-51
              excerpt: "divide the product by 52"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          52

  - name: guildford_council_tax_reduction_minimum_award_weekly
    kind: parameter
    dtype: Money
    period: Week
    unit: GBP
    source: Guildford Borough Council Council Tax Reduction Scheme 2026 paragraph 49A
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: uk-guildford/manual/council-tax-reduction-scheme-2026-2027/page-55
              excerpt: "less than £10.00 per reduction week"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          10

  - name: guildford_council_tax_reduction_non_dependant_band_2_threshold_weekly
    kind: parameter
    dtype: Money
    period: Week
    unit: GBP
    source: Guildford Borough Council Council Tax Reduction Scheme 2026 paragraph 48(2)(a)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: uk-guildford/manual/council-tax-reduction-scheme-2026-2027/page-52
              excerpt: "not less than £266.00"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          266

  - name: guildford_council_tax_reduction_non_dependant_band_3_threshold_weekly
    kind: parameter
    dtype: Money
    period: Week
    unit: GBP
    source: Guildford Borough Council Council Tax Reduction Scheme 2026 paragraph 48(2)(b)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: uk-guildford/manual/council-tax-reduction-scheme-2026-2027/page-52
              excerpt: "not less than £463.00"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          463

  - name: guildford_council_tax_reduction_non_dependant_band_4_threshold_weekly
    kind: parameter
    dtype: Money
    period: Week
    unit: GBP
    source: Guildford Borough Council Council Tax Reduction Scheme 2026 paragraph 48(2)(c)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: uk-guildford/manual/council-tax-reduction-scheme-2026-2027/page-52
              # The adopted PDF typesets the pound sign as "£.577.00"; retain
              # its printed numeric substring rather than inventing an adjusted
              # boundary.
              excerpt: "577.00"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          577.00

  - name: guildford_council_tax_reduction_non_dependant_weekly_deduction_by_band
    kind: parameter
    dtype: Money
    period: Week
    unit: GBP
    indexed_by: guildford_council_tax_reduction_non_dependant_deduction_band
    source: Guildford Borough Council Council Tax Reduction Scheme 2026 paragraph 48(1) and (2)
    metadata:
      proof:
        atoms:
          - path: versions[0].values
            kind: parameter_table
            source:
              corpus_citation_path: uk-guildford/manual/council-tax-reduction-scheme-2026-2027/page-52
              excerpt: "(a) in respect of a non-dependant aged 18 or over in remunerative work, £15.35 x 1/7; (b) in respect of a non-dependant aged 18 or over to whom sub-paragraph (a) does not apply, £5.00 x 1/7."
              table:
                header: Non-dependant weekly deductions
                row_key: deduction band
                column_key: weekly deduction
          - path: versions[0].values
            kind: parameter_table
            source:
              corpus_citation_path: uk-guildford/manual/council-tax-reduction-scheme-2026-2027/page-52
              excerpt: "(b) not less than £266.00 but less than £463.00, the non-dependant deduction to be made under this paragraph is £10.20;"
              table:
                header: Non-dependant weekly deductions
                row_key: deduction band
                column_key: weekly deduction
          - path: versions[0].values
            kind: parameter_table
            source:
              corpus_citation_path: uk-guildford/manual/council-tax-reduction-scheme-2026-2027/page-52
              excerpt: "(c) not less than £463.00 but less than £.577.00, the non-dependant deduction to be made under this paragraph is £12.80."
              table:
                header: Non-dependant weekly deductions
                row_key: deduction band
                column_key: weekly deduction
    versions:
      - effective_from: '2026-04-01'
        values:
          0: 0
          1: 5
          2: 10.20
          3: 12.80
          4: 15.35

  - name: guildford_council_tax_reduction_working_age_scheme_applies
    kind: derived
    entity: Household
    dtype: Judgment
    period: Year
    source: Guildford Borough Council Council Tax Reduction Scheme 2026 paragraphs 36 to 38
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: uk-guildford/manual/council-tax-reduction-scheme-2026-2027/page-44
              excerpt: "person who is not a pensioner"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          local_authority_is_guildford and council_tax_reduction_household_in_england and not council_tax_reduction_household_has_pensioner

  - name: guildford_council_tax_reduction_capital_eligible
    kind: derived
    entity: Household
    dtype: Judgment
    period: Year
    source: Guildford Borough Council Council Tax Reduction Scheme 2026 paragraph 42(1)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: uk-guildford/manual/council-tax-reduction-scheme-2026-2027/page-49
              excerpt: "capital exceeds £6,000"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          guildford_council_tax_reduction_assessed_capital_for_year <= guildford_council_tax_reduction_capital_limit

  - name: guildford_council_tax_reduction_excess_income_for_year
    kind: derived
    entity: Household
    dtype: Money
    period: Year
    unit: GBP
    source: Guildford Borough Council Council Tax Reduction Scheme 2026 paragraph 38(f)(ii)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: uk-guildford/manual/council-tax-reduction-scheme-2026-2027/page-44
              excerpt: "difference between his income for the relevant week and his applicable amount"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          max(0, guildford_council_tax_reduction_assessed_income_for_year - guildford_council_tax_reduction_applicable_amount_for_year)

  - name: guildford_council_tax_reduction_income_taper_deduction_for_year
    kind: derived
    entity: Household
    dtype: Money
    period: Year
    unit: GBP
    source: Guildford Borough Council Council Tax Reduction Scheme 2026 paragraph 38(f)(ii)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: uk-guildford/manual/council-tax-reduction-scheme-2026-2027/page-44
              excerpt: "amount B is 20 per cent of the difference"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          guildford_council_tax_reduction_excess_income_for_year * guildford_council_tax_reduction_weekly_taper_rate

  - name: guildford_council_tax_reduction_non_dependant_deduction_band
    kind: derived
    entity: Person
    dtype: Integer
    period: Year
    source: Guildford Borough Council Council Tax Reduction Scheme 2026 paragraph 48
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: uk-guildford/manual/council-tax-reduction-scheme-2026-2027/page-52
              excerpt: "normal gross weekly income is -"
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: uk-guildford/manual/council-tax-reduction-scheme-2026-2027/page-53
              excerpt: "No non-dependant deduction is to be made"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          if not guildford_council_tax_reduction_is_non_dependant or guildford_council_tax_reduction_non_dependant_exempt: 0 else: if not guildford_council_tax_reduction_non_dependant_in_remunerative_work or guildford_council_tax_reduction_non_dependant_normal_gross_weekly_income < guildford_council_tax_reduction_non_dependant_band_2_threshold_weekly: 1 else: if guildford_council_tax_reduction_non_dependant_normal_gross_weekly_income < guildford_council_tax_reduction_non_dependant_band_3_threshold_weekly: 2 else: if guildford_council_tax_reduction_non_dependant_normal_gross_weekly_income < guildford_council_tax_reduction_non_dependant_band_4_threshold_weekly: 3 else: 4

  - name: guildford_council_tax_reduction_individual_non_dependant_deduction_weekly
    kind: derived
    entity: Person
    dtype: Money
    period: Week
    unit: GBP
    source: Guildford Borough Council Council Tax Reduction Scheme 2026 paragraph 48(1) and (2)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: uk-guildford/manual/council-tax-reduction-scheme-2026-2027/page-52
              excerpt: "the non-dependant deduction to be made under this paragraph is £12.80"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          guildford_council_tax_reduction_non_dependant_weekly_deduction_by_band[guildford_council_tax_reduction_non_dependant_deduction_band]

  - name: guildford_council_tax_reduction_gross_award_for_year
    kind: derived
    entity: Household
    dtype: Money
    period: Year
    unit: GBP
    source: Guildford Borough Council Council Tax Reduction Scheme 2026 paragraphs 47 and 49
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: uk-guildford/manual/council-tax-reduction-scheme-2026-2027/page-54
              excerpt: "amount is the amount found by deducting amount B from amount A"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          guildford_council_tax_reduction_maximum_eligible_liability_for_year * guildford_council_tax_reduction_maximum_support_rate - guildford_council_tax_reduction_income_taper_deduction_for_year - guildford_council_tax_reduction_non_dependant_deductions_for_year

  - name: simulated_guildford_council_tax_reduction_annual_amount
    kind: derived
    entity: Household
    dtype: Money
    period: Year
    unit: GBP
    source: Guildford Borough Council Council Tax Reduction Scheme 2026 paragraphs 38, 49 and 49A
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: uk-guildford/manual/council-tax-reduction-scheme-2026-2027/page-54
              excerpt: "amount is the amount found by deducting amount B from amount A"
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: uk-guildford/manual/council-tax-reduction-scheme-2026-2027/page-55
              excerpt: "shall not be awarded where the amount to which a person would otherwise be entitled is less than £10.00"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          if guildford_council_tax_reduction_working_age_scheme_applies and would_claim_council_tax_reduction and guildford_council_tax_reduction_capital_eligible and guildford_council_tax_reduction_gross_award_for_year >= guildford_council_tax_reduction_minimum_award_weekly * guildford_council_tax_reduction_weeks_per_year: max(0, guildford_council_tax_reduction_gross_award_for_year) else: 0

  - name: guildford_council_tax_reduction_annual_amount
    kind: derived
    entity: Household
    dtype: Money
    period: Year
    unit: GBP
    source: Guildford Borough Council Council Tax Reduction Scheme 2026 final working-age award surface
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: uk-guildford/manual/council-tax-reduction-scheme-2026-2027/page-11
              excerpt: "comes into effect on 1st April 2026."
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          simulated_guildford_council_tax_reduction_annual_amount
