    period: Week
    unit: GBP
  - name: harlow_council_tax_reduction_assessed_income_weekly
    entity: Household
    dtype: Money
    period: Week
    unit: GBP
  - name: harlow_council_tax_reduction_applicable_amount_weekly
    entity: Household
    dtype: Money
    period: Week
    unit: GBP
  - name: harlow_council_tax_reduction_non_dependant_deductions_weekly
