  - name: harrow_council_tax_reduction_section_2_adult_deduction_weekly_by_band
    kind: parameter
    dtype: Money
    period: Week
    unit: GBP
    indexed_by: harrow_council_tax_reduction_section_2_non_dependant_deduction_band
    source: Harrow Council Tax Support Scheme 2026 Section 2 rule 3
    metadata:
      proof:
        atoms:
          - path: versions[0].values
            kind: parameter_table
            source:
              corpus_citation_path: uk-harrow/manual/council-tax-reduction-scheme-2026-2027/page-26
              excerpt: "(1) Subject to the following provisions of this paragraph, the non-dependant deductions in respect of a day referred to in Section 2, rule 2 of this scheme are— (a) except where paragraph (b) applies, where it is shown to the appropriate authority he is in remunerative work and that his normal gross weekly income is not less than £144 per week, a non dependant deduction will be £18.75 per week (b) in respect of a non-dependant aged 18 or over who the authority has verified is in remunerative work and that his normal gross weekly income is less than £144 per week, is not in remunerative work (and the applicant has provided such evidence as the authority reasonably requires to establish that the non dependant has no earnings), is on income support, state pension credit, income-based jobseeker’s allowance or employment and support allowance, maximum award of universal credit, a non- dependant deduction will be £4.75 per week."
              table:
                header: Section 2 non-dependant deductions
                row_key: deduction band
                column_key: weekly deduction
          - path: versions[0].values
            kind: exception
            source:
              corpus_citation_path: uk-harrow/manual/council-tax-reduction-scheme-2026-2027/page-27
              excerpt: "No deduction is to be made in respect of any non-dependants occupying an applicant’s dwelling if the applicant or his partner is"
    versions:
      - effective_from: '2026-04-01'
        values:
          0: 0
          1: 4.75
          2: 18.75

