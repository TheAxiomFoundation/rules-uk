  - name: harrow_council_tax_reduction_legacy_non_dependant_weekly_deduction_by_band
    kind: parameter
    dtype: Money
    period: Week
    unit: GBP
    indexed_by: harrow_council_tax_reduction_legacy_non_dependant_deduction_band
    source: Harrow Council Tax Support Scheme 2026 Section 3 paragraph 26A
    metadata:
      proof:
        atoms:
          - path: versions[0].values
            kind: parameter_table
            source:
              corpus_citation_path: uk-harrow/manual/council-tax-reduction-scheme-2026-2027/page-88
              excerpt: |-
                Non-dependant deductions: persons who are not pensioners 26A.— .—(1) Subject to the following provisions of this paragraph, the non-dependant deductions in respect of a day referred to in paragraph 25A and 26B are— (a) in respect of a non-dependant aged 18 or over in remunerative work, £27.75 per week; (b) in respect of a non-dependant aged 18 or over to whom sub-paragraphs (a) and (c) do not apply, £9.50 per week. (c) in respect of a non-dependant aged 18 or over who is on income support, state pension credit, an income-based jobseeker’s allowance or employment and support allowance, maximum award of universal credit £4.75 per week

                (2) In the case of a non-dependant aged 18 or over to whom sub-paragraph (1)(a) applies, where it is shown to the appropriate authority that his normal gross weekly income is— (a) less than £279.00, the deduction to be made under this paragraph is that specified in subparagraph (1)(b); (b) not less than £279.00 but less than £485.00, the deduction to be made under this paragraph is £18.75; (c) not less than £485.00 but less than £605.00, the deduction to be made under this paragraph is £23.50.
              table:
                header: Section 3 non-dependant deductions
                row_key: deduction band
                column_key: weekly deduction
          - path: versions[0].values
            kind: exception
            source:
              corpus_citation_path: uk-harrow/manual/council-tax-reduction-scheme-2026-2027/page-89
              excerpt: "No deduction is to be made in respect of any non-dependants occupying an applicant’s dwelling if the applicant or his partner is"
    versions:
      - effective_from: '2026-04-01'
        values:
          0: 0
          1: 4.75
          2: 9.50
          3: 18.75
          4: 23.50
          5: 27.75

