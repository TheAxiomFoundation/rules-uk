module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: uk-harrow/manual/council-tax-reduction-scheme-2026-2027/page-30
    # upstream_source_check:
    # status: delegated_scheme
    # checked_paths: [uk/statutes/ukpga/1992/14/13A, uk/regulations/uksi/2012/2885, uk/regulations/uksi/2012/2886]
    # rationale: LGFA 1992 section 13A delegates the working-age scheme to the London Borough of Harrow, so the adopted document is operative. The apply-stage encoder strips this attestation to the singular source-verification contract after local gates pass.
  summary: |-
    Harrow's operative 2026-27 working-age award has two locally set branches. Section 2 fixes Universal Credit claimant awards at the printed class and income-band percentages, composed on the maximum weekly eligible liability; the highest printed rate is 86%. Section 3 applies a 50% ordinary or 86% protected-group maximum, subtracts the printed non-dependant deduction within that maximum, and, only where income exceeds the applicable amount, subtracts the 30% weekly taper. The formal daily rate is derived as 30% divided by the printed seven-day week. Capital above £16,000 prevents entitlement, tariff income is abolished for the Section 3 calculation, and awards below £2 weekly are nil. Pension-age provisions are outside this working-age module.
  deferred_outputs:
    - output: uk-harrow:policies/harrow/council-tax-reduction/section-2-rule-1.3-and-appendix-a#section_2_claimant_category
      reason: This module consumes the factual Section 2 claimant category; the detailed disability, child, earned-income, and maximum-Universal-Credit classifiers are outside this award surface.
    - output: uk-harrow:policies/harrow/council-tax-reduction/section-2-rule-2-and-2.1#eligible_weekly_liability_and_joint_liability
      reason: This module consumes actual and Band D weekly liability; charge lookup, discounts, and joint-liability apportionment are outside this award surface.
    - output: uk-harrow:policies/harrow/council-tax-reduction/section-2-rule-2.2#uc_assessed_income_and_capital
      reason: This module consumes the scheme's weekly net earned-income and assessed-capital results; Universal Credit assessment details, including any capital-derived amount, are outside this award surface.
    - output: uk-harrow:policies/harrow/council-tax-reduction/section-3-part-6-and-schedule-3#legacy_applicable_amount_and_assessed_income
      reason: This module consumes Section 3 applicable amount and assessed income; premiums, earnings, disregards, self-employment, and detailed income assessment are outside this award surface.
    - output: uk-harrow:policies/harrow/council-tax-reduction/section-3-part-9-and-schedule-5#assessed_capital
      reason: This module applies the printed capital cliff; detailed valuation, attribution, notional-capital, and disregard rules are outside this award surface.
    - output: uk-harrow:policies/harrow/council-tax-reduction/section-2-rule-3-and-section-3-paragraph-26A#non_dependant_exemption_and_aggregation
      reason: This module encodes both printed deduction grids and consumes exemption, couple, and household aggregation results; their detailed classifiers and apportionment are outside this award surface.
    - output: uk-harrow:policies/harrow/council-tax-reduction/section-3-part-8#pension_age_alternative_maximum
      reason: The pension-age alternative maximum is outside this working-age award surface.
