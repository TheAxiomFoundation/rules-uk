  - name: hartlepool_council_tax_reduction_schedule_3_paragraph_8_joint_claim_disregard_applies
    kind: derived
    entity: Household
    dtype: Judgment
    period: Year
    source: Hartlepool Borough Council Council Tax Reduction Scheme 2026/27 Schedule 3 paragraph 8
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: exception
            source:
              corpus_citation_path: uk-hartlepool/manual/council-tax-reduction-scheme-2026-2027/page-75
              excerpt: "8. Where the applicant is a member of a joint-claim couple for the purposes of the Jobseekers Act 1995 and his partner is on income-based jobseeker’s allowance, the whole of the applicant’s capital."
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          hartlepool_council_tax_reduction_applicant_is_member_of_joint_claim_couple_for_jobseekers_act_1995
          and hartlepool_council_tax_reduction_partner_receives_income_based_jsa

  - name: hartlepool_council_tax_reduction_capital_eligible
    kind: derived
    entity: Household
    dtype: Judgment
    period: Year
    source: Hartlepool Borough Council Council Tax Reduction Scheme 2026/27 Schedule 1 paragraph 5
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: uk-hartlepool/manual/council-tax-reduction-scheme-2026-2027/page-62
              excerpt: "5. Any applicant whose capital is greater than £10,000 shall not be entitled to any Council Tax Reduction whatsoever (subject to Schedule 3 Capital Disregards)."
    versions:
      - effective_from: '2026-04-01'
        formula: |-
