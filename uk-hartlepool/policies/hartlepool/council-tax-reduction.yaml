    versions:
      - effective_from: '2026-04-01'
        formula: |-
          hartlepool_council_tax_reduction_applicant_or_partner_is_below_state_pension_credit_qualifying_age
          or hartlepool_council_tax_reduction_applicant_or_partner_receives_income_support
          or hartlepool_council_tax_reduction_applicant_or_partner_receives_income_related_esa
          or hartlepool_council_tax_reduction_applicant_or_partner_receives_income_based_jsa
          or hartlepool_council_tax_reduction_applicant_or_partner_receives_universal_credit

  - name: hartlepool_council_tax_reduction_working_age_scheme_applies
    kind: derived
    entity: Household
    dtype: Judgment
    period: Year
    source: Hartlepool Borough Council Council Tax Reduction Scheme 2026/27 paragraphs 1.6 and 1.7
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: uk-hartlepool/manual/council-tax-reduction-scheme-2026-2027/page-7
              excerpt: "The authority is required to specify a scheme for working age and therefore this scheme only applies to a person who;"
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: uk-hartlepool/manual/council-tax-reduction-scheme-2026-2027/page-7
              excerpt: "has made a valid application for reduction."
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          local_authority_is_hartlepool
          and council_tax_reduction_household_in_england
          and hartlepool_council_tax_reduction_applicant_is_in_working_age_class
          and would_claim_council_tax_reduction

  - name: hartlepool_council_tax_reduction_applicant_or_partner_receives_schedule_3_paragraph_7_qualifying_benefit
    kind: derived
    entity: Household
    dtype: Judgment
    period: Year
    source: Hartlepool Borough Council Council Tax Reduction Scheme 2026/27 Schedule 3 paragraph 7
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: uk-hartlepool/manual/council-tax-reduction-scheme-2026-2027/page-75
              excerpt: "7. Where an applicant is on income support, an income-based jobseeker’s allowance or an income- related employment and support allowance, the whole of his capital provided that it is no more than £16,000."
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: uk-hartlepool/manual/council-tax-reduction-scheme-2026-2027/page-23
              excerpt: "any reference to the ‘ applicant’ shall, except where the context otherwise requires be construed for the purposes of this scheme as if it were a reference to his partner."
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          hartlepool_council_tax_reduction_applicant_or_partner_receives_income_support
          or hartlepool_council_tax_reduction_applicant_or_partner_receives_income_based_jsa
          or hartlepool_council_tax_reduction_applicant_or_partner_receives_income_related_esa

  - name: hartlepool_council_tax_reduction_schedule_3_paragraph_7_disregard_applies
