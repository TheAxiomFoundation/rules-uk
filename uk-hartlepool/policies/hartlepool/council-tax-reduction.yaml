  - name: hartlepool_council_tax_reduction_applicant_or_partner_receives_income_support
    kind: derived
    entity: Household
    dtype: Judgment
    period: Year
    source: Hartlepool Borough Council Council Tax Reduction Scheme 2026/27 Class D paragraph 1.7(b)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: uk-hartlepool/manual/council-tax-reduction-scheme-2026-2027/page-7
              excerpt: "(b) he has attained the qualifying age for state pension credit and he, or if he has a partner, his partner, is a person on income support, on income-based jobseeker’s allowance or an income-related employment and support allowance; or a person with an award of universal credit."
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          hartlepool_council_tax_reduction_applicant_receives_income_support
          or hartlepool_council_tax_reduction_partner_receives_income_support

