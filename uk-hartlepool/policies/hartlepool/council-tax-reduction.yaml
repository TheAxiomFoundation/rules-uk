            kind: condition
            source:
              corpus_citation_path: uk-hartlepool/manual/council-tax-reduction-scheme-2026-2027/page-7
              excerpt: "has not attained the qualifying age for state pension credit; or"
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: uk-hartlepool/manual/council-tax-reduction-scheme-2026-2027/page-7
