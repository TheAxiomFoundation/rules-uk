format: rulespec/v1
rules:
  - name: hartlepool_council_tax_reduction_maximum_support_rate
    kind: parameter
    dtype: Rate
    source: Hartlepool Borough Council Council Tax Reduction Scheme 2026/27 paragraph 48.1
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: uk-hartlepool/manual/council-tax-reduction-scheme-2026-2027/page-44
              excerpt: "48.1 Subject to paragraphs (2) to (4), the amount of a person’s maximum Council Tax Reduction in respect of a day for which he is liable to pay council tax, shall be 90 per cent, of the amount A divided by B where;"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          0.90

  - name: hartlepool_council_tax_reduction_capital_limit
    kind: parameter
    dtype: Money
    period: Year
    unit: GBP
    source: Hartlepool Borough Council Council Tax Reduction Scheme 2026/27 Schedule 1 paragraph 5
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: uk-hartlepool/manual/council-tax-reduction-scheme-2026-2027/page-62
              excerpt: "5. Any applicant whose capital is greater than £10,000 shall not be entitled to any Council Tax Reduction whatsoever (subject to Schedule 3 Capital Disregards)."
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          10000

  - name: hartlepool_council_tax_reduction_schedule_3_paragraph_7_disregard_limit
    kind: parameter
    dtype: Money
    period: Year
    unit: GBP
    source: Hartlepool Borough Council Council Tax Reduction Scheme 2026/27 Schedule 3 paragraph 7
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: uk-hartlepool/manual/council-tax-reduction-scheme-2026-2027/page-75
              excerpt: "7. Where an applicant is on income support, an income-based jobseeker’s allowance or an income- related employment and support allowance, the whole of his capital provided that it is no more than £16,000."
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          16000

