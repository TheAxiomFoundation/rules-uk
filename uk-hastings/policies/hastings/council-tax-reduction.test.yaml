- name: hastings_ctr_scalar_parameters
  period: &period
    period_kind: tax_year
    start: '2026-04-01'
    end: '2027-03-31'
  output:
    uk-hastings:policies/hastings/council-tax-reduction#hastings_council_tax_reduction_maximum_support_rate: 1
    uk-hastings:policies/hastings/council-tax-reduction#hastings_council_tax_reduction_capital_limit: 16000
    uk-hastings:policies/hastings/council-tax-reduction#hastings_council_tax_reduction_daily_taper_rate: "0.0357142857142857142857142857"
    uk-hastings:policies/hastings/council-tax-reduction#hastings_council_tax_reduction_days_per_week: 7
    uk-hastings:policies/hastings/council-tax-reduction#hastings_council_tax_reduction_weekly_taper_rate: 0.25
    uk-hastings:policies/hastings/council-tax-reduction#hastings_council_tax_reduction_minimum_award_weekly: 5
    uk-hastings:policies/hastings/council-tax-reduction#hastings_council_tax_reduction_weeks_per_year: 52

- name: hastings_ctr_full_award_at_capital_limit
  period: *period
  input:
    <<: &base
      uk-hastings:policies/hastings/council-tax-reduction#input.local_authority_is_hastings: true
      uk-hastings:policies/hastings/council-tax-reduction#input.would_claim_council_tax_reduction: true
      uk-hastings:policies/hastings/council-tax-reduction#input.hastings_council_tax_reduction_applicant_is_working_age: true
      uk-hastings:policies/hastings/council-tax-reduction#input.hastings_council_tax_reduction_actual_annual_liability_after_discounts: 1800
      uk-hastings:policies/hastings/council-tax-reduction#input.hastings_council_tax_reduction_band_d_annual_liability_after_discounts: 1500
      uk-hastings:policies/hastings/council-tax-reduction#input.hastings_council_tax_reduction_applicable_amount_for_year: 10000
      uk-hastings:policies/hastings/council-tax-reduction#input.hastings_council_tax_reduction_non_dependant_deductions_for_year: 0
    uk-hastings:policies/hastings/council-tax-reduction#input.hastings_council_tax_reduction_assessed_capital: 16000
    uk-hastings:policies/hastings/council-tax-reduction#input.hastings_council_tax_reduction_assessed_income_for_year: 10000
  output:
    uk-hastings:policies/hastings/council-tax-reduction#hastings_council_tax_reduction_capital_eligible: holds
    uk-hastings:policies/hastings/council-tax-reduction#hastings_council_tax_reduction_maximum_for_year: 1500
    uk-hastings:policies/hastings/council-tax-reduction#hastings_council_tax_reduction_award_conditions_met: holds
    uk-hastings:policies/hastings/council-tax-reduction#hastings_council_tax_reduction_annual_amount: 1500

- name: hastings_ctr_capital_first_penny_over_cliff
  period: *period
  input:
    <<: *base
    uk-hastings:policies/hastings/council-tax-reduction#input.hastings_council_tax_reduction_assessed_capital: 16000.01
    uk-hastings:policies/hastings/council-tax-reduction#input.hastings_council_tax_reduction_assessed_income_for_year: 10000
  output:
    uk-hastings:policies/hastings/council-tax-reduction#hastings_council_tax_reduction_capital_eligible: not_holds
    uk-hastings:policies/hastings/council-tax-reduction#hastings_council_tax_reduction_annual_amount: 0

- name: hastings_ctr_taper_award
  period: *period
  input:
    <<: *base
    uk-hastings:policies/hastings/council-tax-reduction#input.hastings_council_tax_reduction_assessed_capital: 0
    uk-hastings:policies/hastings/council-tax-reduction#input.hastings_council_tax_reduction_assessed_income_for_year: 12000
  output:
    uk-hastings:policies/hastings/council-tax-reduction#hastings_council_tax_reduction_excess_income_for_year: 2000
    uk-hastings:policies/hastings/council-tax-reduction#hastings_council_tax_reduction_income_taper_deduction_for_year: 500
    uk-hastings:policies/hastings/council-tax-reduction#hastings_council_tax_reduction_annual_amount: 1000

- name: hastings_ctr_minimum_floor_first_penny_below
  period: *period
  input:
    <<: *base
    uk-hastings:policies/hastings/council-tax-reduction#input.hastings_council_tax_reduction_assessed_capital: 0
    uk-hastings:policies/hastings/council-tax-reduction#input.hastings_council_tax_reduction_assessed_income_for_year: 14960.04
  output:
    uk-hastings:policies/hastings/council-tax-reduction#hastings_council_tax_reduction_amount_before_minimum_floor: 259.99
    uk-hastings:policies/hastings/council-tax-reduction#hastings_council_tax_reduction_minimum_floor_met: not_holds
    uk-hastings:policies/hastings/council-tax-reduction#hastings_council_tax_reduction_annual_amount: 0

- name: hastings_ctr_minimum_floor_at_edge
  period: *period
  input:
    <<: *base
    uk-hastings:policies/hastings/council-tax-reduction#input.hastings_council_tax_reduction_assessed_capital: 0
    uk-hastings:policies/hastings/council-tax-reduction#input.hastings_council_tax_reduction_assessed_income_for_year: 14960
  output:
    uk-hastings:policies/hastings/council-tax-reduction#hastings_council_tax_reduction_amount_before_minimum_floor: 260
    uk-hastings:policies/hastings/council-tax-reduction#hastings_council_tax_reduction_minimum_floor_met: holds
    uk-hastings:policies/hastings/council-tax-reduction#hastings_council_tax_reduction_annual_amount: 260

- name: hastings_ctr_taper_zero_award_branch
  period: *period
  input:
    <<: *base
    uk-hastings:policies/hastings/council-tax-reduction#input.hastings_council_tax_reduction_assessed_capital: 0
    uk-hastings:policies/hastings/council-tax-reduction#input.hastings_council_tax_reduction_assessed_income_for_year: 16000
  output:
    uk-hastings:policies/hastings/council-tax-reduction#hastings_council_tax_reduction_income_taper_deduction_for_year: 1500
    uk-hastings:policies/hastings/council-tax-reduction#hastings_council_tax_reduction_amount_before_minimum_floor: 0
    uk-hastings:policies/hastings/council-tax-reduction#simulated_hastings_council_tax_reduction_annual_amount: 0
    uk-hastings:policies/hastings/council-tax-reduction#hastings_council_tax_reduction_annual_amount: 0

- name: hastings_ctr_non_dependant_flat_band
  period: *period
  input:
    uk-hastings:policies/hastings/council-tax-reduction#input.hastings_council_tax_reduction_is_non_dependant: true
    uk-hastings:policies/hastings/council-tax-reduction#input.hastings_council_tax_reduction_non_dependant_exempt: false
  output:
    uk-hastings:policies/hastings/council-tax-reduction#hastings_council_tax_reduction_non_dependant_deduction_band: 0
    uk-hastings:policies/hastings/council-tax-reduction#hastings_council_tax_reduction_individual_non_dependant_deduction_for_year: 260

- name: hastings_ctr_exempt_non_dependant_zero
  period: *period
  input:
    uk-hastings:policies/hastings/council-tax-reduction#input.hastings_council_tax_reduction_is_non_dependant: true
    uk-hastings:policies/hastings/council-tax-reduction#input.hastings_council_tax_reduction_non_dependant_exempt: true
  output:
    uk-hastings:policies/hastings/council-tax-reduction#hastings_council_tax_reduction_individual_non_dependant_deduction_for_year: 0

- name: hastings_ctr_household_non_dependant_deduction_reduces_award
  period: *period
  input:
    uk-hastings:policies/hastings/council-tax-reduction#input.local_authority_is_hastings: true
    uk-hastings:policies/hastings/council-tax-reduction#input.would_claim_council_tax_reduction: true
    uk-hastings:policies/hastings/council-tax-reduction#input.hastings_council_tax_reduction_applicant_is_working_age: true
    uk-hastings:policies/hastings/council-tax-reduction#input.hastings_council_tax_reduction_actual_annual_liability_after_discounts: 1800
    uk-hastings:policies/hastings/council-tax-reduction#input.hastings_council_tax_reduction_band_d_annual_liability_after_discounts: 1500
    uk-hastings:policies/hastings/council-tax-reduction#input.hastings_council_tax_reduction_applicable_amount_for_year: 10000
    uk-hastings:policies/hastings/council-tax-reduction#input.hastings_council_tax_reduction_assessed_capital: 0
    uk-hastings:policies/hastings/council-tax-reduction#input.hastings_council_tax_reduction_assessed_income_for_year: 10000
    uk-hastings:policies/hastings/council-tax-reduction#input.hastings_council_tax_reduction_non_dependant_deductions_for_year: 260
  output:
    uk-hastings:policies/hastings/council-tax-reduction#simulated_hastings_council_tax_reduction_annual_amount: 1240
    uk-hastings:policies/hastings/council-tax-reduction#hastings_council_tax_reduction_annual_amount: 1240
