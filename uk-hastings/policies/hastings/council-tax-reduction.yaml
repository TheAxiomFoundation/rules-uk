format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: uk-hastings/manual/council-tax-reduction-scheme-2026-2027/page-71
    # upstream_source_check:
    #   status: delegated_scheme
    #   checked_paths: [uk/statutes/ukpga/1992/14/13A, uk/regulations/uksi/2012/2885, uk/regulations/uksi/2012/2886]
    #   rationale: Section 13A delegates the working-age scheme to Hastings Borough Council, so the Council's adopted scheme document is the operative source for its local values and award calculation. The pinned singular source-verification contract rejects and strips this attestation as a live field.
  summary: |-
    Hastings Borough Council's adopted 2026-27 working-age scheme is a taper
    scheme. Maximum reduction is 100 percent of Band-D-or-lower discounted
    liability, less a flat £5 weekly deduction for each non-dependant and a
    25 percent weekly excess-income taper. Capital above £16,000 excludes the
    applicant. The scheme prints no tariff-income threshold or step: capital is
    an immediate eligibility cliff. Awards below £5 per week are suppressed.
    No separate protected-class maximum is printed. Pension-age provisions are
    outside this module.
  deferred_outputs:
    - output: uk-hastings:policies/hastings/council-tax-reduction/section-12-and-schedule-1#applicable_amount
      reason: The category-specific personal allowances, child amounts, components, additions, and premium schedules feeding the applicable amount are outside this award-surface module.
    - output: uk-hastings:policies/hastings/council-tax-reduction/section-58.3-to-58.8#non_dependant_coordination_and_exemptions
      reason: Couple coordination, apportionment, and the detailed exemption schedule require resident-level facts outside this household award surface; exemption status is consumed as an input.
rules:
  - name: hastings_council_tax_reduction_maximum_support_rate
    kind: parameter
    dtype: Rate
    source: Hastings Borough Council Council Tax Reduction Scheme 2026/27 paragraph 57.1
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: uk-hastings/manual/council-tax-reduction-scheme-2026-2027/page-69
              excerpt: "shall be 100 per cent, of the amount A divided by B"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          1

  - name: hastings_council_tax_reduction_capital_limit
    kind: parameter
    dtype: Money
    period: Year
    unit: GBP
    source: Hastings Borough Council Council Tax Reduction Scheme 2026/27 paragraph 33.1
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: uk-hastings/manual/council-tax-reduction-scheme-2026-2027/page-52
              excerpt: "the prescribed amount is £16,000"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          16000

  - name: hastings_council_tax_reduction_daily_taper_rate
    kind: parameter
    dtype: Rate
    source: Hastings Borough Council Council Tax Reduction Scheme 2026/27 paragraph 59.1
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: uk-hastings/manual/council-tax-reduction-scheme-2026-2027/page-71
              excerpt: "shall be 3 4/7 per cent"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          0.03571428571428571428571428571

  - name: hastings_council_tax_reduction_days_per_week
    kind: parameter
    dtype: Number
    source: Hastings Borough Council Council Tax Reduction Scheme 2026/27 paragraph 57A.1
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: uk-hastings/manual/council-tax-reduction-scheme-2026-2027/page-69
              excerpt: "£5.00 x 1/7 per day"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          7

  - name: hastings_council_tax_reduction_weekly_taper_rate
    kind: parameter
    dtype: Rate
    source: Hastings Borough Council Council Tax Reduction Scheme 2026/27 paragraph 59.1
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: uk-hastings/manual/council-tax-reduction-scheme-2026-2027/page-71
              excerpt: "prescribed daily percentage, the taper"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          hastings_council_tax_reduction_daily_taper_rate * hastings_council_tax_reduction_days_per_week

  - name: hastings_council_tax_reduction_minimum_award_weekly
    kind: parameter
    dtype: Money
    period: Week
    unit: GBP
    source: Hastings Borough Council Council Tax Reduction Scheme 2026/27 paragraph 57A.1
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: uk-hastings/manual/council-tax-reduction-scheme-2026-2027/page-69
              excerpt: "less than £5.00 per reduction week"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          5

  - name: hastings_council_tax_reduction_weeks_per_year
    kind: parameter
    dtype: Number
    source: Hastings Borough Council Council Tax Reduction Scheme 2026/27 paragraph 14.2
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: uk-hastings/manual/council-tax-reduction-scheme-2026-2027/page-32
              excerpt: "divide the product by 52"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          52

  - name: hastings_council_tax_reduction_non_dependant_weekly_deduction_by_band
    kind: parameter
    dtype: Money
    period: Week
    unit: GBP
    indexed_by: hastings_council_tax_reduction_non_dependant_deduction_band
    source: Hastings Borough Council Council Tax Reduction Scheme 2026/27 paragraph 58.1
    metadata:
      proof:
        atoms:
          - path: versions[0].values
            kind: parameter_table
            source:
              corpus_citation_path: uk-hastings/manual/council-tax-reduction-scheme-2026-2027/page-69
              excerpt: "in respect of a non­ dependant aged 18 or over £5.00 x 1/7"
              table:
                header: "58.1 Non-dependant deductions"
                row_key: "deduction band"
                column_key: "weekly deduction"
    versions:
      - effective_from: '2026-04-01'
        values:
          0: 5

  - name: hastings_council_tax_reduction_capital_eligible
    kind: derived
    entity: Household
    dtype: Judgment
    period: Year
    source: Hastings Borough Council Council Tax Reduction Scheme 2026/27 paragraph 33.1
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: uk-hastings/manual/council-tax-reduction-scheme-2026-2027/page-52
              excerpt: "no support shall be granted when the applicant has an amount greater than this level"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          hastings_council_tax_reduction_assessed_capital
          <= hastings_council_tax_reduction_capital_limit

  - name: hastings_council_tax_reduction_excess_income_for_year
    kind: derived
    entity: Household
    dtype: Money
    period: Year
    unit: GBP
    source: Hastings Borough Council Council Tax Reduction Scheme 2026/27 paragraph 59.1
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: uk-hastings/manual/council-tax-reduction-scheme-2026-2027/page-71
              excerpt: "excess of income over the applicable amount"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          max(0, hastings_council_tax_reduction_assessed_income_for_year - hastings_council_tax_reduction_applicable_amount_for_year)

  - name: hastings_council_tax_reduction_income_taper_deduction_for_year
    kind: derived
    entity: Household
    dtype: Money
    period: Year
    unit: GBP
    source: Hastings Borough Council Council Tax Reduction Scheme 2026/27 paragraph 59.1
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: uk-hastings/manual/council-tax-reduction-scheme-2026-2027/page-71
              excerpt: "excess income multiplied by the taper"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          hastings_council_tax_reduction_excess_income_for_year * hastings_council_tax_reduction_weekly_taper_rate

  - name: hastings_council_tax_reduction_non_dependant_deduction_band
    kind: derived
    entity: Person
    dtype: Number
    period: Week
    source: Hastings Borough Council Council Tax Reduction Scheme 2026/27 paragraph 58.1
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter_table
            source:
              corpus_citation_path: uk-hastings/manual/council-tax-reduction-scheme-2026-2027/page-69
              excerpt: "in respect of a non­ dependant aged 18 or over £5.00 x 1/7"
              table:
                header: "58.1 Non-dependant deductions"
                row_key: "aged 18 or over"
                column_key: "deduction band"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          0

  - name: hastings_council_tax_reduction_individual_non_dependant_deduction_for_year
    kind: derived
    entity: Person
    dtype: Money
    period: Year
    unit: GBP
    source: Hastings Borough Council Council Tax Reduction Scheme 2026/27 paragraphs 58.1 and 58.6 to 58.8
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: uk-hastings/manual/council-tax-reduction-scheme-2026-2027/page-69
              excerpt: "non-dependant deductions in respect of a day referred to in section 57"
          - path: versions[0].formula
            kind: exception
            source:
              corpus_citation_path: uk-hastings/manual/council-tax-reduction-scheme-2026-2027/page-70
              excerpt: "No deduction shall be made in respect of any non-dependants occupying an applicant’s dwelling if the applicant or his partner is–"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          if hastings_council_tax_reduction_is_non_dependant and not hastings_council_tax_reduction_non_dependant_exempt: hastings_council_tax_reduction_non_dependant_weekly_deduction_by_band[hastings_council_tax_reduction_non_dependant_deduction_band] * hastings_council_tax_reduction_weeks_per_year else: 0

  - name: hastings_council_tax_reduction_maximum_for_year
    kind: derived
    entity: Household
    dtype: Money
    period: Year
    unit: GBP
    source: Hastings Borough Council Council Tax Reduction Scheme 2026/27 paragraph 57.1
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: uk-hastings/manual/council-tax-reduction-scheme-2026-2027/page-69
              excerpt: "A is the lower of either"
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: uk-hastings/manual/council-tax-reduction-scheme-2026-2027/page-69
              excerpt: "the amount set by the appropriate authority as the council tax for the relevant financial year in respect of a dwelling within Band D"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          min(hastings_council_tax_reduction_actual_annual_liability_after_discounts, hastings_council_tax_reduction_band_d_annual_liability_after_discounts) * hastings_council_tax_reduction_maximum_support_rate

  - name: hastings_council_tax_reduction_amount_before_minimum_floor
    kind: derived
    entity: Household
    dtype: Money
    period: Year
    unit: GBP
    source: Hastings Borough Council Council Tax Reduction Scheme 2026/27 paragraphs 57.1 and 59.1
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: uk-hastings/manual/council-tax-reduction-scheme-2026-2027/page-71
              excerpt: "deducting their excess income multiplied by the taper from their maximum council tax reduction"
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: uk-hastings/manual/council-tax-reduction-scheme-2026-2027/page-69
              excerpt: "less any deductions in respect of non-dependants"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          max(0, hastings_council_tax_reduction_maximum_for_year - hastings_council_tax_reduction_income_taper_deduction_for_year - hastings_council_tax_reduction_non_dependant_deductions_for_year)

  - name: hastings_council_tax_reduction_minimum_floor_met
    kind: derived
    entity: Household
    dtype: Judgment
    period: Year
    source: Hastings Borough Council Council Tax Reduction Scheme 2026/27 paragraph 57A.1
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: uk-hastings/manual/council-tax-reduction-scheme-2026-2027/page-69
              excerpt: "it shall not be paid where the amount to which a person would otherwise be entitled is less than £5.00 per reduction week"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          hastings_council_tax_reduction_amount_before_minimum_floor >= hastings_council_tax_reduction_minimum_award_weekly * hastings_council_tax_reduction_weeks_per_year

  - name: hastings_council_tax_reduction_award_conditions_met
    kind: derived
    entity: Household
    dtype: Judgment
    period: Year
    source: Hastings Borough Council Council Tax Reduction Scheme 2026/27 Classes D and E
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: uk-hastings/manual/council-tax-reduction-scheme-2026-2027/page-9
              excerpt: "have made a valid application for reduction"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          local_authority_is_hastings and would_claim_council_tax_reduction and hastings_council_tax_reduction_applicant_is_working_age and hastings_council_tax_reduction_capital_eligible and hastings_council_tax_reduction_minimum_floor_met

  - name: simulated_hastings_council_tax_reduction_annual_amount
    kind: derived
    entity: Household
    dtype: Money
    period: Year
    unit: GBP
    source: Hastings Borough Council Council Tax Reduction Scheme 2026/27 final working-age award surface
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: uk-hastings/manual/council-tax-reduction-scheme-2026-2027/page-71
              excerpt: "their council tax reduction shall be calculated by deducting their excess income multiplied by the taper from their maximum council tax reduction"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          if hastings_council_tax_reduction_award_conditions_met: hastings_council_tax_reduction_amount_before_minimum_floor else: 0

  - name: hastings_council_tax_reduction_annual_amount
    kind: derived
    entity: Household
    dtype: Money
    period: Year
    unit: GBP
    source: Hastings Borough Council Council Tax Reduction Scheme 2026/27 final working-age local award
    metadata:
      proof:
        atoms:
          - path: versions[0].effective_from
            kind: condition
            source:
              corpus_citation_path: uk-hastings/manual/council-tax-reduction-scheme-2026-2027/page-1
              excerpt: "Council Tax Reduction Scheme 2026/27"
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: uk-hastings/manual/council-tax-reduction-scheme-2026-2027/page-71
              excerpt: "their council tax reduction shall be calculated"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          simulated_hastings_council_tax_reduction_annual_amount
