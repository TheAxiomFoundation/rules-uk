              excerpt: "(a) less than £279.00, the deduction to be made under this paragraph shall be that specified in para­ graph 30.1(b); (b) not less than £279.00, but less than £485.00, the deduction to be made under this section shall be £10.60 x1/7; (c) not less than £485.00, but less than £605.00, the deduction to be made under this section shall be £13.30 x 1/7."
