          if not havant_council_tax_reduction_is_non_dependant or havant_council_tax_reduction_non_dependant_exempt: havant_council_tax_reduction_no_non_dependant_deduction_band else: if not havant_council_tax_reduction_non_dependant_in_remunerative_work: havant_council_tax_reduction_low_non_dependant_deduction_band else: if havant_council_tax_reduction_non_dependant_normal_gross_weekly_income >= havant_council_tax_reduction_non_dependant_top_income_threshold_weekly: havant_council_tax_reduction_top_non_dependant_deduction_band else: if havant_council_tax_reduction_non_dependant_normal_gross_weekly_income >= havant_council_tax_reduction_non_dependant_high_income_threshold_weekly: havant_council_tax_reduction_high_non_dependant_deduction_band else: if havant_council_tax_reduction_non_dependant_normal_gross_weekly_income >= havant_council_tax_reduction_non_dependant_mid_income_threshold_weekly: havant_council_tax_reduction_mid_non_dependant_deduction_band else: havant_council_tax_reduction_low_non_dependant_deduction_band

