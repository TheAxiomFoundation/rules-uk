format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: uk-havant/manual/council-tax-reduction-scheme-2026-2027/page-42
    # upstream_source_check:
    #   status: delegated_scheme
    #   checked_paths: [uk/statutes/ukpga/1992/14/13A, uk/regulations/uksi/2012/2885, uk/regulations/uksi/2012/2886]
    #   rationale: LGFA 1992 section 13A delegates the working-age scheme to Havant Borough Council, so the council's adopted scheme document is the operative legal source for these locally set values. The pinned singular source-verification contract strips this attestation as a live field.
  summary: |-
    Upstream-source status: delegated_scheme. Checked paths: uk/statutes/ukpga/1992/14/13A, uk/regulations/uksi/2012/2885, and uk/regulations/uksi/2012/2886. LGFA 1992 section 13A delegates the working-age scheme to Havant Borough Council, so the council's adopted scheme is operative. Havant's adopted 2026-27 working-age scheme caps ordinary applicants at 91.5 percent of liability while protecting listed disability, carer, and armed-forces classes at 100 percent. It then applies the printed 20 percent weekly excess-income taper and non-dependant deductions to that maximum. Capital over £16,000 excludes an applicant; capital over £6,000 generates £1 weekly tariff income for each £250 or part thereof. No minimum-award floor or council-tax band cap is printed. Pension-age and separate alternative-maximum-reduction provisions are outside this module.
  deferred_outputs:
    - output: uk-havant:policies/havant/council-tax-reduction/schedule-3#applicable_amount
      reason: The working-age personal allowances, family premiums, disability premiums, components, and transitional additions underlying the applicable amount are outside this award-surface module.
    - output: uk-havant:policies/havant/council-tax-reduction/paragraphs-18-and-31-and-schedule-4#alternative_maximum_reduction
      reason: The separate second-adult alternative maximum reduction calculation is outside this working-age Classes D and E award surface.
