format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: uk-hertsmere/manual/council-tax-reduction-scheme-2026-2027/page-76
    # upstream_source_check:
    #   status: delegated_scheme
    #   checked_paths: [uk/statutes/ukpga/1992/14/13A, uk/regulations/uksi/2012/2885, uk/regulations/uksi/2012/2886]
    #   rationale: Section 13A delegates the working-age scheme to Hertsmere Borough Council, so the authority's adopted scheme document is the operative source for its locally set values.
  summary: |-
    Hertsmere's operative 2026-27 working-age surface has two routes. Applicants without Universal Credit use a 20 percent excess-income taper against a maximum equal to 80 percent of Band-D-or-lower liability, or 100 percent for the printed protected group. Universal Credit applicants instead use the appendix earnings bands: the printed claimant contribution determines a 100, 80, 60, 40, 20, or zero percent award against Band-D-or-lower liability. Both routes retain the £16,000 capital limit, tariff income above £6,000 in £250 steps, and non-dependant deductions. There is no printed minimum-award floor. Pension-age provisions are outside this module.
  deferred_outputs:
    - output: uk-hertsmere:policies/hertsmere/council-tax-reduction/sections-12-to-32-and-schedules-1-to-4#applicable_amount_and_assessed_income
      reason: The category-specific applicable-amount, premium, earnings, and income-disregard schedules feeding the main route are outside this award-surface module.
    - output: uk-hertsmere:policies/hertsmere/council-tax-reduction/section-57.1#band_d_capped_annual_liability
      reason: The award surface consumes liability already capped at the lower of actual discounted liability and Band D; council-tax charge lookup and joint-liability apportionment are outside this module.
    - output: uk-hertsmere:policies/hertsmere/council-tax-reduction/sections-58.3-to-58.9#non_dependant_exemption_and_coordination
      reason: Couple coordination, apportionment, and the detailed exemption classifier require resident-level facts outside this award surface.
    - output: uk-hertsmere:policies/hertsmere/council-tax-reduction/class-f#alternative_maximum_council_tax_reduction
      reason: The separate second-adult alternative maximum reduction is outside this working-age Class E and Universal Credit award surface.
