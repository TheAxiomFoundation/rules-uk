        formula: |-
          if hillingdon_council_tax_reduction_household_is_vulnerable and hillingdon_council_tax_reduction_net_weekly_income <= hillingdon_council_tax_reduction_band_2_upper_income_by_family[hillingdon_council_tax_reduction_family_category]: hillingdon_council_tax_reduction_band_2 else: if hillingdon_council_tax_reduction_net_weekly_income < hillingdon_council_tax_reduction_band_4_lower_income_by_family[hillingdon_council_tax_reduction_family_category]: hillingdon_council_tax_reduction_band_3 else: if hillingdon_council_tax_reduction_net_weekly_income < hillingdon_council_tax_reduction_band_5_lower_income_by_family[hillingdon_council_tax_reduction_family_category]: hillingdon_council_tax_reduction_band_4 else: if hillingdon_council_tax_reduction_net_weekly_income < hillingdon_council_tax_reduction_band_6_lower_income_by_family[hillingdon_council_tax_reduction_family_category]: hillingdon_council_tax_reduction_band_5 else: if hillingdon_council_tax_reduction_net_weekly_income <= hillingdon_council_tax_reduction_band_6_upper_income_by_family[hillingdon_council_tax_reduction_family_category]: hillingdon_council_tax_reduction_band_6 else: -1

