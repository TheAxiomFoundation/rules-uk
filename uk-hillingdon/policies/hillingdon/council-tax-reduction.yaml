          if hillingdon_council_tax_reduction_income_band == hillingdon_council_tax_reduction_band_2: hillingdon_council_tax_reduction_net_council_tax_after_discounts_weekly else: min(hillingdon_council_tax_reduction_net_council_tax_after_discounts_weekly, hillingdon_council_tax_reduction_band_d_net_council_tax_weekly)

