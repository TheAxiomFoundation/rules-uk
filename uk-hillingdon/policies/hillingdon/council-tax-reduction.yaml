              excerpt: "The minimum entitlement is £3.00 per week."
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: uk-hillingdon/manual/council-tax-reduction-scheme-2026-2027/page-5
              excerpt: "Applicants who have total net income levels above the appropriate upper limit band 6 levels shown in the grid for their household composition will receive no discount."
