        formula: |-
          local_authority_is_hillingdon and would_claim_council_tax_reduction and hillingdon_council_tax_reduction_applicant_is_working_age and hillingdon_council_tax_reduction_capital_eligible and hillingdon_council_tax_reduction_other_entitlement_conditions_satisfied

  - name: hillingdon_council_tax_reduction_selected_liability_weekly
    kind: derived
    entity: Household
    dtype: Money
    period: Week
    unit: GBP
    source: Hillingdon Council Tax Reduction Scheme 2026/27 points 34 and 40
