        formula: |-
          if hillingdon_council_tax_reduction_income_band == -1: 0 else: if hillingdon_council_tax_reduction_working_age_award_conditions_satisfied: (if hillingdon_council_tax_reduction_selected_liability_weekly * min(hillingdon_council_tax_reduction_maximum_support_rate, hillingdon_council_tax_reduction_discount_rate_by_band[hillingdon_council_tax_reduction_income_band]) - hillingdon_council_tax_reduction_non_dependant_deductions_weekly < hillingdon_council_tax_reduction_minimum_award_weekly: 0 else: hillingdon_council_tax_reduction_selected_liability_weekly * min(hillingdon_council_tax_reduction_maximum_support_rate, hillingdon_council_tax_reduction_discount_rate_by_band[hillingdon_council_tax_reduction_income_band]) - hillingdon_council_tax_reduction_non_dependant_deductions_weekly) else: 0

