format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: uk-hillingdon/manual/council-tax-reduction-scheme-2026-2027/page-45
  summary: |-
    Hillingdon's operative working-age scheme from 1 April 2026 is a direct weekly-income banded scheme, not an excess-income-taper scheme. It awards 75, 55, 35, or 15 percent of net council tax after discounts, subject to a £6,000 capital cliff, £12 weekly non-dependant deductions, a £3 weekly minimum entitlement, and a Band D liability cap for bands 3 to 6. The Band 6 upper weekly-income limits are £180 for a single applicant, £250 for a couple, £330 for a family with one child, and £500 for a family with two or more children; income above the applicable limit receives no discount. No tariff-income threshold or step is printed: capital above £6,000 ends entitlement. Band 2 is the 75 percent protected/vulnerable class; band 3 is the ordinary 75 percent class. Pension-age rules are outside this module.
  deferred_outputs:
    - output: uk-hillingdon:policies/hillingdon/council-tax-reduction/points-34-to-35#vulnerable_class_and_entitlement_classifier
      reason: This module consumes the outcome of the printed protected-class and wider entitlement conditions; its detailed benefit, disability, residence, absence, and family classifiers are not encoded here.
    - output: uk-hillingdon:policies/hillingdon/council-tax-reduction/point-41#non_dependant_exemption_and_apportionment
      reason: This module encodes the £12 deduction amount and consumes whether a deduction applies; the detailed exemption, residence, joint-liability, and apportionment rules are deferred.
    - output: uk-hillingdon:policies/hillingdon/council-tax-reduction/points-36-to-39#net_weekly_income_and_capital_assessment
      reason: This module consumes assessed net weekly income and capital; the detailed income, disregards, valuation, notional-capital, and evidence rules are deferred.
