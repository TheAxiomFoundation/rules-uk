format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: uk-kensington-and-chelsea/manual/council-tax-reduction-scheme-2026-2027/page-199
    # upstream_source_check:
    #   status: delegated_scheme
    #   checked_paths: [uk/statutes/ukpga/1992/14/13A, uk/regulations/uksi/2012/2885, uk/regulations/uksi/2012/2886]
    #   rationale: LGFA 1992 section 13A delegates the working-age scheme to Royal Borough of Kensington and Chelsea, so the council's adopted scheme document is the operative legal source for these locally set values. The pinned singular source-verification contract strips this attestation as a live field.
  summary: |-
    The Royal Borough of Kensington and Chelsea's operative 2026-27 working-age scheme caps the maximum award at 90% of annual liability. For non-UC cases, it applies the printed 2 6/7% daily taper (20% weekly), £16,000 capital cliff, and £1 weekly tariff income for each £250 or part over £6,000. Schedule 11 expressly applies UC percentage bands to the same 90% maximum; the band schedule and transitional no-less-favourable comparison are deferred below. No minimum award or council-tax-band cap is printed. Pension-age and alternative maximum reduction are outside this working-age award module.
  deferred_outputs:
    - output: uk-kensington-and-chelsea:policies/kensington-and-chelsea/council-tax-reduction/schedule-3#applicable_amount
      reason: The working-age personal allowances, family premiums, disability premiums, components, and transitional additions underlying the applicable amount are outside this award-surface module.
    - output: uk-kensington-and-chelsea:policies/kensington-and-chelsea/council-tax-reduction/paragraphs-18-and-31-and-schedule-4#alternative_maximum_reduction
      reason: The separate second-adult alternative maximum reduction calculation is outside this working-age Classes D and E award surface.
