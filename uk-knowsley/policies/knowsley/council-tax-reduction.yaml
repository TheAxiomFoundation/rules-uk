              excerpt: "This document describes the scheme set up by Knowsley Metropolitan Borough Council for the period 1st April 2026 until 31st March 2027."
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          local_authority_is_knowsley and council_tax_reduction_household_in_england and not council_tax_reduction_household_has_pensioner

  - name: knowsley_council_tax_reduction_capital_eligible
    kind: derived
    entity: Household
    dtype: Judgment
    period: Year
    source: Knowsley Council Tax Reduction Scheme 2026-2027 working-age eligibility
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: uk-knowsley/manual/council-tax-reduction-scheme-2026-2027/page-9
              excerpt: "If an applicant has more than £16,000 in capital, no council tax reduction is applied under this scheme."
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          knowsley_council_tax_reduction_assessed_capital_for_year <= knowsley_council_tax_reduction_capital_limit

  - name: knowsley_council_tax_reduction_selected_support_rate
    kind: derived
    entity: Household
    dtype: Rate
    period: Week
    source: Knowsley Council Tax Reduction Scheme 2026-2027 paragraph 9
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter_table
            source:
