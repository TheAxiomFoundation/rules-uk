format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: uk-knowsley/manual/council-tax-reduction-scheme-2026-2027/page-10
    # upstream_source_check:
    #   status: delegated_scheme
    #   checked_paths: [uk/statutes/ukpga/1992/14/13A, uk/regulations/uksi/2012/2885, uk/regulations/uksi/2012/2886]
    #   rationale: LGFA 1992 section 13A delegates the working-age scheme to Knowsley Metropolitan Borough Council, so the adopted document is operative. The apply-stage encoder strips this attestation to the singular source-verification contract after local gates pass.
  summary: |-
    Knowsley's 2026-27 local working-age scheme selects a 84%, 64%, 44%, 20%, or 0% award band from weekly net earnings, household type, and the £20-per-child uplift. The selected rate is applied to actual council-tax liability capped at the Band C charge, then non-dependant deductions are applied. Capital above £16,000 excludes the applicant and an award below £3 a week is not payable. The working-age calculation has no capital tariff because the award is based entirely on earnings. The pension-age prescribed calculation and the working-age income-assessment and protected-class classifiers are outside this award surface.
  deferred_outputs:
    - output: uk-knowsley:policies/knowsley/council-tax-reduction/paragraphs-10-to-33#assessed_weekly_net_earnings
      reason: The award surface consumes the scheme's assessed weekly net earnings. Earnings, Universal Credit, self-employment, other-income, and minimum-income-floor calculations are not encoded here.
    - output: uk-knowsley:policies/knowsley/council-tax-reduction/paragraph-35#a_band_c_capped_weekly_liability
      reason: This module consumes the liability already capped at the Band C property charge; council-tax charge lookup, discounts, and daily apportionment are outside this module.
    - output: uk-knowsley:policies/knowsley/council-tax-reduction/paragraph-47#non_dependant_exemption
      reason: This module encodes the printed £4 and £10 deduction amounts and consumes the exemption result. Disability, student, training, Pension Credit, and residence classifiers remain future outputs.
    - output: uk-knowsley:policies/knowsley/council-tax-reduction/paragraph-10#minimum_income_floor_applies
      reason: The scheme permits a self-employment minimum income floor; its eligibility and earnings calculation are outside this award-surface module.
