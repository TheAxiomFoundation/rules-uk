              excerpt: "For working-age applicants, a standard deduction is applied for non-dependants aged 18 or over. The deduction is £4.00 per week for those who are not working and £10.00 per week for those who are working."
              table:
                header: Non-dependant weekly deductions
                row_key: deduction band
                column_key: weekly deduction
