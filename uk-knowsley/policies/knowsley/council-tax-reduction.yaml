              excerpt: "2 64% Net earnings of less than £120+child additions* Net earnings of less than £140+child additions*"
          - path: versions[0].formula
            kind: parameter_table
            source:
              corpus_citation_path: uk-knowsley/manual/council-tax-reduction-scheme-2026-2027/page-6
              excerpt: "3 44% Net earnings of less than £200+child additions* Net earnings of less than £220+child additions*"
          - path: versions[0].formula
            kind: parameter_table
            source:
              corpus_citation_path: uk-knowsley/manual/council-tax-reduction-scheme-2026-2027/page-6
              excerpt: "4 20% Net earnings of less than £300+child additions* Net earnings of less than £320+child additions*"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          if knowsley_council_tax_reduction_weekly_net_earnings == 0: knowsley_council_tax_reduction_maximum_support_rate else: if knowsley_council_tax_reduction_is_couple: if knowsley_council_tax_reduction_weekly_net_earnings < knowsley_council_tax_reduction_couple_band_2_threshold + knowsley_council_tax_reduction_child_band_uplift * knowsley_council_tax_reduction_number_of_children: knowsley_council_tax_reduction_band_2_support_rate else: if knowsley_council_tax_reduction_weekly_net_earnings < knowsley_council_tax_reduction_couple_band_3_threshold + knowsley_council_tax_reduction_child_band_uplift * knowsley_council_tax_reduction_number_of_children: knowsley_council_tax_reduction_band_3_support_rate else: if knowsley_council_tax_reduction_weekly_net_earnings < knowsley_council_tax_reduction_couple_band_4_threshold + knowsley_council_tax_reduction_child_band_uplift * knowsley_council_tax_reduction_number_of_children: knowsley_council_tax_reduction_band_4_support_rate else: knowsley_council_tax_reduction_zero_support_rate else: if knowsley_council_tax_reduction_weekly_net_earnings < knowsley_council_tax_reduction_single_band_2_threshold + knowsley_council_tax_reduction_child_band_uplift * knowsley_council_tax_reduction_number_of_children: knowsley_council_tax_reduction_band_2_support_rate else: if knowsley_council_tax_reduction_weekly_net_earnings < knowsley_council_tax_reduction_single_band_3_threshold + knowsley_council_tax_reduction_child_band_uplift * knowsley_council_tax_reduction_number_of_children: knowsley_council_tax_reduction_band_3_support_rate else: if knowsley_council_tax_reduction_weekly_net_earnings < knowsley_council_tax_reduction_single_band_4_threshold + knowsley_council_tax_reduction_child_band_uplift * knowsley_council_tax_reduction_number_of_children: knowsley_council_tax_reduction_band_4_support_rate else: knowsley_council_tax_reduction_zero_support_rate

  - name: knowsley_council_tax_reduction_individual_non_dependant_deduction_weekly
    kind: derived
    entity: Person
    dtype: Money
    period: Week
    unit: GBP
    source: Knowsley Council Tax Reduction Scheme 2026-2027 paragraph 47
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: uk-knowsley/manual/council-tax-reduction-scheme-2026-2027/page-13
              excerpt: "For working-age applicants, a standard deduction is applied for non-dependants aged 18 or over. The deduction is £4.00 per week for those who are not working and £10.00 per week for those who are working."
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: uk-knowsley/manual/council-tax-reduction-scheme-2026-2027/page-35
              excerpt: "Remunerative work Where a person is working for at least 16 hours a week (which may be an average) for which payment is made or which is done in expectation of payment."
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          if knowsley_council_tax_reduction_non_dependant_exempt: knowsley_council_tax_reduction_non_dependant_deduction_weekly_by_band[0] else: if knowsley_council_tax_reduction_non_dependant_weekly_hours >= knowsley_council_tax_reduction_remunerative_work_hours: knowsley_council_tax_reduction_non_dependant_deduction_weekly_by_band[2] else: knowsley_council_tax_reduction_non_dependant_deduction_weekly_by_band[1]

  - name: knowsley_council_tax_reduction_pre_floor_weekly_award
    kind: derived
    entity: Household
    dtype: Money
    period: Week
    unit: GBP
    source: Knowsley Council Tax Reduction Scheme 2026-2027 paragraph 35
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: uk-knowsley/manual/council-tax-reduction-scheme-2026-2027/page-10
              excerpt: "the actual liability for council tax, capped at a band C property charge"
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: uk-knowsley/manual/council-tax-reduction-scheme-2026-2027/page-11
              excerpt: "b. apply the maximum council tax reduction in accordance with the table at paragraph 9;"
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: uk-knowsley/manual/council-tax-reduction-scheme-2026-2027/page-11
              excerpt: "c. apply any non-dependant deductions set out in paragraph 47."
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          max(0, knowsley_council_tax_reduction_band_c_capped_weekly_liability * knowsley_council_tax_reduction_selected_support_rate - knowsley_council_tax_reduction_non_dependant_deductions_weekly)

  - name: knowsley_council_tax_reduction_weekly_award
    kind: derived
    entity: Household
    dtype: Money
    period: Week
    unit: GBP
    source: Knowsley Council Tax Reduction Scheme 2026-2027 paragraph 9
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: uk-knowsley/manual/council-tax-reduction-scheme-2026-2027/page-5
              excerpt: "In cases were any award calculated is less than £3.00 per week, no award shall be made."
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          if knowsley_council_tax_reduction_working_age_scheme_applies and knowsley_council_tax_reduction_capital_eligible and would_claim_council_tax_reduction and knowsley_council_tax_reduction_pre_floor_weekly_award >= knowsley_council_tax_reduction_minimum_award_weekly: knowsley_council_tax_reduction_pre_floor_weekly_award else: 0
