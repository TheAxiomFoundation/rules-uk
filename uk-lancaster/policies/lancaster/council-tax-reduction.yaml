format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: uk-lancaster/manual/council-tax-reduction-scheme-2026-2027/page-71
    # upstream_source_check:
    #   status: delegated_scheme
    #   checked_paths:
    #     - uk/statutes/ukpga/1992/14/13A
    #     - uk/regulations/uksi/2012/2885
    #     - uk/regulations/uksi/2012/2886
    #   rationale: Section 13A of the Local Government Finance Act 1992 delegates the working-age scheme to Lancaster City Council, so the Council's adopted scheme document is the operative legal source for its locally set values.
  summary: |-
    Upstream-source status: delegated_scheme. Checked paths: uk/statutes/ukpga/1992/14/13A, uk/regulations/uksi/2012/2885, and uk/regulations/uksi/2012/2886. Section 13A of the Local Government Finance Act 1992 delegates the working-age scheme to Lancaster City Council, so the Council's adopted scheme document is the operative legal source for its locally set values. Lancaster's adopted 2026-27 working-age scheme covers 100 percent of eligible liability, less working-age non-dependant deductions and a 2 6/7 percent daily (20 percent weekly) taper on excess income. Capital above £16,000 is an eligibility cliff; capital above £6,000 and no more than £16,000 produces £1 weekly tariff income for each complete £250 or part thereof. The working-age text contains no minimum-award floor or council-tax-band cap. The pension-age prescribed scheme and second-adult rebate are outside this module.
  deferred_outputs:
    - output: uk-lancaster:policies/lancaster/council-tax-reduction/schedule-1#applicable_amount
      reason: The category-specific personal allowances, premiums, components, and transitional additions used to calculate the applicable amount are outside this award-surface module.
    - output: uk-lancaster:policies/lancaster/council-tax-reduction/sections-15-to-40-and-schedules-3-to-5#assessed_income_and_capital
      reason: Detailed income disregards, attribution, and capital valuation are outside this award-surface module.
    - output: uk-lancaster:policies/lancaster/council-tax-reduction/class-c#alternative_maximum_council_tax_reduction
      reason: The separate pension-age second-adult rebate is outside this working-age Class D and E module.
rules:
  - name: lancaster_council_tax_reduction_maximum_support_rate
    kind: parameter
    dtype: Rate
    period: Year
    source: Lancaster Council Tax Reduction Scheme 2026/27 paragraph 57.1
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: uk-lancaster/manual/council-tax-reduction-scheme-2026-2027/page-71
              excerpt: "shall be 100 per cent, of the amount A divided by B"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          1

  - name: lancaster_council_tax_reduction_daily_taper_rate
