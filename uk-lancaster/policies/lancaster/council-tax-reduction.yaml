              excerpt: "£15.95 x 1/7"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          7

  - name: lancaster_council_tax_reduction_weekly_taper_rate
    kind: parameter
    dtype: Rate
    period: Week
    source: Lancaster Council Tax Reduction Scheme 2026/27 paragraph 59.1 daily percentage converted by the printed seven-day denominator
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: uk-lancaster/manual/council-tax-reduction-scheme-2026-2027/page-73
              excerpt: "shall be 2 6/7 per cent."
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: uk-lancaster/manual/council-tax-reduction-scheme-2026-2027/page-71
              excerpt: "£15.95 x 1/7"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          lancaster_council_tax_reduction_daily_taper_rate * lancaster_council_tax_reduction_days_per_week

  - name: lancaster_council_tax_reduction_capital_limit
    kind: parameter
    dtype: Money
    period: Year
    unit: GBP
    source: Lancaster Council Tax Reduction Scheme 2026/27 paragraph 33.1
    metadata:
