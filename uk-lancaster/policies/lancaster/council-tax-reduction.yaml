              excerpt: "shall be 2 6/7 per cent."
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          0.0285714285714285714285714286

  - name: lancaster_council_tax_reduction_days_per_week
    kind: parameter
    dtype: Number
    source: Lancaster Council Tax Reduction Scheme 2026/27 paragraph 58.1
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: amount
            source:
