format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: uk-maldon/manual/council-tax-reduction-scheme-2026-2027/page-79
    upstream_source_check:
      status: delegated_scheme
      checked_paths: [uk/statutes/ukpga/1992/14/13A, uk/regulations/uksi/2012/2885, uk/regulations/uksi/2012/2886]
      rationale: LGFA 1992 section 13A delegates the working-age scheme to Maldon District Council, so the adopted document is operative. The apply-stage encoder strips this attestation to the singular source-verification contract after local gates pass.
  summary: |-
    Maldon's operative 2026-27 working-age scheme caps maximum support at 80% of the lower of actual liability or Band D liability. The Class E taper is linked expressly to that section 57 maximum and withdraws 2 6/7% daily, exactly 20% weekly. Capital above £6,000 ends support. The scheme incorporates the Housing Benefit tariff-income calculation, but tariff income is necessarily zero throughout Maldon's locally eligible capital range. Non-dependants attract £10 weekly in every printed work/income band unless a protection or exemption applies. No minimum-award floor is printed.
  deferred_outputs:
    - output: uk-maldon:policies/maldon/council-tax-reduction/sections-12-to-32-and-schedules-1-to-4#applicable_amount_and_assessed_income
      reason: The award surface consumes applicable amount and assessed income; detailed premiums, earnings, disregards, childcare, self-employment, and Universal Credit assessment rules are outside this module.
    - output: uk-maldon:policies/maldon/council-tax-reduction/sections-33-to-41-and-schedule-5#assessed_capital
      reason: This module applies the local capital cliff; the incorporated tariff calculation and detailed valuation, attribution, notional-capital, and disregard rules are outside this module because tariff income cannot be positive within Maldon's eligible capital range.
    - output: uk-maldon:policies/maldon/council-tax-reduction/paragraphs-57.1-to-57.4#band_d_capped_annual_liability
      reason: The award surface consumes eligible liability already capped at the lower of actual liability and Band D; charge lookup, discounts, and joint-liability apportionment are outside this module.
    - output: uk-maldon:policies/maldon/council-tax-reduction/paragraphs-58.3-to-58.9#non_dependant_exemption_and_apportionment
      reason: This module encodes the deduction grid and consumes the printed protection or exemption result; couple, disability, student, benefit, absence, armed-forces, and apportionment classifiers are deferred.
    - output: uk-maldon:policies/maldon/council-tax-reduction/class-c#alternative_maximum_council_tax_reduction
      reason: The separate pension-age second-adult reduction is outside this working-age award surface.
rules:
  - name: maldon_council_tax_reduction_maximum_support_rate
    kind: parameter
    dtype: Rate
    source: Maldon Council Tax Reduction Scheme 2026/27 paragraph 57.1
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: uk-maldon/manual/council-tax-reduction-scheme-2026-2027/page-77
              excerpt: "shall be 80 per cent, of the amount A/B"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          0.80

  - name: maldon_council_tax_reduction_capital_limit
    kind: parameter
    dtype: Money
    period: Year
    unit: GBP
    source: Maldon Council Tax Reduction Scheme 2026/27 paragraph 33.1
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: uk-maldon/manual/council-tax-reduction-scheme-2026-2027/page-59
              excerpt: "the prescribed amount is £6,000"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          6000

  - name: maldon_council_tax_reduction_tariff_income_threshold
    kind: parameter
    dtype: Money
    period: Year
    unit: GBP
    source: Maldon Council Tax Reduction Scheme 2026/27 paragraph 17.1(b), incorporating Housing Benefit Regulations 2006 regulation 52
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: uk-maldon/manual/council-tax-reduction-scheme-2026-2027/page-59
              excerpt: "the prescribed amount is £6,000"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          6000

  - name: maldon_council_tax_reduction_days_per_week
    kind: parameter
    dtype: Number
    source: Maldon Council Tax Reduction Scheme 2026/27 paragraph 58.1
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: uk-maldon/manual/council-tax-reduction-scheme-2026-2027/page-77
              excerpt: "£10.00 x 1/7"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          7

  - name: maldon_council_tax_reduction_daily_taper_rate
    kind: parameter
    dtype: Rate
    source: Maldon Council Tax Reduction Scheme 2026/27 paragraph 59.1
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: uk-maldon/manual/council-tax-reduction-scheme-2026-2027/page-79
              excerpt: "shall be 2 6/7 per cent"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          0.02857142857142857142857142857

  - name: maldon_council_tax_reduction_weekly_taper_rate
    kind: parameter
    dtype: Rate
    source: Maldon Council Tax Reduction Scheme 2026/27 paragraph 59.1, daily rate converted by the printed seven-day divisor
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: uk-maldon/manual/council-tax-reduction-scheme-2026-2027/page-79
              excerpt: "shall be 2 6/7 per cent"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          maldon_council_tax_reduction_daily_taper_rate * maldon_council_tax_reduction_days_per_week

  - name: maldon_council_tax_reduction_non_dependant_band_2_threshold
    kind: parameter
    dtype: Money
    period: Week
    unit: GBP
    source: Maldon Council Tax Reduction Scheme 2026/27 paragraph 58.2
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: uk-maldon/manual/council-tax-reduction-scheme-2026-2027/page-77
              excerpt: "not less than £195.00, but less than £338.00"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          195

  - name: maldon_council_tax_reduction_non_dependant_band_3_threshold
    kind: parameter
    dtype: Money
    period: Week
    unit: GBP
    source: Maldon Council Tax Reduction Scheme 2026/27 paragraph 58.2
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: uk-maldon/manual/council-tax-reduction-scheme-2026-2027/page-77
              excerpt: "not less than £338.00, but less than £420.00"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          338

  - name: maldon_council_tax_reduction_non_dependant_band_4_threshold
    kind: parameter
    dtype: Money
    period: Week
    unit: GBP
    source: Maldon Council Tax Reduction Scheme 2026/27 paragraph 58.2
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: uk-maldon/manual/council-tax-reduction-scheme-2026-2027/page-77
              excerpt: "less than £420.00"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          420

  - name: maldon_council_tax_reduction_non_dependant_weekly_deduction_by_band
    kind: parameter
    dtype: Money
    period: Week
    unit: GBP
    indexed_by: maldon_council_tax_reduction_non_dependant_deduction_band
    source: Maldon Council Tax Reduction Scheme 2026/27 paragraphs 58.1 and 58.2
    metadata:
      proof:
        atoms:
          - path: versions[0].values
            kind: parameter_table
            source:
              corpus_citation_path: uk-maldon/manual/council-tax-reduction-scheme-2026-2027/page-77
              excerpt: |-
                (a) in respect of a non-dependant aged 18 or over in remunerative work, £10.00 x 1/7; (b) in respect of a non-dependant aged 18 or over to whom sub-paragraph (a) does not apply, £10.00 x 1/7.

                58.2 In the case of a non-dependant aged 18 or over to whom paragraph 58.1(a) applies, where it is shown to the appropriate authority that his normal gross weekly income is– (a) less than £195.00, the deduction to be made under this paragraph shall be that specified in paragraph 58.1(b); (b) not less than £195.00, but less than £338.00, the deduction to be made under this section shall be £10.00; (c) not less than £338.00, but less than £420.00, the deduction to be made under this section shall be £10.00;
              table:
                header: Non-dependant weekly deductions
                row_key: deduction band
                column_key: weekly deduction
    versions:
      - effective_from: '2026-04-01'
        values:
          0: 0
          1: 10
          2: 10
          3: 10

  - name: maldon_council_tax_reduction_working_age_scheme_applies
    kind: derived
    entity: Household
    dtype: Judgment
    period: Year
    source: Maldon Council Tax Reduction Scheme 2026/27 paragraph 1.6
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: uk-maldon/manual/council-tax-reduction-scheme-2026-2027/page-9
              excerpt: "THE SCHEME FOR WORKING AGE APPLICANTS – THE COUNCIL’S LOCAL SCHEME"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          local_authority_is_maldon and council_tax_reduction_household_in_england and not council_tax_reduction_household_has_pensioner

  - name: maldon_council_tax_reduction_capital_eligible
    kind: derived
    entity: Household
    dtype: Judgment
    period: Year
    source: Maldon Council Tax Reduction Scheme 2026/27 paragraph 33.1
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: uk-maldon/manual/council-tax-reduction-scheme-2026-2027/page-59
              excerpt: "no support shall be granted when the applicant has an amount greater than this level"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          maldon_council_tax_reduction_assessed_capital_for_year <= maldon_council_tax_reduction_capital_limit

  - name: maldon_council_tax_reduction_excess_income_for_year
    kind: derived
    entity: Household
    dtype: Money
    period: Year
    unit: GBP
    source: Maldon Council Tax Reduction Scheme 2026/27 paragraph 59.1
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: uk-maldon/manual/council-tax-reduction-scheme-2026-2027/page-79
              excerpt: "excess of income over the applicable amount"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          max(0, maldon_council_tax_reduction_assessed_income_for_year - maldon_council_tax_reduction_applicable_amount_for_year)

  - name: maldon_council_tax_reduction_income_taper_deduction_for_year
    kind: derived
    entity: Household
    dtype: Money
    period: Year
    unit: GBP
    source: Maldon Council Tax Reduction Scheme 2026/27 paragraph 59.1
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: uk-maldon/manual/council-tax-reduction-scheme-2026-2027/page-79
              excerpt: "their excess income multiplied by the taper"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          maldon_council_tax_reduction_excess_income_for_year * maldon_council_tax_reduction_weekly_taper_rate

  - name: maldon_council_tax_reduction_non_dependant_deduction_band
    kind: derived
    entity: Person
    dtype: Number
    period: Year
    source: Maldon Council Tax Reduction Scheme 2026/27 paragraphs 58.1, 58.2, 58.6, 58.7, and 58.8
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: uk-maldon/manual/council-tax-reduction-scheme-2026-2027/page-77
              excerpt: "normal gross weekly income is–"
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: uk-maldon/manual/council-tax-reduction-scheme-2026-2027/page-78
              excerpt: "No deduction shall be made in respect of any non-dependants"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          if not maldon_council_tax_reduction_is_non_dependant or maldon_council_tax_reduction_non_dependant_exempt: 0 else: if not maldon_council_tax_reduction_non_dependant_in_remunerative_work or maldon_council_tax_reduction_non_dependant_normal_gross_weekly_income < maldon_council_tax_reduction_non_dependant_band_2_threshold: 1 else: if maldon_council_tax_reduction_non_dependant_normal_gross_weekly_income < maldon_council_tax_reduction_non_dependant_band_3_threshold: 2 else: if maldon_council_tax_reduction_non_dependant_normal_gross_weekly_income < maldon_council_tax_reduction_non_dependant_band_4_threshold: 3 else: 1

  - name: maldon_council_tax_reduction_individual_non_dependant_deduction_weekly
    kind: derived
    entity: Person
    dtype: Money
    period: Week
    unit: GBP
    source: Maldon Council Tax Reduction Scheme 2026/27 paragraphs 58.1 and 58.2
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: uk-maldon/manual/council-tax-reduction-scheme-2026-2027/page-77
              excerpt: "the deduction to be made under this section shall be £10.00"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          maldon_council_tax_reduction_non_dependant_weekly_deduction_by_band[maldon_council_tax_reduction_non_dependant_deduction_band]

  - name: maldon_council_tax_reduction_maximum_amount_for_year
    kind: derived
    entity: Household
    dtype: Money
    period: Year
    unit: GBP
    source: Maldon Council Tax Reduction Scheme 2026/27 paragraph 57.1
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: uk-maldon/manual/council-tax-reduction-scheme-2026-2027/page-77
              excerpt: "the lower of either"
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: uk-maldon/manual/council-tax-reduction-scheme-2026-2027/page-77
              excerpt: "shall be 80 per cent, of the amount A/B"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          min(maldon_council_tax_reduction_actual_liability_for_year, maldon_council_tax_reduction_band_d_liability_for_year) * maldon_council_tax_reduction_maximum_support_rate

  - name: simulated_maldon_council_tax_reduction_annual_amount
    kind: derived
    entity: Household
    dtype: Money
    period: Year
    unit: GBP
    source: Maldon Council Tax Reduction Scheme 2026/27 working-age classes D and E, paragraphs 57.1 and 59.1
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: uk-maldon/manual/council-tax-reduction-scheme-2026-2027/page-79
              excerpt: "their council tax reduction shall be calculated by deducting their excess income multiplied by the taper from their maximum council tax reduction as defined within section 57 of this scheme"
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: uk-maldon/manual/council-tax-reduction-scheme-2026-2027/page-77
              excerpt: "less any deductions in respect of non-dependants"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          if maldon_council_tax_reduction_working_age_scheme_applies and would_claim_council_tax_reduction and maldon_council_tax_reduction_capital_eligible: max(0, maldon_council_tax_reduction_maximum_amount_for_year - maldon_council_tax_reduction_income_taper_deduction_for_year - maldon_council_tax_reduction_non_dependant_deductions_for_year) else: 0

  - name: maldon_council_tax_reduction_annual_amount
    kind: derived
    entity: Household
    dtype: Money
    period: Year
    unit: GBP
    source: Maldon Council Tax Reduction Scheme 2026/27 final working-age award surface
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: uk-maldon/manual/council-tax-reduction-scheme-2026-2027/page-11
              excerpt: "Details of support to be given for working age applicants for the financial year 2026/27"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          simulated_maldon_council_tax_reduction_annual_amount
