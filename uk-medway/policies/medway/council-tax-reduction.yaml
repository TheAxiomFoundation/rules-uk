              excerpt: "48A.1 Subject to the following provisions of this paragraph, the non-dependant deductions in respect of a day referred to in section 48 (maximum council tax reduction) shall be; (a) in respect of a non-dependant aged 18 or over in remunerative work, £10 x 1/7; (b) in respect of a non-dependant aged 18 or over to whom sub-paragraph (a) does not apply, £5 x 1/7. Where no evidence is provided by the applicant as to whether the non-dependant is in remunerative work, the higher deduction shall be made."
              table:
                header: "48A.0 Non-dependant deductions"
                row_key: "remunerative-work band"
                column_key: "weekly deduction before multiplication by 1/7"
    versions:
      - effective_from: '2026-04-01'
        values:
          0: 5
          1: 10

