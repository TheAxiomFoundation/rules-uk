format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: uk-medway/manual/council-tax-reduction-scheme-2026-2027/page-65
  summary: |-
    Medway's adopted working-age Council Tax Reduction scheme is effective from
    1 April 2026 and uses six weekly-income discount bands across four family
    categories. LGFA 1992 section 13A and Schedule 1A delegate working-age
    scheme design to Medway, making this adopted scheme operative. The
    2 6/7 per cent taper printed for pensioner Class B is outside this
    working-age module.
  deferred_outputs:
    - output: uk-medway:policies/medway/council-tax-reduction/class-e#prescribed_requirements_award_for_year
      reason: >-
        Working-age Class E war-pension cases are assessed under the prescribed
        requirements scheme. This alignment module selects a source-named
        boundary amount for that separately composed prescribed calculation.
    - output: uk-medway:policies/medway/council-tax-reduction/48A.2-48A.4#annual_non_dependant_deductions_after_coordination
      reason: >-
        Couple and polygamous-marriage one-deduction coordination and
        apportionment between jointly liable people require resident
        relationships outside this household award surface. The final formula
        consumes their coordinated annual total as a source-named boundary
        amount.
