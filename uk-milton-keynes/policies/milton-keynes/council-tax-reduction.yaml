    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: uk-milton-keynes/manual/council-tax-reduction-scheme-2026-2027/page-60
              excerpt: "£15.95 x 1/7"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          7

  - name: milton_keynes_council_tax_reduction_daily_taper_rate
    kind: parameter
    dtype: Rate
    source: Milton Keynes Council Tax Reduction Scheme 2026/27 paragraphs W14(f) and W14B(f)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: uk-milton-keynes/manual/council-tax-reduction-scheme-2026-2027/page-43
              excerpt: "amount B is 2 6/7 per cent"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          0.02857142857142857142857142857

  - name: milton_keynes_council_tax_reduction_weekly_taper_rate
    kind: parameter
    dtype: Rate
    source: Milton Keynes Council Tax Reduction Scheme 2026/27 daily rate converted by the printed seven-day denominator
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: uk-milton-keynes/manual/council-tax-reduction-scheme-2026-2027/page-43
              excerpt: "amount B is 2 6/7 per cent"
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: uk-milton-keynes/manual/council-tax-reduction-scheme-2026-2027/page-60
              excerpt: "£15.95 x 1/7"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          milton_keynes_council_tax_reduction_daily_taper_rate * milton_keynes_council_tax_reduction_days_per_week

  - name: milton_keynes_council_tax_reduction_non_dependant_first_income_cutoff
    kind: parameter
    dtype: Money
    period: Week
    unit: GBP
    source: Milton Keynes Council Tax Reduction Scheme 2026/27 paragraph W27(2)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: uk-milton-keynes/manual/council-tax-reduction-scheme-2026-2027/page-60
              excerpt: "less than £279.00"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          279

  - name: milton_keynes_council_tax_reduction_non_dependant_second_income_cutoff
    kind: parameter
    dtype: Money
    period: Week
    unit: GBP
    source: Milton Keynes Council Tax Reduction Scheme 2026/27 paragraph W27(2)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: uk-milton-keynes/manual/council-tax-reduction-scheme-2026-2027/page-60
              excerpt: "not less than £279.00 but less than £485.00"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          485

  - name: milton_keynes_council_tax_reduction_non_dependant_third_income_cutoff
    kind: parameter
    dtype: Money
    period: Week
    unit: GBP
    source: Milton Keynes Council Tax Reduction Scheme 2026/27 paragraph W27(2)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: uk-milton-keynes/manual/council-tax-reduction-scheme-2026-2027/page-60
              excerpt: "not less than £485.00 but less than £605.00"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          605

  - name: milton_keynes_council_tax_reduction_non_dependant_weekly_deduction_by_income_band
    kind: parameter
    dtype: Money
    period: Week
    unit: GBP
    indexed_by: milton_keynes_council_tax_reduction_non_dependant_income_band
    source: Milton Keynes Council Tax Reduction Scheme 2026/27 paragraph W27(1)-(2)
    metadata:
      proof:
        atoms:
          - path: versions[0].values
            kind: parameter_table
            source:
              corpus_citation_path: uk-milton-keynes/manual/council-tax-reduction-scheme-2026-2027/page-60
              table:
                header: "Working-age non-dependant normal gross weekly income and deduction"
                row_key: "income band"
                column_key: "weekly deduction"
              excerpt: "(a) in respect of a non-dependant aged 18 or over in remunerative work, £15.95 x 1/7; (b) in respect of a non-dependant aged 18 or over to whom sub-paragraph (a) does not apply, £5.20 x 1/7. (2) In the case of a non-dependant aged 18 or over to whom sub-paragraph (1)(a) applies, where it is shown to the authority that his normal gross weekly income is— (a) less than £279.00, the deduction to be made under this paragraph is that specified in subparagraph (1)(b); (b) not less than £279.00 but less than £485.00, the deduction to be made under this paragraph is £10.60 x 1/7 (c) not less than £485.00 but less than £605.00, the deduction to be made under this paragraph is £13.30 x 1/7"
    versions:
      - effective_from: '2026-04-01'
        values:
          0: 5.20
          1: 10.60
          2: 13.30
          3: 15.95

  - name: milton_keynes_council_tax_reduction_working_age_scheme_applies
    kind: derived
    entity: Household
    dtype: Judgment
    period: Year
    source: Milton Keynes Council Tax Reduction Scheme 2026/27 introduction paragraph 1(4)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: uk-milton-keynes/manual/council-tax-reduction-scheme-2026-2027/page-19
              excerpt: "Section 1 of this scheme applies to persons who are “working age”"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          local_authority_is_milton_keynes and council_tax_reduction_household_in_england and not council_tax_reduction_household_has_pensioner

  - name: milton_keynes_council_tax_reduction_capital_eligible
    kind: derived
    entity: Household
    dtype: Judgment
    period: Year
    source: Milton Keynes Council Tax Reduction Scheme 2026/27 paragraph W21(1)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: uk-milton-keynes/manual/council-tax-reduction-scheme-2026-2027/page-54
              excerpt: "any person whose capital exceeds £6,000"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          milton_keynes_council_tax_reduction_assessed_capital_for_year <= milton_keynes_council_tax_reduction_capital_limit

  - name: milton_keynes_council_tax_reduction_selected_maximum_support_rate
    kind: derived
    entity: Household
    dtype: Rate
    period: Year
    source: Milton Keynes Council Tax Reduction Scheme 2026/27 paragraphs W26 and W26A
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: uk-milton-keynes/manual/council-tax-reduction-scheme-2026-2027/page-58
              excerpt: "Classes AW and BW - persons who are not protected persons"
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: uk-milton-keynes/manual/council-tax-reduction-scheme-2026-2027/page-59
              excerpt: "Classes CW and DW - protected persons"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          if milton_keynes_council_tax_reduction_protected_person: milton_keynes_council_tax_reduction_protected_maximum_support_rate else: milton_keynes_council_tax_reduction_standard_maximum_support_rate

  - name: milton_keynes_council_tax_reduction_maximum_for_year
    kind: derived
    entity: Household
    dtype: Money
    period: Year
    unit: GBP
    source: Milton Keynes Council Tax Reduction Scheme 2026/27 paragraphs W26 and W26A
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: uk-milton-keynes/manual/council-tax-reduction-scheme-2026-2027/page-58
              excerpt: "80 per cent of the amount A/B"
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: uk-milton-keynes/manual/council-tax-reduction-scheme-2026-2027/page-59
              excerpt: "100 per cent of the amount A/B"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          milton_keynes_council_tax_reduction_maximum_eligible_liability_for_year * milton_keynes_council_tax_reduction_selected_maximum_support_rate - milton_keynes_council_tax_reduction_non_dependant_deductions_for_year

  - name: milton_keynes_council_tax_reduction_excess_income_for_year
    kind: derived
    entity: Household
    dtype: Money
    period: Year
    unit: GBP
    source: Milton Keynes Council Tax Reduction Scheme 2026/27 paragraphs W14(f) and W14B(f)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: uk-milton-keynes/manual/council-tax-reduction-scheme-2026-2027/page-43
              excerpt: "difference between his income for the relevant week and his applicable amount"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          max(0, milton_keynes_council_tax_reduction_assessed_income_for_year - milton_keynes_council_tax_reduction_applicable_amount_for_year)

  - name: milton_keynes_council_tax_reduction_taper_deduction_for_year
    kind: derived
    entity: Household
    dtype: Money
    period: Year
    unit: GBP
    source: Milton Keynes Council Tax Reduction Scheme 2026/27 paragraphs W14(f), W14B(f), and W28(2)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: uk-milton-keynes/manual/council-tax-reduction-scheme-2026-2027/page-43
              excerpt: "amount B is 2 6/7 per cent"
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: uk-milton-keynes/manual/council-tax-reduction-scheme-2026-2027/page-63
              excerpt: "deducting amount B from amount A"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          milton_keynes_council_tax_reduction_excess_income_for_year * milton_keynes_council_tax_reduction_weekly_taper_rate

  - name: milton_keynes_council_tax_reduction_non_dependant_income_band
    kind: derived
    entity: Person
    dtype: Number
    period: Week
    source: Milton Keynes Council Tax Reduction Scheme 2026/27 paragraph W27(1)-(2)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter_table
            source:
              corpus_citation_path: uk-milton-keynes/manual/council-tax-reduction-scheme-2026-2027/page-60
              excerpt: "normal gross weekly income is— (a) less than £279.00, the deduction to be made under this paragraph is that specified in subparagraph (1)(b); (b) not less than £279.00 but less than £485.00, the deduction to be made under this paragraph is £10.60 x 1/7 (c) not less than £485.00 but less than £605.00, the deduction to be made under this paragraph is £13.30 x 1/7"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          if not milton_keynes_council_tax_reduction_non_dependant_in_remunerative_work: 0 else: if milton_keynes_council_tax_reduction_non_dependant_normal_gross_weekly_income < milton_keynes_council_tax_reduction_non_dependant_first_income_cutoff: 0 else: if milton_keynes_council_tax_reduction_non_dependant_normal_gross_weekly_income < milton_keynes_council_tax_reduction_non_dependant_second_income_cutoff: 1 else: if milton_keynes_council_tax_reduction_non_dependant_normal_gross_weekly_income < milton_keynes_council_tax_reduction_non_dependant_third_income_cutoff: 2 else: 3

  - name: milton_keynes_council_tax_reduction_individual_non_dependant_deduction_weekly
    kind: derived
    entity: Person
    dtype: Money
    period: Week
    unit: GBP
    source: Milton Keynes Council Tax Reduction Scheme 2026/27 paragraph W27
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter_table
            source:
              corpus_citation_path: uk-milton-keynes/manual/council-tax-reduction-scheme-2026-2027/page-60
              excerpt: "(a) in respect of a non-dependant aged 18 or over in remunerative work, £15.95 x 1/7; (b) in respect of a non-dependant aged 18 or over to whom sub-paragraph (a) does not apply, £5.20 x 1/7."
          - path: versions[0].formula
            kind: exception
            source:
              corpus_citation_path: uk-milton-keynes/manual/council-tax-reduction-scheme-2026-2027/page-60
              excerpt: "No deduction is to be made in respect of any non-dependants"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          if milton_keynes_council_tax_reduction_non_dependant_is_exempt: 0 else: milton_keynes_council_tax_reduction_non_dependant_weekly_deduction_by_income_band[milton_keynes_council_tax_reduction_non_dependant_income_band]

  - name: simulated_milton_keynes_council_tax_reduction_annual_amount
    kind: derived
    entity: Household
    dtype: Money
    period: Year
    unit: GBP
    source: Milton Keynes Council Tax Reduction Scheme 2026/27 paragraph W28
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: uk-milton-keynes/manual/council-tax-reduction-scheme-2026-2027/page-63
              excerpt: "that amount is the amount which is the maximum council tax reduction"
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: uk-milton-keynes/manual/council-tax-reduction-scheme-2026-2027/page-63
              excerpt: "that amount is the amount found by deducting amount B from amount A"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          if milton_keynes_council_tax_reduction_working_age_scheme_applies and would_claim_council_tax_reduction and milton_keynes_council_tax_reduction_capital_eligible: max(0, milton_keynes_council_tax_reduction_maximum_for_year - milton_keynes_council_tax_reduction_taper_deduction_for_year) else: 0

  - name: milton_keynes_council_tax_reduction_annual_amount
    kind: derived
    entity: Household
    dtype: Money
    period: Year
    unit: GBP
    source: Milton Keynes Council Tax Reduction Scheme 2026/27 working-age award surface
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: uk-milton-keynes/manual/council-tax-reduction-scheme-2026-2027/page-63
              excerpt: "the amount of the reduction to which he is entitled is as follows"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          simulated_milton_keynes_council_tax_reduction_annual_amount
