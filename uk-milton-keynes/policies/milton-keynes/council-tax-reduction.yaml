format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: uk-milton-keynes/manual/council-tax-reduction-scheme-2026-2027/page-63
    # upstream_source_check:
    #   status: delegated_scheme
    #   checked_paths: [uk/statutes/ukpga/1992/14/13A, uk/regulations/uksi/2012/2885, uk/regulations/uksi/2012/2886]
    #   rationale: Section 13A delegates design of the working-age scheme to Milton Keynes City Council, so the Council's adopted scheme document is the operative source for its local values and award calculation.
  summary: |-
    Upstream-source status: delegated_scheme. Checked paths: uk/statutes/ukpga/1992/14/13A,
    uk/regulations/uksi/2012/2885, and uk/regulations/uksi/2012/2886. Section 13A
    delegates the working-age scheme to Milton Keynes, so its adopted document is
    operative. Milton Keynes's operative 2026-27 working-age scheme is a taper scheme. Ordinary
    working-age applicants receive at most 80 percent of eligible liability, while
    locally defined protected persons receive at most 100 percent. Excess weekly
    income is withdrawn at 2 6/7 percent per day (20 percent per week), after
    working-age non-dependant deductions, and capital above £6,000 excludes the
    applicant. The working-age scheme has no tariff-income rule: £6,000 is an
    immediate eligibility cliff. No minimum-award floor or council-tax band cap is
    stated. The separate pension-age prescribed scheme is outside this module.
  deferred_outputs:
    - output: uk-milton-keynes:policies/milton-keynes/council-tax-reduction/schedule-w2#applicable_amount
      reason: Schedule W2's category-specific personal allowances and premiums are outside this award-surface module; the calculated applicable amount is consumed as an input.
    - output: uk-milton-keynes:policies/milton-keynes/council-tax-reduction/paragraph-w3a#protected_person
      reason: The health, war-pension, and care-leaver evidence tests defining protected persons are outside this award-surface module; protected status is consumed as an input.
rules:
  - name: milton_keynes_council_tax_reduction_standard_maximum_support_rate
    kind: parameter
    dtype: Rate
    source: Milton Keynes Council Tax Reduction Scheme 2026/27 paragraph W26(1)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: uk-milton-keynes/manual/council-tax-reduction-scheme-2026-2027/page-58
              excerpt: "80 per cent of the amount A/B"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          0.80

  - name: milton_keynes_council_tax_reduction_protected_maximum_support_rate
    kind: parameter
    dtype: Rate
    source: Milton Keynes Council Tax Reduction Scheme 2026/27 paragraph W26A(1)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: uk-milton-keynes/manual/council-tax-reduction-scheme-2026-2027/page-59
              excerpt: "100 per cent of the amount A/B"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          1

