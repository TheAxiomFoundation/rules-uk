module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: uk-newcastle-upon-tyne/manual/council-tax-reduction-scheme-2026-2027/page-118
    # upstream_source_check:
    # status: delegated_scheme
    # checked_paths: [uk/statutes/ukpga/1992/14/13A, uk/regulations/uksi/2012/2885, uk/regulations/uksi/2012/2886]
    # rationale: LGFA 1992 section 13A delegates the working-age scheme to Newcastle City Council, so the authority's adopted scheme is the operative source for its local values and award calculation.
  summary: |-
    Newcastle's operative 2026/27 working-age scheme is a five-band weekly-income discount grid. The statutory maximum is 100 percent of eligible liability, with the selected grid rate composed onto that maximum because Schedule 3 makes the discount depend on the section 29A maximum. Capital above £6,000 is a cliff. The award is nil below £1 per week, and there are no working-age non-dependant deductions. The source prints no working-age excess-income taper or tariff-income step; the pensioner-only taper is outside this module. Care leavers meeting Class E receive 100 percent, while Class F terminal/SR1 cases receive 100 percent only after ordinary entitlement. Pension-age provisions are out of scope.
  deferred_outputs:
    - output: uk-newcastle-upon-tyne:policies/newcastle-upon-tyne/council-tax-reduction/sections-33-to-72#assessed_weekly_income
      reason: The detailed earnings, self-employment, disregards, and other income-assessment rules supplying weekly income are outside this award-surface module.
    - output: uk-newcastle-upon-tyne:policies/newcastle-upon-tyne/council-tax-reduction/sections-33-to-72#assessed_capital
      reason: Capital valuation, attribution, instalment treatment, and disregard rules are outside this award-surface module; this module applies the printed £6,000 cliff to assessed capital.
    - output: uk-newcastle-upon-tyne:policies/newcastle-upon-tyne/council-tax-reduction/paragraph-29A#annual_eligible_liability_after_statutory_discounts_and_apportionment
      reason: Charge determination, statutory discounts, joint-liability apportionment, and the annualisation of paragraph 29A's daily maximum are outside this award-surface module.
    - output: uk-newcastle-upon-tyne:policies/newcastle-upon-tyne/council-tax-reduction/section-6#family_category_classifier
      reason: This module consumes tested family-category facts for the Schedule 3 columns; the full section 6 family definition is deferred.
    - output: uk-newcastle-upon-tyne:policies/newcastle-upon-tyne/council-tax-reduction/class-e#care_leaver_evidence_classifier
      reason: This module applies Class E's printed age, care-duration, birthday-span, and residence conditions to supplied facts; evidencing those facts is deferred.
    - output: uk-newcastle-upon-tyne:policies/newcastle-upon-tyne/council-tax-reduction/class-f#terminal_illness_and_sr1_evidence_classifier
      reason: This module applies Class F to supplied terminal-diagnosis and recognised-clinician SR1 facts; clinical evidence classification is deferred.
    - output: uk-newcastle-upon-tyne:policies/newcastle-upon-tyne/council-tax-reduction/class-c#alternative_maximum_council_tax_reduction
      reason: The separate pension-age alternative maximum reduction is outside this working-age award module.
