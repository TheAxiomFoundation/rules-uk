    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: uk-newcastle-upon-tyne/manual/council-tax-reduction-scheme-2026-2027/page-22
              excerpt: "is a person who is under 25 years old;"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          25

  - name: newcastle_upon_tyne_council_tax_reduction_care_leaver_minimum_care_weeks
    kind: parameter
