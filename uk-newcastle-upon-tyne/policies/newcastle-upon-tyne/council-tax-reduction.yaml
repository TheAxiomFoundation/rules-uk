        formula: |-
          1

  - name: newcastle_upon_tyne_council_tax_reduction_working_age_scheme_applies
    kind: derived
    entity: Household
    dtype: Judgment
    period: Year
    source: Newcastle City Council Council Tax Reduction Scheme 2026/27 paragraph 26.0(1)
    metadata:
      proof:
        atoms:
          - path: versions[0].effective_from
            kind: effective_period
            source:
              corpus_citation_path: uk-newcastle-upon-tyne/manual/council-tax-reduction-scheme-2026-2027/page-7
              excerpt: "The following has been adopted by the City Council and details the Council Tax Reduction scheme adopted by the authority for the financial year 2026/27."
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: uk-newcastle-upon-tyne/manual/council-tax-reduction-scheme-2026-2027/page-34
              excerpt: "The authority’s Council Tax Reduction scheme from 2026/27 shall be calculated on a Banded Discount Scheme as defined within Schedule 3."
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          local_authority_is_newcastle_upon_tyne and council_tax_reduction_household_in_england and would_claim_council_tax_reduction and newcastle_upon_tyne_council_tax_reduction_applicant_is_working_age

  - name: newcastle_upon_tyne_council_tax_reduction_passported
    kind: derived
    entity: Household
    dtype: Judgment
    period: Week
    source: Newcastle City Council Council Tax Reduction Scheme 2026/27 Schedule 3 paragraph 3
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: uk-newcastle-upon-tyne/manual/council-tax-reduction-scheme-2026-2027/page-118
              excerpt: "A ‘passported’ case is defined under this scheme is any applicant who is in receipt of any of the following: a. Income Support; b. Income Based Job Seekers Allowance; or c. Income Related Employment and Support Allowance."
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          newcastle_upon_tyne_council_tax_reduction_receives_income_support or newcastle_upon_tyne_council_tax_reduction_receives_income_based_jsa or newcastle_upon_tyne_council_tax_reduction_receives_income_related_esa

  - name: newcastle_upon_tyne_council_tax_reduction_family_category
    kind: derived
    entity: Household
    dtype: Integer
    period: Week
    source: Newcastle City Council Council Tax Reduction Scheme 2026/27 Schedule 3 paragraphs 1 and 6
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter_table
            source:
              corpus_citation_path: uk-newcastle-upon-tyne/manual/council-tax-reduction-scheme-2026-2027/page-118
              excerpt: "Support Level Passported Single Couple Family with One Child Family with Two+ Children"
              table:
                header: Council Tax Reduction Banded Discount Scheme
                row_key: household family
                column_key: family category
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          if newcastle_upon_tyne_council_tax_reduction_has_two_or_more_children: 3 else: if newcastle_upon_tyne_council_tax_reduction_has_one_or_more_children: 2 else: if newcastle_upon_tyne_council_tax_reduction_applicant_has_partner: 1 else: 0

  - name: newcastle_upon_tyne_council_tax_reduction_capital_eligible
    kind: derived
    entity: Household
    dtype: Judgment
    period: Year
    source: Newcastle City Council Council Tax Reduction Scheme 2026/27 Schedule 3 paragraph 7
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: uk-newcastle-upon-tyne/manual/council-tax-reduction-scheme-2026-2027/page-118
              excerpt: "Any applicant whose capital is greater than £6,000 shall not be entitled to any Council Tax Reductions whatsoever."
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          newcastle_upon_tyne_council_tax_reduction_assessed_capital_for_year <= newcastle_upon_tyne_council_tax_reduction_capital_limit

  - name: newcastle_upon_tyne_council_tax_reduction_income_within_banded_grid
    kind: derived
    entity: Household
    dtype: Judgment
    period: Week
    source: Newcastle City Council Council Tax Reduction Scheme 2026/27 Class D paragraph 16.0(1)(e) and Schedule 3
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: uk-newcastle-upon-tyne/manual/council-tax-reduction-scheme-2026-2027/page-22
              excerpt: "whose income (if any) for the relevant week 2 is within any income band3 prescribed by the Council within this scheme"
          - path: versions[0].formula
            kind: parameter_table
            source:
              corpus_citation_path: uk-newcastle-upon-tyne/manual/council-tax-reduction-scheme-2026-2027/page-118
              excerpt: |-
                Band 5 - 25%

                £330.01 £425.00 £380.01 £485.00 £465.01 £570.00 £515.01 £630.00
              table:
                header: Council Tax Reduction Banded Discount Scheme
                row_key: family category
                column_key: Band 5 upper weekly income
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          newcastle_upon_tyne_council_tax_reduction_passported or newcastle_upon_tyne_council_tax_reduction_assessed_weekly_income <= newcastle_upon_tyne_council_tax_reduction_band_5_upper_income_weekly_by_family[newcastle_upon_tyne_council_tax_reduction_family_category]

  - name: newcastle_upon_tyne_council_tax_reduction_income_band
    kind: derived
    entity: Household
    dtype: Integer
    period: Week
    source: Newcastle City Council Council Tax Reduction Scheme 2026/27 Schedule 3 paragraph 1
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: uk-newcastle-upon-tyne/manual/council-tax-reduction-scheme-2026-2027/page-118
              excerpt: "Discount bands vary depending on both weekly income and the household"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          if newcastle_upon_tyne_council_tax_reduction_passported: 1 else: if newcastle_upon_tyne_council_tax_reduction_assessed_weekly_income <= newcastle_upon_tyne_council_tax_reduction_band_1_upper_income_weekly_by_family[newcastle_upon_tyne_council_tax_reduction_family_category]: 1 else: if newcastle_upon_tyne_council_tax_reduction_assessed_weekly_income <= newcastle_upon_tyne_council_tax_reduction_band_2_upper_income_weekly_by_family[newcastle_upon_tyne_council_tax_reduction_family_category]: 2 else: if newcastle_upon_tyne_council_tax_reduction_assessed_weekly_income <= newcastle_upon_tyne_council_tax_reduction_band_3_upper_income_weekly_by_family[newcastle_upon_tyne_council_tax_reduction_family_category]: 3 else: if newcastle_upon_tyne_council_tax_reduction_assessed_weekly_income <= newcastle_upon_tyne_council_tax_reduction_band_4_upper_income_weekly_by_family[newcastle_upon_tyne_council_tax_reduction_family_category]: 4 else: if newcastle_upon_tyne_council_tax_reduction_assessed_weekly_income <= newcastle_upon_tyne_council_tax_reduction_band_5_upper_income_weekly_by_family[newcastle_upon_tyne_council_tax_reduction_family_category]: 5 else: 0

  - name: newcastle_upon_tyne_council_tax_reduction_ordinary_award_entitlement
    kind: derived
    entity: Household
    dtype: Judgment
    period: Year
    source: Newcastle City Council Council Tax Reduction Scheme 2026/27 Class D paragraph 16.0(1)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: uk-newcastle-upon-tyne/manual/council-tax-reduction-scheme-2026-2027/page-22
              excerpt: "On any day class D consists of any person who is not a pensioner:"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          newcastle_upon_tyne_council_tax_reduction_working_age_scheme_applies and newcastle_upon_tyne_council_tax_reduction_capital_eligible and newcastle_upon_tyne_council_tax_reduction_income_within_banded_grid

  - name: newcastle_upon_tyne_council_tax_reduction_care_leaver_age_condition
    kind: derived
    entity: Household
    dtype: Judgment
    period: Year
    source: Newcastle City Council Council Tax Reduction Scheme 2026/27 Class E paragraph 17.0(1)(a)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: uk-newcastle-upon-tyne/manual/council-tax-reduction-scheme-2026-2027/page-22
              excerpt: "is a person who is under 25 years old;"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          newcastle_upon_tyne_council_tax_reduction_applicant_age < newcastle_upon_tyne_council_tax_reduction_care_leaver_age_limit

  - name: newcastle_upon_tyne_council_tax_reduction_care_leaver_care_duration_condition
    kind: derived
    entity: Household
    dtype: Judgment
    period: Year
    source: Newcastle City Council Council Tax Reduction Scheme 2026/27 Class E paragraph 17.0(1)(b)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: uk-newcastle-upon-tyne/manual/council-tax-reduction-scheme-2026-2027/page-22
              excerpt: "who has been in the care of a Local Authority for a period of 13 weeks or more spanning their 16th birthday;"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          newcastle_upon_tyne_council_tax_reduction_care_leaver_weeks_in_local_authority_care >= newcastle_upon_tyne_council_tax_reduction_care_leaver_minimum_care_weeks

  - name: newcastle_upon_tyne_council_tax_reduction_care_leaver_criteria_met
    kind: derived
    entity: Household
    dtype: Judgment
    period: Year
    source: Newcastle City Council Council Tax Reduction Scheme 2026/27 Class E paragraph 17.0(1)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: uk-newcastle-upon-tyne/manual/council-tax-reduction-scheme-2026-2027/page-22
              excerpt: "For the purposes of this class, a care Leaver: (a) is a person who is under 25 years old; and (b) who has been in the care of a Local Authority for a period of 13 weeks or more spanning their 16th birthday; and (c) is resident within the City of Newcastle area."
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          newcastle_upon_tyne_council_tax_reduction_care_leaver_age_condition and newcastle_upon_tyne_council_tax_reduction_care_leaver_care_duration_condition and newcastle_upon_tyne_council_tax_reduction_care_leaver_care_spans_sixteenth_birthday and newcastle_upon_tyne_council_tax_reduction_care_leaver_is_newcastle_resident

  - name: newcastle_upon_tyne_council_tax_reduction_care_leaver_full_award_applies
    kind: derived
    entity: Household
    dtype: Judgment
    period: Year
    source: Newcastle City Council Council Tax Reduction Scheme 2026/27 Class E paragraph 17.0(2)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: exception
            source:
              corpus_citation_path: uk-newcastle-upon-tyne/manual/council-tax-reduction-scheme-2026-2027/page-22
              excerpt: "Where the applicant is a care leaver and meets the criteria in (1) above, a reduction of 100% shall be awarded."
    versions:
