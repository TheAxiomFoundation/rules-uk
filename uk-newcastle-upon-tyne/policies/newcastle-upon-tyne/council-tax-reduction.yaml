        atoms:
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: uk-newcastle-upon-tyne/manual/council-tax-reduction-scheme-2026-2027/page-22
              excerpt: "who has been in the care of a Local Authority for a period of 13 weeks or more spanning their 16th birthday;"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          13

  - name: newcastle_upon_tyne_council_tax_reduction_care_leaver_full_award_rate
    kind: parameter
    dtype: Rate
    source: Newcastle City Council Council Tax Reduction Scheme 2026/27 Class E paragraph 17.0(2)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: uk-newcastle-upon-tyne/manual/council-tax-reduction-scheme-2026-2027/page-22
              excerpt: "Where the applicant is a care leaver and meets the criteria in (1) above, a reduction of 100% shall be awarded."
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          1

  - name: newcastle_upon_tyne_council_tax_reduction_terminal_sr1_full_award_rate
    kind: parameter
