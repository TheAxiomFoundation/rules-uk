format: rulespec/v1
rules:
  - name: newcastle_upon_tyne_council_tax_reduction_maximum_support_rate
    kind: parameter
    dtype: Rate
    source: Newcastle City Council Council Tax Reduction Scheme 2026/27 paragraph 29A.0(1)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: uk-newcastle-upon-tyne/manual/council-tax-reduction-scheme-2026-2027/page-36
              excerpt: "a person's maximum council tax reduction amount in respect of a day is 100 per cent of the amount A/B where:"
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: uk-newcastle-upon-tyne/manual/council-tax-reduction-scheme-2026-2027/page-118
              excerpt: "The amount of discount to be granted is to be based on the following factors: a. The maximum Council Tax Reduction as defined within Section 29A of this scheme; b. The Council Tax family as defined within Section 6 of this scheme; and c. The income and capital of the applicant as defined within Sections 33 - 72 of this scheme."
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          1

  - name: newcastle_upon_tyne_council_tax_reduction_support_rate_by_income_band
    kind: parameter
    dtype: Rate
    indexed_by: newcastle_upon_tyne_council_tax_reduction_income_band
    source: Newcastle City Council Council Tax Reduction Scheme 2026/27 Schedule 3 paragraph 1
    metadata:
      proof:
        atoms:
          - path: versions[0].values
            kind: parameter_table
            source:
              corpus_citation_path: uk-newcastle-upon-tyne/manual/council-tax-reduction-scheme-2026-2027/page-118
              excerpt: |-
                Support Level Passported Single Couple Family with One Child Family with Two+ Children Band 1 - 100% Relevant Benefit £0.00 £110.00 £0.00 £160.00 £0.00 £255.00 £0.00 £350.00 Band 2 - 90%

                £110.01 £160.00 £160.01 £220.00 £255.01 £305.00 £350.01 £370.00 Band 3 - 85%

                £160.01 £215.00 £220.01 £275.00 £305.01 £380.00 £370.01 £425.00 Band 4 - 50%

                £215.01 £330.00 £275.01 £380.00 £380.01 £465.00 £425.01 £515.00 Band 5 - 25%

                £330.01 £425.00 £380.01 £485.00 £465.01 £570.00 £515.01 £630.00
              table:
                header: Council Tax Reduction Banded Discount Scheme
                row_key: Support Level
                column_key: percentage discount
    versions:
      - effective_from: '2026-04-01'
        values: {0: 0, 1: 1, 2: 0.90, 3: 0.85, 4: 0.50, 5: 0.25}

