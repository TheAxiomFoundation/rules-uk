  - name: newcastle_upon_tyne_council_tax_reduction_capital_limit
    kind: parameter
    dtype: Money
    period: Year
    unit: GBP
    source: Newcastle City Council Council Tax Reduction Scheme 2026/27 Schedule 3 paragraph 7
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: uk-newcastle-upon-tyne/manual/council-tax-reduction-scheme-2026-2027/page-118
              excerpt: "Any applicant whose capital is greater than £6,000 shall not be entitled to any Council Tax Reductions whatsoever."
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          6000

  - name: newcastle_upon_tyne_council_tax_reduction_minimum_award_weekly
    kind: parameter
    dtype: Money
    period: Week
    unit: GBP
    source: Newcastle City Council Council Tax Reduction Scheme 2026/27 paragraph 29B.0(1)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: uk-newcastle-upon-tyne/manual/council-tax-reduction-scheme-2026-2027/page-37
              excerpt: "Where any reduction under this scheme is calculated at an amount of less than £1.00 per week, no reduction shall be paid to the applicant whatsoever."
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          1

  - name: newcastle_upon_tyne_council_tax_reduction_weeks_per_year
    kind: parameter
    dtype: Number
    source: Newcastle City Council Council Tax Reduction Scheme 2026/27 paragraph 50.0(1)(b)(i)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: uk-newcastle-upon-tyne/manual/council-tax-reduction-scheme-2026-2027/page-56
              excerpt: "by multiplying the amount of the payment by 12 and dividing the product by 52"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          52

  - name: newcastle_upon_tyne_council_tax_reduction_no_non_dependant_deduction_band
