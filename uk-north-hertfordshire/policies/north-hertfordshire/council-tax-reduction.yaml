format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: uk-north-hertfordshire/manual/council-tax-reduction-scheme-2026-2027/page-60
    # upstream_source_check:
    #   status: delegated_scheme
    #   checked_paths:
    #     - uk/statutes/ukpga/1992/14/13A
    #     - uk/regulations/uksi/2012/2885
    #     - uk/regulations/uksi/2012/2886
    #   rationale: Section 13A delegates the working-age scheme to North Hertfordshire, so the authority's adopted scheme document is operative for its locally set award rules.
  summary: |-
    North Hertfordshire's operative 2026-27 working-age calculation is a banded discount scheme, not the pension-age excess-income taper printed in the composite document. The local award applies the family-specific 100, 75, 45, 25, or zero percent band to a 100 percent maximum liability amount, caps the family grid at three dependant children, passports specified income-related benefit recipients to Band 1, and imposes a capital cliff above £16,000. The working-age scheme has no tariff-income rule, non-dependant deduction schedule, or minimum-award floor.
  deferred_outputs:
    - output: uk-north-hertfordshire:policies/north-hertfordshire/council-tax-reduction/sections-11-to-34-and-schedules-2-to-3#assessed_weekly_income_and_capital
      reason: The award surface consumes weekly applicant-and-partner income and assessed capital after the scheme's detailed income, disregard, attribution, valuation, and notional-resource rules, which are outside this module.
    - output: uk-north-hertfordshire:policies/north-hertfordshire/council-tax-reduction/section-48#eligible_annual_liability
      reason: The award surface consumes council-tax liability after statutory discounts and joint-liability adjustments; valuation of that liability base is outside this module.
