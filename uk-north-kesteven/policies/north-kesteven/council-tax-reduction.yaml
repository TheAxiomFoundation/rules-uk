              corpus_citation_path: uk-north-kesteven/manual/council-tax-reduction-scheme-2026-2027/page-23
              excerpt: "difference between his income for the relevant week and his applicable amount"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          max(0, north_kesteven_council_tax_reduction_assessed_income_for_year + north_kesteven_council_tax_reduction_tariff_income_for_year - north_kesteven_council_tax_reduction_applicable_amount_for_year)

