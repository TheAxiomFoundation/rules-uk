  - name: north_kesteven_council_tax_reduction_tariff_income_for_year
    kind: derived
    entity: Household
    dtype: Money
    period: Year
    unit: GBP
    source: North Kesteven Council Tax Support Scheme 2026/27 paragraph 72
    metadata:
