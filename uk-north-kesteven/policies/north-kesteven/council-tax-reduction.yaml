format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: uk-north-kesteven/manual/council-tax-reduction-scheme-2026-2027/page-41
    # upstream_source_check:
    #   status: delegated_scheme
    #   checked_paths: [uk/statutes/ukpga/1992/14/13A, uk/regulations/uksi/2012/2885, uk/regulations/uksi/2012/2886]
    #   rationale: LGFA 1992 section 13A delegates the working-age scheme to North Kesteven District Council, so the Council's adopted scheme document is the operative source for its local values and award calculation. The pinned singular source-verification contract strips this attestation after local gates pass.
  summary: |-
    Upstream-source status: delegated_scheme. LGFA 1992 section 13A delegates the working-age scheme to North Kesteven District Council, so its adopted document is operative. Checked paths: uk/statutes/ukpga/1992/14/13A, uk/regulations/uksi/2012/2885, and uk/regulations/uksi/2012/2886. The 2026/27 working-age scheme caps ordinary support at 90 percent of liability and at Band D, while protected applicants avoid that restriction. Care leavers under 26 receive a 100 percent single-occupant or 75 percent shared-occupation maximum. Excess income is withdrawn at 2 6/7 percent daily (20 percent weekly), non-dependant deductions are subtracted, and ordinary awards below £3.50 weekly are suppressed. Capital limits are £8,000 ordinarily and £16,000 for vulnerable applicants, with tariff income above £6,000 in £250 steps. Pension-age and second-adult-rebate provisions are outside this module.
  deferred_outputs:
    - output: uk-north-kesteven:policies/north-kesteven/council-tax-reduction/schedule-3#applicable_amount
      reason: The personal allowances, family premium, premiums, components, and transitional additions used to calculate the applicable amount are outside this award-surface module.
    - output: uk-north-kesteven:policies/north-kesteven/council-tax-reduction/part-10#assessed_income_and_capital
      reason: Detailed income disregards, attribution, and capital valuation are outside this award-surface module.
    - output: uk-north-kesteven:policies/north-kesteven/council-tax-reduction/schedule-4#alternative_maximum_council_tax_reduction
      reason: The separate second-adult alternative maximum reduction is outside this working-age main-award surface.
    - output: uk-north-kesteven:policies/north-kesteven/council-tax-reduction/paragraph-29.7#protected_category
      reason: This module consumes protected-category status; the detailed category classifier is a future self-scoped output.
