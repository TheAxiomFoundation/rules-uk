        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: uk-north-kesteven/manual/council-tax-reduction-scheme-2026-2027/page-81
              excerpt: "a deduction of £1 for every £250, from £6000.00 to £7999.99"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          if north_kesteven_council_tax_reduction_assessed_capital_for_year <= north_kesteven_council_tax_reduction_tariff_income_threshold: 0 else: ceil((north_kesteven_council_tax_reduction_assessed_capital_for_year - north_kesteven_council_tax_reduction_tariff_income_threshold) / north_kesteven_council_tax_reduction_tariff_income_step) * north_kesteven_council_tax_reduction_tariff_income_weekly_per_step * north_kesteven_council_tax_reduction_weeks_per_year

  - name: north_kesteven_council_tax_reduction_excess_income_for_year
    kind: derived
    entity: Household
    dtype: Money
    period: Year
    unit: GBP
    source: North Kesteven Council Tax Support Scheme 2026/27 paragraph 17(f)
    metadata:
