            kind: parameter_table
            source: &nondep_source
              corpus_citation_path: uk-north-kesteven/manual/council-tax-reduction-scheme-2026-2027/page-37
              excerpt: &nondep_excerpt "Pensioners and vulnerable: (1) Subject to the following provisions of this paragraph, the non-dependant deductions in respect of a day referred to in paragraph 29 are-- (a) in respect of a non-dependant aged 18 or over in remunerative work, £15.95 (subject to amendment) x 1/7; (b) in respect of a non-dependant aged 18 or over to whom paragraph (a) does not apply, £5.20 (subject to amendment) x 1/7.\n\n(2) In the case of a non-dependant aged 18 or over to whom sub-paragraph (1)(a) applies, where it is shown to the appropriate authority that his normal gross weekly income is-- (a) less than £279.00 (subject to amendment), the deduction to be made under this paragraph is that specified in sub- paragraph (1)(b); (b) not less than £279.00 (subject to amendment) but less than £485.00 (subject to amendment), the deduction to be made under this paragraph is £10.60 (subject to amendment); (c) not less than £485.00 (subject to amendment) but less than £605.00 (subject to amendment), the deduction to be made under this paragraph is £13.30 (subject to amendment).\n\nPersons who are not pensions or do not fall within the vulnerable scheme: (2A) (a) in respect of a non-dependant aged 18 or over in remunerative work, £20.00;\n\n(b) in respect of a non-dependant aged 18 or over to whom paragraph (a) does not apply, £5.00.\n\n(2B) In the case of a non-dependant aged 18 or over to whom sub-paragraph (1)(a) applies, where it is shown to the appropriate authority that his normal gross weekly income is-- (a)less than £189.00 (subject to amendment), the deduction to be made under this paragraph is £5.00 (subject to amendment); (b)not less than £189.00 (subject to amendment) but less than £327.99 (subject to amendment), the deduction to be made under this paragraph is £10.00 (subject to amendment); (c)not less than £328.00 (subject to amendment) but less than £407.99 (subject to amendment), the deduction to be made under this paragraph is £15.00 (subject to amendment). (d)not less than £408.00 (subject to amendment), the deduction to be made under this paragraph is £20.00 (subject to amendment)."
              table: &nondep_table
                header: Working-age ordinary and vulnerable non-dependant weekly income bands and deductions
                row_key: scheme and income band
                column_key: threshold and weekly deduction
    versions:
      - effective_from: '2026-04-01'
        values:
          0: 0
          1: 1
          2: 2
          3: 3

