  - name: north_lincolnshire_council_tax_reduction_family_category
    kind: derived
    entity: Household
    dtype: Number
    period: Year
    source: North Lincolnshire Council Tax Reduction Scheme 2026/27 Schedule 1
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter_table
            source:
              <<: *grid_source
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          if north_lincolnshire_council_tax_reduction_is_protected_group: north_lincolnshire_council_tax_reduction_family_category_codes[4] else: if north_lincolnshire_council_tax_reduction_has_two_dependants: north_lincolnshire_council_tax_reduction_family_category_codes[3] else: if north_lincolnshire_council_tax_reduction_has_one_dependant: north_lincolnshire_council_tax_reduction_family_category_codes[2] else: if north_lincolnshire_council_tax_reduction_has_partner: north_lincolnshire_council_tax_reduction_family_category_codes[1] else: north_lincolnshire_council_tax_reduction_family_category_codes[0]

  - name: north_lincolnshire_council_tax_reduction_income_band
    kind: derived
    entity: Household
    dtype: Number
    period: Week
    source: North Lincolnshire Council Tax Reduction Scheme 2026/27 Schedule 1
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter_table
            source:
              <<: *grid_source
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          if north_lincolnshire_council_tax_reduction_assessed_weekly_net_income >= north_lincolnshire_council_tax_reduction_band_5_lower_income_by_family[north_lincolnshire_council_tax_reduction_family_category]: north_lincolnshire_council_tax_reduction_income_band_codes[4] else: if north_lincolnshire_council_tax_reduction_assessed_weekly_net_income >= north_lincolnshire_council_tax_reduction_band_4_lower_income_by_family[north_lincolnshire_council_tax_reduction_family_category]: north_lincolnshire_council_tax_reduction_income_band_codes[3] else: if north_lincolnshire_council_tax_reduction_assessed_weekly_net_income >= north_lincolnshire_council_tax_reduction_band_3_lower_income_by_family[north_lincolnshire_council_tax_reduction_family_category]: north_lincolnshire_council_tax_reduction_income_band_codes[2] else: if north_lincolnshire_council_tax_reduction_assessed_weekly_net_income >= north_lincolnshire_council_tax_reduction_band_2_lower_income_by_family[north_lincolnshire_council_tax_reduction_family_category]: north_lincolnshire_council_tax_reduction_income_band_codes[1] else: north_lincolnshire_council_tax_reduction_income_band_codes[0]

  - name: north_lincolnshire_council_tax_reduction_passported
    kind: derived
    entity: Household
    dtype: Judgment
    period: Year
    source: North Lincolnshire Council Tax Reduction Scheme 2026/27 Schedule 1 paragraph 7
    metadata:
