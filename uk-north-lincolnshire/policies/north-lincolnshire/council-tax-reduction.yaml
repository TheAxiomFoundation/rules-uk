            kind: condition
            source:
              corpus_citation_path: uk-north-lincolnshire/manual/council-tax-reduction-scheme-2026-2027/page-61
              excerpt: "Income Support, Income Related Employment and Support Allowance or Income Based Jobseeker’s Allowance"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          north_lincolnshire_council_tax_reduction_receives_income_support
          or north_lincolnshire_council_tax_reduction_receives_income_related_esa
          or north_lincolnshire_council_tax_reduction_receives_income_based_jsa

  - name: north_lincolnshire_council_tax_reduction_selected_discount_rate
    kind: derived
    entity: Household
    dtype: Rate
    period: Year
    source: North Lincolnshire Council Tax Reduction Scheme 2026/27 Schedule 1
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter_table
            source:
              <<: *grid_source
          - path: versions[0].formula
            kind: exception
            source:
              corpus_citation_path: uk-north-lincolnshire/manual/council-tax-reduction-scheme-2026-2027/page-61
              excerpt: "discount will be awarded at Band 1 level."
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          if north_lincolnshire_council_tax_reduction_passported: north_lincolnshire_council_tax_reduction_passported_discount_rate_by_family[north_lincolnshire_council_tax_reduction_family_category] else: if north_lincolnshire_council_tax_reduction_is_protected_group: north_lincolnshire_council_tax_reduction_protected_discount_rate_by_band[north_lincolnshire_council_tax_reduction_income_band] else: north_lincolnshire_council_tax_reduction_ordinary_discount_rate_by_band[north_lincolnshire_council_tax_reduction_income_band]

  - name: north_lincolnshire_council_tax_reduction_selected_maximum_support_rate
    kind: derived
    entity: Household
    dtype: Rate
    period: Year
    source: North Lincolnshire Council Tax Reduction Scheme 2026/27 paragraph 48
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: exception
            source:
              corpus_citation_path: uk-north-lincolnshire/manual/council-tax-reduction-scheme-2026-2027/page-44
              excerpt: "Where the applicant, but for this scheme, would be entitled to a Disability Premium, a Severe Disability Premium or an Enhanced Disability Premium the amount specified in 48.1 shall be 77 per cent."
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          if north_lincolnshire_council_tax_reduction_is_protected_group: north_lincolnshire_council_tax_reduction_protected_maximum_support_rate else: north_lincolnshire_council_tax_reduction_ordinary_maximum_support_rate

  - name: north_lincolnshire_council_tax_reduction_capital_eligible
    kind: derived
    entity: Household
    dtype: Judgment
    period: Year
    source: North Lincolnshire Council Tax Reduction Scheme 2026/27 paragraph 26.1
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: uk-north-lincolnshire/manual/council-tax-reduction-scheme-2026-2027/page-33
              excerpt: "no reduction shall be granted when the applicant has an amount of £6,000 or greater."
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          north_lincolnshire_council_tax_reduction_assessed_capital < north_lincolnshire_council_tax_reduction_capital_limit

  - name: north_lincolnshire_council_tax_reduction_maximum_amount_for_year
    kind: derived
    entity: Household
    dtype: Money
    period: Year
    unit: GBP
    source: North Lincolnshire Council Tax Reduction Scheme 2026/27 paragraph 48.1
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: uk-north-lincolnshire/manual/council-tax-reduction-scheme-2026-2027/page-44
              excerpt: "the amount of a person’s maximum Council Tax Reduction in respect of a day for which he is liable to pay council tax, shall be 50 per cent, of the amount A divided by B"
          - path: versions[0].formula
            kind: exception
            source:
              corpus_citation_path: uk-north-lincolnshire/manual/council-tax-reduction-scheme-2026-2027/page-44
              excerpt: "the amount specified in 48.1 shall be 77 per cent."
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          north_lincolnshire_council_tax_reduction_band_b_capped_eligible_liability_for_year * north_lincolnshire_council_tax_reduction_selected_maximum_support_rate

  - name: north_lincolnshire_council_tax_reduction_amount_before_eligibility
    kind: derived
    entity: Household
    dtype: Money
    period: Year
    unit: GBP
    source: North Lincolnshire Council Tax Reduction Scheme 2026/27 Schedule 1 paragraph 2
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: uk-north-lincolnshire/manual/council-tax-reduction-scheme-2026-2027/page-61
              excerpt: "In all cases (Table 1), the amount of reduction to be granted is to be based on the following factors: (a) The maximum Council Tax Reduction as defined within this scheme;"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          min(north_lincolnshire_council_tax_reduction_maximum_amount_for_year, north_lincolnshire_council_tax_reduction_band_b_capped_eligible_liability_for_year * north_lincolnshire_council_tax_reduction_selected_discount_rate)

  - name: north_lincolnshire_council_tax_reduction_award_conditions_met
    kind: derived
    entity: Household
    dtype: Judgment
    period: Year
    source: North Lincolnshire Council Tax Reduction Scheme 2026/27 working-age award
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: uk-north-lincolnshire/manual/council-tax-reduction-scheme-2026-2027/page-61
              excerpt: "Any applicant whose capital is £6,000 or above shall not be entitled to any Council Tax Reduction whatsoever."
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          local_authority_is_north_lincolnshire
          and north_lincolnshire_council_tax_reduction_applicant_is_working_age
          and would_claim_council_tax_reduction
          and north_lincolnshire_council_tax_reduction_capital_eligible

  - name: simulated_north_lincolnshire_council_tax_reduction_annual_amount
    kind: derived
    entity: Household
    dtype: Money
    period: Year
    unit: GBP
    source: North Lincolnshire Council Tax Reduction Scheme 2026/27 Schedule 1
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: uk-north-lincolnshire/manual/council-tax-reduction-scheme-2026-2027/page-61
              excerpt: "The authority’s Council Tax Reduction Scheme from 2026/27 shall be calculated on the basis of the following banded support scheme:"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          if north_lincolnshire_council_tax_reduction_award_conditions_met: north_lincolnshire_council_tax_reduction_amount_before_eligibility else: 0

  - name: north_lincolnshire_council_tax_reduction_annual_amount
    kind: derived
    entity: Household
    dtype: Money
    period: Year
    unit: GBP
    source: North Lincolnshire Council Tax Reduction Scheme 2026/27 operative working-age award
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: effective_period
            source:
              corpus_citation_path: uk-north-lincolnshire/manual/council-tax-reduction-scheme-2026-2027/page-4
              excerpt: "effective from 1st April 2026 for a period of one financial year."
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          simulated_north_lincolnshire_council_tax_reduction_annual_amount

