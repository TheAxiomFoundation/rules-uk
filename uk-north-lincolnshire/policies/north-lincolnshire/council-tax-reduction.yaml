format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: uk-north-lincolnshire/manual/council-tax-reduction-scheme-2026-2027/page-61
  summary: |-
    Upstream-source status: delegated_scheme. LGFA 1992 section 13A delegates the working-age scheme to North Lincolnshire Council, so the Council's adopted scheme document is operative. Checked paths: uk/statutes/ukpga/1992/14/13A, uk/regulations/uksi/2012/2885, and uk/regulations/uksi/2012/2886. North Lincolnshire's operative 2026-27 working-age calculation is a banded discount scheme, not the pension-age excess-income taper printed on page 6. Ordinary applicants are capped at 50 percent of Band-B-or-lower eligible liability and the protected group at 77 percent. The five family-specific income bands award 50, 40, 20, 10, or zero percent; protected-group bands award 77, 60, 40, 20, or zero percent. Capital of £6,000 or more is an immediate eligibility cliff. The working-age text has no tariff-income rule and expressly provides no non-dependant deductions.
  deferred_outputs:
    - output: uk-north-lincolnshire:policies/north-lincolnshire/council-tax-reduction/sections-11-to-46-and-schedules-2-to-4#assessed_weekly_net_income
      reason: The award surface consumes weekly net income after the scheme's detailed income, disregard, attribution, and valuation rules, which are outside this module.
    - output: uk-north-lincolnshire:policies/north-lincolnshire/council-tax-reduction/section-48.1#band_b_capped_eligible_liability_for_year
      reason: The award surface consumes liability already limited to the lower of actual discounted liability and Band B and adjusted for joint liability; calculation of that council-tax base is outside this module.
    - output: uk-north-lincolnshire:policies/north-lincolnshire/council-tax-reduction/section-48.6#protected_group_status
      reason: This module encodes the protected maximum and protected income grid, while the counterfactual disability-premium eligibility classifier remains a future self-scoped output.
