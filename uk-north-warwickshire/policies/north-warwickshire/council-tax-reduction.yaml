format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: uk-north-warwickshire/manual/council-tax-reduction-scheme-2026-2027/page-77
  summary: |-
    North Warwickshire's adopted 2026-27 working-age scheme applies a 91.5 percent maximum to eligible liability, then deducts the printed 20 percent excess-income taper and non-dependant deductions from that maximum. Capital above £16,000 excludes entitlement; capital above £6,000 produces £1 weekly tariff income for each £250 or part thereof. No protected working-age maximum, minimum-award floor, or council-tax-band cap is printed in the award provisions. Pension-age provisions are outside this module.
  deferred_outputs:
    - output: uk-north-warwickshire:policies/north-warwickshire/council-tax-reduction/section-12-and-schedule-1#applicable_amount
      reason: The working-age personal allowances and premium schedules used to determine applicable amounts are outside this award-surface module.
rules:
  - name: north_warwickshire_council_tax_reduction_maximum_support_rate
    kind: parameter
    dtype: Rate
    source: North Warwickshire Council Tax Reduction Scheme 2026/27 paragraph 57.1
    metadata: {proof: {atoms: [{path: "versions[0].formula", kind: amount, source: {corpus_citation_path: uk-north-warwickshire/manual/council-tax-reduction-scheme-2026-2027/page-75, excerpt: "shall be 91.5 per cent, of the amount A/B where;"}}]}}
    versions: [{effective_from: '2026-04-01', formula: "0.915"}]

  - name: north_warwickshire_council_tax_reduction_capital_limit
    kind: parameter
    dtype: Money
    period: Year
    unit: GBP
    source: North Warwickshire Council Tax Reduction Scheme 2026/27 paragraph 33.1
    metadata: {proof: {atoms: [{path: "versions[0].formula", kind: amount, source: {corpus_citation_path: uk-north-warwickshire/manual/council-tax-reduction-scheme-2026-2027/page-57, excerpt: "the prescribed amount is £16,000."}}]}}
    versions: [{effective_from: '2026-04-01', formula: "16000"}]

  - name: north_warwickshire_council_tax_reduction_tariff_income_threshold
    kind: parameter
    dtype: Money
    period: Year
    unit: GBP
    source: North Warwickshire Council Tax Reduction Scheme 2026/27 paragraph 42.1
    metadata: {proof: {atoms: [{path: "versions[0].formula", kind: amount, source: {corpus_citation_path: uk-north-warwickshire/manual/council-tax-reduction-scheme-2026-2027/page-62, excerpt: "capital calculated in accordance with this policy exceeds £6,000 it shall be treated as equivalent to a weekly income of £1"}}]}}
    versions: [{effective_from: '2026-04-01', formula: "6000"}]

  - name: north_warwickshire_council_tax_reduction_tariff_income_step
    kind: parameter
    dtype: Money
    period: Year
    unit: GBP
    source: North Warwickshire Council Tax Reduction Scheme 2026/27 paragraph 42.1
    metadata: {proof: {atoms: [{path: "versions[0].formula", kind: amount, source: {corpus_citation_path: uk-north-warwickshire/manual/council-tax-reduction-scheme-2026-2027/page-62, excerpt: "weekly income of £1 for each complete £250 of in excess of £6,000 but not exceeding £16,000."}}]}}
    versions: [{effective_from: '2026-04-01', formula: "250"}]

  - name: north_warwickshire_council_tax_reduction_tariff_income_weekly_amount_per_step
    kind: parameter
    dtype: Money
    period: Week
    unit: GBP
    source: North Warwickshire Council Tax Reduction Scheme 2026/27 paragraphs 42.1-42.2
    metadata: {proof: {atoms: [{path: "versions[0].formula", kind: amount, source: {corpus_citation_path: uk-north-warwickshire/manual/council-tax-reduction-scheme-2026-2027/page-62, excerpt: "shall be treated as equivalent to a weekly income of £1 for each complete £250"}}]}}
    versions: [{effective_from: '2026-04-01', formula: "1"}]

  - name: north_warwickshire_council_tax_reduction_days_per_week
    kind: parameter
    dtype: Number
    source: North Warwickshire Council Tax Reduction Scheme 2026/27 paragraph 58.1
    metadata: {proof: {atoms: [{path: "versions[0].formula", kind: amount, source: {corpus_citation_path: uk-north-warwickshire/manual/council-tax-reduction-scheme-2026-2027/page-75, excerpt: "(a) in respect of a non-dependant aged 18 or over in remunerative work, £15.95 x 1/7;"}}]}}
    versions: [{effective_from: '2026-04-01', formula: "7"}]

  - name: north_warwickshire_council_tax_reduction_weeks_per_year
    kind: parameter
    dtype: Number
    source: North Warwickshire Council Tax Reduction Scheme 2026/27 paragraph 23.1(b)(i)
    metadata: {proof: {atoms: [{path: "versions[0].formula", kind: condition, source: {corpus_citation_path: uk-north-warwickshire/manual/council-tax-reduction-scheme-2026-2027/page-45, excerpt: "by multiplying the amount of the payment by 12 and dividing the product by 52;"}}]}}
    versions: [{effective_from: '2026-04-01', formula: "52"}]

  - name: north_warwickshire_council_tax_reduction_daily_taper_rate
    kind: parameter
    dtype: Rate
    source: North Warwickshire Council Tax Reduction Scheme 2026/27 paragraph 59.1
    metadata: {proof: {atoms: [{path: "versions[0].formula", kind: amount, source: {corpus_citation_path: uk-north-warwickshire/manual/council-tax-reduction-scheme-2026-2027/page-77, excerpt: "shall be 2 6/7 per cent."}}]}}
    versions: [{effective_from: '2026-04-01', formula: "0.02857142857142857142857142857"}]

  - name: north_warwickshire_council_tax_reduction_withdrawal_rate
    kind: parameter
    dtype: Rate
    source: North Warwickshire Council Tax Reduction Scheme 2026/27 paragraph 59.1
    metadata: {proof: {atoms: [{path: "versions[0].formula", kind: formula, source: {corpus_citation_path: uk-north-warwickshire/manual/council-tax-reduction-scheme-2026-2027/page-77, excerpt: "The prescribed daily percentage for the purpose of calculating reduction as a percentage of excess of income over the applicable amount, which is deducted from maximum council tax reduction, shall be 2 6/7 per cent."}}]}}
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          north_warwickshire_council_tax_reduction_daily_taper_rate * north_warwickshire_council_tax_reduction_days_per_week

  - name: north_warwickshire_council_tax_reduction_non_dependant_weekly_deduction_by_band
    kind: parameter
    dtype: Money
    period: Week
    unit: GBP
    indexed_by: north_warwickshire_council_tax_reduction_non_dependant_deduction_band
    source: North Warwickshire Council Tax Reduction Scheme 2026/27 paragraphs 58.1-58.2
    metadata:
      proof:
        atoms:
          - path: "versions[0].values"
            kind: parameter_table
            source:
              corpus_citation_path: uk-north-warwickshire/manual/council-tax-reduction-scheme-2026-2027/page-75
              excerpt: "58.1 Subject to the following provisions of this paragraph, the non-dependant deductions in respect of a day referred to in section 29 (maximum council tax reduction) shall be; (a) in respect of a non-dependant aged 18 or over in remunerative work, £15.95 x 1/7; (b) in respect of a non-dependant aged 18 or over to whom sub-paragraph (a) does not apply, £5.20 x 1/7.\n\n58.2 In the case of a non-dependant aged 18 or over, where it is shown to the appropriate authority that his normal gross weekly income is– (a) less than £279.00, the deduction to be made under this paragraph shall be that specified in paragraph 58.1(b); (b) not less than £279.00, but less than £485.00, the deduction to be made under this section shall be £10.60 x1/7; (c) not less than £485.00, but less than £605.00, the deduction to be made under this section shall be £13.30 x 1/7;"
              table: {header: Non-dependant deductions and gross weekly income bands, row_key: deduction band, column_key: weekly deduction}
          - path: "versions[0].values"
            kind: condition
            source:
              corpus_citation_path: uk-north-warwickshire/manual/council-tax-reduction-scheme-2026-2027/page-76
              excerpt: "58.6 No deduction shall be made in respect of any non-dependants occupying an applicant’s dwelling if the applicant or his partner is–"
    versions:
      - effective_from: '2026-04-01'
        values: {0: 0, 1: 5.20, 2: 10.60, 3: 13.30, 4: 15.95}

  - name: north_warwickshire_council_tax_reduction_low_band_threshold
    kind: parameter
    dtype: Money
    period: Week
    unit: GBP
    source: North Warwickshire Council Tax Reduction Scheme 2026/27 paragraph 58.2
    metadata: {proof: {atoms: [{path: "versions[0].formula", kind: amount, source: {corpus_citation_path: uk-north-warwickshire/manual/council-tax-reduction-scheme-2026-2027/page-75, excerpt: "(a) less than £279.00, the deduction to be made under this paragraph shall be that specified in paragraph 58.1(b);"}}]}}
    versions: [{effective_from: '2026-04-01', formula: "279"}]

  - name: north_warwickshire_council_tax_reduction_middle_band_threshold
    kind: parameter
    dtype: Money
    period: Week
    unit: GBP
    source: North Warwickshire Council Tax Reduction Scheme 2026/27 paragraph 58.2
    metadata: {proof: {atoms: [{path: "versions[0].formula", kind: amount, source: {corpus_citation_path: uk-north-warwickshire/manual/council-tax-reduction-scheme-2026-2027/page-75, excerpt: "(b) not less than £279.00, but less than £485.00, the deduction to be made under this section shall be £10.60 x1/7;"}}]}}
    versions: [{effective_from: '2026-04-01', formula: "485"}]

  - name: north_warwickshire_council_tax_reduction_top_band_threshold
    kind: parameter
    dtype: Money
    period: Week
    unit: GBP
    source: North Warwickshire Council Tax Reduction Scheme 2026/27 paragraph 58.2
    metadata: {proof: {atoms: [{path: "versions[0].formula", kind: amount, source: {corpus_citation_path: uk-north-warwickshire/manual/council-tax-reduction-scheme-2026-2027/page-75, excerpt: "(c) not less than £485.00, but less than £605.00, the deduction to be made under this section shall be £13.30 x 1/7;"}}]}}
    versions: [{effective_from: '2026-04-01', formula: "605"}]

  - name: north_warwickshire_council_tax_reduction_remunerative_work_hours
    kind: parameter
    dtype: Number
    source: North Warwickshire Council Tax Reduction Scheme 2026/27 paragraph 6.1
    metadata: {proof: {atoms: [{path: "versions[0].formula", kind: amount, source: {corpus_citation_path: uk-north-warwickshire/manual/council-tax-reduction-scheme-2026-2027/page-21, excerpt: "for not less than 16 hours a week, in work for which payment is made or which is done in expectation of payment."}}]}}
    versions: [{effective_from: '2026-04-01', formula: "16"}]

  - name: north_warwickshire_council_tax_reduction_working_age_scheme_applies
    kind: derived
    entity: Household
    dtype: Judgment
    period: Year
    source: North Warwickshire Council Tax Reduction Scheme 2026/27 paragraph 1.6
    metadata: {proof: {atoms: [{path: "versions[0].formula", kind: condition, source: {corpus_citation_path: uk-north-warwickshire/manual/council-tax-reduction-scheme-2026-2027/page-8, excerpt: "working age and therefore this scheme only applies to a person who; a. has not attained the qualifying age for state pension credit;"}}]}}
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          local_authority_is_north_warwickshire and council_tax_reduction_household_in_england and not council_tax_reduction_household_has_pensioner

  - name: north_warwickshire_council_tax_reduction_capital_eligible
    kind: derived
    entity: Household
    dtype: Judgment
    period: Year
    source: North Warwickshire Council Tax Reduction Scheme 2026/27 paragraph 33.1
    metadata: {proof: {atoms: [{path: "versions[0].formula", kind: condition, source: {corpus_citation_path: uk-north-warwickshire/manual/council-tax-reduction-scheme-2026-2027/page-57, excerpt: "33.1 For the purposes of section 134(1) of the Act as it applies to council tax reduction (no entitlement to reduction if capital exceeds prescribed amount), the prescribed amount is £16,000."}}]}}
    versions: [{effective_from: '2026-04-01', formula: "north_warwickshire_council_tax_reduction_assessed_capital_for_year <= north_warwickshire_council_tax_reduction_capital_limit"}]

  - name: north_warwickshire_council_tax_reduction_tariff_income_for_year
    kind: derived
    entity: Household
    dtype: Money
    period: Year
    unit: GBP
    source: North Warwickshire Council Tax Reduction Scheme 2026/27 paragraphs 42.1-42.2
    metadata: {proof: {atoms: [{path: "versions[0].formula", kind: formula, source: {corpus_citation_path: uk-north-warwickshire/manual/council-tax-reduction-scheme-2026-2027/page-62, excerpt: "42.2 Notwithstanding paragraph 42.1 where any part of the excess is not a complete £250 that part shall be treated as equivalent to a weekly tariff income of £1."}}]}}
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          north_warwickshire_council_tax_reduction_tariff_income_weekly_amount_per_step * ceil(max(0, north_warwickshire_council_tax_reduction_assessed_capital_for_year - north_warwickshire_council_tax_reduction_tariff_income_threshold) / north_warwickshire_council_tax_reduction_tariff_income_step) * north_warwickshire_council_tax_reduction_weeks_per_year

  - name: north_warwickshire_council_tax_reduction_excess_income_for_year
    kind: derived
    entity: Household
    dtype: Money
    period: Year
    unit: GBP
    source: North Warwickshire Council Tax Reduction Scheme 2026/27 paragraph 59.1
    metadata: {proof: {atoms: [{path: "versions[0].formula", kind: formula, source: {corpus_citation_path: uk-north-warwickshire/manual/council-tax-reduction-scheme-2026-2027/page-77, excerpt: "shall be 2 6/7 per cent. Where a claimant’s income exceeds their applicable amount, their council tax reduction shall be calculated by deducting their excess income"}}]}}
    versions: [{effective_from: '2026-04-01', formula: "max(0, north_warwickshire_council_tax_reduction_applicable_income_for_year + north_warwickshire_council_tax_reduction_tariff_income_for_year - north_warwickshire_council_tax_reduction_applicable_amount_for_year)"}]

  - name: north_warwickshire_council_tax_reduction_income_taper_deduction_for_year
    kind: derived
    entity: Household
    dtype: Money
    period: Year
    unit: GBP
    source: North Warwickshire Council Tax Reduction Scheme 2026/27 paragraph 59.1
    metadata: {proof: {atoms: [{path: "versions[0].formula", kind: formula, source: {corpus_citation_path: uk-north-warwickshire/manual/council-tax-reduction-scheme-2026-2027/page-77, excerpt: "The prescribed daily percentage for the purpose of calculating reduction as a percentage of excess of income over the applicable amount, which is deducted from maximum council tax reduction, shall be 2 6/7 per cent. Where a claimant’s income exceeds their applicable amount, their council tax reduction shall be calculated by deducting their excess income multiplied by the taper from their maximum council tax reduction as defined within section 57 of this policy."}}]}}
    versions: [{effective_from: '2026-04-01', formula: "north_warwickshire_council_tax_reduction_excess_income_for_year * north_warwickshire_council_tax_reduction_withdrawal_rate"}]

  - name: north_warwickshire_council_tax_reduction_non_dependant_in_remunerative_work
    kind: derived
    entity: Person
    dtype: Judgment
    period: Year
    source: North Warwickshire Council Tax Reduction Scheme 2026/27 paragraph 6.1
    metadata: {proof: {atoms: [{path: "versions[0].formula", kind: condition, source: {corpus_citation_path: uk-north-warwickshire/manual/council-tax-reduction-scheme-2026-2027/page-21, excerpt: "for not less than 16 hours a week, in work for which payment is made or which is done in expectation of payment."}}]}}
    versions: [{effective_from: '2026-04-01', formula: "north_warwickshire_council_tax_reduction_non_dependant_weekly_hours >= north_warwickshire_council_tax_reduction_remunerative_work_hours"}]

  - name: north_warwickshire_council_tax_reduction_non_dependant_deduction_band
    kind: derived
    entity: Person
    dtype: Integer
    period: Week
    source: North Warwickshire Council Tax Reduction Scheme 2026/27 paragraphs 58.1-58.8
    metadata:
      proof:
        atoms:
          - path: "versions[0].formula"
            kind: parameter_table
            source:
              corpus_citation_path: uk-north-warwickshire/manual/council-tax-reduction-scheme-2026-2027/page-75
              excerpt: "58.1 Subject to the following provisions of this paragraph, the non-dependant deductions in respect of a day referred to in section 29 (maximum council tax reduction) shall be; (a) in respect of a non-dependant aged 18 or over in remunerative work, £15.95 x 1/7; (b) in respect of a non-dependant aged 18 or over to whom sub-paragraph (a) does not apply, £5.20 x 1/7.\n\n58.2 In the case of a non-dependant aged 18 or over, where it is shown to the appropriate authority that his normal gross weekly income is– (a) less than £279.00, the deduction to be made under this paragraph shall be that specified in paragraph 58.1(b); (b) not less than £279.00, but less than £485.00, the deduction to be made under this section shall be £10.60 x1/7; (c) not less than £485.00, but less than £605.00, the deduction to be made under this section shall be £13.30 x 1/7;"
              table: {header: Normal gross weekly income and deduction band, row_key: gross weekly income, column_key: deduction band}
          - path: "versions[0].formula"
            kind: condition
            source:
              corpus_citation_path: uk-north-warwickshire/manual/council-tax-reduction-scheme-2026-2027/page-76
              excerpt: "58.6 No deduction shall be made in respect of any non-dependants occupying an applicant’s dwelling if the applicant or his partner is–"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          if not north_warwickshire_council_tax_reduction_is_non_dependant or north_warwickshire_council_tax_reduction_non_dependant_exempt: 0 else: if not north_warwickshire_council_tax_reduction_non_dependant_in_remunerative_work: 1 else: if north_warwickshire_council_tax_reduction_non_dependant_normal_gross_weekly_income >= north_warwickshire_council_tax_reduction_top_band_threshold: 4 else: if north_warwickshire_council_tax_reduction_non_dependant_normal_gross_weekly_income >= north_warwickshire_council_tax_reduction_middle_band_threshold: 3 else: if north_warwickshire_council_tax_reduction_non_dependant_normal_gross_weekly_income >= north_warwickshire_council_tax_reduction_low_band_threshold: 2 else: 1

  - name: north_warwickshire_council_tax_reduction_individual_non_dependant_deduction_for_year
    kind: derived
    entity: Person
    dtype: Money
    period: Year
    unit: GBP
    source: North Warwickshire Council Tax Reduction Scheme 2026/27 paragraphs 58.1-58.8
    metadata: {proof: {atoms: [{path: "versions[0].formula", kind: formula, source: {corpus_citation_path: uk-north-warwickshire/manual/council-tax-reduction-scheme-2026-2027/page-75, excerpt: "58.1 Subject to the following provisions of this paragraph, the non-dependant deductions in respect of a day referred to in section 29 (maximum council tax reduction) shall be; (a) in respect of a non-dependant aged 18 or over in remunerative work, £15.95 x 1/7; (b) in respect of a non-dependant aged 18 or over to whom sub-paragraph (a) does not apply, £5.20 x 1/7."}}]}}
    versions: [{effective_from: '2026-04-01', formula: "north_warwickshire_council_tax_reduction_non_dependant_weekly_deduction_by_band[north_warwickshire_council_tax_reduction_non_dependant_deduction_band] * north_warwickshire_council_tax_reduction_weeks_per_year"}]

  - name: simulated_north_warwickshire_council_tax_reduction_annual_amount
    kind: derived
    entity: Household
    dtype: Money
    period: Year
    unit: GBP
    source: North Warwickshire Council Tax Reduction Scheme 2026/27 paragraphs 57.1 and 59.1
    metadata: {proof: {atoms: [{path: "versions[0].formula", kind: formula, source: {corpus_citation_path: uk-north-warwickshire/manual/council-tax-reduction-scheme-2026-2027/page-75, excerpt: "shall be 91.5 per cent, of the amount A/B where; (a) A is the amount set by the appropriate authority as the council tax for the relevant financial year in respect of the dwelling in which he is a resident and for which he is liable, subject to any discount which may be appropriate to that dwelling under the 1992 Act; and (b) B is the number of days in that financial year,\n\nless any deductions in respect of non-dependants which fall to be made under section 58 (non-dependant deductions)."}}, {path: "versions[0].formula", kind: formula, source: {corpus_citation_path: uk-north-warwickshire/manual/council-tax-reduction-scheme-2026-2027/page-77, excerpt: "59.1 The prescribed daily percentage for the purpose of calculating reduction as a percentage of excess of income over the applicable amount, which is deducted from maximum council tax reduction, shall be 2 6/7 per cent. Where a claimant’s income exceeds their applicable amount, their council tax reduction shall be calculated by deducting their excess income multiplied by the taper from their maximum council tax reduction as defined within section 57 of this policy."}}]}}
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          if north_warwickshire_council_tax_reduction_working_age_scheme_applies and would_claim_council_tax_reduction and north_warwickshire_council_tax_reduction_capital_eligible: max(0, north_warwickshire_council_tax_reduction_maximum_eligible_liability_for_year * north_warwickshire_council_tax_reduction_maximum_support_rate - north_warwickshire_council_tax_reduction_income_taper_deduction_for_year - north_warwickshire_council_tax_reduction_non_dependant_deductions_for_year) else: 0

  - name: north_warwickshire_council_tax_reduction_annual_amount
    kind: derived
    entity: Household
    dtype: Money
    period: Year
    unit: GBP
    source: North Warwickshire Council Tax Reduction Scheme 2026/27 operative year
    metadata: {proof: {atoms: [{path: "versions[0].formula", kind: condition, source: {corpus_citation_path: uk-north-warwickshire/manual/council-tax-reduction-scheme-2026-2027/page-5, excerpt: "is effective from 1st April 2026 for a period of one financial year."}}]}}
    versions: [{effective_from: '2026-04-01', formula: "simulated_north_warwickshire_council_tax_reduction_annual_amount"}]
