format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: uk-north-yorkshire/manual/council-tax-reduction-scheme-2026-2027/page-59
  summary: |-
    Section 13A of the Local Government Finance Act 1992 delegates working-age Council Tax Reduction scheme design to North Yorkshire Council, so the Council's adopted 2026-2027 scheme document is the operative source for these local rules. The statutory delegation and national prescribed/default schemes were checked at uk/statutes/ukpga/1992/14/13A, uk/regulations/uksi/2012/2885, and uk/regulations/uksi/2012/2886. North Yorkshire's operative working-age calculation is a banded discount scheme, not the pension-age taper printed earlier in the composite document. The local award uses a 100 percent maximum, family-specific weekly income bands of 100, 75, 50, or 25 percent, a capital cliff at £6,000, specified passported benefits, and a £40 disability-premium income disregard. The working-age text contains no tariff-income rule or non-dependant deduction.
  deferred_outputs:
    - output: uk-north-yorkshire:policies/north-yorkshire/council-tax-reduction/sections-11-to-25-and-schedule-2#assessed_weekly_income_before_disability_premium_disregard
      reason: The award surface consumes assessed weekly applicant-and-partner income after the scheme's earnings calculations and general income disregards. Those underlying income-definition schedules are outside this module.
    - output: uk-north-yorkshire:policies/north-yorkshire/council-tax-reduction/schedule-2/paragraph-72#qualifies_for_disability_premium_income_disregard
      reason: Paragraph 72 preserves a £40 disregard where counterfactual disability-premium entitlement exists. This module encodes the amount and its effect, while the premium-entitlement classifier remains a future self-scoped output.
    - output: uk-north-yorkshire:policies/north-yorkshire/council-tax-reduction/sections-27-to-34-and-schedule-3#assessed_capital
      reason: The award surface applies the local £6,000 cliff to assessed capital. The scheme's valuation, attribution, notional-capital, and capital-disregard schedules are outside this module.
