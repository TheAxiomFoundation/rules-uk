    kind: parameter
    dtype: Rate
    period: Year
    source: Northumberland Council Tax Reduction Scheme 2026/27 paragraph 48.1
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter
            source:
              corpus_citation_path: uk-northumberland/manual/council-tax-reduction-scheme-2026-2027/page-45
              excerpt: "shall be 100 per cent, of the amount A divided by B"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          1.00

