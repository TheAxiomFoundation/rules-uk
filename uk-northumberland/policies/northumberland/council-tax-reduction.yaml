format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: uk-northumberland/manual/council-tax-reduction-scheme-2026-2027/page-61
  summary: |-
    Northumberland's adopted working-age Council Tax Reduction scheme is effective from
    1 April 2026 and uses six weekly-income discount bands across four family
    categories. LGFA 1992 section 13A and Schedule 1A delegate working-age
    scheme design to Northumberland, making this adopted scheme operative. The
    2 6/7 per cent taper printed for pensioner Class B is outside this
    working-age module.
  deferred_outputs:
    - output: uk-northumberland:policies/northumberland/council-tax-reduction/sections-11-to-25-and-schedules-2-and-4#assessed_weekly_income
      reason: Detailed income calculation and disregard schedules are outside this award surface.
    - output: uk-northumberland:policies/northumberland/council-tax-reduction/sections-27-to-34-and-schedule-3#assessed_capital
      reason: Detailed capital valuation and disregard schedules are outside this award surface.
rules:
