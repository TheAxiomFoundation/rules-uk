format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: uk-nuneaton-and-bedworth/manual/council-tax-reduction-scheme-2026-2027/page-75
    # upstream_source_check:
    #   status: delegated_scheme
    #   checked_paths: [uk/statutes/ukpga/1992/14/13A, uk/regulations/uksi/2012/2885, uk/regulations/uksi/2012/2886]
    #   rationale: LGFA 1992 section 13A delegates the working-age scheme to Nuneaton and Bedworth Borough Council, so the adopted document is operative. The apply-stage encoder strips this attestation to the singular source-verification contract after local gates pass.
  summary: |-
    Nuneaton and Bedworth's operative 2026-27 working-age local scheme sets the maximum at 85 percent of eligible council-tax liability. Class E deducts the printed 2 6/7 percent daily taper from that defined maximum. Capital above £16,000 ends entitlement; capital above £6,000 produces tariff income. The module includes the four printed non-dependant outcomes and the stated protections through a supplied exemption classifier. No minimum award or banded award cap is printed.
  deferred_outputs:
    - output: uk-nuneaton-and-bedworth:policies/nuneaton-and-bedworth/council-tax-reduction/sections-12-to-32-and-schedules-1-to-4#applicable_amount_and_assessed_income
      reason: The award surface consumes applicable amount and assessed income; the detailed premium, income, disregard, childcare, self-employment, and Universal Credit assessment schedules are outside this module.
    - output: uk-nuneaton-and-bedworth:policies/nuneaton-and-bedworth/council-tax-reduction/sections-34-to-41-and-schedule-5#assessed_capital
      reason: This module applies the local capital limit and tariff rule; capital valuation, attribution, notional-capital, and disregard rules are outside this module.
    - output: uk-nuneaton-and-bedworth:policies/nuneaton-and-bedworth/council-tax-reduction/paragraphs-57.2-to-57.4#maximum_eligible_liability
      reason: This module consumes eligible liability after statutory reductions, discounts, and joint-liability apportionment.
    - output: uk-nuneaton-and-bedworth:policies/nuneaton-and-bedworth/council-tax-reduction/paragraphs-58.3-to-58.9#non_dependant_exemption_and_apportionment
      reason: This module encodes the printed deduction grid and consumes the protection or exemption classifier; couple, disability, benefit, student, absence, armed-forces, and apportionment conditions are outside this module.
    - output: uk-nuneaton-and-bedworth:policies/nuneaton-and-bedworth/council-tax-reduction/class-c#alternative_maximum_council_tax_reduction
      reason: The separate pension-age alternative maximum reduction is outside this working-age award surface.
