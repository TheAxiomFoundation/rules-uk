          if plymouth_council_tax_reduction_passported_to_band_1: plymouth_council_tax_reduction_band_1 else: if plymouth_council_tax_reduction_applicant_or_partner_is_war_pensioner: (if plymouth_council_tax_reduction_weekly_income >= plymouth_council_tax_reduction_war_pensioner_zero_award_income_weekly: plymouth_council_tax_reduction_band_5 else: plymouth_council_tax_reduction_band_1) else: if plymouth_council_tax_reduction_weekly_income >= plymouth_council_tax_reduction_band_5_lower_income_by_family[plymouth_council_tax_reduction_family_category]: plymouth_council_tax_reduction_band_5 else: if plymouth_council_tax_reduction_weekly_income >= plymouth_council_tax_reduction_band_4_lower_income_by_family[plymouth_council_tax_reduction_family_category]: plymouth_council_tax_reduction_band_4 else: if plymouth_council_tax_reduction_weekly_income >= plymouth_council_tax_reduction_band_3_lower_income_by_family[plymouth_council_tax_reduction_family_category]: plymouth_council_tax_reduction_band_3 else: if plymouth_council_tax_reduction_weekly_income >= plymouth_council_tax_reduction_band_2_lower_income_by_family[plymouth_council_tax_reduction_family_category]: plymouth_council_tax_reduction_band_2 else: plymouth_council_tax_reduction_band_1

