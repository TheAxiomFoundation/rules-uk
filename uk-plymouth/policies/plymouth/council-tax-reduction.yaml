            source:
              corpus_citation_path: uk-plymouth/manual/council-tax-reduction-scheme-2026-2027/page-104
              excerpt: "The amount of discount to be granted is to be based on the following factors: a. The maximum Council Tax Reduction as defined within this scheme;"
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: uk-plymouth/manual/council-tax-reduction-scheme-2026-2027/page-104
              excerpt: "Any applicant whose capital is greater than £6,000 shall not be entitled to any Council Tax Reductions whatsoever."
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: uk-plymouth/manual/council-tax-reduction-scheme-2026-2027/page-70
              excerpt: "A standard deduction of £5.20 x1/7 shall be applied for non-dependant for each day that the non-dependant resides in the premises."
