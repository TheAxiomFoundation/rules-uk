format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: uk-plymouth/manual/council-tax-reduction-scheme-2026-2027/page-104
    # upstream_source_check:
    #   status: delegated_scheme
    #   checked_paths: [uk/statutes/ukpga/1992/14/13A, uk/regulations/uksi/2012/2885, uk/regulations/uksi/2012/2886]
    #   rationale: Section 13A delegates the working-age scheme to this authority, so Plymouth's adopted document is operative. The pinned singular source-verification contract rejects and strips this attestation as a live field.
  summary: |-
    Plymouth's operative working-age scheme is effective from 1 April 2026 for one financial year. Schedule 1 replaces the pension-age taper text with a five-band discount surface: 80%, 60%, 40%, 20%, and 0%, selected by weekly income and family category. Paragraph 57 sets a 100% liability maximum capped at Band E; the band discount is based directly on that maximum. Capital above £6,000 produces no award. The working-age award has no tariff-income rule or excess-income taper. A flat £5.20 weekly non-dependant deduction applies unless a printed protection or exemption applies.
  deferred_outputs:
    - output: uk-plymouth:policies/plymouth/council-tax-reduction/sections-12-to-30-and-schedules-2-to-3#assessed_weekly_income
      reason: The award surface consumes weekly income calculated under the scheme; the detailed earnings, self-employment, minimum-income-floor, and income-disregard schedules are outside this module.
    - output: uk-plymouth:policies/plymouth/council-tax-reduction/sections-31-to-40-and-schedule-4#assessed_capital
      reason: The award surface applies the local capital cliff; valuation, attribution, notional-capital, and capital-disregard rules are outside this module.
    - output: uk-plymouth:policies/plymouth/council-tax-reduction/paragraph-57.1#a_or_band_e_capped_annual_liability
      reason: The award surface consumes eligible liability already capped at the lower of actual liability and Band E; dwelling-band charge lookup and joint-liability apportionment are outside this module.
    - output: uk-plymouth:policies/plymouth/council-tax-reduction/paragraphs-58.4-to-58.6#non_dependant_exemption_classifier
      reason: This module encodes the flat deduction and consumes the printed protection/exemption result; the detailed disability, student, benefit, absence, and armed-forces classifier is deferred.
    - output: uk-plymouth:policies/plymouth/council-tax-reduction/class-c#alternative_maximum_council_tax_reduction
      reason: The separate pension-age second-adult alternative maximum reduction is outside this working-age award surface.
