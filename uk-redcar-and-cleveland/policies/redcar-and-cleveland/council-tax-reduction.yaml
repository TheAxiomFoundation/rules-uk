format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: uk-redcar-and-cleveland/manual/council-tax-reduction-scheme-2026-2027/page-19
  summary: |-
    Redcar and Cleveland's operative 2026-27 working-age award covers 82.5 percent of eligible Council Tax liability. Non-dependant deductions reduce that maximum before a 20 percent weekly excess-income taper. Countable capital must be below £16,000; capital above £6,000 otherwise creates £1 weekly tariff income for every £250 or part. The deferred assessed-capital boundary applies the scheme's disregard classifiers before this award surface. The printed non-dependant rows overlap at exactly £485.00, so this alignment uses the necessary non-overlapping convention: £279.00 inclusive to £485.00 exclusive, then £485.00 inclusive to £605.00 exclusive. No minimum-award floor or valuation-band cap is printed. Pension-age provisions are outside this local working-age module.
  deferred_outputs:
    - output: uk-redcar-and-cleveland:policies/redcar-and-cleveland/council-tax-reduction/paragraphs-6-1-and-8-1-to-8-51#applicable_amount_and_assessed_income_weekly
      reason: The award surface consumes the scheme's applicable amount and assessed weekly income; the personal allowances, premiums, Universal Credit treatment, earnings, disregards, childcare, and other income-assessment rules are outside this module.
    - output: uk-redcar-and-cleveland:policies/redcar-and-cleveland/council-tax-reduction/paragraphs-8-52-to-8-62#assessed_capital
      reason: This module applies the local capital cliff and tariff formula, while capital valuation, attribution, notional-capital, and the detailed capital-disregard classifiers remain outside the award surface.
    - output: uk-redcar-and-cleveland:policies/redcar-and-cleveland/council-tax-reduction/paragraphs-9-3-to-9-4#eligible_liability_weekly
      reason: The award surface consumes weekly eligible liability already derived from the daily A/B calculation, discounts, and joint-liability apportionment; the source does not print a weekly-to-daily conversion constant for this module to invent.
    - output: uk-redcar-and-cleveland:policies/redcar-and-cleveland/council-tax-reduction/paragraphs-9-10-to-9-13#household_non_dependant_deductions_weekly
      reason: This module encodes each printed deduction band but consumes the household total after the one-deduction-per-couple, joint-liability apportionment, exemption, and unknown-income classifiers.
    - output: uk-redcar-and-cleveland:policies/redcar-and-cleveland/council-tax-reduction/paragraph-9-12#non_dependant_deduction_applies
      reason: The source's blindness, disability-benefit, residence, training, student, inpatient, benefit, Universal Credit, and age exemptions are represented by a source-classified input rather than inferred from unrelated facts.
    - output: uk-redcar-and-cleveland:policies/redcar-and-cleveland/council-tax-reduction/paragraphs-1-3-and-5-14#applicant_is_in_working_age_local_scheme
      reason: The working-age classifier includes the source's mixed-age-couple treatment and is consumed as an input so a pensioner non-dependant cannot incorrectly remove a working-age household from the local scheme.
rules:
  - name: redcar_and_cleveland_council_tax_reduction_maximum_support_rate
    kind: parameter
    dtype: Rate
    source: Redcar and Cleveland Borough Council Council Tax Support Scheme 2026-27 paragraphs 2.2 and 9.3
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: uk-redcar-and-cleveland/manual/council-tax-reduction-scheme-2026-2027/page-19
              excerpt: "9.3 The amount of Council Tax Support will be calculated as (A) divided by (B) and multiplied by 82.5% where:"
          - path: versions[0].formula
            kind: effective_period
            source:
              corpus_citation_path: uk-redcar-and-cleveland/manual/council-tax-reduction-scheme-2026-2027/page-2
              excerpt: "This means that Council Tax Support will be worked out on 82.5% of a working aged resident’s Council Tax liability for the 2026/27 financial year."
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          0.825

  - name: redcar_and_cleveland_council_tax_reduction_weekly_taper_rate
    kind: parameter
