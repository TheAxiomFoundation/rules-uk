  - name: ribble_valley_council_tax_reduction_non_dependant_first_income_cutoff
    kind: parameter
    dtype: Money
    period: Week
    unit: GBP
    source: Ribble Valley Council Tax Reduction Scheme 2026/27 paragraph 58.2
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: uk-ribble-valley/manual/council-tax-reduction-scheme-2026-2027/page-73
              excerpt: "less than £279.00"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          279

