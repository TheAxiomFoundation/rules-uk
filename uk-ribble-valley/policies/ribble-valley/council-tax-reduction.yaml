        formula: |-
          0.02857142857142857142857142857

  - name: ribble_valley_council_tax_reduction_weekly_taper_rate
    kind: parameter
    dtype: Rate
    source: Ribble Valley Council Tax Reduction Scheme 2026/27 daily rate converted by the printed seven-day denominator
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: uk-ribble-valley/manual/council-tax-reduction-scheme-2026-2027/page-75
              excerpt: "shall be 2 6/7 per cent"
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: uk-ribble-valley/manual/council-tax-reduction-scheme-2026-2027/page-73
              excerpt: "£15.95 x 1/7"
    versions:
