format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: uk-ribble-valley/manual/council-tax-reduction-scheme-2026-2027/page-75
    # upstream_source_check:
    #   status: delegated_scheme
    #   checked_paths: [uk/statutes/ukpga/1992/14/13A, uk/regulations/uksi/2012/2885, uk/regulations/uksi/2012/2886]
    #   rationale: Section 13A delegates the working-age scheme to this authority, so Ribble Valley's adopted document is operative. The pinned singular source-verification contract rejects and strips this attestation as a live field.
  summary: |-
    Upstream-source status: delegated_scheme. Checked paths: uk/statutes/ukpga/1992/14/13A,
    uk/regulations/uksi/2012/2885, and uk/regulations/uksi/2012/2886. Section 13A
    delegates the working-age scheme to Ribble Valley, so its adopted document is
    operative. The scheme applies from 1 April 2026 through 31 March 2027. Its
    working-age maximum is 100 percent of eligible liability, with no lower cap or
    separate protected-class rate. Excess income is withdrawn at 2 6/7 percent per
    day, exactly 20 percent per week. Capital above £16,000 excludes the applicant;
    capital above £6,000 produces £1 weekly tariff income for each complete £250 or
    part thereof. Non-dependant deductions are £5.20, £10.60, £13.30, or £15.95 per
    week. No minimum-award floor or council-tax band cap is printed. Pension-age
    provisions and separate second-adult reduction are outside this module.
  deferred_outputs:
    - output: uk-ribble-valley:policies/ribble-valley/council-tax-reduction/schedule-1#applicable_amount
      reason: Schedule 1's personal allowances, premiums, components, and transitional additions are outside this award-surface module; the calculated applicable amount is consumed as an input.
    - output: uk-ribble-valley:policies/ribble-valley/council-tax-reduction/section-62-and-schedule-2#second_adult_reduction
      reason: The separate Class F alternative maximum Council Tax Reduction is outside this working-age main-award surface.
