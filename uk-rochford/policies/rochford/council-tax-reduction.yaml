        atoms:
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: uk-rochford/manual/council-tax-support-scheme-2026-2027/page-43
              excerpt: "shall be 75 per cent, of the amount A divided by B"
    versions: [{effective_from: '2026-04-01', formula: "0.75"}]

