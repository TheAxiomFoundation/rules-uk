    dtype: Number
    period: Week
    source: Rochford District Council Council Tax Support Scheme 2026/27 Schedule 1
    metadata: *grid_proof
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          if rochford_council_tax_reduction_applicant_has_partner: if rochford_council_tax_reduction_number_of_dependants > 1: rochford_council_tax_reduction_household_category_couple_with_2_or_more_children else: if rochford_council_tax_reduction_number_of_dependants == 1: rochford_council_tax_reduction_household_category_couple_with_1_child else: rochford_council_tax_reduction_household_category_couple_with_no_children else: if rochford_council_tax_reduction_number_of_dependants > 1: rochford_council_tax_reduction_household_category_single_with_2_or_more_children else: if rochford_council_tax_reduction_number_of_dependants == 1: rochford_council_tax_reduction_household_category_single_with_1_child else: rochford_council_tax_reduction_household_category_single_person

