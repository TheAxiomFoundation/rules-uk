        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: uk-rochford/manual/council-tax-support-scheme-2026-2027/page-32
              excerpt: "no reduction shall be granted when the applicant has an amount greater that this level"
    versions: [{effective_from: '2026-04-01', formula: "rochford_council_tax_reduction_assessed_capital_for_year < rochford_council_tax_reduction_capital_limit"}]

