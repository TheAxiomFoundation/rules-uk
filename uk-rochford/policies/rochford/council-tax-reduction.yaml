            source:
              corpus_citation_path: uk-rochford/manual/council-tax-support-scheme-2026-2027/page-60
              excerpt: "discount will be awarded at highest level in line with their household circumstances."
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          if rochford_council_tax_reduction_applicant_or_partner_receives_relevant_benefit: rochford_council_tax_reduction_income_band_1 else: if rochford_council_tax_reduction_assessed_weekly_income > rochford_council_tax_reduction_income_band_upper_weekly_income[rochford_council_tax_reduction_income_band_5]: rochford_council_tax_reduction_income_band_6 else: if rochford_council_tax_reduction_assessed_weekly_income > rochford_council_tax_reduction_income_band_upper_weekly_income[rochford_council_tax_reduction_income_band_4]: rochford_council_tax_reduction_income_band_5 else: if rochford_council_tax_reduction_assessed_weekly_income > rochford_council_tax_reduction_income_band_upper_weekly_income[rochford_council_tax_reduction_income_band_3]: rochford_council_tax_reduction_income_band_4 else: if rochford_council_tax_reduction_assessed_weekly_income > rochford_council_tax_reduction_income_band_upper_weekly_income[rochford_council_tax_reduction_income_band_2]: rochford_council_tax_reduction_income_band_3 else: if rochford_council_tax_reduction_assessed_weekly_income > rochford_council_tax_reduction_income_band_upper_weekly_income[rochford_council_tax_reduction_income_band_1]: rochford_council_tax_reduction_income_band_2 else: rochford_council_tax_reduction_income_band_1

