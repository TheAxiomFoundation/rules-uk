format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: uk-rochford/manual/council-tax-support-scheme-2026-2027/page-60
    # upstream_source_check:
    # status: delegated_scheme
    # checked_paths: [uk/statutes/ukpga/1992/14/13A, uk/regulations/uksi/2012/2885, uk/regulations/uksi/2012/2886]
    # rationale: LGFA 1992 section 13A delegates the working-age scheme to this authority, so the adopted document is operative.
  summary: |-
    Rochford's adopted 2026/27 working-age scheme is a banded discount scheme.
    It first defines a maximum reduction of 75% of eligible liability and then
    applies the Schedule 1 household-and-weekly-income discount (75%, 50%,
    25%, or 0%) to that maximum. Capital of £6,000 or more produces no award. The
    working-age Schedule 1 prints no non-dependant deduction, tariff-income
    rule, taper, minimum award, or protected higher rate. Pension-age
    prescribed-scheme provisions are outside this module.
  deferred_outputs:
    - output: uk-rochford:policies/rochford/council-tax-reduction/sections-11-to-25-and-schedule-2#assessed_weekly_income
      reason: Income calculation, earnings, disregards, and attribution feed the Schedule 1 grid but are outside this award-surface module.
    - output: uk-rochford:policies/rochford/council-tax-reduction/sections-27-to-34-and-schedule-3#assessed_capital
      reason: Capital valuation, attribution, notional capital, and disregards are outside this award-surface module.
    - output: uk-rochford:policies/rochford/council-tax-reduction/paragraphs-48.2-to-48.4#maximum_eligible_liability
      reason: Liability discounts and joint-liability apportionment are inputs to the maximum-reduction calculation.
    - output: uk-rochford:policies/rochford/council-tax-reduction/schedule-1-paragraph-5#number_of_dependant_children_or_young_persons
      reason: The detailed family classifier is supplied as a boundary input; this module applies the printed two-dependant cap.
