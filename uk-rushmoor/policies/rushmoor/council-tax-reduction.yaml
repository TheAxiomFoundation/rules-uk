format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: uk-rushmoor/manual/council-tax-reduction-scheme-2026-2027/page-76
    # upstream_source_check:
    #   status: delegated_scheme
    #   checked_paths: [uk/statutes/ukpga/1992/14/13A, uk/regulations/uksi/2012/2885, uk/regulations/uksi/2012/2886]
    #   rationale: LGFA 1992 section 13A delegates the working-age scheme to Rushmoor Borough Council, so the adopted scheme document is the operative legal source for the locally set working-age values. The pinned singular source-verification contract strips this attestation as a live field.
  summary: |-
    Rushmoor's 2026/27 local working-age scheme provides 100 percent of liability capped at Band D, less the printed Class E daily excess-income taper and non-dependant deductions. Capital greater than £6,000 is a cliff; the adopted local scheme prints no tariff-income rule or minimum-award floor.
  deferred_outputs:
    - output: uk-rushmoor:policies/rushmoor/council-tax-reduction/sections-12-to-32-and-schedules-1-to-4#applicable_amount_and_assessed_income
      reason: The detailed applicable-amount, income, disregard and Universal Credit assessment schedules supply the consumed inputs but are outside this award-surface module.
    - output: uk-rushmoor:policies/rushmoor/council-tax-reduction/sections-34-to-42-and-schedule-5#assessed_capital
      reason: Capital valuation, attribution and disregard rules are outside this module; it applies the printed £6,000 capital cliff.
    - output: uk-rushmoor:policies/rushmoor/council-tax-reduction/sections-58-3-to-58-9#non_dependant_deduction_applies_and_household_total
      reason: This module encodes the printed individual deduction bands; exemption, couple coordination, apportionment and household aggregation remain future outputs.
    - output: uk-rushmoor:policies/rushmoor/council-tax-reduction/section-60#extended_reduction_amount
      reason: Extended-reduction entitlement is a separate award pathway outside the ordinary working-age means-tested surface.
rules:
  - name: rushmoor_council_tax_reduction_maximum_support_rate
    kind: parameter
    dtype: Rate
    source: Rushmoor Council Tax Reduction Scheme 2026/27 paragraph 57.1
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: uk-rushmoor/manual/council-tax-reduction-scheme-2026-2027/page-74
              excerpt: "shall be 100 per cent, of the amount A divided by B"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          1
  - name: rushmoor_council_tax_reduction_capital_limit
    kind: parameter
    dtype: Money
    period: Year
    unit: GBP
    source: Rushmoor Council Tax Reduction Scheme 2026/27 paragraph 33.1
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: uk-rushmoor/manual/council-tax-reduction-scheme-2026-2027/page-56
              excerpt: "the prescribed amount is £6,000"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          6000
  - name: rushmoor_council_tax_reduction_taper_whole_percentage_points
    kind: parameter
    dtype: Number
    source: Rushmoor Council Tax Reduction Scheme 2026/27 paragraph 59.1
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: uk-rushmoor/manual/council-tax-reduction-scheme-2026-2027/page-76
              excerpt: "shall be 2 6/7 per cent."
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          2
  - name: rushmoor_council_tax_reduction_taper_fraction_numerator
    kind: parameter
    dtype: Number
    source: Rushmoor Council Tax Reduction Scheme 2026/27 paragraph 59.1
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: uk-rushmoor/manual/council-tax-reduction-scheme-2026-2027/page-76
              excerpt: "shall be 2 6/7 per cent."
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          6
  - name: rushmoor_council_tax_reduction_days_per_week
    kind: parameter
    dtype: Number
    source: Rushmoor Council Tax Reduction Scheme 2026/27 paragraph 58.1
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: uk-rushmoor/manual/council-tax-reduction-scheme-2026-2027/page-74
              excerpt: "£15.95 x 1/7"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          7
  - name: rushmoor_council_tax_reduction_per_cent_unit
    kind: parameter
    dtype: Rate
    source: Rushmoor Council Tax Reduction Scheme 2026/27 percentage notation
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: uk-rushmoor/manual/council-tax-reduction-scheme-2026-2027/page-74
              excerpt: "shall be 100 per cent, of the amount A divided by B"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          0.01
  - name: rushmoor_council_tax_reduction_daily_taper_rate
    kind: parameter
    dtype: Rate
    source: Rushmoor Council Tax Reduction Scheme 2026/27 paragraph 59.1, derived from printed mixed percentage
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: uk-rushmoor/manual/council-tax-reduction-scheme-2026-2027/page-76
              excerpt: "The prescribed daily percentage for the purpose of calculating support as a percentage of excess of income over the applicable amount, which is deducted from maximum council tax reduction, shall be 2 6/7 per cent."
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          (rushmoor_council_tax_reduction_taper_whole_percentage_points + rushmoor_council_tax_reduction_taper_fraction_numerator / rushmoor_council_tax_reduction_days_per_week) * rushmoor_council_tax_reduction_per_cent_unit
  - name: rushmoor_council_tax_reduction_non_dependant_deduction_by_band
    kind: parameter
    dtype: Money
    period: Week
    unit: GBP
    indexed_by: rushmoor_council_tax_reduction_non_dependant_band
    source: Rushmoor Council Tax Reduction Scheme 2026/27 paragraphs 58.1-58.2
    metadata:
      proof:
        atoms:
          - path: versions[0].values
            kind: parameter_table
            source:
              corpus_citation_path: uk-rushmoor/manual/council-tax-reduction-scheme-2026-2027/page-74
              excerpt: "58.1 Subject to the following provisions of this paragraph, the non-dependant deductions in respect of a day referred to in section 29 (maximum council tax reduction) shall be; (a) in respect of a non-dependant aged 18 or over in remunerative work, £15.95 x 1/7; (b) in respect of a non-dependant aged 18 or over to whom sub-paragraph (a) does not apply, £5.20 x 1/7. 58.2 In the case of a non-dependant aged 18 or over, where it is shown to the appropriate authority that his normal gross weekly income is– (a) less than £279.00, the deduction to be made under this paragraph shall be that specified in paragraph 58.1(b); (b) not less than £279.00, but less than £485.00, the deduction to be made under this section shall be £10.60 x1/7; (c) not less than £485.00, but less than £605.00, the deduction to be made under this section shall be £13.30 x 1/7;"
              table:
                header: paragraphs 58.1-58.2
                row_key: non-dependant deduction band
                column_key: weekly deduction
    versions:
      - effective_from: '2026-04-01'
        values: {0: 0, 1: 5.20, 2: 10.60, 3: 13.30, 4: 15.95}
  - name: rushmoor_council_tax_reduction_working_age_scheme_applies
    kind: derived
    entity: Household
    dtype: Judgment
    period: Year
    source: Rushmoor Council Tax Reduction Scheme 2026/27 section 1.6
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: uk-rushmoor/manual/council-tax-reduction-scheme-2026-2027/page-8
              excerpt: "The adopted scheme for working age applicants is a means test, which compares income against an assessment of applicable amounts"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          local_authority_is_rushmoor and council_tax_reduction_household_in_england and rushmoor_council_tax_reduction_applicant_is_working_age
  - name: rushmoor_council_tax_reduction_capital_eligible
    kind: derived
    entity: Household
    dtype: Judgment
    period: Year
    source: Rushmoor Council Tax Reduction Scheme 2026/27 paragraph 33.1
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: uk-rushmoor/manual/council-tax-reduction-scheme-2026-2027/page-56
              excerpt: "no support shall be granted when the applicant has an amount greater than this level."
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          rushmoor_council_tax_reduction_assessed_capital_for_year <= rushmoor_council_tax_reduction_capital_limit
  - name: rushmoor_council_tax_reduction_class_d_income_condition
    kind: derived
    entity: Household
    dtype: Judgment
    period: Year
    source: Rushmoor Council Tax Reduction Scheme 2026/27 Class D
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: uk-rushmoor/manual/council-tax-reduction-scheme-2026-2027/page-8
              excerpt: "person’s income4 is less than their applicable amount5"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          rushmoor_council_tax_reduction_assessed_income_for_year < rushmoor_council_tax_reduction_applicable_amount_for_year
  - name: rushmoor_council_tax_reduction_class_e_income_condition
    kind: derived
    entity: Household
    dtype: Judgment
    period: Year
    source: Rushmoor Council Tax Reduction Scheme 2026/27 Class E
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: uk-rushmoor/manual/council-tax-reduction-scheme-2026-2027/page-9
              excerpt: "person’s income10 is more than their applicable amount11"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          rushmoor_council_tax_reduction_assessed_income_for_year > rushmoor_council_tax_reduction_applicable_amount_for_year
  - name: rushmoor_council_tax_reduction_individual_non_dependant_deduction_weekly
    kind: derived
    entity: Person
    dtype: Money
    period: Week
    unit: GBP
    source: Rushmoor Council Tax Reduction Scheme 2026/27 paragraphs 58.1-58.2
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: uk-rushmoor/manual/council-tax-reduction-scheme-2026-2027/page-74
              excerpt: "the non-dependant deductions in respect of a day referred to in section 29"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          if rushmoor_council_tax_reduction_non_dependant_deduction_applies: rushmoor_council_tax_reduction_non_dependant_deduction_by_band[rushmoor_council_tax_reduction_non_dependant_band] else: rushmoor_council_tax_reduction_capital_limit - rushmoor_council_tax_reduction_capital_limit
  - name: rushmoor_council_tax_reduction_band_d_capped_liability_for_year
    kind: derived
    entity: Household
    dtype: Money
    period: Year
    unit: GBP
    source: Rushmoor Council Tax Reduction Scheme 2026/27 paragraph 57.1(a)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: uk-rushmoor/manual/council-tax-reduction-scheme-2026-2027/page-74
              excerpt: "A is the lower of either; i. amount set by the appropriate authority as the council tax for the relevant financial year in respect of the dwelling in which he is a resident and for which he is liable, subject to any discount which may be appropriate to that dwelling under the 1992 Act; or ii. the amount set by the appropriate authority as the council tax for the relevant financial year in respect of a dwelling within Band D subject to any discount which may be appropriate to the person’s circumstances;"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          min(rushmoor_council_tax_reduction_actual_liability_for_year, rushmoor_council_tax_reduction_band_d_liability_for_year)
  - name: rushmoor_council_tax_reduction_maximum_council_tax_reduction_for_year
    kind: derived
    entity: Household
    dtype: Money
    period: Year
    unit: GBP
    source: Rushmoor Council Tax Reduction Scheme 2026/27 paragraph 57.1
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: uk-rushmoor/manual/council-tax-reduction-scheme-2026-2027/page-74
              excerpt: "shall be 100 per cent, of the amount A divided by B where;"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          rushmoor_council_tax_reduction_band_d_capped_liability_for_year * rushmoor_council_tax_reduction_maximum_support_rate - rushmoor_council_tax_reduction_non_dependant_deductions_for_year
  - name: rushmoor_council_tax_reduction_excess_income_for_year
    kind: derived
    entity: Household
    dtype: Money
    period: Year
    unit: GBP
    source: Rushmoor Council Tax Reduction Scheme 2026/27 paragraph 59.1
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: uk-rushmoor/manual/council-tax-reduction-scheme-2026-2027/page-76
              excerpt: "Where an applicant’s income exceeds their applicable amount"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          max(rushmoor_council_tax_reduction_assessed_income_for_year - rushmoor_council_tax_reduction_applicable_amount_for_year, rushmoor_council_tax_reduction_capital_limit - rushmoor_council_tax_reduction_capital_limit)
  - name: rushmoor_council_tax_reduction_income_taper_deduction_for_year
    kind: derived
    entity: Household
    dtype: Money
    period: Year
    unit: GBP
    source: Rushmoor Council Tax Reduction Scheme 2026/27 paragraph 59.1
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: uk-rushmoor/manual/council-tax-reduction-scheme-2026-2027/page-76
              excerpt: "deducting their excess income multiplied by the taper from their maximum council tax reduction"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          rushmoor_council_tax_reduction_excess_income_for_year * rushmoor_council_tax_reduction_daily_taper_rate
  - name: rushmoor_council_tax_reduction_award_conditions_met
    kind: derived
    entity: Household
    dtype: Judgment
    period: Year
    source: Rushmoor Council Tax Reduction Scheme 2026/27 paragraphs 33.1 and 59.1
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: uk-rushmoor/manual/council-tax-reduction-scheme-2026-2027/page-76
              excerpt: "Where an applicant’s income exceeds their applicable amount, their council tax reduction shall be calculated"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          rushmoor_council_tax_reduction_working_age_scheme_applies and rushmoor_council_tax_reduction_capital_eligible and would_claim_council_tax_reduction and (rushmoor_council_tax_reduction_class_d_income_condition or (rushmoor_council_tax_reduction_class_e_income_condition and rushmoor_council_tax_reduction_maximum_council_tax_reduction_for_year > rushmoor_council_tax_reduction_income_taper_deduction_for_year))
  - name: rushmoor_council_tax_reduction_annual_amount
    kind: derived
    entity: Household
    dtype: Money
    period: Year
    unit: GBP
    source: Rushmoor Council Tax Reduction Scheme 2026/27 paragraph 59.1
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: uk-rushmoor/manual/council-tax-reduction-scheme-2026-2027/page-76
              excerpt: "deducting their excess income multiplied by the taper from their maximum council tax reduction"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          if rushmoor_council_tax_reduction_award_conditions_met: rushmoor_council_tax_reduction_maximum_council_tax_reduction_for_year - rushmoor_council_tax_reduction_income_taper_deduction_for_year else: rushmoor_council_tax_reduction_capital_limit - rushmoor_council_tax_reduction_capital_limit
inputs:
  - {name: local_authority_is_rushmoor, entity: Household, dtype: Boolean, period: Year}
  - {name: council_tax_reduction_household_in_england, entity: Household, dtype: Boolean, period: Year}
  - {name: rushmoor_council_tax_reduction_applicant_is_working_age, entity: Household, dtype: Boolean, period: Year}
  - {name: would_claim_council_tax_reduction, entity: Household, dtype: Boolean, period: Year}
  - {name: rushmoor_council_tax_reduction_assessed_capital_for_year, entity: Household, dtype: Money, period: Year, unit: GBP}
  - {name: rushmoor_council_tax_reduction_actual_liability_for_year, entity: Household, dtype: Money, period: Year, unit: GBP}
  - {name: rushmoor_council_tax_reduction_band_d_liability_for_year, entity: Household, dtype: Money, period: Year, unit: GBP}
  - {name: rushmoor_council_tax_reduction_assessed_income_for_year, entity: Household, dtype: Money, period: Year, unit: GBP}
  - {name: rushmoor_council_tax_reduction_applicable_amount_for_year, entity: Household, dtype: Money, period: Year, unit: GBP}
  - {name: rushmoor_council_tax_reduction_non_dependant_deductions_for_year, entity: Household, dtype: Money, period: Year, unit: GBP}
  - {name: rushmoor_council_tax_reduction_non_dependant_deduction_applies, entity: Person, dtype: Boolean, period: Week}
  - {name: rushmoor_council_tax_reduction_non_dependant_band, entity: Person, dtype: Number, period: Week}
