  - name: salford_council_tax_reduction_tariff_income_weekly
    kind: derived
    entity: Household
    dtype: Money
    period: Week
    unit: GBP
    source: Salford City Council Council Tax Reduction Scheme 2026/27 sections 42.4-42.5
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: uk-salford/manual/council-tax-reduction-scheme-2026-2027/page-78
              excerpt: "Where the applicant’s capital calculated in accordance with this scheme exceeds £6,000 it shall be treated as equivalent to a weekly income of £1 for each complete £250 of in excess of £6,000 but not exceeding £16,000."
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: uk-salford/manual/council-tax-reduction-scheme-2026-2027/page-78
              excerpt: "Notwithstanding paragraph 42.1 where any part of the excess is not a complete £250 that part shall be treated as equivalent to a weekly tariff income of £1."
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: uk-salford/manual/council-tax-reduction-scheme-2026-2027/page-78
              excerpt: "In the case of any applicant that falls to be treated under Class F and who is in receipt of universal credit, the capital and tariff income used by the authority shall be that specified by the Secretary of State for Work and Pensions."
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: uk-salford/manual/council-tax-reduction-scheme-2026-2027/page-78
              excerpt: "In the case of any applicant that falls to be treated under Class F but who is not in receipt of an award of universal credit, any tariff shall be calculated in accordance with 42.1 to 42.3."
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          if salford_council_tax_reduction_capital_eligible: if salford_council_tax_reduction_has_universal_credit_award: salford_council_tax_reduction_universal_credit_tariff_income_weekly else: if salford_council_tax_reduction_capital_at_or_below_tariff_threshold: salford_council_tax_reduction_tariff_income_weekly_amount_per_step - salford_council_tax_reduction_tariff_income_weekly_amount_per_step else: ceil((salford_council_tax_reduction_assessed_capital_for_year - salford_council_tax_reduction_tariff_income_threshold) / salford_council_tax_reduction_tariff_income_capital_step) * salford_council_tax_reduction_tariff_income_weekly_amount_per_step else: salford_council_tax_reduction_tariff_income_weekly_amount_per_step - salford_council_tax_reduction_tariff_income_weekly_amount_per_step

