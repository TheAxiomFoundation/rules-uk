format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: uk-salford/manual/council-tax-reduction-scheme-2026-2027/page-144
    # upstream_source_check:
    #   status: delegated_scheme
    #   checked_paths: [uk/statutes/ukpga/1992/14/13A, uk/regulations/uksi/2012/2885, uk/regulations/uksi/2012/2886]
    #   rationale: LGFA 1992 section 13A delegates the working-age scheme to Salford City Council, so the adopted scheme document is operative. The apply-stage encoder strips this attestation to the singular source-verification contract after local gates pass.
  summary: |-
    Upstream-source status: delegated_scheme. LGFA 1992 section 13A delegates
    Salford's working-age scheme to the billing authority, so its adopted
    2026-27 document is operative. Class F is a banded scheme effective from
    1 April 2026: its six grid rates (88, 75, 50, 25, 10, and zero percent)
    are direct bill-reduction percentages selected from weekly income and
    council-tax family and bounded by the 88 percent section-57 maximum. The
    Class-F flat non-dependant amount is deducted in full after the selected
    percentage award is determined. Capital over £16,000 gives no award;
    non-UC cases receive £1 weekly tariff income for every £250 or part over
    £6,000, while UC cases
    use the DWP-specified tariff input. No Class-F minimum award, de-minimis
    rule, or band-cap award ceiling is printed. Section 59's 3 4/7 percent
    taper applies to the separate legacy Class E, not this active Class-F
    award surface; its protected transition remains deferred below. Although
    the Schedule 2 layout also prints monthly columns, it supplies no monthly
    selector and its clarification states that the table incomes are weekly,
    so this module encodes the weekly grid only.
  deferred_outputs:
    - output: uk-salford:policies/salford/council-tax-reduction/sections-15-to-52-and-schedules-3-to-5#class_f_assessed_weekly_income
      reason: >-
        The Class-F award surface consumes assessed weekly income after the
        Universal Credit calculation, notional-income, self-employment minimum-
        income-floor, disregard, and attribution provisions; omitted inputs are
        not treated as zero.
    - output: uk-salford:policies/salford/council-tax-reduction/sections-33-to-41#class_f_assessed_capital
      reason: >-
        The award surface consumes capital after valuation, attribution,
        notional-capital, and disregard rules, including the DWP assessment for
        Universal Credit cases.
    - output: uk-salford:policies/salford/council-tax-reduction/paragraph-42.4#universal_credit_tariff_income_weekly
      reason: >-
        For Class-F Universal Credit cases the authority uses the Secretary of
        State's capital and tariff calculation. This module consumes that
        specified weekly tariff input rather than inventing a local UC value.
    - output: uk-salford:policies/salford/council-tax-reduction/schedule-2#council_tax_family_classifier
      reason: >-
        This module selects the printed single, couple, one-child, or two-or-
        more-child column from mutually exclusive household classification
        facts; the scheme's detailed council-tax-family definition is deferred.
    - output: uk-salford:policies/salford/council-tax-reduction/paragraph-57.1#a_divided_by_b_daily_eligible_liability
      reason: >-
        The award surface consumes the daily liability base after council-tax
        discounts and joint-liability apportionment under section 57.
    - output: uk-salford:policies/salford/council-tax-reduction/sections-58.5-to-58A.4#chargeable_non_dependant_classification_and_apportionment
      reason: >-
        This module consumes a post-exemption, post-apportionment count of
        chargeable Class-F resident non-dependants. The imported section-58
        joint-liability apportionment and claimant, partner, student, absence,
        armed-forces, benefit, Universal Credit, disability, age, carer, and
        prisoner exceptions, together with sections 58A.2 to 58A.4, are
        deferred rather than treated as chargeable.
    - output: uk-salford:policies/salford/council-tax-reduction/paragraphs-1.9-to-1.11#legacy_class_d_e_transition_award
      reason: >-
        ESAIR and more-than-20-percent-loss transitional claimants retain a
        legacy Class D or E calculation for a time-limited or discretionary
        period. That separate legacy award is not treated as Class F.
rules:
  - name: salford_council_tax_reduction_maximum_support_rate
    kind: parameter
    dtype: Rate
    source: Salford City Council Council Tax Reduction Scheme 2026/27 section 57.1
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: uk-salford/manual/council-tax-reduction-scheme-2026-2027/page-94
              excerpt: "shall be 88 per cent, of the amount A divided by B where;"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          0.88

  - name: salford_council_tax_reduction_capital_limit
    kind: parameter
    dtype: Money
    period: Year
    unit: GBP
    source: Salford City Council Council Tax Reduction Scheme 2026/27 Schedule 2 paragraph 4
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: uk-salford/manual/council-tax-reduction-scheme-2026-2027/page-145
              excerpt: "Any applicant who's capital is greater than £16,000 shall not be entitled to any Council Tax Reductions whatsoever."
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          16000

  - name: salford_council_tax_reduction_tariff_income_threshold
    kind: parameter
    dtype: Money
    period: Year
    unit: GBP
    source: Salford City Council Council Tax Reduction Scheme 2026/27 sections 42.1-42.5
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: uk-salford/manual/council-tax-reduction-scheme-2026-2027/page-78
              excerpt: "exceeds £6,000 it shall be treated as equivalent to a weekly income of £1 for each complete £250 of in excess of £6,000 but not exceeding £16,000."
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          6000

  - name: salford_council_tax_reduction_tariff_income_capital_step
    kind: parameter
    dtype: Money
    period: Year
    unit: GBP
    source: Salford City Council Council Tax Reduction Scheme 2026/27 sections 42.1-42.5
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: uk-salford/manual/council-tax-reduction-scheme-2026-2027/page-78
              excerpt: "£1 for each complete £250 of in excess of £6,000"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          250

  - name: salford_council_tax_reduction_tariff_income_weekly_amount_per_step
    kind: parameter
    dtype: Money
    period: Week
    unit: GBP
    source: Salford City Council Council Tax Reduction Scheme 2026/27 sections 42.1-42.5
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: uk-salford/manual/council-tax-reduction-scheme-2026-2027/page-78
              excerpt: "weekly income of £1 for each complete £250"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          1

  - name: salford_council_tax_reduction_days_per_week
    kind: parameter
    dtype: Number
    source: Salford City Council Council Tax Reduction Scheme 2026/27 section 58A.1
    metadata:
      proof:
        atoms:
