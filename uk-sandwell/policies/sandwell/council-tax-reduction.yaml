            source:
              corpus_citation_path: uk-sandwell/manual/council-tax-reduction-policy-2026-2027/page-69
              excerpt: "A is the lower of either; i. the amount set by the appropriate authority as the council tax for the relevant financial year in respect of the dwelling in which he is a resident and for which he is liable, subject to any discount which may be appropriate to that dwelling under the 1992 Act; or ii. the amount set by the appropriate authority as the council tax for the relevant financial year in respect of a dwelling within Band B;"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          min(sandwell_council_tax_reduction_actual_council_tax_liability_for_year, sandwell_council_tax_reduction_band_b_council_tax_liability_for_year)

  - name: sandwell_council_tax_reduction_maximum_amount_before_grid_for_day
    kind: derived
    entity: Household
