format: rulespec/v1
imports:
  - "uk:regulations/uksi/2006/213/52#ordinary_capital_tariff_income_lower_threshold"
  - "uk:regulations/uksi/2006/213/52#prescribed_circumstances_capital_tariff_income_lower_threshold"
  - "uk:regulations/uksi/2006/213/52#capital_tariff_income_upper_limit"
  - "uk:regulations/uksi/2006/213/52#capital_tariff_income_band_size"
  - "uk:regulations/uksi/2006/213/52#capital_tariff_income_weekly_amount_per_band"
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: uk-sandwell/manual/council-tax-reduction-policy-2026-2027/page-105
    # upstream_source_check:
    # status: delegated_scheme
    # checked_paths: [uk/statutes/ukpga/1992/14/13A, uk/regulations/uksi/2012/2885, uk/regulations/uksi/2012/2886]
    # rationale: LGFA 1992 section 13A delegates the working-age scheme to Sandwell Metropolitan Borough Council, so the adopted document is operative.
  summary: |-
    Sandwell's operative 2026-27 working-age award is the Schedule 1 Banded Discount Scheme, not an excess-income taper. The defined maximum is the lower of actual and Band B liability, at 85 percent for ordinary applicants and 100 percent for a resident dependant child aged five or under; applicable non-dependant deductions are inside that maximum. The family-specific weekly-income grid then composes its 100, 90, 75, 50, 25, or zero percent discount rate onto the defined maximum. Capital above £3,000 excludes entitlement, and an award below £1 per reduction week is not payable. Section 17.1 incorporates Regulation 52 tariff income; imported national threshold-and-step constants supply that incorporated calculation while the local proof atom records Sandwell's adoption. Pension-age prescribed-scheme provisions are outside this working-age local module.
  deferred_outputs:
    - output: uk-sandwell:policies/sandwell/council-tax-reduction/sections-1.6-to-1.7#applicant_is_in_local_working_age_class
      reason: This award-surface module consumes the local claimant-and-partner working-age classifier, including the statutory-age and qualifying-benefit conditions.
    - output: uk-sandwell:policies/sandwell/council-tax-reduction/sections-1.6-to-1.7-class-d#applicant_satisfies_class_d_general_conditions
      reason: This module separately consumes Class D's residence, liability, non-absence, prescribed-exclusion, and maximum-calculability conditions. It encodes the local capital cliff and Schedule 1 income-band result directly.
    - output: uk-sandwell:policies/sandwell/council-tax-reduction/sections-9-to-18-and-schedules-2-to-5#assessed_weekly_income_before_tariff
      reason: The Schedule 1 selector consumes weekly income after the scheme's family, income, disregard, childcare, Universal Credit, capital-valuation, attribution, and disregard rules.
    - output: uk-sandwell:policies/sandwell/council-tax-reduction/section-57#actual_liability_band_b_liability_and_financial_year_day_count
      reason: This module applies the printed lower-of-actual-and-Band-B maximum; council-tax charging, statutory discounts, joint-liability apportionment, and calendar-day calculation are future outputs.
    - output: uk-sandwell:policies/sandwell/council-tax-reduction/sections-58.3-to-58.9#chargeable_non_dependant_deduction_units
      reason: >-
        This module encodes the £5 and £10 weekly deduction table and the claimant-wide protection gate. Each supplied deduction unit has already applied section 58.3: a couple or polygamous-marriage group contributes one unit in its higher applicable band, while separately chargeable people contribute separate units. The detailed group, student, training, absence, armed-forces, disability, and apportionment classifiers remain future outputs.
    - output: uk-sandwell:policies/sandwell/council-tax-reduction/section-17-and-regulation-52#prescribed_circumstances_for_tariff_income
      reason: The imported Regulation 52 special £10,000 tariff-threshold classifier is consumed as an input. It cannot affect an award that passes Sandwell's £3,000 capital cliff.
    - output: uk-sandwell:policies/sandwell/council-tax-reduction/sections-60-to-61e#extended_reduction_amount
      reason: Extended-reduction eligibility, duration, and amount are a distinct post-employment-change award route outside this ordinary working-age award calculation.
