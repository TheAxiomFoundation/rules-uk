format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: uk-sefton/manual/council-tax-reduction-scheme-2026-2027/page-44
    # upstream_source_check:
    #   status: delegated_scheme
    #   checked_paths: [uk/statutes/ukpga/1992/14/13A, uk/regulations/uksi/2012/2885, uk/regulations/uksi/2012/2886]
    #   rationale: LGFA 1992 section 13A delegates the working-age scheme to Sefton Council, so the adopted document is operative. The apply-stage encoder strips this live attestation to the singular source-verification contract after local gates pass.
  summary: |-
    Upstream-source status: delegated_scheme. Checked paths: uk/statutes/ukpga/1992/14/13A, uk/regulations/uksi/2012/2885, and uk/regulations/uksi/2012/2886. LGFA 1992 section 13A delegates the working-age scheme to Sefton Council, so the adopted document is operative. Sefton's adopted 2026-27 working-age scheme sets the maximum reduction at 84 percent of eligible council-tax liability, then deducts the applicable non-dependant amount inside that maximum. Class E expressly defines amount A as that maximum and deducts amount B, the printed 2 6/7 percent daily excess-income taper; the companion weekly rate is derived as 20 percent. Capital above £6,000 excludes the claimant. Paragraph 72 is "Not used", so this module models no working-age tariff income and does not invent a threshold or step. The printed non-dependant grid is £2 weekly below the strict £195 boundary (or not in remunerative work) and £5 above it; classification, exemptions, aggregation, and the source's unassigned exactly-£195 case are deferred. No minimum-award floor, council-tax-band cap, or protected 100-percent maximum is printed for this local working-age award surface. Pension-age alternative-maximum provisions are outside scope.
  deferred_outputs:
    - output: uk-sefton:policies/sefton/council-tax-reduction/paragraphs-16-to-24#working_age_class_other_conditions
      reason: Liability, residence, absence, exclusion, claimant/partner pension-age status, and the remaining Class D/E conditions are consumed as an eligibility input; this module does not infer them from household-wide pensioner status.
    - output: uk-sefton:policies/sefton/council-tax-reduction/paragraphs-26-to-28-and-schedule-3#applicable_amount
      reason: The applicable amount's allowances, premiums, components, and transitional amounts are outside this award-surface module.
    - output: uk-sefton:policies/sefton/council-tax-reduction/paragraphs-37-to-70-and-schedules-5-to-10#assessed_income_and_capital
      reason: Income and capital assessment, including the self-employment minimum-income floor, are consumed as assessed inputs; this module applies the locally printed capital cliff only.
    - output: uk-sefton:policies/sefton/council-tax-reduction/paragraphs-29A.2-to-29A.5#eligible_liability_and_joint_liability_apportionment
      reason: Discounts, council-tax charge determination, and joint-liability apportionment are consumed in eligible liability before the 84-percent local maximum is applied.
    - output: uk-sefton:policies/sefton/council-tax-reduction/paragraphs-10-and-30A.3-to-30A.9#non_dependant_deduction_classification_and_aggregation
      reason: Remunerative-work exceptions, claimant and non-dependant exemptions, couple coordination, apportionment, and aggregation are deferred. Paragraph 30A assigns deductions only below and above £195.00, so the exactly-£195.00 classifier is intentionally not inferred here.
    - output: uk-sefton:policies/sefton/council-tax-reduction/paragraph-31-and-schedule-4#pension_age_alternative_maximum_council_tax_reduction
      reason: The separate pension-age alternative maximum and second-adult provisions are outside this working-age Classes D and E module.
rules:
  - name: sefton_council_tax_reduction_maximum_support_rate
    kind: parameter
    dtype: Rate
    source: Sefton Council Tax Reduction Scheme 2026/27 paragraph 29A.0(1)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: uk-sefton/manual/council-tax-reduction-scheme-2026-2027/page-35
              excerpt: "a person's maximum council tax reduction amount in respect of a day is 84 per cent of the amount A/B where:"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          0.84

  - name: sefton_council_tax_reduction_capital_limit
    kind: parameter
    dtype: Money
    period: Year
    unit: GBP
    source: Sefton Council Tax Reduction Scheme 2026/27 paragraph 23.0(1)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: uk-sefton/manual/council-tax-reduction-scheme-2026-2027/page-29
              excerpt: "The class of person described in this paragraph consists of any person whose capital exceeds £6,000."
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          6000

  - name: sefton_council_tax_reduction_days_per_week
    kind: parameter
    dtype: Number
    source: Sefton Council Tax Reduction Scheme 2026/27 paragraph 30A.0(1) daily deduction conversion
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: uk-sefton/manual/council-tax-reduction-scheme-2026-2027/page-38
              excerpt: "£2.00 x 1/7"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          7

  - name: sefton_council_tax_reduction_daily_taper_rate
    kind: parameter
    dtype: Rate
    source: Sefton Council Tax Reduction Scheme 2026/27 paragraph 17.0(1)(f)(ii)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: uk-sefton/manual/council-tax-reduction-scheme-2026-2027/page-21
              excerpt: "amount B is 2 6/7 per cent of the difference between his income for the relevant week and his applicable amount"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          0.02857142857142857142857142857

  - name: sefton_council_tax_reduction_weekly_taper_rate
    kind: parameter
    dtype: Rate
    source: Sefton Council Tax Reduction Scheme 2026/27 paragraph 17.0(1)(f)(ii), converted from the printed daily rate by the printed seven-day week
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: uk-sefton/manual/council-tax-reduction-scheme-2026-2027/page-21
              excerpt: "amount B is 2 6/7 per cent of the difference between his income for the relevant week and his applicable amount"
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: uk-sefton/manual/council-tax-reduction-scheme-2026-2027/page-38
              excerpt: "£2.00 x 1/7"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          sefton_council_tax_reduction_daily_taper_rate * sefton_council_tax_reduction_days_per_week

  - name: sefton_council_tax_reduction_non_dependant_income_threshold_weekly
    kind: parameter
    dtype: Money
    period: Week
    unit: GBP
    source: Sefton Council Tax Reduction Scheme 2026/27 paragraph 30A.0(1)(b)-(c)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: uk-sefton/manual/council-tax-reduction-scheme-2026-2027/page-38
              excerpt: "where it is shown to the appropriate authority that his normal gross weekly income is less than £195.00"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          195

  - name: sefton_council_tax_reduction_non_dependant_weekly_deduction_by_band
    kind: parameter
    dtype: Money
    period: Week
    unit: GBP
    indexed_by: sefton_council_tax_reduction_non_dependant_deduction_band
    source: Sefton Council Tax Reduction Scheme 2026/27 paragraph 30A.0(1)
    metadata:
      proof:
        atoms:
          - path: versions[0].values
            kind: parameter_table
            source:
              corpus_citation_path: uk-sefton/manual/council-tax-reduction-scheme-2026-2027/page-38
              excerpt: "(a) in respect of a non-dependant aged 18 or over not in remunerative work, £2.00 x 1/7; (b) in respect of a non-dependant aged 18 or over in remunerative work, where it is shown to the appropriate authority that his normal gross weekly income is less than £195.00, the deduction to be made under this paragraph is £2.00 x 1/7; (c) in respect of a non-dependant aged 18 or over in remunerative work, where it is shown to the appropriate authority that his normal gross weekly income is more than £195.00, the deduction to be made under this paragraph is £5.00 x 1/7;"
              table:
                header: Working-age non-dependant deductions
                row_key: classified deduction band
                column_key: weekly deduction
          - path: versions[0].values[0]
            kind: exception
            source:
              corpus_citation_path: uk-sefton/manual/council-tax-reduction-scheme-2026-2027/page-38
              excerpt: "No deduction is to be made in respect of any non-dependants occupying an applicant's dwelling if the applicant or his partner is—"
    versions:
      - effective_from: '2026-04-01'
        values:
          0: 0
          1: 2
          2: 5

