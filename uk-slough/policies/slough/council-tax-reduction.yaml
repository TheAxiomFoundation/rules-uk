format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: uk-slough/manual/council-tax-reduction-scheme-2026-2027/page-93
  summary: |-
    Upstream-source status: delegated_scheme. Checked paths:
    uk/statutes/ukpga/1992/14/13A, uk/regulations/uksi/2012/2885, and
    uk/regulations/uksi/2012/2886. Section 13A delegates the working-age scheme
    to this authority, so the adopted Slough document is the operative legal
    source for its local values.
    Slough's adopted 2026-27 working-age scheme applies a direct discount of
    70% for applicants without earnings, or 50%, 32%, 20%, 15%, 10%, 5%, or
    0% according to weekly earnings. The maximum uses 100% of the lower of
    actual discounted liability and Band C liability. Capital above £6,000
    ends entitlement. The pension-age taper and tariff-income rules are not
    applicable to this working-age banded award.
  deferred_outputs:
    - output: uk-slough:policies/slough/council-tax-reduction/schedule-2#earnings_disregards
      reason: The detailed earnings-disregard schedule used to determine band-assessment earnings is outside this award-surface module.
    - output: uk-slough:policies/slough/council-tax-reduction/55.3#joint_liability_apportionment
      reason: Joint-liability apportionment requires household relationships outside this award-surface module; the formula consumes liability after that coordination.
    - output: uk-slough:policies/slough/council-tax-reduction/56.2#couple_non_dependant_deduction_coordination
      reason: The highest-deduction coordination for a non-dependant couple requires relationship data outside this module; the award consumes the coordinated annual total.
