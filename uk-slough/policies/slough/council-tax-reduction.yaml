        formula: |-
          applicant_capital <= capital_limit

  - name: earnings_band
    kind: derived
    entity: Person
    dtype: Number
    period: Week
    source: Slough Council Tax Support Scheme 2026/27 Schedule 1 paragraphs 1-3
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter_table
            source:
              corpus_citation_path: uk-slough/manual/council-tax-reduction-scheme-2026-2027/page-93
              excerpt: "Income Band Discount off CT Liability Earnings threshold (weekly) 1 70% Not working - - - 1 50% Earnings <£115.38 2 32% £115.39 - £184.61 3 20% £184.62 - £253.84 4 15% £253.85-£323.07 5 10% £323.08-£392.30 6 5% £392.31-£461.53 7 0% £461.54 and above"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          if applicant_has_earned_income == false: band_codes[0] else: if applicant_weekly_earnings < band_2_lower_threshold: band_codes[1] else: if applicant_weekly_earnings < band_3_lower_threshold: band_codes[2] else: if applicant_weekly_earnings < band_4_lower_threshold: band_codes[3] else: if applicant_weekly_earnings < band_5_lower_threshold: band_codes[4] else: if applicant_weekly_earnings < band_6_lower_threshold: band_codes[5] else: if applicant_weekly_earnings < band_7_lower_threshold: band_codes[6] else: band_codes[7]

  - name: selected_support_rate
    kind: derived
    entity: Person
    dtype: Rate
    period: Year
    source: Slough Council Tax Support Scheme 2026/27 Schedule 1 paragraphs 1-3
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter_table
            source:
              corpus_citation_path: uk-slough/manual/council-tax-reduction-scheme-2026-2027/page-93
              excerpt: "Income Band Discount off CT Liability Earnings threshold (weekly) 1 70% Not working - - - 1 50% Earnings <£115.38 2 32% £115.39 - £184.61 3 20% £184.62 - £253.84 4 15% £253.85-£323.07 5 10% £323.08-£392.30 6 5% £392.31-£461.53 7 0% £461.54 and above"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          if earnings_band == band_codes[0]: not_working_support_rate else: if earnings_band == band_codes[1]: band_1_support_rate else: if earnings_band == band_codes[2]: band_2_support_rate else: if earnings_band == band_codes[3]: band_3_support_rate else: if earnings_band == band_codes[4]: band_4_support_rate else: if earnings_band == band_codes[5]: band_5_support_rate else: if earnings_band == band_codes[6]: band_6_support_rate else: band_7_support_rate

  - name: adult_resident_deduction_weekly
    kind: derived
    entity: Person
    dtype: Money
    period: Week
    unit: GBP
    source: Slough Council Tax Support Scheme 2026/27 paragraph 56.1
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter_table
            source:
              corpus_citation_path: uk-slough/manual/council-tax-reduction-scheme-2026-2027/page-72
              excerpt: "56.1 The following non-dependent deductions shall apply: a) Nil, where the non-dependent is: Under 18 years of age or a full-time student:"
          - path: versions[0].formula
            kind: parameter_table
            source:
              corpus_citation_path: uk-slough/manual/council-tax-reduction-scheme-2026-2027/page-72
              excerpt: "a. £5 x 1/7 for each day where the non-dependent is in receipt of Pension Credit, Income Support, Income Based Jobseeker’s Allowance, Income Related Employment and Support Allowance, an award of Universal Credit without earnings. On a contributory benefit such as new style Employment and Support Allowance, new style Job Seeker’s Allowance. Working less than 16 hours per week; or working 16 hours or more per week but his normal gross income of £199.99 or less per week. This will also apply to any non-dependent not in receipt of any income or in receipt of any other income."
          - path: versions[0].formula
            kind: parameter_table
            source:
              corpus_citation_path: uk-slough/manual/council-tax-reduction-scheme-2026-2027/page-72
              excerpt: "b. £11 x 1/7 for each day where the non-dependant is working 16 hours or more per week and his normal gross weekly income is greater than or equal to £200.00."
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: uk-slough/manual/council-tax-reduction-scheme-2026-2027/page-72
              excerpt: |-
                No deduction shall apply where the applicant is in receipt of the care component of

                Disability Living Allowance at any rate or receiving the Daily Living component of

                the Personal independence Payment or registered Blind or in receipt of Armed

                Forces Independence Payments.
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          if non_dependant_is_exempt or applicant_is_protected_from_non_dependant_deductions: 0 else: if non_dependant_normal_gross_weekly_income < adult_resident_higher_income_threshold: adult_resident_standard_weekly_deduction else: adult_resident_higher_weekly_deduction

  - name: maximum_council_tax_support
    kind: derived
    entity: Person
    dtype: Money
    period: Year
    unit: GBP
    source: Slough Council Tax Support Scheme 2026/27 paragraph 55.1
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: uk-slough/manual/council-tax-reduction-scheme-2026-2027/page-71
              excerpt: |-
                shall be 100 per

                cent, of the amount A divided by B
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: uk-slough/manual/council-tax-reduction-scheme-2026-2027/page-71
              excerpt: "A is the lower of either:"
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: uk-slough/manual/council-tax-reduction-scheme-2026-2027/page-71
              excerpt: "dwelling within Band C subject to any"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          min(annual_council_tax_liability_after_statutory_discounts, annual_band_c_council_tax_liability_after_statutory_discounts) * maximum_support_rate

  - name: council_tax_reduction_award
    kind: derived
    entity: Person
    dtype: Money
    period: Year
    unit: GBP
    source: Slough Council Tax Support Scheme 2026/27 Schedule 1 paragraph 4 and paragraph 56.1
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: uk-slough/manual/council-tax-reduction-scheme-2026-2027/page-93
              excerpt: "The amount of discount to be granted is to be based on the following factors: (a) The maximum Council Tax Support as defined within this scheme (b) The income of the applicant as defined within this scheme (c) The capital of the applicant as defined within this scheme."
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: uk-slough/manual/council-tax-reduction-scheme-2026-2027/page-7
              excerpt: "Non-Dependant Deduction An amount deducted from your entitlement depending on the Non-Dependants circumstances."
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: uk-slough/manual/council-tax-reduction-scheme-2026-2027/page-94
              excerpt: "Any applicant whose capital is greater than £6,000 shall not be entitled to any Council Tax Support whatsoever."
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          if capital_eligible: max(0, maximum_council_tax_support * selected_support_rate - annual_non_dependant_deductions) else: 0
