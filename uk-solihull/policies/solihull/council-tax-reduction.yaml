            kind: formula
            source:
              corpus_citation_path: uk-solihull/manual/council-tax-reduction-scheme-2026-2027/page-60
              excerpt: "The authority’s Council Tax Reduction Scheme from 2026/27 shall be calculated on the basis of the following banded support scheme:"
          - path: versions[0].formula
            kind: ordering
            source:
              corpus_citation_path: uk-solihull/manual/council-tax-reduction-scheme-2026-2027/page-60
              excerpt: "In all cases (Table 1), the amount of reduction to be granted is to be based on the following factors: (a) The maximum Council Tax Reduction as defined within this scheme;"
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: uk-solihull/manual/council-tax-reduction-scheme-2026-2027/page-44
              excerpt: "There shall be a deduction of £10 per week made in respect of any non-dependant who resides in the household."
    versions:
