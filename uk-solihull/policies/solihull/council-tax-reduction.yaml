          if solihull_council_tax_reduction_award_conditions_met: max(solihull_council_tax_reduction_maximum_amount_for_year * solihull_council_tax_reduction_selected_support_rate - solihull_council_tax_reduction_annual_non_dependant_deduction, solihull_council_tax_reduction_maximum_amount_for_year * solihull_council_tax_reduction_support_rate_by_band[solihull_council_tax_reduction_no_award_band_index]) else: solihull_council_tax_reduction_maximum_amount_for_year * solihull_council_tax_reduction_support_rate_by_band[solihull_council_tax_reduction_no_award_band_index]

