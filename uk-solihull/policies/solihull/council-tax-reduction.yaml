              excerpt: "Table 1 Discount level Passported Single Single with 1 Child Single with 2+ Children Couples Couple with 1 Child Couple with 2+ Children Weekly Income Levels (Net) Band 1 85% Relevant Benefit £0.00 to £120.00 £0.00 to £220.00 £0.00 to £310.00 £0.00 to £170.00 £0.00 to £240.00 £0.00 to £320.00 Band 2 75% N/A £120.01 to £170.00 £220.01 to £270.00 £310.01 to £360.00 £170.01 to £220.00 £240.01 to £290.00 £320.01 to £370.00 Band 3 50% N/A £170.01 to £220.00 £270.01 to £320.00 £360.01 to £410.00 £220.01 to £270.00 £290.01 to £340.00 £370.01 to £420.00 Band 4 25% N/A £220.01 to £270.00 £320.01 to £370.00 £410.01 to £460.00 £270.01 to £320.00 £340.01 to £390.00 £420.01 to £470.00"
              table:
                header: Table 1
