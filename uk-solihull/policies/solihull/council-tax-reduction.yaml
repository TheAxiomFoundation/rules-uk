format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: uk-solihull/manual/council-tax-reduction-scheme-2026-2027/page-60
  summary: |-
    Solihull's operative 2026-27 working-age scheme is a four-band weekly-net-income discount scheme, not an excess-income taper. Paragraph 48.1 first limits the maximum Council Tax Reduction to 85 percent of eligible liability. Schedule 1 then selects a 85, 75, 50, or 25 percent band rate by family category and composes that rate onto the defined maximum. Capital of £16,000 or more gives no award. A £10 weekly deduction applies for each resident non-dependant, except where the applicant would but for this scheme receive a disability premium. The adopted working-age award surface prints no tariff-income rule and no minimum-award floor. Pension-age prescribed provisions are outside this local working-age module.
  deferred_outputs:
    - output: uk-solihull:policies/solihull/council-tax-reduction/sections-11-to-24-and-schedules-2-and-4#assessed_weekly_net_income
      reason: This award-surface module consumes the applicant-and-partner weekly net income after the scheme's income calculation, disregards, earnings, and Universal Credit assessment rules.
    - output: uk-solihull:policies/solihull/council-tax-reduction/sections-26-to-34-and-schedule-3#assessed_capital
      reason: This module applies the local £16,000 capital cliff but does not encode capital valuation, attribution, notional capital, or capital-disregard schedules.
    - output: uk-solihull:policies/solihull/council-tax-reduction/paragraphs-1.6-to-1.7#applicant_is_in_working_age_class
      reason: The claimant-and-partner pension-credit-age and qualifying-benefit classifier is consumed as an input to this working-age award surface.
    - output: uk-solihull:policies/solihull/council-tax-reduction/paragraphs-48.1-to-48.4#maximum_eligible_liability_for_year
      reason: This module consumes eligible liability after the scheme's daily calculation, statutory discounts, and joint-liability apportionment rules.
    - output: uk-solihull:policies/solihull/council-tax-reduction/schedule-1-paragraphs-2-to-4#family_category
      reason: The Schedule 1 household-family classifier is consumed as an input; this module applies every resulting table column.
    - output: uk-solihull:policies/solihull/council-tax-reduction/paragraphs-48.5-to-48.6#chargeable_non_dependant_count_and_disability_premium_protection
      reason: This module applies the printed flat deduction but consumes the resident non-dependant count and disability-premium protection classifier.
    - output: uk-solihull:policies/solihull/council-tax-reduction/pension-age-class-c#alternative_maximum_council_tax_reduction
      reason: The separate prescribed pension-age alternative maximum reduction is outside this working-age local-scheme module.
