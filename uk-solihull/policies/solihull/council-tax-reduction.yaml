          if solihull_council_tax_reduction_passported_to_band_1: solihull_council_tax_reduction_band_1_index else: if solihull_council_tax_reduction_assessed_weekly_net_income < solihull_council_tax_reduction_band_1_lower_weekly_income_by_family[solihull_council_tax_reduction_family_category]: solihull_council_tax_reduction_no_award_band_index else: if solihull_council_tax_reduction_assessed_weekly_net_income <= solihull_council_tax_reduction_band_1_upper_weekly_income_by_family[solihull_council_tax_reduction_family_category]: solihull_council_tax_reduction_band_1_index else: if solihull_council_tax_reduction_assessed_weekly_net_income <= solihull_council_tax_reduction_band_2_upper_weekly_income_by_family[solihull_council_tax_reduction_family_category]: solihull_council_tax_reduction_band_2_index else: if solihull_council_tax_reduction_assessed_weekly_net_income <= solihull_council_tax_reduction_band_3_upper_weekly_income_by_family[solihull_council_tax_reduction_family_category]: solihull_council_tax_reduction_band_3_index else: if solihull_council_tax_reduction_assessed_weekly_net_income <= solihull_council_tax_reduction_band_4_upper_weekly_income_by_family[solihull_council_tax_reduction_family_category]: solihull_council_tax_reduction_band_4_index else: solihull_council_tax_reduction_no_award_band_index

  - name: solihull_council_tax_reduction_selected_support_rate
