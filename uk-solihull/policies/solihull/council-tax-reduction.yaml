  - name: solihull_council_tax_reduction_non_dependant_deduction_applies
    kind: derived
    entity: Household
    dtype: Judgment
    period: Week
    source: Solihull Council Tax Reduction Scheme 2026/27 paragraphs 48.5-48.6
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: uk-solihull/manual/council-tax-reduction-scheme-2026-2027/page-44
              excerpt: "There shall be a deduction of £10 per week made in respect of any non-dependant who resides in the household."
          - path: versions[0].formula
            kind: exception
            source:
              corpus_citation_path: uk-solihull/manual/council-tax-reduction-scheme-2026-2027/page-44
              excerpt: "No non-dependant deductions shall be made where the applicant would, but for this scheme, have received a disability premium."
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          solihull_council_tax_reduction_has_chargeable_non_dependant and not solihull_council_tax_reduction_applicant_would_receive_disability_premium

  - name: solihull_council_tax_reduction_non_dependant_deduction_band
    kind: derived
    entity: Household
    dtype: Number
    period: Week
    source: Solihull Council Tax Reduction Scheme 2026/27 paragraphs 48.5-48.6
    metadata:
      proof:
        atoms:
