          south_kesteven_council_tax_reduction_non_dependant_weekly_hours >= south_kesteven_council_tax_reduction_remunerative_work_hours

  - name: south_kesteven_council_tax_reduction_non_dependant_income_band
    kind: derived
    entity: Person
    dtype: Number
    period: Week
    source: South Kesteven Council Tax Reduction Scheme 2026-2027 paragraph 30(1)-(2)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter_table
            source:
              corpus_citation_path: uk-south-kesteven/manual/council-tax-reduction-scheme-2026-2027/page-61
              excerpt: "normal gross weekly income is-- (a) less than £279.00, the deduction to be made under this paragraph is that specified in sub-paragraph (1)(b); (b) not less than £279.00 but less than £485.00, the deduction to be made under this paragraph is £10.60; (c) not less than £485.00 but less than £605.00, the deduction to be made under this paragraph is £13.30."
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          if not south_kesteven_council_tax_reduction_non_dependant_in_remunerative_work: 0 else: if south_kesteven_council_tax_reduction_non_dependant_normal_gross_weekly_income < south_kesteven_council_tax_reduction_non_dependant_mid_income_threshold_weekly: 0 else: if south_kesteven_council_tax_reduction_non_dependant_normal_gross_weekly_income < south_kesteven_council_tax_reduction_non_dependant_high_income_threshold_weekly: 1 else: if south_kesteven_council_tax_reduction_non_dependant_normal_gross_weekly_income < south_kesteven_council_tax_reduction_non_dependant_top_income_threshold_weekly: 2 else: 3

  - name: south_kesteven_council_tax_reduction_individual_non_dependant_deduction_for_year
    kind: derived
    entity: Person
    dtype: Money
    period: Year
    unit: GBP
    source: South Kesteven Council Tax Reduction Scheme 2026-2027 paragraph 30 working-age non-dependant deductions
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: uk-south-kesteven/manual/council-tax-reduction-scheme-2026-2027/page-61
              excerpt: "normal gross weekly income"
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: uk-south-kesteven/manual/council-tax-reduction-scheme-2026-2027/page-63
              excerpt: "No deduction is to be made in respect of a non-dependant"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          if not south_kesteven_council_tax_reduction_is_non_dependant or south_kesteven_council_tax_reduction_non_dependant_exempt: 0 else: south_kesteven_council_tax_reduction_weekly_deduction_by_income_band[south_kesteven_council_tax_reduction_non_dependant_income_band] * south_kesteven_council_tax_reduction_weeks_per_year

