    entity: Household
    dtype: Judgment
    period: Year
    source: South Kesteven Council Tax Reduction Scheme 2026-2027 working-age capital upper bound
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: uk-south-kesteven/manual/council-tax-reduction-scheme-2026-2027/page-53
              excerpt: "any person whose capital exceeds £16,000"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          south_kesteven_council_tax_reduction_assessed_capital_for_year <= south_kesteven_council_tax_reduction_capital_limit

  - name: south_kesteven_council_tax_reduction_tariff_income_for_year
    kind: derived
    entity: Household
    dtype: Money
    period: Year
    unit: GBP
    source: South Kesteven Council Tax Reduction Scheme 2026-2027 paragraph 72 working-age tariff income
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: uk-south-kesteven/manual/council-tax-reduction-scheme-2026-2027/page-132
              excerpt: "£1 for any excess which is not a complete £500"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          if south_kesteven_council_tax_reduction_has_universal_credit_award: 0 else: south_kesteven_council_tax_reduction_tariff_income_weekly_amount_per_step * ceil(max(0, south_kesteven_council_tax_reduction_assessed_capital_for_year - south_kesteven_council_tax_reduction_tariff_income_threshold) / south_kesteven_council_tax_reduction_tariff_income_step) * south_kesteven_council_tax_reduction_weeks_per_year

  - name: south_kesteven_council_tax_reduction_applicable_income_with_tariff_for_year
    kind: derived
    entity: Household
    dtype: Money
    period: Year
    unit: GBP
    source: South Kesteven Council Tax Reduction Scheme 2026-2027 income calculation including capital tariff
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: uk-south-kesteven/manual/council-tax-reduction-scheme-2026-2027/page-132
              excerpt: "is to be treated as if it were a weekly income"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          south_kesteven_council_tax_reduction_applicable_income_for_year + south_kesteven_council_tax_reduction_tariff_income_for_year

  - name: south_kesteven_council_tax_reduction_excess_income_for_year
    kind: derived
    entity: Household
    dtype: Money
    period: Year
    unit: GBP
