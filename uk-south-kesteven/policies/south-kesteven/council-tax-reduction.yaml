    entity: Household
    dtype: Money
    period: Year
    unit: GBP
    source: South Kesteven Council Tax Reduction Scheme 2026-2027 working-age classes D and E amount calculation
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: uk-south-kesteven/manual/council-tax-reduction-scheme-2026-2027/page-59
              excerpt: "less any deductions in respect of non-dependants"
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: uk-south-kesteven/manual/council-tax-reduction-scheme-2026-2027/page-67
              excerpt: "deducting amount B from amount A"
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: uk-south-kesteven/manual/council-tax-reduction-scheme-2026-2027/page-39
              excerpt: "who has made an application"
    versions:
