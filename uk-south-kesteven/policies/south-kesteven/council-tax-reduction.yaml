        formula: |-
          if south_kesteven_council_tax_reduction_relevant_income_based_benefit: 0 else: max(0, south_kesteven_council_tax_reduction_applicable_income_with_tariff_for_year - south_kesteven_council_tax_reduction_applicable_amount_for_year)

  - name: south_kesteven_council_tax_reduction_income_taper_deduction_for_year
    kind: derived
    entity: Household
    dtype: Money
    period: Year
    unit: GBP
    source: South Kesteven Council Tax Reduction Scheme 2026-2027 class E amount B
    metadata:
