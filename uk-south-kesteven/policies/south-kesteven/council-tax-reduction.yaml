  - name: south_kesteven_council_tax_reduction_weekly_deduction_by_income_band
    kind: parameter
    dtype: Money
    period: Week
    unit: GBP
    indexed_by: south_kesteven_council_tax_reduction_non_dependant_income_band
    source: South Kesteven Council Tax Reduction Scheme 2026-2027 paragraph 30(1)-(2)
    metadata:
      proof:
        atoms:
          - path: versions[0].values
            kind: parameter_table
            source:
              corpus_citation_path: uk-south-kesteven/manual/council-tax-reduction-scheme-2026-2027/page-61
              table:
                header: Working-age non-dependant normal gross weekly income and deduction
                row_key: income band
                column_key: weekly deduction
              excerpt: "(a) in respect of a non-dependant aged 18 or over in remunerative work, £15.95 x 1/7; (b) in respect of a non-dependant aged 18 or over to whom paragraph (a) does not apply, £5.20 x 1/7.\n\n(2) In the case of a non-dependant aged 18 or over to whom sub-para- graph (1)(a) applies, where it is shown to the appropriate authority that his normal gross weekly income is-- (a) less than £279.00, the deduction to be made under this paragraph is that specified in sub-paragraph (1)(b); (b) not less than £279.00 but less than £485.00, the deduction to be made under this paragraph is £10.60; (c) not less than £485.00 but less than £605.00, the deduction to be made under this paragraph is £13.30."
    versions:
      - effective_from: '2026-04-01'
        values:
          0: 5.20
          1: 10.60
          2: 13.30
          3: 15.95

  - name: south_kesteven_council_tax_reduction_working_age_scheme_applies
