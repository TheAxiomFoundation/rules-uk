              excerpt: "an award of universal credit"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          south_kesteven_council_tax_reduction_universal_credit_for_year > 0

  - name: south_kesteven_council_tax_reduction_applicable_amount_for_year
    kind: derived
    entity: Household
    dtype: Money
    period: Year
    unit: GBP
    source: South Kesteven Council Tax Reduction Scheme 2026-2027 applicable amount for working-age UC cases
    metadata:
