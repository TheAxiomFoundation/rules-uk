format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: uk-south-kesteven/manual/council-tax-reduction-scheme-2026-2027/page-67
    # upstream_source_check:
    #   status: delegated_scheme
    #   checked_paths: [uk/statutes/ukpga/1992/14/13A, uk/regulations/uksi/2012/2885, uk/regulations/uksi/2012/2886]
    #   rationale: Section 13A delegates the working-age scheme to South Kesteven District Council, so the Council's adopted document is the operative source for its local values and award calculation.
  summary: |-
    South Kesteven's operative 2026-27 working-age taper scheme covers 100 percent of eligible liability for ordinary classes D and F, but 80 percent for locally defined vulnerable classes E and G. Excess income is withdrawn at 2 6/7 percent per day (20 percent per week). Capital above £16,000 excludes an applicant; capital over £10,000 produces £1 weekly tariff income per £500 or part. Paragraph 30 supplies four non-dependant deduction bands. No minimum-award floor or council-tax band cap is printed. The pension-age and separate second-adult surfaces are outside this module.
  deferred_outputs:
    - output: uk-south-kesteven:policies/south-kesteven/council-tax-reduction/schedule-3#applicable_amount
      reason: Schedule 3's personal allowances and premium schedules are outside this award-surface module; the calculated applicable amount is consumed as an input.
    - output: uk-south-kesteven:policies/south-kesteven/council-tax-reduction/paragraphs-16a-and-17a#vulnerable_class
      reason: The detailed premium and Schedule 8 tests defining vulnerable classes E and G are outside this award-surface module; vulnerable status is consumed as an input.
    - output: uk-south-kesteven:policies/south-kesteven/council-tax-reduction/schedule-4#alternative_maximum_council_tax_reduction
      reason: The separate second-adult rebate calculation is outside this primary working-age award surface.
