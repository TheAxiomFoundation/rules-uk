              excerpt: "persons who are not pensioners who fall within any of classes D, F or H"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          local_authority_is_south_kesteven and council_tax_reduction_household_in_england and not council_tax_reduction_household_has_pensioner

  - name: south_kesteven_council_tax_reduction_has_universal_credit_award
    kind: derived
    entity: Household
    dtype: Judgment
    period: Year
