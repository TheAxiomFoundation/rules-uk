    versions: [{effective_from: '2026-04-01', formula: "if not south_oxfordshire_council_tax_reduction_has_chargeable_non_dependant or south_oxfordshire_council_tax_reduction_non_dependant_protected_or_exempt: south_oxfordshire_council_tax_reduction_tariff_income_weekly_amount_per_step - south_oxfordshire_council_tax_reduction_tariff_income_weekly_amount_per_step else: if not south_oxfordshire_council_tax_reduction_non_dependant_in_remunerative_work: south_oxfordshire_council_tax_reduction_non_dependant_other_weekly_deduction / south_oxfordshire_council_tax_reduction_days_per_week else: if south_oxfordshire_council_tax_reduction_non_dependant_normal_gross_weekly_income < south_oxfordshire_council_tax_reduction_non_dependant_low_income_threshold: south_oxfordshire_council_tax_reduction_non_dependant_low_weekly_deduction / south_oxfordshire_council_tax_reduction_days_per_week else: if south_oxfordshire_council_tax_reduction_non_dependant_normal_gross_weekly_income < south_oxfordshire_council_tax_reduction_non_dependant_middle_income_threshold: south_oxfordshire_council_tax_reduction_non_dependant_middle_weekly_deduction / south_oxfordshire_council_tax_reduction_days_per_week else: south_oxfordshire_council_tax_reduction_non_dependant_high_weekly_deduction / south_oxfordshire_council_tax_reduction_days_per_week"}]

