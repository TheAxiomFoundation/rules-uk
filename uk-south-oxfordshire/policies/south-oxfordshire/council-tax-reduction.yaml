format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: uk-south-oxfordshire/manual/council-tax-reduction-scheme-2026-2027/page-132
    # upstream_source_check:
    #   status: delegated_scheme
    #   checked_paths: [uk/statutes/ukpga/1992/14/13A, uk/regulations/uksi/2012/2885, uk/regulations/uksi/2012/2886]
    #   rationale: Section 13A delegates the working-age scheme to South Oxfordshire District Council, so its adopted scheme document is operative. The pinned singular source-verification contract strips this apply-stage attestation.
  summary: |-
    South Oxfordshire's adopted 2026-27 working-age scheme calculates a daily award from 100 percent of daily council-tax liability, less the daily excess-income taper and any non-dependant deduction. Pension-age provisions and second-adult rebate are outside this working-age award surface.
  deferred_outputs:
    - output: uk-south-oxfordshire:policies/south-oxfordshire/council-tax-reduction/parts-6-and-8#assessed_income_and_applicable_amount
      reason: Detailed income, capital valuation, disregard, and applicable-amount schedules are outside this award-surface module.
    - output: uk-south-oxfordshire:policies/south-oxfordshire/council-tax-reduction/rule-241-paragraphs-3-to-9#non_dependant_aggregation_and_exemption
      reason: Couple aggregation, apportionment, and protected or exempt non-dependant classification are consumed as inputs.
    - output: uk-south-oxfordshire:policies/south-oxfordshire/council-tax-reduction/rule-240-and-part-13#second_adult_rebate
      reason: Alternative maximum council tax reduction is a separate Class C award.
rules:
