  - name: south_oxfordshire_council_tax_reduction_tariff_income_daily
    kind: derived
    entity: Household
    dtype: Money
    period: Day
    unit: GBP
    source: South Oxfordshire Council Tax Reduction Scheme 2026/27 rule 138
    metadata:
