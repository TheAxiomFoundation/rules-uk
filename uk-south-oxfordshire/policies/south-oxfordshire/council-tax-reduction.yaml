    versions:
      - effective_from: '2026-04-01'
        formula: "if south_oxfordshire_council_tax_reduction_assessed_capital_for_year > south_oxfordshire_council_tax_reduction_tariff_income_threshold: ceil((south_oxfordshire_council_tax_reduction_assessed_capital_for_year - south_oxfordshire_council_tax_reduction_tariff_income_threshold) / south_oxfordshire_council_tax_reduction_tariff_income_step) * south_oxfordshire_council_tax_reduction_tariff_income_weekly_amount_per_step / south_oxfordshire_council_tax_reduction_days_per_week else: south_oxfordshire_council_tax_reduction_tariff_income_weekly_amount_per_step - south_oxfordshire_council_tax_reduction_tariff_income_weekly_amount_per_step"

