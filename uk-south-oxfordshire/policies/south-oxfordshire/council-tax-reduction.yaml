  - name: south_oxfordshire_council_tax_reduction_non_dependant_weekly_deduction_by_band
    kind: parameter
    dtype: Money
    period: Week
    unit: GBP
    indexed_by: south_oxfordshire_council_tax_reduction_non_dependant_deduction_band
    source: South Oxfordshire Council Tax Reduction Scheme 2026/27 rule 241(1)-(2)
    metadata:
      proof:
        atoms:
          - path: versions[0].values
            kind: parameter_table
            source:
              corpus_citation_path: uk-south-oxfordshire/manual/council-tax-reduction-scheme-2026-2027/page-134
              excerpt: "the non- dependant deductions in respect of a day referred to in section 239 (maximum council tax reduction) shall be; (a) in respect of a non-dependant aged 18 or over in remunerative work, £12.43 x 1/7; (b) in respect of a non-dependant aged 18 or over to whom sub- paragraph (a) does not apply, £4.20 x 1/7.\n\n(2) In the case of a non-dependant aged 18 or over to whom paragraph 241(1)(a) applies, where it is shown to the appropriate authority that his normal gross weekly income is- (a) less than £212.00, the deduction to be made under this paragraph shall be that specified in paragraph 239(1)(b); (b) not less than £212.00, but less than £364.00, the deduction to be made under this section shall be £8.19; (c) not less than £364.00, but less than £453.00, the deduction to be made under this section shall be £10.44;"
              table:
                header: "241 Non-dependant deductions"
                row_key: "deduction band"
                column_key: "weekly deduction"
    versions:
      - effective_from: '2026-04-01'
        values: {0: 0, 1: 4.20, 2: 12.43, 3: 8.19, 4: 10.44}

