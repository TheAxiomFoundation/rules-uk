    kind: derived
    entity: Household
    dtype: Money
    period: Day
    unit: GBP
    source: South Oxfordshire Council Tax Reduction Scheme 2026/27 rules 239 and 242
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: uk-south-oxfordshire/manual/council-tax-reduction-scheme-2026-2027/page-132
              excerpt: "shall be 100 per cent, of the amount A divided by B"
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: uk-south-oxfordshire/manual/council-tax-reduction-scheme-2026-2027/page-136
              excerpt: "their council tax reduction shall be calculated by deducting their excess income multiplied by the taper from their maximum council tax reduction as defined within rule 239 of this scheme"
    versions:
      - effective_from: '2026-04-01'
        formula: "if local_authority_is_south_oxfordshire and south_oxfordshire_council_tax_reduction_applicant_is_working_age and would_claim_council_tax_reduction and south_oxfordshire_council_tax_reduction_capital_eligible: max(0, south_oxfordshire_council_tax_reduction_daily_eligible_liability * south_oxfordshire_council_tax_reduction_maximum_support_rate - max(0, south_oxfordshire_council_tax_reduction_assessed_daily_income + south_oxfordshire_council_tax_reduction_tariff_income_daily - south_oxfordshire_council_tax_reduction_applicable_daily_amount) * south_oxfordshire_council_tax_reduction_daily_taper_rate - south_oxfordshire_council_tax_reduction_daily_non_dependant_deduction) else: south_oxfordshire_council_tax_reduction_daily_eligible_liability - south_oxfordshire_council_tax_reduction_daily_eligible_liability"
