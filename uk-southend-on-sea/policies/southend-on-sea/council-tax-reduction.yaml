  - name: southend_on_sea_council_tax_reduction_two_or_more_children_rate_by_band
    kind: parameter
    dtype: Rate
    period: Year
    indexed_by: southend_on_sea_council_tax_reduction_income_band
    source: Southend-on-Sea Council Tax Reduction Scheme 2026/27 Schedule 1
    metadata:
      proof:
        atoms:
          - {path: 'versions[0].values', kind: parameter_table, source: {corpus_citation_path: uk-southend-on-sea/manual/council-tax-reduction-scheme-2026-2027/page-59, excerpt: "Single or Couple – 2 or More Children 75% 75% 75% 50% 25% 0%", table: {header: "Weekly Income and Discounts", row_key: "Single or Couple – 2 or More Children", column_key: "Band 1 to Band 6"}}}
    versions:
      - effective_from: '2026-04-01'
        values: {0: 0.75, 1: 0.75, 2: 0.75, 3: 0.50, 4: 0.25, 5: 0}

  - name: southend_on_sea_council_tax_reduction_family_category
    kind: derived
    entity: Household
    dtype: Number
    period: Year
    source: Southend-on-Sea Council Tax Reduction Scheme 2026/27 Schedule 1
    metadata:
      proof:
        atoms:
          - {path: 'versions[0].formula', kind: parameter_table, source: *grid_source}
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          if southend_on_sea_council_tax_reduction_has_two_or_more_children: southend_on_sea_council_tax_reduction_family_category_codes[3] else: if southend_on_sea_council_tax_reduction_has_one_child: southend_on_sea_council_tax_reduction_family_category_codes[2] else: if southend_on_sea_council_tax_reduction_has_partner: southend_on_sea_council_tax_reduction_family_category_codes[1] else: southend_on_sea_council_tax_reduction_family_category_codes[0]

  - name: southend_on_sea_council_tax_reduction_income_band
    kind: derived
    entity: Household
    dtype: Number
    period: Week
    source: Southend-on-Sea Council Tax Reduction Scheme 2026/27 Schedule 1
    metadata:
      proof:
        atoms:
          - {path: 'versions[0].formula', kind: parameter_table, source: *grid_source}
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          if southend_on_sea_council_tax_reduction_assessed_weekly_income >= southend_on_sea_council_tax_reduction_band_6_lower_income: southend_on_sea_council_tax_reduction_income_band_codes[5] else: if southend_on_sea_council_tax_reduction_assessed_weekly_income >= southend_on_sea_council_tax_reduction_band_5_lower_income: southend_on_sea_council_tax_reduction_income_band_codes[4] else: if southend_on_sea_council_tax_reduction_assessed_weekly_income >= southend_on_sea_council_tax_reduction_band_4_lower_income: southend_on_sea_council_tax_reduction_income_band_codes[3] else: if southend_on_sea_council_tax_reduction_assessed_weekly_income >= southend_on_sea_council_tax_reduction_band_3_lower_income: southend_on_sea_council_tax_reduction_income_band_codes[2] else: if southend_on_sea_council_tax_reduction_assessed_weekly_income >= southend_on_sea_council_tax_reduction_band_2_lower_income: southend_on_sea_council_tax_reduction_income_band_codes[1] else: southend_on_sea_council_tax_reduction_income_band_codes[0]

  - name: southend_on_sea_council_tax_reduction_relevant_benefit
    kind: derived
    entity: Household
    dtype: Judgment
    period: Year
    source: Southend-on-Sea Council Tax Reduction Scheme 2026/27 Schedule 1 paragraph 7
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: uk-southend-on-sea/manual/council-tax-reduction-scheme-2026-2027/page-59
              excerpt: "Income Support, Income Related Employment and Support Allowance or Income Based Jobseeker’s Allowance"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          southend_on_sea_council_tax_reduction_receives_income_support
          or southend_on_sea_council_tax_reduction_receives_income_related_esa
          or southend_on_sea_council_tax_reduction_receives_income_based_jsa

  - name: southend_on_sea_council_tax_reduction_selected_income_band
    kind: derived
    entity: Household
    dtype: Number
    period: Week
    source: Southend-on-Sea Council Tax Reduction Scheme 2026/27 Schedule 1 paragraph 7
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: exception
            source:
              corpus_citation_path: uk-southend-on-sea/manual/council-tax-reduction-scheme-2026-2027/page-59
              excerpt: "discount will be awarded at Band 1 level."
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          if southend_on_sea_council_tax_reduction_relevant_benefit: southend_on_sea_council_tax_reduction_income_band_codes[0] else: southend_on_sea_council_tax_reduction_income_band

  - name: southend_on_sea_council_tax_reduction_selected_discount_rate
    kind: derived
    entity: Household
    dtype: Rate
    period: Year
    source: Southend-on-Sea Council Tax Reduction Scheme 2026/27 Schedule 1
    metadata:
      proof:
        atoms:
          - {path: 'versions[0].formula', kind: parameter_table, source: *grid_source}
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          if southend_on_sea_council_tax_reduction_family_category == southend_on_sea_council_tax_reduction_family_category_codes[3]: southend_on_sea_council_tax_reduction_two_or_more_children_rate_by_band[southend_on_sea_council_tax_reduction_selected_income_band] else: if southend_on_sea_council_tax_reduction_family_category == southend_on_sea_council_tax_reduction_family_category_codes[2]: southend_on_sea_council_tax_reduction_one_child_rate_by_band[southend_on_sea_council_tax_reduction_selected_income_band] else: if southend_on_sea_council_tax_reduction_family_category == southend_on_sea_council_tax_reduction_family_category_codes[1]: southend_on_sea_council_tax_reduction_couple_no_children_rate_by_band[southend_on_sea_council_tax_reduction_selected_income_band] else: southend_on_sea_council_tax_reduction_single_no_children_rate_by_band[southend_on_sea_council_tax_reduction_selected_income_band]

  - name: southend_on_sea_council_tax_reduction_capital_eligible
    kind: derived
    entity: Household
    dtype: Judgment
    period: Year
    source: Southend-on-Sea Council Tax Reduction Scheme 2026/27 paragraph 26.1
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: uk-southend-on-sea/manual/council-tax-reduction-scheme-2026-2027/page-31
              excerpt: "no reduction shall be granted when the applicant has an amount of £6,000 or greater."
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          southend_on_sea_council_tax_reduction_assessed_capital < southend_on_sea_council_tax_reduction_capital_limit

  - name: southend_on_sea_council_tax_reduction_maximum_amount_for_year
    kind: derived
    entity: Household
    dtype: Money
    period: Year
    unit: GBP
    source: Southend-on-Sea Council Tax Reduction Scheme 2026/27 paragraph 48.1
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: uk-southend-on-sea/manual/council-tax-reduction-scheme-2026-2027/page-42
              excerpt: "shall be 75 per cent, of the amount A divided by B"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          southend_on_sea_council_tax_reduction_eligible_annual_liability * southend_on_sea_council_tax_reduction_maximum_support_rate

  - name: southend_on_sea_council_tax_reduction_amount_before_eligibility
    kind: derived
    entity: Household
    dtype: Money
    period: Year
    unit: GBP
    source: Southend-on-Sea Council Tax Reduction Scheme 2026/27 Schedule 1 paragraphs 1-2
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: uk-southend-on-sea/manual/council-tax-reduction-scheme-2026-2027/page-59
              excerpt: "The amount of discount to be granted is to be based on the following factors: a. The maximum Council Tax Reduction as defined within this scheme;"
          - {path: 'versions[0].formula', kind: parameter_table, source: *grid_source}
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          min(southend_on_sea_council_tax_reduction_maximum_amount_for_year, southend_on_sea_council_tax_reduction_eligible_annual_liability * southend_on_sea_council_tax_reduction_selected_discount_rate)

  - name: southend_on_sea_council_tax_reduction_award_conditions_met
    kind: derived
    entity: Household
    dtype: Judgment
    period: Year
    source: Southend-on-Sea Council Tax Reduction Scheme 2026/27 Class D
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: uk-southend-on-sea/manual/council-tax-reduction-scheme-2026-2027/page-7
              excerpt: "not have capital savings of £6,000 or above"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          local_authority_is_southend_on_sea
          and southend_on_sea_council_tax_reduction_applicant_is_in_working_age_class
          and would_claim_council_tax_reduction
          and southend_on_sea_council_tax_reduction_capital_eligible

  - name: simulated_southend_on_sea_council_tax_reduction_annual_amount
    kind: derived
    entity: Household
    dtype: Money
    period: Year
    unit: GBP
    source: Southend-on-Sea Council Tax Reduction Scheme 2026/27 operative working-age award
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: uk-southend-on-sea/manual/council-tax-reduction-scheme-2026-2027/page-59
              excerpt: "shall be calculated on the basis of the following Banded Discount Scheme:"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          if southend_on_sea_council_tax_reduction_award_conditions_met: southend_on_sea_council_tax_reduction_amount_before_eligibility else: 0

  - name: southend_on_sea_council_tax_reduction_annual_amount
    kind: derived
    entity: Household
    dtype: Money
    period: Year
    unit: GBP
    source: Southend-on-Sea Council Tax Reduction Scheme 2026/27 operative working-age award
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: effective_period
            source:
              corpus_citation_path: uk-southend-on-sea/manual/council-tax-reduction-scheme-2026-2027/page-4
              excerpt: "effective from 1st April 2026 for a period of one financial year."
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: uk-southend-on-sea/manual/council-tax-reduction-scheme-2026-2027/page-59
              excerpt: "The authority’s Council Tax Reduction scheme from 2026/27 shall be calculated on the basis of the following Banded Discount Scheme:"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          simulated_southend_on_sea_council_tax_reduction_annual_amount

inputs:
