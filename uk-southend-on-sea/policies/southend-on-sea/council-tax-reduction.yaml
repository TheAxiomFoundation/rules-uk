              excerpt: &grid_excerpt "Weekly Income and Discounts Household Type Band 1 £0.00– £110.00 Band 2 £110.01– £185.00 Band 3 £185.01– £260.00 Band 4 £260.01– £335.00 Band 5 £335.01– £410.00 Band 6 £410.01+ Single – No Children 75% 50% 25% 0% 0% 0% Couple – No Children 75% 50% 25% 0% 0% 0% Single or Couple – 1 Child 75% 75% 50% 25% 0% 0% Single or Couple – 2 or More Children 75% 75% 75% 50% 25% 0%"
