  - {name: southend_on_sea_council_tax_reduction_has_one_child, entity: Household, dtype: Boolean, period: Year}
  - {name: southend_on_sea_council_tax_reduction_has_two_or_more_children, entity: Household, dtype: Boolean, period: Year}
  - {name: southend_on_sea_council_tax_reduction_receives_income_support, entity: Household, dtype: Boolean, period: Year}
  - {name: southend_on_sea_council_tax_reduction_receives_income_related_esa, entity: Household, dtype: Boolean, period: Year}
  - {name: southend_on_sea_council_tax_reduction_receives_income_based_jsa, entity: Household, dtype: Boolean, period: Year}
