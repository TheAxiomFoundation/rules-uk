format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: uk-southend-on-sea/manual/council-tax-reduction-scheme-2026-2027/page-59
  summary: |-
    Upstream-source status: delegated_scheme. LGFA 1992 section 13A delegates the working-age scheme to Southend-on-Sea, so the Council's adopted document is operative. Checked paths: uk/statutes/ukpga/1992/14/13A, uk/regulations/uksi/2012/2885, and uk/regulations/uksi/2012/2886. Southend-on-Sea's adopted 2026-27 working-age scheme is a six-band direct-discount grid, not an excess-income taper. It caps maximum reduction at 75 percent of liability, selects a 75, 50, 25, or zero percent direct discount by weekly income and family type, assigns passported applicants to Band 1, and excludes capital of £6,000 or more. The working-age text contains no tariff-income rule, non-dependant deduction schedule, minimum-award floor, or council-tax-band cap.
  deferred_outputs:
    - output: uk-southend-on-sea:policies/southend-on-sea/council-tax-reduction/sections-11-to-47-and-schedules-2-to-4#assessed_weekly_income
      reason: The award surface consumes weekly income and assessed capital after the scheme's detailed income, disregard, attribution, and valuation rules, which are outside this module.
    - output: uk-southend-on-sea:policies/southend-on-sea/council-tax-reduction/section-48#eligible_annual_liability
      reason: The award surface consumes council-tax liability after statutory discounts and joint-liability adjustments; valuation of that liability base is outside this module.
