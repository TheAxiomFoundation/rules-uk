  - name: southend_on_sea_council_tax_reduction_single_no_children_rate_by_band
    kind: parameter
    dtype: Rate
    period: Year
    indexed_by: southend_on_sea_council_tax_reduction_income_band
    source: Southend-on-Sea Council Tax Reduction Scheme 2026/27 Schedule 1
    metadata:
      proof:
        atoms:
          - {path: 'versions[0].values', kind: parameter_table, source: {corpus_citation_path: uk-southend-on-sea/manual/council-tax-reduction-scheme-2026-2027/page-59, excerpt: "Single – No Children 75% 50% 25% 0% 0% 0%", table: {header: "Weekly Income and Discounts", row_key: "Single – No Children", column_key: "Band 1 to Band 6"}}}
