    source: Southend-on-Sea Council Tax Reduction Scheme 2026/27 Schedule 1
    metadata:
      proof:
        atoms:
          - {path: 'versions[0].values', kind: parameter_table, source: {corpus_citation_path: uk-southend-on-sea/manual/council-tax-reduction-scheme-2026-2027/page-59, excerpt: "Single or Couple – 1 Child 75% 75% 50% 25% 0% 0%", table: {header: "Weekly Income and Discounts", row_key: "Single or Couple – 1 Child", column_key: "Band 1 to Band 6"}}}
    versions:
      - effective_from: '2026-04-01'
