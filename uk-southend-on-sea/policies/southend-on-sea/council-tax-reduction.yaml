  - {name: would_claim_council_tax_reduction, entity: Household, dtype: Boolean, period: Year}
  - {name: southend_on_sea_council_tax_reduction_applicant_is_in_working_age_class, entity: Household, dtype: Boolean, period: Year}
  - {name: southend_on_sea_council_tax_reduction_assessed_capital, entity: Household, dtype: Money, period: Year, unit: GBP}
  - {name: southend_on_sea_council_tax_reduction_assessed_weekly_income, entity: Household, dtype: Money, period: Week, unit: GBP}
  - {name: southend_on_sea_council_tax_reduction_eligible_annual_liability, entity: Household, dtype: Money, period: Year, unit: GBP}
