format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: uk-stevenage/manual/council-tax-reduction-scheme-2026-2027/page-73
    # upstream_source_check:
    #   status: delegated_scheme
    #   checked_paths: [uk/statutes/ukpga/1992/14/13A, uk/regulations/uksi/2012/2885, uk/regulations/uksi/2012/2886]
    #   rationale: LGFA 1992 section 13A delegates the working-age scheme to Stevenage Borough Council, so the adopted scheme document is the operative legal source for these locally set values. The pinned singular source-verification contract strips this attestation as a live field.
  summary: |-
    Upstream-source status: delegated_scheme. Checked paths: uk/statutes/ukpga/1992/14/13A, uk/regulations/uksi/2012/2885, and uk/regulations/uksi/2012/2886. LGFA 1992 section 13A delegates the working-age scheme to Stevenage Borough Council, so its adopted 2026-27 document is operative. Stevenage caps the section 57 maximum below 100 percent, at 91.5 percent of eligible liability, then subtracts non-dependant deductions from that capped maximum and subtracts the printed 2 6/7 percent daily excess-income taper. The weekly taper is derived from the printed seven-day divisor. Capital over £16,000 is excluded after Schedule 5 disregards; capital above £6,000 creates £1 weekly tariff income for each £250 or part thereof. Schedule 5 fully disregards capital for income support, income-based JSA, and income-related ESA cases. No protected 100-percent rate, minimum award, minimum-entitlement floor, or council-tax band cap is printed for this working-age award surface. Pension-age provisions and Class F second-adult reduction are out of scope.
  deferred_outputs:
    - output: uk-stevenage:policies/stevenage/council-tax-reduction/section-1.6#working_age_scheme_qualification
      reason: The award surface consumes the section 1.6 age-and-benefit qualification result; its detailed pension-credit-age and partner classification is outside this module.
    - output: uk-stevenage:policies/stevenage/council-tax-reduction/sections-12-to-32-and-schedules-1-to-4#applicable_amount_and_assessed_income
      reason: The award surface consumes applicable amount and income excluding tariff income; detailed premiums, earnings, Universal Credit, disregards, and childcare calculations are outside this module.
    - output: uk-stevenage:policies/stevenage/council-tax-reduction/sections-33-to-41-and-schedule-5#capital_after_other_disregards
      reason: This module applies the local capital cliff, tariff rule, and the Schedule 5 income-based-benefit disregard; detailed valuation, attribution, notional-capital, and other Schedule 5 disregard calculations are outside this module.
    - output: uk-stevenage:policies/stevenage/council-tax-reduction/section-6#non_dependant_in_remunerative_work
      reason: The section 58 deduction grid consumes the section 6 remunerative-work classification; its detailed paid-work and expected-payment test is outside this module.
    - output: uk-stevenage:policies/stevenage/council-tax-reduction/sections-58.3-to-58.9#household_non_dependant_deductions_for_year
      reason: This module encodes the individual deduction grid and consumes the annual household deduction after the printed couple, protection, exemption, and apportionment rules are applied.
    - output: uk-stevenage:policies/stevenage/council-tax-reduction/sections-60-to-63-and-schedule-2#extended_and_second_adult_reduction
      reason: Extended reductions and the Class F alternative maximum council tax reduction are separate from this Classes D and E working-age award surface.
