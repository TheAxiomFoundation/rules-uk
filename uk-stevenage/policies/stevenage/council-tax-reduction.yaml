    dtype: Rate
    source: Stevenage Borough Council Council Tax Reduction Scheme 2026/27 section 57.1
    metadata:
      proof:
        atoms:
          - path: versions[0].effective_from
            kind: effective_period
            source:
              corpus_citation_path: uk-stevenage/manual/council-tax-reduction-scheme-2026-2027/page-5
              excerpt: "effective from 1st April 2026 for a period of one financial year."
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: uk-stevenage/manual/council-tax-reduction-scheme-2026-2027/page-71
              excerpt: "the amount of a person’s maximum council tax reduction in respect of a day for which he is liable to pay council tax, shall be 91.5 per cent, of the amount A divided by B where;"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          0.915

  - name: stevenage_council_tax_reduction_capital_limit
    kind: parameter
    dtype: Money
    period: Year
    unit: GBP
