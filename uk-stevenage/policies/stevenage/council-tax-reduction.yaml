              excerpt: "58.1 Subject to the following provisions of this paragraph, the non-dependant deductions in respect of a day referred to in section 29 (maximum council tax reduction) shall be; (a) in respect of a non-dependant aged 18 or over in remunerative work, £15.95 x 1/7; (b) in respect of a non-dependant aged 18 or over to whom sub-paragraph (a) does not apply, £5.20 x 1/7. 58.2 In the case of a non-dependant aged 18 or over, where it is shown to the appropriate authority that his normal gross weekly income is– (a) less than £279.00, the deduction to be made under this paragraph shall be that specified in paragraph 58.1(b); (b) not less than £279.00, but less than £485.00, the deduction to be made under this section shall be £10.60 x1/7; (c) not less than £485.00, but less than £605.00, the deduction to be made under this section shall be £13.30 x 1/7;"
              table:
                header: Normal gross weekly income and deduction band
                row_key: gross weekly income
                column_key: deduction band
          - path: versions[0].formula
            kind: exception
            source:
              corpus_citation_path: uk-stevenage/manual/council-tax-reduction-scheme-2026-2027/page-72
              excerpt: "No deduction shall be made in respect of any non-dependants occupying an applicant’s dwelling"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          if not stevenage_council_tax_reduction_non_dependant_deduction_applies: stevenage_council_tax_reduction_no_non_dependant_deduction_band else: if stevenage_council_tax_reduction_non_dependant_income_below_mid_threshold: stevenage_council_tax_reduction_low_non_dependant_deduction_band else: if stevenage_council_tax_reduction_non_dependant_income_below_high_threshold: stevenage_council_tax_reduction_mid_non_dependant_deduction_band else: if stevenage_council_tax_reduction_non_dependant_income_below_top_threshold: stevenage_council_tax_reduction_high_non_dependant_deduction_band else: if stevenage_council_tax_reduction_non_dependant_in_remunerative_work: stevenage_council_tax_reduction_top_non_dependant_deduction_band else: stevenage_council_tax_reduction_low_non_dependant_deduction_band

