  - name: stevenage_council_tax_reduction_non_dependant_deduction_band
    kind: derived
    entity: Person
    dtype: Number
    period: Week
    source: Stevenage Borough Council Council Tax Reduction Scheme 2026/27 sections 58.1 and 58.2
    metadata:
