format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: uk-stratford-on-avon/manual/council-tax-reduction-scheme-2026-2027/page-74
    # upstream_source_check:
    # status: delegated_scheme
    # checked_paths: [uk/statutes/ukpga/1992/14/13A, uk/regulations/uksi/2012/2885, uk/regulations/uksi/2012/2886]
    # rationale: LGFA 1992 section 13A delegates the working-age scheme to Stratford-on-Avon District Council, so the adopted document is operative. The apply-stage encoder strips this attestation to the singular source-verification contract after local gates pass.
  summary: |-
    Stratford-on-Avon's adopted 2026-27 working-age scheme is a means test. Its
    maximum is 80 percent of eligible liability, less non-dependant deductions;
    excess income is then deducted at 2 6/7 percent daily, or exactly 20 percent
    weekly, from that defined maximum. Capital above £16,000 ends entitlement;
    capital above £6,000 produces £1 weekly tariff income for each £250 or part
    thereof. The scheme prints no minimum-award floor, council-tax band cap, or
    protected higher maximum rate. Class D income-based-benefit cases receive
    the untapered maximum. Pension-age provisions, second-adult reduction,
    applicable-amount schedules, and the detailed classification and aggregation
    of non-dependants are outside this working-age award-surface module.
  deferred_outputs:
    - output: uk-stratford-on-avon:policies/stratford-on-avon/council-tax-reduction/sections-12-to-14-and-schedule-1#applicable_amount
      reason: Personal allowances, family premium protection, premiums, components, transitional additions, and Universal Credit maximum-amount assessment determine the applicable amount consumed by this award surface.
    - output: uk-stratford-on-avon:policies/stratford-on-avon/council-tax-reduction/section-1#working_age_applicant_classification
      reason: Section 1's age, partner, and qualifying-income-based-benefit classification determines whether an applicant is in the locally administered working-age classes consumed by this award surface.
    - output: uk-stratford-on-avon:policies/stratford-on-avon/council-tax-reduction/sections-15-to-41-and-schedules-3-to-5#assessed_income_and_capital
      reason: Income calculation, disregards, capital valuation, attribution, and Schedule 5 disregards produce the assessed income and capital consumed by this module.
    - output: uk-stratford-on-avon:policies/stratford-on-avon/council-tax-reduction/section-6#non_dependant_is_in_remunerative_work
      reason: The section 6 average-hours, holiday, income-related-benefit, family-leave, illness, and unpaid-sports-award rules determine the day-specific remunerative-work status consumed by the non-dependant deduction bands.
    - output: uk-stratford-on-avon:policies/stratford-on-avon/council-tax-reduction/paragraphs-57.2-to-57.4#maximum_eligible_liability
      reason: Discounts, joint-liability apportionment, and the liable-person calculation determine the eligible council-tax liability consumed by the local maximum formula.
    - output: uk-stratford-on-avon:policies/stratford-on-avon/council-tax-reduction/paragraphs-58.3-to-58.9#non_dependant_exemption_and_aggregate_deduction
      reason: Couple and polygamous-marriage treatment, apportionment, claimant protections, exemptions, and aggregation determine whether and how person-level deductions combine into the household deduction consumed by the maximum formula.
    - output: uk-stratford-on-avon:policies/stratford-on-avon/council-tax-reduction/sections-60-to-61E#extended_reduction
      reason: Extended-reduction eligibility and duration are a distinct award route outside the ordinary Class D and E award surface encoded here.
    - output: uk-stratford-on-avon:policies/stratford-on-avon/council-tax-reduction/section-62-and-schedule-2#second_adult_reduction
      reason: The separate Class F alternative maximum Council Tax Reduction is outside this working-age main-award surface.
