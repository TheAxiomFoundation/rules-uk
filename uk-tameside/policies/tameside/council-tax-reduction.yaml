format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: uk-tameside/manual/council-tax-support-scheme-2026-2027/page-61
    # upstream_source_check:
      # status: delegated_scheme
      # checked_paths: [uk/statutes/ukpga/1992/14/13A, uk/regulations/uksi/2012/2885, uk/regulations/uksi/2012/2886]
      # rationale: LGFA 1992 section 13A delegates the working-age scheme to this authority so the adopted document is operative.
  summary: |-
    Tameside's adopted 2026/27 working-age scheme applies its four weekly-income discount bands to the scheme-defined maximum Council Tax Reduction. That maximum is 75 percent of the lower of discounted actual liability and discounted Band A liability. Capital of £6,000 or above gives no award, Band 4 gives zero, specified passported benefits give Band 1, and the scheme states that there are no non-dependant deductions. The local award provisions state no excess-income taper or minimum-entitlement floor. Pension-age provisions are outside this module.
  deferred_outputs:
    - output: uk-tameside:policies/tameside/council-tax-reduction/sections-2-to-47-and-schedules-2-to-3#assessed_weekly_income
      reason: The award surface consumes the scheme-defined weekly income after its detailed income, disregard, and attribution rules.
    - output: uk-tameside:policies/tameside/council-tax-reduction/sections-2-to-47-and-schedules-2-to-3#assessed_capital
      reason: The award surface consumes capital after the detailed valuation, attribution, and disregard rules.
    - output: uk-tameside:policies/tameside/council-tax-reduction/paragraph-48#actual_and_band_a_annual_liability
      reason: Liability, discounts, and joint-liability shares are boundary inputs to paragraph 48's lower-of calculation.
