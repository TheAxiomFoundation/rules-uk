        formula: |-
          if tameside_council_tax_reduction_assessed_weekly_income < tameside_council_tax_reduction_band_2_lower_weekly_income_by_family[tameside_council_tax_reduction_family_category]: tameside_council_tax_reduction_income_band_codes[tameside_council_tax_reduction_income_band_1_code] else: if tameside_council_tax_reduction_assessed_weekly_income < tameside_council_tax_reduction_band_3_lower_weekly_income_by_family[tameside_council_tax_reduction_family_category]: tameside_council_tax_reduction_income_band_codes[tameside_council_tax_reduction_income_band_2_code] else: if tameside_council_tax_reduction_assessed_weekly_income < tameside_council_tax_reduction_band_4_lower_weekly_income_by_family[tameside_council_tax_reduction_family_category]: tameside_council_tax_reduction_income_band_codes[tameside_council_tax_reduction_income_band_3_code] else: if tameside_council_tax_reduction_assessed_weekly_income <= tameside_council_tax_reduction_last_discount_band_upper_weekly_income_by_family[tameside_council_tax_reduction_family_category]: tameside_council_tax_reduction_income_band_codes[tameside_council_tax_reduction_income_band_4_code] else: tameside_council_tax_reduction_income_band_codes[tameside_council_tax_reduction_income_band_no_award_code]

