  local_authority_is_tamworth: {dtype: Boolean, entity: Household, period: Year}
  council_tax_reduction_household_in_england: {dtype: Boolean, entity: Household, period: Year}
  would_claim_council_tax_reduction: {dtype: Boolean, entity: Household, period: Year}
  tamworth_council_tax_reduction_applicant_is_in_working_age_class: {dtype: Boolean, entity: Household, period: Year}
  tamworth_council_tax_reduction_assessed_capital_for_year: {dtype: Money, entity: Household, period: Year, unit: GBP}
  tamworth_council_tax_reduction_maximum_eligible_liability_for_year: {dtype: Money, entity: Household, period: Year, unit: GBP}
  tamworth_council_tax_reduction_assessed_weekly_income: {dtype: Money, entity: Household, period: Week, unit: GBP}
  tamworth_council_tax_reduction_has_partner: {dtype: Boolean, entity: Household, period: Week}
  tamworth_council_tax_reduction_dependant_child_count: {dtype: Integer, entity: Household, period: Week}
  tamworth_council_tax_reduction_applicant_or_partner_receives_income_support: {dtype: Boolean, entity: Household, period: Week}
  tamworth_council_tax_reduction_applicant_or_partner_receives_income_related_esa: {dtype: Boolean, entity: Household, period: Week}
  tamworth_council_tax_reduction_applicant_or_partner_receives_income_based_jsa: {dtype: Boolean, entity: Household, period: Week}
