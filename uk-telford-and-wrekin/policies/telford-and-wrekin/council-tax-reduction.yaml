    metadata: *grid_table_proof
    versions:
      - effective_from: '2026-04-01'
        values: {0: 388.05, 1: 0.00, 2: 233.87, 3: 285.26, 4: 336.66}

  - name: telford_and_wrekin_council_tax_reduction_two_plus_children_lower_bound_by_band
    kind: parameter
    dtype: Money
    period: Week
    unit: GBP
    indexed_by: telford_and_wrekin_council_tax_reduction_selected_band_index
    source: Telford and Wrekin Council Tax Reduction Scheme 2026/27 Schedule 1
    metadata: *grid_table_proof
    versions:
      - effective_from: '2026-04-01'
        values: {0: 490.85, 1: 0.00, 2: 317.39, 3: 375.22, 4: 433.03}

  - name: telford_and_wrekin_council_tax_reduction_no_non_dependant_band_index
    kind: parameter
    dtype: Integer
    source: Telford and Wrekin Council Tax Reduction Scheme 2026/27 paragraph 58.1
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: amount
            source: &nondep_atom
              corpus_citation_path: uk-telford-and-wrekin/manual/council-tax-reduction-scheme-2026-2027/page-66
              excerpt: "58.1 There shall be no non dependant deductions"
    versions: [{effective_from: '2026-04-01', formula: "0"}]

  - name: telford_and_wrekin_council_tax_reduction_non_dependant_deduction_by_band
    kind: parameter
    dtype: Money
