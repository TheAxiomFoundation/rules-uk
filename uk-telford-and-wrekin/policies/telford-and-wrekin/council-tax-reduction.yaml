  - name: telford_and_wrekin_council_tax_reduction_working_age_scheme_applies
    kind: derived
    entity: Household
    dtype: Judgment
    period: Year
    source: Telford and Wrekin Council Tax Reduction Scheme 2026/27 paragraph 1.6
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: uk-telford-and-wrekin/manual/council-tax-reduction-scheme-2026-2027/page-8
              excerpt: "THE SCHEME FOR WORKING AGE APPLICANTS – THE COUNCIL’S LOCAL SCHEME"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          local_authority_is_telford_and_wrekin and council_tax_reduction_household_in_england and telford_and_wrekin_council_tax_reduction_applicant_is_in_working_age_class and would_claim_council_tax_reduction

  - name: telford_and_wrekin_council_tax_reduction_passported
    kind: derived
    entity: Household
    dtype: Judgment
    period: Week
    source: Telford and Wrekin Council Tax Reduction Scheme 2026/27 Schedule 1 paragraph 7
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: uk-telford-and-wrekin/manual/council-tax-reduction-scheme-2026-2027/page-96
              excerpt: "Where an applicant or partner is in receipt of a ‘relevant benefit*’ namely Income Support, Income Related Employment and Support Allowance or Income Based Jobseeker’s Allowance, discount will be awarded at Band 1 level."
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          telford_and_wrekin_council_tax_reduction_receives_income_support or telford_and_wrekin_council_tax_reduction_receives_income_related_esa or telford_and_wrekin_council_tax_reduction_receives_income_based_jsa

  - name: telford_and_wrekin_council_tax_reduction_family_category_index
    kind: derived
    entity: Household
    dtype: Integer
    period: Week
    source: Telford and Wrekin Council Tax Reduction Scheme 2026/27 Schedule 1
    metadata: {proof: {atoms: [{path: 'versions[0].formula', kind: parameter_table, source: *grid_atom}]}}
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          if telford_and_wrekin_council_tax_reduction_has_two_or_more_dependant_children: 3 else: if telford_and_wrekin_council_tax_reduction_has_dependant_child: 2 else: if telford_and_wrekin_council_tax_reduction_has_partner: 1 else: 0

  - name: telford_and_wrekin_council_tax_reduction_band_2_lower_bound
    kind: derived
    entity: Household
    dtype: Money
    period: Week
    unit: GBP
    source: Telford and Wrekin Council Tax Reduction Scheme 2026/27 Schedule 1
    metadata: &grid_formula_proof
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter_table
            source: *grid_atom
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          if telford_and_wrekin_council_tax_reduction_family_category_index == 0: telford_and_wrekin_council_tax_reduction_single_lower_bound_by_band[telford_and_wrekin_council_tax_reduction_band_2_index] else: if telford_and_wrekin_council_tax_reduction_family_category_index == 1: telford_and_wrekin_council_tax_reduction_couple_lower_bound_by_band[telford_and_wrekin_council_tax_reduction_band_2_index] else: if telford_and_wrekin_council_tax_reduction_family_category_index == 2: telford_and_wrekin_council_tax_reduction_one_child_lower_bound_by_band[telford_and_wrekin_council_tax_reduction_band_2_index] else: telford_and_wrekin_council_tax_reduction_two_plus_children_lower_bound_by_band[telford_and_wrekin_council_tax_reduction_band_2_index]

  - name: telford_and_wrekin_council_tax_reduction_band_3_lower_bound
    kind: derived
    entity: Household
    dtype: Money
    period: Week
    unit: GBP
    source: Telford and Wrekin Council Tax Reduction Scheme 2026/27 Schedule 1
    metadata: *grid_formula_proof
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          if telford_and_wrekin_council_tax_reduction_family_category_index == 0: telford_and_wrekin_council_tax_reduction_single_lower_bound_by_band[telford_and_wrekin_council_tax_reduction_band_3_index] else: if telford_and_wrekin_council_tax_reduction_family_category_index == 1: telford_and_wrekin_council_tax_reduction_couple_lower_bound_by_band[telford_and_wrekin_council_tax_reduction_band_3_index] else: if telford_and_wrekin_council_tax_reduction_family_category_index == 2: telford_and_wrekin_council_tax_reduction_one_child_lower_bound_by_band[telford_and_wrekin_council_tax_reduction_band_3_index] else: telford_and_wrekin_council_tax_reduction_two_plus_children_lower_bound_by_band[telford_and_wrekin_council_tax_reduction_band_3_index]

  - name: telford_and_wrekin_council_tax_reduction_band_4_lower_bound
    kind: derived
    entity: Household
    dtype: Money
    period: Week
    unit: GBP
    source: Telford and Wrekin Council Tax Reduction Scheme 2026/27 Schedule 1
    metadata: *grid_formula_proof
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          if telford_and_wrekin_council_tax_reduction_family_category_index == 0: telford_and_wrekin_council_tax_reduction_single_lower_bound_by_band[telford_and_wrekin_council_tax_reduction_band_4_index] else: if telford_and_wrekin_council_tax_reduction_family_category_index == 1: telford_and_wrekin_council_tax_reduction_couple_lower_bound_by_band[telford_and_wrekin_council_tax_reduction_band_4_index] else: if telford_and_wrekin_council_tax_reduction_family_category_index == 2: telford_and_wrekin_council_tax_reduction_one_child_lower_bound_by_band[telford_and_wrekin_council_tax_reduction_band_4_index] else: telford_and_wrekin_council_tax_reduction_two_plus_children_lower_bound_by_band[telford_and_wrekin_council_tax_reduction_band_4_index]

  - name: telford_and_wrekin_council_tax_reduction_last_discount_band_upper_bound
    kind: derived
    entity: Household
    dtype: Money
    period: Week
    unit: GBP
    source: Telford and Wrekin Council Tax Reduction Scheme 2026/27 Schedule 1
    metadata: *grid_formula_proof
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          if telford_and_wrekin_council_tax_reduction_family_category_index == 0: telford_and_wrekin_council_tax_reduction_single_lower_bound_by_band[telford_and_wrekin_council_tax_reduction_zero_band_index] else: if telford_and_wrekin_council_tax_reduction_family_category_index == 1: telford_and_wrekin_council_tax_reduction_couple_lower_bound_by_band[telford_and_wrekin_council_tax_reduction_zero_band_index] else: if telford_and_wrekin_council_tax_reduction_family_category_index == 2: telford_and_wrekin_council_tax_reduction_one_child_lower_bound_by_band[telford_and_wrekin_council_tax_reduction_zero_band_index] else: telford_and_wrekin_council_tax_reduction_two_plus_children_lower_bound_by_band[telford_and_wrekin_council_tax_reduction_zero_band_index]

  - name: telford_and_wrekin_council_tax_reduction_selected_band_index
    kind: derived
    entity: Household
    dtype: Integer
    period: Week
    source: Telford and Wrekin Council Tax Reduction Scheme 2026/27 Schedule 1
    metadata: {proof: {atoms: [{path: 'versions[0].formula', kind: parameter_table, source: *grid_atom}]}}
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          if telford_and_wrekin_council_tax_reduction_passported: telford_and_wrekin_council_tax_reduction_band_1_index else: if telford_and_wrekin_council_tax_reduction_assessed_weekly_income < telford_and_wrekin_council_tax_reduction_band_2_lower_bound: telford_and_wrekin_council_tax_reduction_band_1_index else: if telford_and_wrekin_council_tax_reduction_assessed_weekly_income < telford_and_wrekin_council_tax_reduction_band_3_lower_bound: telford_and_wrekin_council_tax_reduction_band_2_index else: if telford_and_wrekin_council_tax_reduction_assessed_weekly_income < telford_and_wrekin_council_tax_reduction_band_4_lower_bound: telford_and_wrekin_council_tax_reduction_band_3_index else: if telford_and_wrekin_council_tax_reduction_assessed_weekly_income <= telford_and_wrekin_council_tax_reduction_last_discount_band_upper_bound: telford_and_wrekin_council_tax_reduction_band_4_index else: telford_and_wrekin_council_tax_reduction_zero_band_index

  - name: telford_and_wrekin_council_tax_reduction_selected_support_rate
    kind: derived
    entity: Household
    dtype: Rate
    period: Week
    source: Telford and Wrekin Council Tax Reduction Scheme 2026/27 Schedule 1
    metadata: *grid_formula_proof
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          telford_and_wrekin_council_tax_reduction_support_rate_by_band[telford_and_wrekin_council_tax_reduction_selected_band_index]

  - name: telford_and_wrekin_council_tax_reduction_capital_eligible
    kind: derived
    entity: Household
    dtype: Judgment
    period: Year
    source: Telford and Wrekin Council Tax Reduction Scheme 2026/27 paragraph 33.1
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: uk-telford-and-wrekin/manual/council-tax-reduction-scheme-2026-2027/page-48
              excerpt: "the prescribed amount is £6,000 and no support shall be granted when the applicant has an amount greater than this level"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          telford_and_wrekin_council_tax_reduction_assessed_capital_for_year <= telford_and_wrekin_council_tax_reduction_capital_limit

  - name: telford_and_wrekin_council_tax_reduction_maximum_for_year
    kind: derived
    entity: Household
    dtype: Money
    period: Year
    unit: GBP
    source: Telford and Wrekin Council Tax Reduction Scheme 2026/27 paragraph 57.1
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: uk-telford-and-wrekin/manual/council-tax-reduction-scheme-2026-2027/page-66
              excerpt: "shall be 100 per cent, of the amount A divided by B"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          telford_and_wrekin_council_tax_reduction_maximum_eligible_liability_for_year * telford_and_wrekin_council_tax_reduction_maximum_liability_rate

  - name: telford_and_wrekin_council_tax_reduction_non_dependant_deduction_weekly
    kind: derived
    entity: Household
    dtype: Money
    period: Week
    unit: GBP
    source: Telford and Wrekin Council Tax Reduction Scheme 2026/27 paragraph 58.1
    metadata: {proof: {atoms: [{path: 'versions[0].formula', kind: parameter_table, source: *nondep_atom}]}}
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          telford_and_wrekin_council_tax_reduction_non_dependant_deduction_by_band[telford_and_wrekin_council_tax_reduction_no_non_dependant_band_index]

  - name: simulated_telford_and_wrekin_council_tax_reduction_annual_amount
    kind: derived
    entity: Household
    dtype: Money
    period: Year
    unit: GBP
    source: Telford and Wrekin Council Tax Reduction Scheme 2026/27 Schedule 1 paragraphs 1-5
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: uk-telford-and-wrekin/manual/council-tax-reduction-scheme-2026-2027/page-96
              excerpt: "The authority’s Council Tax Reduction scheme from 2026/27 shall be calculated on the basis of the following Banded Discount Scheme"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          if telford_and_wrekin_council_tax_reduction_working_age_scheme_applies and telford_and_wrekin_council_tax_reduction_capital_eligible: max(0, telford_and_wrekin_council_tax_reduction_maximum_for_year * telford_and_wrekin_council_tax_reduction_selected_support_rate) else: 0

  - name: telford_and_wrekin_council_tax_reduction_annual_amount
    kind: derived
    entity: Household
    dtype: Money
    period: Year
    unit: GBP
    source: Telford and Wrekin Council Tax Reduction Scheme 2026/27 working-age award
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: uk-telford-and-wrekin/manual/council-tax-reduction-scheme-2026-2027/page-96
              excerpt: "The authority’s Council Tax Reduction scheme from 2026/27 shall be calculated on the basis of the following Banded Discount Scheme"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          simulated_telford_and_wrekin_council_tax_reduction_annual_amount

inputs:
  local_authority_is_telford_and_wrekin: {dtype: Boolean, entity: Household, period: Year}
  council_tax_reduction_household_in_england: {dtype: Boolean, entity: Household, period: Year}
  would_claim_council_tax_reduction: {dtype: Boolean, entity: Household, period: Year}
  telford_and_wrekin_council_tax_reduction_applicant_is_in_working_age_class: {dtype: Boolean, entity: Household, period: Year}
  telford_and_wrekin_council_tax_reduction_assessed_capital_for_year: {dtype: Money, entity: Household, period: Year, unit: GBP}
  telford_and_wrekin_council_tax_reduction_maximum_eligible_liability_for_year: {dtype: Money, entity: Household, period: Year, unit: GBP}
  telford_and_wrekin_council_tax_reduction_assessed_weekly_income: {dtype: Money, entity: Household, period: Week, unit: GBP}
  telford_and_wrekin_council_tax_reduction_has_partner: {dtype: Boolean, entity: Household, period: Week}
