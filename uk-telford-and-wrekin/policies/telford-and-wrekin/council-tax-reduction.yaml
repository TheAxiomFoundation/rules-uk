    source: Telford and Wrekin Council Tax Reduction Scheme 2026/27 Schedule 1
    metadata: {proof: {atoms: [{path: 'versions[0].formula', kind: amount, source: *grid_atom}]}}
    versions: [{effective_from: '2026-04-01', formula: "0"}]

  - name: telford_and_wrekin_council_tax_reduction_support_rate_by_band
    kind: parameter
    dtype: Rate
    indexed_by: telford_and_wrekin_council_tax_reduction_selected_band_index
    source: Telford and Wrekin Council Tax Reduction Scheme 2026/27 Schedule 1
    metadata:
      proof:
        atoms:
          - path: versions[0].values
            kind: parameter_table
            source:
              <<: *grid_atom
              table: {header: Council Tax Reduction level and family income grid, row_key: level, column_key: reduction percentage}
    versions:
      - effective_from: '2026-04-01'
        values: {0: 0, 1: 0.90, 2: 0.75, 3: 0.50, 4: 0.25}

  - name: telford_and_wrekin_council_tax_reduction_single_lower_bound_by_band
