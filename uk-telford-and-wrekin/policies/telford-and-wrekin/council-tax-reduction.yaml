    metadata: *grid_table_proof
    versions:
      - effective_from: '2026-04-01'
        values: {0: 286.53, 1: 0.00, 2: 151.62, 3: 196.60, 4: 241.57}

  - name: telford_and_wrekin_council_tax_reduction_one_child_lower_bound_by_band
    kind: parameter
    dtype: Money
