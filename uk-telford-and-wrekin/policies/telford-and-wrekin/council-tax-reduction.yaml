    metadata: &grid_table_proof
      proof:
        atoms:
          - path: versions[0].values
            kind: parameter_table
            source:
              <<: *grid_atom
              table: {header: Council Tax Reduction level and family income grid, row_key: level, column_key: weekly income range}
    versions:
      - effective_from: '2026-04-01'
        values: {0: 212.00, 1: 0.00, 2: 96.37, 3: 134.92, 4: 173.47}

  - name: telford_and_wrekin_council_tax_reduction_couple_lower_bound_by_band
    kind: parameter
    dtype: Money
    period: Week
    unit: GBP
    indexed_by: telford_and_wrekin_council_tax_reduction_selected_band_index
