    metadata: {proof: {atoms: [{path: 'versions[0].formula', kind: amount, source: *grid_atom}]}}
    versions: [{effective_from: '2026-04-01', formula: "4"}]

  - name: telford_and_wrekin_council_tax_reduction_zero_band_index
    kind: parameter
