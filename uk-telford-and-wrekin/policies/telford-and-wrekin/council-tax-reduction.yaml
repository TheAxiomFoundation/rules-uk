format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: uk-telford-and-wrekin/manual/council-tax-reduction-scheme-2026-2027/page-96
  summary: |-
    Upstream source check status: delegated_scheme. Checked paths: uk/statutes/ukpga/1992/14/13A, uk/regulations/uksi/2012/2885, and uk/regulations/uksi/2012/2886. Section 13A delegates the working-age scheme to Telford and Wrekin Council, so its adopted scheme document is the operative source for the local award rules. Telford and Wrekin's operative 2026-27 working-age scheme is a banded discount scheme, not the pension-age taper printed on page 7. It applies direct discounts of 90, 75, 50, 25, or zero percent to the scheme maximum, with family-specific weekly income bands and a capital cliff above £6,000. The working-age scheme expressly has no non-dependant deductions and contains no tariff-income rule.
  deferred_outputs:
    - output: uk-telford-and-wrekin:policies/telford-and-wrekin/council-tax-reduction/sections-15-to-32-and-schedules-3-to-4#assessed_weekly_income
      reason: The underlying income calculation and disregard schedules are outside this award-surface module.
    - output: uk-telford-and-wrekin:policies/telford-and-wrekin/council-tax-reduction/sections-33-to-41-and-schedule-5#assessed_capital
      reason: Capital valuation, attribution, and disregard rules are outside this award-surface module.
rules:
  - name: telford_and_wrekin_council_tax_reduction_maximum_liability_rate
    kind: parameter
    dtype: Rate
    source: Telford and Wrekin Council Tax Reduction Scheme 2026/27 paragraph 57.1
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: uk-telford-and-wrekin/manual/council-tax-reduction-scheme-2026-2027/page-66
              excerpt: "shall be 100 per cent, of the amount A divided by B"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          1.00

  - name: telford_and_wrekin_council_tax_reduction_capital_limit
    kind: parameter
    dtype: Money
    period: Year
    unit: GBP
    source: Telford and Wrekin Council Tax Reduction Scheme 2026/27 paragraph 33.1
