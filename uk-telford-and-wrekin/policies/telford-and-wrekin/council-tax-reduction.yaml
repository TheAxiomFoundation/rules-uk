        atoms:
          - path: versions[0].formula
            kind: amount
            source: &grid_atom
              corpus_citation_path: uk-telford-and-wrekin/manual/council-tax-reduction-scheme-2026-2027/page-96
              excerpt: &grid_excerpt "Council Tax Reduction level Passported Single £ Couples £ Families with one child £ Families with two or more children £ Level 1 90% Relevant benefit* 0.00 – 96.36 0.00 -151.61 0.00 – 233.86 0.00 – 317.38 Level 2 75% N/A 96.37 – 134.91 151.62 – 196.59 233.87 – 285.25 317.39 – 375.21 Level 3 50% N/A 134.92 – 173.46 196.60 – 241.56 285.26 – 336.65 375.22 – 433.02 Level 4 25% N/A 173.47 – 212.00 241.57 – 286.53 336.66 – 388.05 433.03 – 490.85 No Reduction N/A >212.oo >286.53 >388.05 >490.85"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          1

  - name: telford_and_wrekin_council_tax_reduction_band_2_index
    kind: parameter
    dtype: Integer
    source: Telford and Wrekin Council Tax Reduction Scheme 2026/27 Schedule 1
    metadata: {proof: {atoms: [{path: 'versions[0].formula', kind: amount, source: *grid_atom}]}}
    versions: [{effective_from: '2026-04-01', formula: "2"}]

  - name: telford_and_wrekin_council_tax_reduction_band_3_index
    kind: parameter
    dtype: Integer
    source: Telford and Wrekin Council Tax Reduction Scheme 2026/27 Schedule 1
    metadata: {proof: {atoms: [{path: 'versions[0].formula', kind: amount, source: *grid_atom}]}}
    versions: [{effective_from: '2026-04-01', formula: "3"}]

  - name: telford_and_wrekin_council_tax_reduction_band_4_index
    kind: parameter
