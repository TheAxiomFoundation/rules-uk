format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: uk-thanet/manual/council-tax-reduction-scheme-2026-2027/page-80
    # upstream_source_check:
    #   status: delegated_scheme
    #   checked_paths: [uk/statutes/ukpga/1992/14/13A, uk/regulations/uksi/2012/2885, uk/regulations/uksi/2012/2886]
    #   rationale: LGFA 1992 section 13A delegates the working-age scheme to Thanet District Council, so the adopted scheme document is operative. The pinned singular contract strips this attestation as a live field.
  summary: |-
    Thanet's 2026-27 local working-age award is an income-banded discount: 100, 75, 50, 25, or zero percent of the scheme-defined maximum (the lower of actual and Band D liability). It has a £10,000 capital cliff, a £10 weekly non-dependant deduction subject to printed protections, and passported Band 1 routes for the named legacy benefits, UC with no earnings, and qualifying Kent care leavers. No local excess-income taper, tariff-income rule, or minimum award floor is printed. Pension-age provisions are outside scope.
  deferred_outputs:
    - output: uk-thanet:policies/thanet/council-tax-reduction/sections-12-to-33-and-schedules-2-to-3#assessed_weekly_income_and_capital
      reason: Detailed income and capital assessment, disregards, attribution, and valuation feed the award-surface inputs but are outside this module.
    - output: uk-thanet:policies/thanet/council-tax-reduction/paragraph-35#annual_liability_after_discounts_and_joint_liability_apportionment
      reason: The award surface consumes liability already adjusted for statutory discounts and joint-liability apportionment before applying the printed Band D ceiling.
    - output: uk-thanet:policies/thanet/council-tax-reduction/paragraph-36#chargeable_non_dependant_units
      reason: The detailed non-dependant exemption, couple coordination, and apportionment rules determine the deduction units consumed here.
rules:
  - name: thanet_council_tax_reduction_maximum_support_rate
    kind: parameter
    dtype: Rate
    source: Thanet Council Tax Reduction Scheme 2026/27 paragraph 35.1
    metadata: {proof: {atoms: [{path: 'versions[0].formula', kind: amount, source: {corpus_citation_path: uk-thanet/manual/council-tax-reduction-scheme-2026-2027/page-49, excerpt: "shall be 100 per cent, of the amount A divided by B where;"}}]}}
    versions: [{effective_from: '2026-04-01', formula: "1"}]
  - name: thanet_council_tax_reduction_capital_limit
    kind: parameter
    dtype: Money
    period: Year
    unit: GBP
    source: Thanet Council Tax Reduction Scheme 2026/27 paragraph 26.1
    metadata: {proof: {atoms: [{path: 'versions[0].formula', kind: amount, source: {corpus_citation_path: uk-thanet/manual/council-tax-reduction-scheme-2026-2027/page-40, excerpt: "the prescribed amount is £10,000 and no reduction shall be granted when the applicant has an amount greater than this level."}}]}}
    versions: [{effective_from: '2026-04-01', formula: "10000"}]
  - name: thanet_council_tax_reduction_days_per_week
    kind: parameter
    dtype: Number
    source: Thanet Council Tax Reduction Scheme 2026/27 paragraph 36.1
    metadata: {proof: {atoms: [{path: 'versions[0].formula', kind: amount, source: {corpus_citation_path: uk-thanet/manual/council-tax-reduction-scheme-2026-2027/page-49, excerpt: "shall be £10 x 1/7"}}]}}
    versions: [{effective_from: '2026-04-01', formula: "7"}]
  - name: thanet_council_tax_reduction_non_dependant_weekly_deduction_by_band
    kind: parameter
    dtype: Money
    period: Week
    unit: GBP
    indexed_by: thanet_council_tax_reduction_non_dependant_deduction_band
    source: Thanet Council Tax Reduction Scheme 2026/27 paragraph 36.1
    metadata: {proof: {atoms: [{path: 'versions[0].values', kind: parameter_table, source: {corpus_citation_path: uk-thanet/manual/council-tax-reduction-scheme-2026-2027/page-49, excerpt: "36.1 Subject to the following provisions of this paragraph, the non-dependant deductions in respect of a day referred to in section 35 (maximum council tax reduction) shall be £10 x 1/7", table: {header: Non-dependant deductions, row_key: deduction band, column_key: weekly deduction}}}]}}
    versions: [{effective_from: '2026-04-01', values: {0: 0, 1: 10}}]
  - name: thanet_council_tax_reduction_family_category_codes
    kind: parameter
    dtype: Number
    indexed_by: thanet_council_tax_reduction_family_category
    source: Thanet Council Tax Reduction Scheme 2026/27 Schedule 1
    metadata: &grid_proof
      proof:
        atoms:
          - path: 'versions[0].values'
            kind: parameter_table
            source: &grid_source
              corpus_citation_path: uk-thanet/manual/council-tax-reduction-scheme-2026-2027/page-80
              excerpt: "Income Band Single Couple Family with 1 child Family with 2+ children Discount From To From To From To From To Band 1 0.00 109.00 0.00 164.00 0.00 246.00 0.00 327.00 100% Band 2 109.01 184.00 164.01 239.00 246.01 321.00 327.01 402.00 75% Band 3 184.01 259.00 239.01 314.00 321.01 396.00 402.01 477.00 50% Band 4 259.01 334.00 314.01 389.00 396.01 471.00 477.01 552.00 25%"
              table: {header: Income Band, row_key: income band, column_key: household category}
    versions: [{effective_from: '2026-04-01', values: {0: 0, 1: 1, 2: 2, 3: 3}}]
  - name: thanet_council_tax_reduction_income_band_codes
    kind: parameter
    dtype: Number
    indexed_by: thanet_council_tax_reduction_income_band
    source: Thanet Council Tax Reduction Scheme 2026/27 Schedule 1
    metadata: *grid_proof
    versions: [{effective_from: '2026-04-01', values: {0: 0, 1: 1, 2: 2, 3: 3, 4: 4}}]
  - name: thanet_council_tax_reduction_support_rate_by_income_band
    kind: parameter
    dtype: Rate
    indexed_by: thanet_council_tax_reduction_income_band
    source: Thanet Council Tax Reduction Scheme 2026/27 Schedule 1
    metadata: *grid_proof
    versions: [{effective_from: '2026-04-01', values: {0: 1, 1: 0.75, 2: 0.50, 3: 0.25, 4: 0}}]
  - name: thanet_council_tax_reduction_band_2_lower_income_by_family
    kind: parameter
    dtype: Money
    period: Week
    unit: GBP
    indexed_by: thanet_council_tax_reduction_family_category
    source: Thanet Council Tax Reduction Scheme 2026/27 Schedule 1
    metadata: *grid_proof
    versions: [{effective_from: '2026-04-01', values: {0: 109.01, 1: 164.01, 2: 246.01, 3: 327.01}}]
  - name: thanet_council_tax_reduction_band_3_lower_income_by_family
    kind: parameter
    dtype: Money
