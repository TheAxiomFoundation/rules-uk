format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: uk-torbay/manual/council-tax-reduction-scheme-2026-2027/page-59
  summary: |-
    Torbay's adopted working-age Council Tax Reduction scheme is effective from
    1 April 2026 for one financial year. It caps maximum reduction at 75 percent
    of liability, then selects a 75, 55, 40, 20, or 0 percent discount from a
    six-family-column weekly-income grid. Applicants with capital of £6,000 or
    more receive no reduction. Passported applicants receive 75 percent. The
    working-age banded scheme has no excess-income taper, tariff-income step,
    non-dependant deduction schedule, minimum-award floor, council-tax band cap,
    or separately stated protected-class rate. Pension-age provisions are
    outside this module.
