format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: uk-wigan/manual/council-tax-reduction-scheme-2026-2027/page-111
    # upstream_source_check:
    #   status: delegated_scheme
    #   checked_paths: [uk/statutes/ukpga/1992/14/13A, uk/regulations/uksi/2012/2885, uk/regulations/uksi/2012/2886]
    #   rationale: LGFA 1992 section 13A delegates the working-age scheme to Wigan Council, so the adopted document is operative. The apply-stage encoder strips this attestation to the singular source-verification contract after local gates pass.
  summary: >-
    Wigan's 2026/27 working-age award starts from the section 57 100-percent maximum,
    reduces excess income by the printed daily taper, and then applies the local 20-percent
    reduction except for an applicant or partner responsible for a child under five. Pension-age
    provisions and the incorporated applicable-amount, income, and capital valuation schedules
    are outside this working-age award surface.
  deferred_outputs:
    - output: uk-wigan:policies/wigan/council-tax-reduction/sections-12-to-32-and-schedules-1-to-4#applicable_amount_and_assessed_income
      reason: This award surface consumes applicable amount and assessed income; the detailed personal allowances, premiums, earnings, disregards, and Universal Credit assessment rules are not encoded here.
    - output: uk-wigan:policies/wigan/council-tax-reduction/sections-33-to-41-and-schedule-5#assessed_capital
      reason: This module applies the local capital limits and tariff calculation but does not encode capital valuation, attribution, notional-capital, or disregard classifiers.
    - output: uk-wigan:policies/wigan/council-tax-reduction/sections-57-to-58#eligible_liability_and_non_dependant_protection
      reason: This module consumes eligible liability and a non-dependant-exemption result; liability apportionment, discount calculation, and protected-class classifiers are not encoded here.
    - output: uk-wigan:policies/wigan/council-tax-reduction/schedule-2#alternative_maximum_council_tax_reduction
      reason: The separate second-adult reduction is outside this working-age award calculation.
