        formula: |-
          if not wigan_council_tax_reduction_is_non_dependant or wigan_council_tax_reduction_non_dependant_exempt: wigan_council_tax_reduction_non_dependant_no_deduction_band else: if not wigan_council_tax_reduction_non_dependant_in_remunerative_work or wigan_council_tax_reduction_non_dependant_normal_gross_weekly_income < wigan_council_tax_reduction_non_dependant_band_2_threshold: wigan_council_tax_reduction_non_dependant_lower_band else: if wigan_council_tax_reduction_non_dependant_normal_gross_weekly_income < wigan_council_tax_reduction_non_dependant_band_3_threshold: wigan_council_tax_reduction_non_dependant_band_2 else: if wigan_council_tax_reduction_non_dependant_normal_gross_weekly_income < wigan_council_tax_reduction_non_dependant_band_4_threshold: wigan_council_tax_reduction_non_dependant_band_3 else: wigan_council_tax_reduction_non_dependant_band_4

