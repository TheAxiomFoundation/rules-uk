            kind: formula
            source:
              corpus_citation_path: uk-wigan/manual/council-tax-reduction-scheme-2026-2027/page-88
              excerpt: "where any part of the excess is not a complete £250 that part shall be treated as equivalent to a weekly tariff income of £1."
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: uk-wigan/manual/council-tax-reduction-scheme-2026-2027/page-89
              excerpt: "weekly income of £1 for each complete £250 of in excess of £6,000"
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: uk-wigan/manual/council-tax-reduction-scheme-2026-2027/page-89
              excerpt: "where any part of the excess is not a complete £250 that part shall be treated as equivalent to a weekly tariff income of £1."
    versions:
