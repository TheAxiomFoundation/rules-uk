        formula: |-
          ceil(max(0, wigan_council_tax_reduction_assessed_capital_for_year - wigan_council_tax_reduction_tariff_income_threshold) / wigan_council_tax_reduction_tariff_income_step) * wigan_council_tax_reduction_tariff_income_weekly_amount_per_step * wigan_council_tax_reduction_weeks_per_year

