format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: uk-winchester/manual/council-tax-reduction-scheme-2026-2027/page-61
    # upstream_source_check:
    #   status: delegated_scheme
    #   checked_paths: [uk/statutes/ukpga/1992/14/13A, uk/regulations/uksi/2012/2885, uk/regulations/uksi/2012/2886]
    #   rationale: Section 13A delegates the working-age scheme to Winchester City Council, so its adopted 2026/27 document is the operative source for these local parameters.
  summary: |-
    Upstream-source status: delegated_scheme. Checked paths: uk/statutes/ukpga/1992/14/13A,
    uk/regulations/uksi/2012/2885, and uk/regulations/uksi/2012/2886. Section 13A
    delegates working-age scheme design to Winchester, so its adopted document is
    operative. Winchester's adopted working-age Council Tax Reduction scheme is effective from
    1 April 2026 for one financial year. Maximum reduction is 100 percent of
    liability, and the linked grid selects a 100, 75, 45, 25, or 0 percent
    discount from six family columns. Capital above £16,000 bars an award;
    capital above £6,000 produces £1 weekly tariff income per £250 or part.
    Passported applicants receive Band 1. The working-age scheme has no excess-income taper,
    non-dependant deduction schedule, minimum-award floor, council-tax band cap,
    or separately stated protected-class rate. Pension-age provisions are
    outside this module.
