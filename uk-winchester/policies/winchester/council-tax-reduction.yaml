            kind: formula
            source:
              corpus_citation_path: uk-winchester/manual/council-tax-reduction-scheme-2026-2027/page-33
              excerpt: "weekly income of £1 for each complete £250 of in excess of £6,000 but not exceeding £16,000"
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: uk-winchester/manual/council-tax-reduction-scheme-2026-2027/page-33
              excerpt: "where any part of the excess is not a complete £250 that part shall be treated as equivalent to a weekly tariff income of £1"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          winchester_council_tax_reduction_tariff_income_weekly_amount_per_step * ceil(max(0, winchester_council_tax_reduction_assessed_capital - winchester_council_tax_reduction_tariff_income_threshold) / winchester_council_tax_reduction_tariff_income_step)

