format: rulespec/v1
imports:
  - "uk:regulations/uksi/2006/213/52#ordinary_capital_tariff_income_lower_threshold"
  - "uk:regulations/uksi/2006/213/52#capital_tariff_income_upper_limit"
  - "uk:regulations/uksi/2006/213/52#capital_tariff_income_band_size"
  - "uk:regulations/uksi/2006/213/52#capital_tariff_income_weekly_amount_per_band"
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: uk-wolverhampton/manual/council-tax-reduction-scheme-2026-2027/page-73
    # upstream_source_check:
    # status: delegated_scheme
    # checked_paths: [uk/statutes/ukpga/1992/14/13A, uk/regulations/uksi/2012/2885, uk/regulations/uksi/2012/2886]
    # rationale: LGFA 1992 section 13A delegates the working-age scheme to this authority, so Wolverhampton's adopted scheme document is the operative legal source.
  summary: |-
    Wolverhampton's operative 2026-27 working-age scheme is a means-tested Class D/Class E award. The section 57 maximum is 78% of the lower of actual liability and Band C liability, rising to 88% for the listed enhanced groups, with non-dependant deductions taken from that maximum. Section 59 expressly deducts the 3 2/7% daily excess-income taper from the defined section 57 maximum; the weekly rate is derived as 23%. Capital above £6,000 ends entitlement. Section 17 incorporates the Housing Benefit tariff-income rule, but that tariff cannot coexist with a locally eligible award because both start above £6,000. Income exactly equal to the applicable amount is neither the printed “less than” Class D condition nor the printed “more than” Class E condition unless the separate Class D income-based-benefit condition applies. No minimum new-award floor is printed: section 65 is a change-of-circumstance tolerance and is deferred.
  deferred_outputs:
    - output: uk-wolverhampton:policies/wolverhampton/council-tax-reduction/sections-1.6-to-1.7-and-classes-d-to-e#working_age_class_and_general_conditions_classifier
      reason: This module consumes the working-age class and shared residence, absence, exclusion, and claim conditions. It does not reproduce the detailed pension-credit-age exception or every general eligibility classifier.
    - output: uk-wolverhampton:policies/wolverhampton/council-tax-reduction/sections-12-to-42-and-schedules-1-to-5#applicable_amount_assessed_income_and_capital
      reason: The award surface consumes assessed weekly income, applicable amount, and assessed capital. Detailed allowances, premiums, earnings, disregards, valuation, attribution, notional-capital, and capital-disregard rules are outside this module.
    - output: uk-wolverhampton:policies/wolverhampton/council-tax-reduction/paragraphs-57.2-to-57.4#eligible_weekly_liability
      reason: This module takes the lower of actual and Band C weekly liability. It does not calculate statutory reductions, dwelling charges, daily conversion, or joint-liability apportionment.
    - output: uk-wolverhampton:policies/wolverhampton/council-tax-reduction/paragraph-57.1#enhanced_group_classifier
      reason: This module selects the printed 88 percent rate from the paragraph 57.1 enhanced-group result; the detailed disability-benefit, child-premium, and age/family classifier is deferred.
    - output: uk-wolverhampton:policies/wolverhampton/council-tax-reduction/paragraphs-58.3-to-58.9#non_dependant_deductions_for_week
      reason: This module encodes the individual deduction grid but consumes the section 58 aggregate after couple, polygamous-marriage, protection, exemption, joint-income, and apportionment rules.
    - output: uk-wolverhampton:policies/wolverhampton/council-tax-reduction/class-c#alternative_maximum_council_tax_reduction
      reason: The separate pension-age Class C alternative maximum is outside this working-age award surface.
    - output: uk-wolverhampton:policies/wolverhampton/council-tax-reduction/sections-60-to-61d#extended_reduction
      reason: Extended-reduction entitlement is a distinct post-employment-change component and is outside the ordinary working-age award calculation encoded here.
    - output: uk-wolverhampton:policies/wolverhampton/council-tax-reduction/section-65.1#change_in_entitlement_tolerance
      reason: Section 65.1 is a £3 weekly change-of-circumstance tolerance, not a minimum new-award entitlement floor.
