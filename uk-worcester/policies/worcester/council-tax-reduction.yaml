format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: uk-worcester/manual/council-tax-reduction-scheme-2026-2027/page-73
    # upstream_source_check:
      # status: delegated_scheme
      # checked_paths:
        # - uk/statutes/ukpga/1992/14/13A
        # - uk/regulations/uksi/2012/2885
        # - uk/regulations/uksi/2012/2886
      # rationale: Section 13A delegates the working-age scheme to Worcester City Council, so its adopted scheme document is the operative legal source for the locally set working-age values.
  summary: |-
    Worcester's adopted 2026/27 working-age scheme gives 80 percent of eligible liability, less the printed 2 6/7 percent daily excess-income taper and non-dependant deductions. Capital above £6,000 is a complete entitlement cliff, rather than a tariff-income range. Pension-age provisions are outside this module.
  deferred_outputs:
    - output: uk-worcester:policies/worcester/council-tax-reduction/section-12#applicable_amount
      reason: The category-specific applicable amounts and premium schedules are not encoded by this award-surface module.
    - output: uk-worcester:policies/worcester/council-tax-reduction/sections-15-to-56#assessed_income_and_capital
      reason: Detailed income and capital valuation, attribution and disregard rules are outside this award-surface module.
    - output: uk-worcester:policies/worcester/council-tax-reduction/section-58#non_dependant_exemption_and_aggregation
      reason: The printed deduction bands are encoded here; exemption, couple and household aggregation classifiers remain future outputs.
rules:
  - name: maximum_support_rate
    kind: parameter
    dtype: Rate
    period: Year
    source: Worcester Council Tax Reduction Scheme 2026/27 section 57.1
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: uk-worcester/manual/council-tax-reduction-scheme-2026-2027/page-71
              excerpt: "shall be 80 per cent, of the amount A/B"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          0.80

  - name: capital_limit
    kind: parameter
    dtype: Money
    period: Year
    unit: GBP
    source: Worcester Council Tax Reduction Scheme 2026/27 section 33.1
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: uk-worcester/manual/council-tax-reduction-scheme-2026-2027/page-53
              excerpt: "the prescribed amount is £6,000 and no support shall be granted when the applicant has an amount greater than this level."
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          6000

  - name: taper_whole_percentage_points
    kind: parameter
    dtype: Number
    period: Day
    source: Worcester Council Tax Reduction Scheme 2026/27 section 59.1
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: uk-worcester/manual/council-tax-reduction-scheme-2026-2027/page-73
              excerpt: "shall be 2 6/7 per cent."
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          2

  - name: taper_fraction_numerator
    kind: parameter
    dtype: Number
    period: Day
    source: Worcester Council Tax Reduction Scheme 2026/27 section 59.1
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: uk-worcester/manual/council-tax-reduction-scheme-2026-2027/page-73
              excerpt: "shall be 2 6/7 per cent."
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          6

  - name: days_per_week
    kind: parameter
    dtype: Number
    source: Worcester Council Tax Reduction Scheme 2026/27 sections 57A and 58
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: uk-worcester/manual/council-tax-reduction-scheme-2026-2027/page-71
              excerpt: "£5.00 x 1/7"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          7

  - name: per_cent_unit
    kind: parameter
    dtype: Rate
    period: Day
    source: Worcester Council Tax Reduction Scheme 2026/27 percentage notation
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: uk-worcester/manual/council-tax-reduction-scheme-2026-2027/page-117
              excerpt: "100 per cent. of such payments"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          0.01

  - name: daily_taper_rate
    kind: parameter
    dtype: Rate
    period: Day
    source: Worcester Council Tax Reduction Scheme 2026/27 section 59.1
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: uk-worcester/manual/council-tax-reduction-scheme-2026-2027/page-73
              excerpt: "The prescribed daily percentage, the taper, for the purpose of calculating support as a percentage of excess of income over the applicable amount, which is deducted from maximum council tax reduction, shall be 2 6/7 per cent."
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          (taper_whole_percentage_points + taper_fraction_numerator / days_per_week) * per_cent_unit

  - name: weekly_taper_rate
    kind: parameter
    dtype: Rate
    period: Week
    source: Worcester Council Tax Reduction Scheme 2026/27 section 59.1, derived from its printed daily rate
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: uk-worcester/manual/council-tax-reduction-scheme-2026-2027/page-73
              excerpt: "shall be 2 6/7 per cent."
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          daily_taper_rate * days_per_week

  - name: weeks_per_year
    kind: parameter
    dtype: Number
    period: Year
    source: Worcester Council Tax Reduction Scheme 2026/27 section 58.7
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: uk-worcester/manual/council-tax-reduction-scheme-2026-2027/page-72
              excerpt: "period of excess of 52 weeks"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          52

  - name: minimum_reduction_weekly
    kind: parameter
    dtype: Money
    period: Week
    unit: GBP
    source: Worcester Council Tax Reduction Scheme 2026/27 section 57A.1
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: uk-worcester/manual/council-tax-reduction-scheme-2026-2027/page-71
              excerpt: "shall be £5.00 x 1/7"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          5.00

  - name: non_dependant_low_threshold
    kind: parameter
    dtype: Money
    period: Week
    unit: GBP
    source: Worcester Council Tax Reduction Scheme 2026/27 section 58.2
    metadata: {proof: {atoms: [{path: 'versions[0].formula', kind: amount, source: {corpus_citation_path: uk-worcester/manual/council-tax-reduction-scheme-2026-2027/page-71, excerpt: "less than £279.00"}}]}}
    versions: [{effective_from: '2026-04-01', formula: '279'}]
  - name: non_dependant_middle_threshold
    kind: parameter
    dtype: Money
    period: Week
    unit: GBP
    source: Worcester Council Tax Reduction Scheme 2026/27 section 58.2
    metadata: {proof: {atoms: [{path: 'versions[0].formula', kind: amount, source: {corpus_citation_path: uk-worcester/manual/council-tax-reduction-scheme-2026-2027/page-71, excerpt: "not less than £279.00, but less than £485.00"}}]}}
    versions: [{effective_from: '2026-04-01', formula: '485'}]
  - name: non_dependant_high_threshold
    kind: parameter
    dtype: Money
    period: Week
    unit: GBP
    source: Worcester Council Tax Reduction Scheme 2026/27 section 58.2
    metadata: {proof: {atoms: [{path: 'versions[0].formula', kind: amount, source: {corpus_citation_path: uk-worcester/manual/council-tax-reduction-scheme-2026-2027/page-71, excerpt: "not less than £485.00, but less than £605.00"}}]}}
    versions: [{effective_from: '2026-04-01', formula: '605'}]
  - name: non_dependant_deduction_low
    kind: parameter
    dtype: Money
    period: Week
    unit: GBP
    source: Worcester Council Tax Reduction Scheme 2026/27 section 58.1
    metadata: {proof: {atoms: [{path: 'versions[0].formula', kind: amount, source: {corpus_citation_path: uk-worcester/manual/council-tax-reduction-scheme-2026-2027/page-71, excerpt: "£5.20 x 1/7"}}]}}
    versions: [{effective_from: '2026-04-01', formula: '5.20'}]
  - name: non_dependant_deduction_middle
    kind: parameter
    dtype: Money
    period: Week
    unit: GBP
    source: Worcester Council Tax Reduction Scheme 2026/27 section 58.2
    metadata: {proof: {atoms: [{path: 'versions[0].formula', kind: amount, source: {corpus_citation_path: uk-worcester/manual/council-tax-reduction-scheme-2026-2027/page-71, excerpt: "£10.60 x1/7"}}]}}
    versions: [{effective_from: '2026-04-01', formula: '10.60'}]
  - name: non_dependant_deduction_high
    kind: parameter
    dtype: Money
    period: Week
    unit: GBP
    source: Worcester Council Tax Reduction Scheme 2026/27 section 58.2
    metadata: {proof: {atoms: [{path: 'versions[0].formula', kind: amount, source: {corpus_citation_path: uk-worcester/manual/council-tax-reduction-scheme-2026-2027/page-71, excerpt: "£13.30 x 1/7"}}]}}
    versions: [{effective_from: '2026-04-01', formula: '13.30'}]
  - name: non_dependant_deduction_top
    kind: parameter
    dtype: Money
    period: Week
    unit: GBP
    source: Worcester Council Tax Reduction Scheme 2026/27 section 58.1
    metadata: {proof: {atoms: [{path: 'versions[0].formula', kind: amount, source: {corpus_citation_path: uk-worcester/manual/council-tax-reduction-scheme-2026-2027/page-71, excerpt: "£15.95 x 1/7"}}]}}
    versions: [{effective_from: '2026-04-01', formula: '15.95'}]

  - name: capital_eligible
    kind: derived
    entity: Person
    dtype: Judgment
    period: Year
    source: Worcester Council Tax Reduction Scheme 2026/27 section 33.1
    metadata: {proof: {atoms: [{path: 'versions[0].formula', kind: condition, source: {corpus_citation_path: uk-worcester/manual/council-tax-reduction-scheme-2026-2027/page-53, excerpt: "no support shall be granted when the applicant has an amount greater than this level."}}]}}
    versions: [{effective_from: '2026-04-01', formula: 'applicant_capital <= capital_limit'}]
  - name: non_dependant_deduction_weekly
    kind: derived
    entity: Person
    dtype: Money
    period: Week
    unit: GBP
    source: Worcester Council Tax Reduction Scheme 2026/27 sections 58.1-58.2
    metadata: {proof: {atoms: [{path: 'versions[0].formula', kind: parameter_table, source: {corpus_citation_path: uk-worcester/manual/council-tax-reduction-scheme-2026-2027/page-71, excerpt: "58.1 Subject to the following provisions of this paragraph, the non-dependant deductions in respect of a day referred to in section 29 (maximum council tax reduction) shall be; (a) in respect of a non-dependant aged 18 or over in remunerative work, £15.95 x 1/7; (b) in respect of a non-dependant aged 18 or over to whom sub-paragraph (a) does not apply, £5.20 x 1/7. 58.2 In the case of a non-dependant aged 18 or over, where it is shown to the appropriate authority that his normal gross weekly income is– (a) less than £279.00, the deduction to be made under this paragraph shall be that specified in paragraph 58.1(b); (b) not less than £279.00, but less than £485.00, the deduction to be made under this section shall be £10.60 x1/7; (c) not less than £485.00, but less than £605.00, the deduction to be made under this section shall be £13.30 x 1/7;"}}]}}
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          if non_dependant_is_exempt: 0 else: if non_dependant_normal_gross_weekly_income < non_dependant_low_threshold: non_dependant_deduction_low else: if non_dependant_normal_gross_weekly_income < non_dependant_middle_threshold: non_dependant_deduction_middle else: if non_dependant_normal_gross_weekly_income < non_dependant_high_threshold: non_dependant_deduction_high else: non_dependant_deduction_top
  - name: maximum_council_tax_reduction
    kind: derived
    entity: Person
    dtype: Money
    period: Year
    unit: GBP
    source: Worcester Council Tax Reduction Scheme 2026/27 section 57.1
    metadata: {proof: {atoms: [{path: 'versions[0].formula', kind: formula, source: {corpus_citation_path: uk-worcester/manual/council-tax-reduction-scheme-2026-2027/page-71, excerpt: "shall be 80 per cent, of the amount A/B where: • A is the amount set by the authority as the council tax for the relevant financial year"}}]}}
    versions: [{effective_from: '2026-04-01', formula: 'max(0, annual_council_tax_liability_after_statutory_discounts * maximum_support_rate - annual_non_dependant_deductions)'}]
  - name: weekly_excess_income
    kind: derived
    entity: Person
    dtype: Money
    period: Week
    unit: GBP
    source: Worcester Council Tax Reduction Scheme 2026/27 section 59.1
    metadata: {proof: {atoms: [{path: 'versions[0].formula', kind: formula, source: {corpus_citation_path: uk-worcester/manual/council-tax-reduction-scheme-2026-2027/page-73, excerpt: "excess of income over the applicable amount"}}]}}
    versions: [{effective_from: '2026-04-01', formula: 'max(0, applicant_weekly_income - applicant_weekly_applicable_amount)'}]
  - name: council_tax_reduction_award
    kind: derived
    entity: Person
    dtype: Money
    period: Year
    unit: GBP
    source: Worcester Council Tax Reduction Scheme 2026/27 sections 57, 57A and 59
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: uk-worcester/manual/council-tax-reduction-scheme-2026-2027/page-73
              excerpt: "their council tax reduction shall be calculated by deducting their excess income multiplied by the taper from their maximum council tax reduction as defined within section 57 of this scheme."
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: uk-worcester/manual/council-tax-reduction-scheme-2026-2027/page-71
              excerpt: "minimum council tax reduction in respect of a day for which he is liable to pay council tax, shall be £5.00 x 1/7"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          if capital_eligible: if maximum_council_tax_reduction - weekly_excess_income * weekly_taper_rate * weeks_per_year < minimum_reduction_weekly * weeks_per_year: 0 else: maximum_council_tax_reduction - weekly_excess_income * weekly_taper_rate * weeks_per_year else: 0
